<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emil's Loom · 067 — Tyto</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0a1228;
    color: #b8c2d4;
    font: 13px ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; min-height: 100vh; overflow: hidden;
  }
  canvas {
    border-radius: 6px;
    box-shadow: 0 30px 80px -28px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.05);
  }
  .loom-caption {
    position: fixed; left: 18px; bottom: 16px;
    display: flex; flex-direction: column; gap: 2px;
    color: #7d889c; line-height: 1.4; pointer-events: none;
  }
  .loom-title { color: #d8cdb4; }
  .loom-seed { color: #5a6478; font-size: 12px; }
  .loom-controls { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; }
  .loom-controls button {
    font: 12px ui-monospace, monospace;
    color: #b8c2d4; background: #131c30; cursor: pointer;
    border: 1px solid #28344c; border-radius: 8px; padding: 7px 12px;
    transition: border-color .15s, color .15s;
  }
  .loom-controls button:hover { border-color: #d8cdb4; color: #ece2c8; }
</style>
</head>
<body>
  <div class="loom-controls">
    <button data-another>weave another</button>
    <button data-reset>reset</button>
  </div>
  <script src="../../lib/rng.js"></script>
  <script src="../../lib/loom.js"></script>
  <script src="../../lib/palette.js"></script>
  <script src="../../lib/noise.js"></script>
  <script src="../../lib/glow.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
