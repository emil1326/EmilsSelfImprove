<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emil's Loom · 094 — Erg</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #1a1320;
    color: #c89a86;
    font: 13px ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; min-height: 100vh; overflow: hidden;
  }
  canvas {
    border-radius: 6px;
    box-shadow: 0 30px 80px -30px rgba(230,150,80,0.35), 0 0 0 1px rgba(0,0,0,0.3);
  }
  .loom-caption {
    position: fixed; left: 18px; bottom: 16px;
    display: flex; flex-direction: column; gap: 2px;
    color: #a07a68; line-height: 1.4; pointer-events: none;
  }
  .loom-title { color: #f0b86a; }
  .loom-seed { color: #7a5e58; font-size: 12px; }
  .loom-controls { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; }
  .loom-controls button {
    font: 12px ui-monospace, monospace;
    color: #c89a86; background: #2a1d28cc; cursor: pointer;
    border: 1px solid #4a3340; border-radius: 8px; padding: 7px 12px;
    transition: border-color .15s, color .15s;
  }
  .loom-controls button:hover { border-color: #f0b86a; color: #ffd28a; }
</style>
</head>
<body>
  <div class="loom-controls">
    <button data-another>weave another</button>
    <button data-reset>reset</button>
  </div>
  <script src="../../lib/rng.js"></script>
  <script src="../../lib/loom.js"></script>
  <script src="../../lib/palette.js"></script>
  <script src="../../lib/ramp.js"></script>
  <script src="../../lib/noise.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
