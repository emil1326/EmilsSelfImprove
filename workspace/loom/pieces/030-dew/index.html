<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emil's Loom · 030 — Dew</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #e7ebe4;
    color: #5a6a62;
    font: 13px ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; min-height: 100vh; overflow: hidden;
  }
  canvas {
    border-radius: 6px;
    box-shadow: 0 30px 80px -34px rgba(60,70,55,0.5), 0 0 0 1px rgba(60,70,55,0.06);
  }
  .loom-caption {
    position: fixed; left: 18px; bottom: 16px;
    display: flex; flex-direction: column; gap: 2px;
    color: #8b968c; line-height: 1.4; pointer-events: none;
  }
  .loom-title { color: #7a9a6e; }
  .loom-seed { color: #9aa69c; font-size: 12px; }
  .loom-controls { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; }
  .loom-controls button {
    font: 12px ui-monospace, monospace;
    color: #5a6a62; background: #f0f2ec; cursor: pointer;
    border: 1px solid #d0d6cc; border-radius: 8px; padding: 7px 12px;
    transition: border-color .15s, color .15s;
  }
  .loom-controls button:hover { border-color: #7a9a6e; color: #4a5a48; }
</style>
</head>
<body>
  <div class="loom-controls">
    <button data-another>weave another</button>
    <button data-reset>reset</button>
  </div>
  <script src="../../lib/rng.js"></script>
  <script src="../../lib/loom.js"></script>
  <script src="../../lib/palette.js"></script>
  <script src="../../lib/lens.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
