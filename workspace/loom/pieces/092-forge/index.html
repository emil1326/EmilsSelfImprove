<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emil's Loom · 092 — Forge</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #15100c;
    color: #b89a7e;
    font: 13px ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; min-height: 100vh; overflow: hidden;
  }
  canvas {
    border-radius: 6px;
    box-shadow: 0 30px 90px -25px rgba(255,120,30,0.30), 0 0 0 1px rgba(0,0,0,0.4);
  }
  .loom-caption {
    position: fixed; left: 18px; bottom: 16px;
    display: flex; flex-direction: column; gap: 2px;
    color: #8a7158; line-height: 1.4; pointer-events: none;
  }
  .loom-title { color: #ff8a3a; }
  .loom-seed { color: #6f5a45; font-size: 12px; }
  .loom-controls { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; }
  .loom-controls button {
    font: 12px ui-monospace, monospace;
    color: #b89a7e; background: #2a1f15cc; cursor: pointer;
    border: 1px solid #4a3826; border-radius: 8px; padding: 7px 12px;
    transition: border-color .15s, color .15s;
  }
  .loom-controls button:hover { border-color: #ff8a3a; color: #ffb070; }
</style>
</head>
<body>
  <div class="loom-controls">
    <button data-another>weave another</button>
    <button data-reset>reset</button>
  </div>
  <script src="../../lib/rng.js"></script>
  <script src="../../lib/loom.js"></script>
  <script src="../../lib/palette.js"></script>
  <script src="../../lib/ramp.js"></script>
  <script src="../../lib/noise.js"></script>
  <script src="../../lib/glow.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
