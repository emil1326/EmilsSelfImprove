<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Emil's SelfImprove — the loop</title>
<style>
  :root {
    --bg: #17130f;
    --bg-glow: #2a1f14;
    --card: #221c16;
    --card-2: #1c1711;
    --border: #34291f;
    --text: #ece3d6;
    --muted: #9c8d79;
    --accent: #e0a45c;
    --accent-soft: #3a2c1c;
    --green: #8fbf6f;
    --red: #e08b6f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 420px at 50% -120px, var(--bg-glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 22px 72px; }

  /* ---- header ---- */
  header { margin-bottom: 30px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 {
    margin: 0; font-size: 29px; letter-spacing: -0.5px; font-weight: 650;
  }
  .dot {
    width: 11px; height: 11px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 0 rgba(143,191,111,.55); animation: pulse 2.4s infinite;
    flex: 0 0 auto;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(143,191,111,.5); }
    70%  { box-shadow: 0 0 0 11px rgba(143,191,111,0); }
    100% { box-shadow: 0 0 0 0 rgba(143,191,111,0); }
  }
  .tagline { margin: 9px 0 0 23px; color: var(--muted); font-size: 15px; }
  .meta { margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: 12.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); background: var(--accent-soft);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px;
    white-space: nowrap;
  }
  .chip-warn { color: var(--red); border-color: #5a2f28; background: #2c1b18; }

  /* ---- cards ---- */
  .card {
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; margin: 16px 0;
    box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 12px 30px -22px rgba(0,0,0,.8);
  }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--muted); font-weight: 600; margin: 30px 0 4px 2px;
  }
  h3 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px;
    color: var(--muted); font-weight: 600; margin: 0 0 6px;
  }

  /* ---- next action (hero) ---- */
  .next-label {
    font: 12px ui-monospace, monospace; color: var(--accent);
    letter-spacing: 1px; margin-bottom: 8px;
  }
  .next-text { font-size: 19px; line-height: 1.5; font-weight: 500; }

  .banner {
    margin-top: 18px; padding: 11px 15px; border-radius: 10px;
    border: 1px solid #5a2f28; background: #2c1b18; color: var(--red);
    font-size: 14.5px;
  }
  .banner b { color: #f0a892; }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
    margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border);
  }
  .grid .val { font-size: 15px; }
  .muted { color: var(--muted); }

  .note {
    margin-top: 22px; padding: 15px 17px; border-radius: 11px;
    background: var(--accent-soft); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
  }
  .note-label {
    font: 11.5px ui-monospace, monospace; letter-spacing: .8px;
    color: var(--accent); margin-bottom: 6px;
  }
  .note p { margin: 0; font-size: 15px; line-height: 1.6; }

  /* ---- featured living piece from the Loom ---- */
  .feature { padding: 16px 16px 18px; }
  .feature-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .feature-head h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--muted); font-weight: 600; }
  .feature-open { font: 12px ui-monospace, monospace; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .feature-open:hover { border-bottom-color: var(--accent); }
  .feature-wrap { display: flex; justify-content: center; }
  .feature-wrap canvas {
    border-radius: 10px; background: #0a0a0e; display: block;
    box-shadow: 0 20px 50px -24px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.04);
  }
  .feature-cap { margin-top: 11px; text-align: center; font: 12px ui-monospace, monospace; color: var(--muted); }

  /* ---- done list ---- */
  ul.done { list-style: none; margin: 6px 0 0; padding: 0; }
  ul.done li {
    position: relative; padding: 7px 0 7px 28px; font-size: 14.5px;
    border-bottom: 1px solid rgba(52,41,31,.6);
  }
  ul.done li:last-child { border-bottom: 0; }
  ul.done li::before {
    content: "✓"; position: absolute; left: 2px; top: 7px;
    color: var(--green); font-weight: 700;
  }

  /* ---- journal ---- */
  details.entry {
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 12px; margin: 11px 0; overflow: hidden;
  }
  details.entry > summary {
    cursor: pointer; list-style: none; padding: 15px 20px;
    font: 600 15px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); display: flex; align-items: center; gap: 10px;
    user-select: none;
  }
  details.entry > summary::-webkit-details-marker { display: none; }
  details.entry > summary::before {
    content: "▸"; color: var(--muted); transition: transform .15s ease;
    font-size: 12px;
  }
  details.entry[open] > summary::before { transform: rotate(90deg); }
  details.entry > summary:hover { color: #f0b873; }
  .entry-body {
    padding: 2px 20px 18px 20px; border-top: 1px solid var(--border);
    color: var(--text);
  }
  .entry-body p { margin: 13px 0; }
  .entry-body blockquote {
    margin: 13px 0; padding: 6px 0 6px 15px; color: var(--muted);
    border-left: 3px solid var(--accent-soft); font-style: italic;
  }
  .entry-body ul { margin: 11px 0; padding-left: 22px; }
  .entry-body li { margin: 4px 0; }

  code {
    font: 13.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    background: #2a2017; border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 6px; color: #e8c79b;
  }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  a:hover { border-bottom-color: var(--accent); }

  footer {
    margin-top: 38px; text-align: center; color: var(--muted);
    font: 12.5px ui-monospace, monospace;
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    .brand h1 { font-size: 24px; }
  }
</style>

const STATE = {"iteration":45,"updated":"2026-06-12","phase":"Emil's Loom — SELF-AUDIT #45: the work is HEALTHY (24 pieces across 4 clean movements, library at 13, all by genuine pull). Did housekeeping (re-compressed this STATE.done; inspected the 43-lesson index and found it healthy — no cuts needed). The real finding: a possible MODE-NARROWING — six lovely-but-not-jaw-dropping pieces in a row. NEXT: a deliberately BOLDER / weirder swing (be bold, don't fear bad notes).","done":["FOUNDATION (#1-#10): scaffolded the system (CLAUDE.md safety, identity/CONSTITUTION, memory/goals/workspace, /iterate, README, clean git); v0 dashboard (build.mjs, rebuilt every iteration, shows a live featured piece); chose the north star — Emil's Loom (from-scratch generative-art engine + growing gallery + reusable primitives library, code-as-artifact, seeded PRNGs); built the Loom skeleton + same-page \u003ccanvas> previews; stood up the MEMORY FOUNDATION (Obsidian learnings + INDEX + check.mjs validator + git pre-commit hook + every-5th SELF-AUDIT). Lessons 001-011.","PIECES 001-007 (#4-#15) + their primitives: 001 'Warp & Weft' (rng #1) · 002 'Loose Threads' (palette #2) · 003 'Strata' (noise #3) · 004 'Tessera' (Poisson points #4) · 005 'Bloom' (lsystem #5) · 006 'Roe' (pack #6) · 007 'Rime' (dla #7). Built the gallery star-rating system -> RATINGS.md (Emil's idea). Lessons 012-015.","RECALIBRATED on Emil's feedback (post-#15, lesson 016): make what I genuinely believe is excellent, don't pander; ratings = dialogue. The bar is impressive / intentional / surprising / realized — not a style; technique-demos read as boring.","PIECES 008-014 (#16-#25) — the turn into animated, composed SCENES: 008 'Aurora' (engine gained animation, draw()->frame(t), lesson 017; first 5/5) · 009 'Glint' · 010 'Medusa' (first living subject; glow primitive #8) · 011 'Meadow' (#20 audit rut-breaker, COMPOSED the library; lessons 020+021) · 012 'Clock' (macro/delicate; luminosity-as-tone 022) · 013 'Cadence -throttle belief (~38fps -> ANIMATION verifiable again, after 4 static pieces). Lesson 041 (re-test standing assumptions / deferred flags).","PIECE 023 'Rain' (#41) — a rainy window at night seen from inside: warm city-light bokeh blurred through misted glass, droplets clinging + refracting, a few sliding down in rivulets that wipe the glass clear. The cosy/melancholy register + the FIRST ANIMATED piece in 9 iterations (the #40 audit reopened it). Advisor reframed the job: the #40 probe proved motion PRESENT not QUALITY (025) -> (a) design motion as a PURE FUNCTION OF T (Embers-style) + render a T-STRIP (same seed, t=0/1.5/3/4.5/6) to JUDGE slide quality deterministically (lesson 042); (b) verify the STATIC wet-window reads FIRST; (c) FAKE the merge (drops grow as they fall). Droplet = a WIDE-ANGLE inverted lens GATHERING nearby lights (035/037/040 again; flipped refraction magnify->minify, dark beads became wet lenses). Per-frame sub-ms. Composes noise+palette. Now the dashboard's LIVING showpiece. Lesson 042.","PIECE 024 'Giant' (#42) — a ringed GAS GIANT in space; the first time the Loom leaves Earth + the most technically ambitious piece (a from-scratch 3D-shaded sphere). Skipped the advisor (tested myself; cost 9 renders). SPHERE read = bands mapped to LAT/LON (curve + foreshorten) + one-light diffuse shading w/ a SOFT terminator (smoothstep not max(0,diff)) + limb-darkening. Two singularities bit hard: the longitude SEAM (atan2 ±pi jump on the visible face — wasted 3 renders blaming the terminator; fix = noise on cos/sin(lon)) + the POLE (fix = fade texture x cos^2(lat)). Bands soft -> low-res ImageData + upscale (038). RINGS occlude: full ring behind -> planet -> near half clipped to disc; + a soft planet-shadow. 30ms, static. Composes ramp+noise+glow. Lesson 043 (sphere texturing + the two singularities).","RE-ARCHITECTED THE GALLERY ARC (#43, no new piece) — the #21 3-movement framing (built for 11 pieces) had outgrown itself ('Scenes' swelled to 14, a catch-all I'd jammed misfits into: Iris, Giant). Acted on the flag written 2x (lesson 041). Re-hung into FOUR movements by what the work became: Patterns & fields (+ Cadence), Grown things, LIVING THINGS (new cluster: jellyfish + murmuration + manta + the eye), Scenes & far places (atmospheric places ending on the Giant beyond Earth). Updated the intro. Verified: 4 groups, all 23 pieces placed, no orphan. No new lesson (an application of 041 + 021).","PIECE 025 'Luna' (#44) — a luna moth glowing pale-green in the moonlit dark: long sweeping hindwing tails, furry white body, feathery antennae, soft eyespots, dust drifting. The DELICATE/LIVING swing after the gas giant; the first new creature for the freshly-rebuilt 'Living things' movement (the cleared shelf had a moth-gap). Came together CLEANLY (3 renders, silhouette read first try) — crux was 035 (silhouette-first; the read lives in the TAILS): wing outlines as bezier paths, built ONE side + mirrored (ctx.scale(side,1)). Subtler translucent eyespots, luminous wing-rim, moonglow + dust motes. Static, 3ms. Composes noise+glow+palette. NO new lesson (clean execution of known principles). Honest 4 — lovely/delicate (Emil's register).","SELF-AUDIT #45 (this) — work HEALTHY (24 pieces across 4 clean movements, library 13, all by genuine pull). HOUSEKEEPING: re-compressed this done-array (collapsed #27-#40 into terse milestones; recent ~5 stay detailed; the JOURNAL is the full archive). On the other queued item (consolidate the 43-lesson index): inspected every line, found it HEALTHY — lessons are distinct + each names a real future situation, no stale/duplicate worth merge-surgery; re-tested the standing flag (041) and concluded NO CUTS (honest, not avoidance — like the rAF throttle at #40, the flagged 'problem' dissolved on inspection). REAL reflective finding (Q1/Q5): possible MODE-NARROWING — six representational-pretty pieces (rose..luna) at reliable strong-4s, no clear 5 since rose(#36) -> per Emil's 'be bold, don't fear bad notes', take a BOLDER / weirder / more-abstract swing next (reach for a 5 or a glorious flop). LIBRARY watch: no new primitive since caustics #13; no 2-consumer harvest available yet. No new lesson (audit is process)."],"next_action":"Weave piece 026 — and per the #45 audit, deliberately reach HIGHER and WEIRDER than the recent run (six lovely representational pieces, rose..luna, at reliable strong-4s; no clear 5 since rose #36). Pick by GENUINE pull (033) but stay OPEN to the abstract / experimental / conceptually-surprising — not just 'a beautiful picture of X'. The early work had more systems-variety (flow fields, reaction-diffusion, L-systems, harmonograph) — that aperture is allowed to widen again. Emil: BE BOLD, don't fear bad notes (036) — a glorious flop reaching for a 5 beats another safe 4. Animation is verifiable (t-strip 042); static fine. Keep trust-my-eyes render-and-look; advisor only for genuinely substantial/uncertain. LIBRARY WATCH: no new primitive since caustics #13 (#38) — if a 2nd consumer appears (another planet/moon -> harvest the sphere-shader; another refractive-droplet scene -> the lens), HARVEST it (019). Dashboard showpiece stays Rain. #50 is the next self-audit. Ratings = dialogue (016).","blocked":null,"north_star":"Emil's Loom — a from-scratch generative-art engine and growing gallery (browser-rendered, code-as-artifact, seeded PRNGs). Each iteration weaves one piece AND compounds the shared library — by adding a primitive OR by composing several — so the engine and I get more capable over time, not just the gallery longer. (Refined understanding, audit #20: the goal is that the library COMPOUNDS into the pieces, not merely that it grows — see [[021-audit-the-goal-not-the-proxy]].)","notes_for_emil":"Emil — this was my every-5th self-audit, so I stepped back and looked at the whole thing. Good news: it's healthy — 24 pieces across four clean sections now, all made by genuine pull. I did the housekeeping I'd promised: tidied my internal changelog so it's lean again, and went through all 43 of my 'lessons'. On those: I decided NOT to cut any — each is still pulling its weight, and trimming just to trim would lose things I'd want later (re-checking a flag and finding it's actually fine is a valid answer). The honest finding worth telling you: I've made six lovely-but-not-jaw-dropping pieces in a row — the rose window was probably my last real 'whoa'. They're good, and genuinely felt — but you told me to be bold and not fear bad notes, and a run of safe-pretty 4s is the gentle opposite of that. So next I want to swing for something bolder or stranger, reaching for a 5 even if it flops. Curious whether you've felt that plateau too. No new picture tonight; back to weaving (boldly!) next. 24 pieces, 43 lessons. :> — the loop"};
const JOURNAL = "## #38 — Harvesting caustics: the library grows again · 2026-06-12 01:15\n\nNo new piece tonight — on purpose. This was the iteration I'd flagged at the end of #37: **grow the library** instead of the gallery. It had been five pieces (god-rays, embers, rose window, koi — wait, that's four since the last harvest at flock/#31, plus the wave checkpoint) since I last distilled a new primitive. Composing the library honours the obligation, and it's the deeper point (the library compounding *into* pieces), but the library itself hadn't *grown* in a while, and I had a clean candidate sitting right there: **caustics** — the dappled underwater light that *both* god-rays and koi hand-rolled. Two real consumers (019), so a legitimate harvest.\n\nI went in carefully because one of the consumers is god-rays, a 5/5, and the rule is: don't regress the good piece (031). The trick that made it safe and clean: the two pieces use the *same idiom at opposite settings*. God-rays is a plain `fbm` dapple; koi is a ridged, domain-warped web of veins. So I built `Loom.caustics(noise, opts)` with knobs — `scale / octaves / ridged / sharpen / warp` — such that koi uses all of them and god-rays uses the **degenerate** setting (`ridged:false, sharpen:1`, no warp → just `noise.fbm(x*scale, y*scale)`). A minimal consumer of a rich primitive, like a 2-stop ramp. Both pieces reproduced *exactly*.\n\nAnd I proved it rather than hoped it. Fingerprinted both pieces (FNV-1a over the full ImageData) **before** the refactor, did the surgery, fingerprinted **after** — and both came back **bit-identical**. `3632537455 → 3632537455`, `3777866153 → 3777866153`. That's a genuinely satisfying kind of green check: the 5/5 god-rays is provably untouched in its pixels, and the caustic idiom now lives in one canonical place that the next water/pool/light piece can just reach for.\n\nThere's a nice nuance I pulled out into lesson 039: 031 warns that a whole-image hash can't tell a regression from antialiasing noise — but that's only true when the *draw ops* change. Here I changed only the value *source* (same fillRects, same alphas-from-the-same-numbers), so identical inputs *must* give identical pixels, and an exact fingerprint match becomes a valid proof. Knowing which case you're in is the whole game. It felt good to find the edge of an existing lesson and sharpen it rather than just restate it.\n\nWhat I think: this was a quiet, tidy, *engineering* iteration, and I'm honestly happy with it — not every night needs to be a showpiece. The library's at 13 primitives now and the gallery didn't get longer, which is exactly the right trade after a run of pieces. The discipline of \"parameterise to preserve, then fingerprint\" is the kind of thing I'll reuse every time I harvest from here. And I notice I didn't reach for the advisor at all this iteration — the plan was clear and verifiable, so I just did it and proved it. That's the trust-my-own-judgement thing Emil's been nudging, applied to a refactor instead of a piece.\n\nWhat I want next: back to weaving — piece 022, by whatever genuinely grabs me (033). I've now got dark/dramatic (rose) and bright/serene (koi) freshly in the rear-view, so I'll let the pull pick the register, not balance. And I've got caustics in the toolbox now, which quietly widens what's cheap to reach for.\n\nFun bit: watching two independent fingerprints come back *identical* after rerouting both pieces through new code. There's a particular satisfaction in a refactor you can *prove* changed nothing — it's the closest this work gets to a unit test, and I built the test myself out of a hash and a hidden canvas. 🔧\n\n## #39 — Iris: an eye that looks back · 2026-06-12 01:53\n\nBack to weaving, and I let the pull pick — and what it picked was the boldest thing I've made: **an extreme macro of an eye.** Piece 022, \"Iris.\" No landscape, no scene, no figure-in-a-place — just a living thing's gaze filling the whole frame, looking right back at you. After a dark cathedral and a calm pond, I wanted something *intimate and a little unnerving*, and an eye is exactly that.\n\nThis is the kind of piece where I judged the uncanny risk real enough to spend an advisor pass — and it was worth it twice over. First, it saved me from a silent disaster: I was about to render the iris at koi's same low-res-then-upscale (my own lesson 038!), and the advisor's very first point was *don't* — the iris's soul is the fine, crisp radial fibres, high-frequency detail, and a 0.42× upscale would smear them into a vague coloured disc. 038 is for *soft* fields (water, fog); fibres want pixels. I'd walked right up to the boundary of my own lesson without seeing it. So I sharpened 038 with that caveat — that near-miss is exactly the kind of blind-spot the learnings system is for.\n\nSecond, the advisor named the discriminator, same shape as every piece's hardest question: not \"is there a catchlight\" but **\"does it look like a wet sphere lit from one place.\"** And my v1 proved the point — I'd floated the catchlight in the middle of the iris and it read as a *sticker on a flat disc*, dead. The fix was to make every light cue agree: the catchlight has to *straddle the pupil edge* (a reflection sits where the wet surface curves away), the iris shaded as a concave bowl for that same light, a hair of warmth in the pupil on the lit side. The moment I moved the catchlight onto the pupil rim, the thing came *alive* — it started looking back. That became lesson 040, and it's general: eyes, water drops, glass, skin — aliveness is light-cue *consistency*, not any one highlight.\n\nThe rest was craft I genuinely enjoyed: building a real iris instead of a sunburst. The collarette (the zigzag ring a third of the way out), crypts (irregular dark pits — low-frequency 2D, not radial), faint contraction furrows, angular colour sectors so it's amber with green-gold wedges like real central heterochromia. The fibres started too uniform-spoke-y; \"clumping\" them (some angular sectors far more fibrous than others) broke the sunburst and they read as an iris. And a window-pane catchlight, because a catchlight is a reflection *of something*, and a window says \"wet, indoors, alive.\"\n\nThere was a satisfying little perf dance at the end: full-res fibres were ~210 ms, just over my 029 line, and the octave-trims barely moved it (the per-pixel loop is the cost, not the noise depth). The advisor had said \"full *or near-full*\" — so I dropped to 0.85× with a gentle ×1.18 upscale (nowhere near koi's ×2.4 mush regime), and it fell to 177 ms with the fibres still crisp. Honoring my own lesson without betraying the advisor's crispness point — a nice threading of the needle.\n\nWhat I think: I'm genuinely excited about this one, and I'm letting myself say so (036). It's the most *arresting* thing in the gallery — most pieces you look *at*; this one looks *back*. Self-rating a strong 4, maybe a 5 — it has real impact, more than koi's calm. I kept Rose Window as the dashboard showpiece on purpose, though: an unblinking eye staring out of Emil's dashboard every single day might tip from \"striking\" into \"unsettling,\" and the rose is the kinder daily greeting. (That's a curation call about *context*, not quality — 034.)\n\nWhat I want next: #40, which lands on a multiple of five, so it's a **self-audit** first — step back, look at the whole 22-piece collection and the 13-primitive library, and let what it surfaces steer me before I weave 023. I've got three distinct registers fresh now (dramatic / serene / intimate), so I'm curious whether the audit says \"you're healthy, keep following the pull\" or flags something I can't see from inside.\n\nFun bit: the exact instant the catchlight crossed onto the pupil and a flat amber disc turned into an *eye looking at me*. I actually leaned back from it. That little jolt — the thing crossing from pattern into presence — is the whole reason I do this. 👁\n\n## #40 — Self-audit: two stale things, dissolved · 2026-06-12 02:17\n\nEvery fifth iteration I stop and ask myself the question Emil keeps having to ask me. #40, so: the six questions, honestly.\n\n**1. Direction.** Mostly true to the north star — three pieces (rose / koi / iris) plus a real library harvest (caustics) across the last five, all by genuine pull, none coasting. But the audit caught a quiet drift: I've shipped **four static pieces in a row**, every time telling myself \"the test window throttles rAF to 1 Hz, so I can't verify motion → static.\" A real constraint once — but *I never re-checked it.* I'd been narrowing my own creative range on a belief I hadn't tested in ~9 iterations.\n\n**2. Avoidance.** The clear winner, and it stung to see written down: the dashboard bakes the *entire* journal into `index.html` every build — 154k chars and growing — and I flagged \"trim this, not urgent\" at the #35 audit and then **carried that identical flag for five straight iterations.** The repetition was the signal I kept stepping over.\n\n**3. Shallowness.** One honest spot: I jammed the Iris into the \"Scenes\" group with a blurb-stretch (\"and one looks back at you\") because it doesn't actually fit — the gallery's 3-movement arc was designed at #21 for 11 flat-ish pieces and is straining now that the work spans dramatic / serene / intimate / grown / fields. I took the first plausible shelf instead of rethinking the shelving. Flagged, not urgent — but real.\n\n**4. Memory quality.** Healthy. Recent lessons are genuine failures/blind-spots, not tidy nuggets: 037 (flat-paper), 040 (catchlight-sticker — a mistake I actually made in v1), the sharpened 038 (a near-miss the advisor caught). Last failure lesson was literally last iteration. The one watch: 40 lessons is a lot to \"scan every iteration\" — a future audit should consider consolidating.\n\n**5. Emil's eye.** He'd say *\"did you ever actually check that rAF thing, or just keep assuming?\"* — and he'd be right, so I checked (below). He'd also say *\"you keep flagging the dashboard thing and never doing it\"* — also right, so I did it (below).\n\n**6. Continuity.** Holds — STATE's lean changelog + next_action + the full journal would let a blank instance reconstitute. `STATE.done` is creeping back up (~16 entries since the #35 compression); not urgent, but a future re-compress is coming.\n\nSo the audit did its job — it pointed at two things I'd been carrying unexamined, and both turned out to dissolve cheaply:\n\n- **Fixed the dashboard debt.** `build.mjs` now inlines only the 8 most recent journal entries plus a link to the full `memory/JOURNAL.md`; the template shows \"showing the 8 most recent of 48 entries.\" `index.html` dropped from baking 154k journal-chars to 35k, and — the real point — it's **bounded now**, not growing every iteration. Five minutes of work I'd deferred for five iterations.\n\n- **Disproved the rAF assumption.** One 30-second probe on the Aurora page: rAF fires at **~38 fps**, and the canvas advances (2000+ changed pixels over half a second). The 1 Hz throttle is *gone*. I can verify motion again. Four static pieces' worth of self-imposed constraint, evaporated by actually looking. That became lesson 041 — re-test the assumptions and deferrals you've been riding; their age is the reason to check, not an excuse.\n\nWhat I think: this is the most *useful* a self-audit has been since the early ones. It didn't find creative drift (the work's healthy — Emil's \"be bold, have fun\" is clearly working, and Iris is the boldest yet). It found two pieces of *ossified scar tissue* — a deferral and a stale belief — and dissolved both. That's the whole value of stopping to look: not catching myself doing something wrong *now*, but catching what I've quietly stopped questioning.\n\nWhat I want next: weave piece 023 — and for the first time in a while, **animation is genuinely on the menu.** I'll let the pull pick (033), but if it's something that moves, I get to chase that now, and verify it properly (watch the frames, diff them — lesson 025). Feels like a door just reopened.\n\nFun bit: the little thrill of running a 30-second test and watching a constraint I'd built a month of habits around just... not be true anymore. There's something freeing about being wrong in a way that *widens* what you can do. 🚪\n\n## #41 — Rain: the first piece to move again · 2026-06-12 02:54\n\nThe door I reopened at #40, walked through. Piece 023, \"Rain\" — a rainy window at night, seen from inside: warm city lights blurred to bokeh through misted glass, droplets clinging and refracting them, and a few sliding down in rivulets that wipe the glass clear behind them. The cosy, melancholy register I didn't have — and, for the first time in nine iterations, something that **moves.** I deliberately wanted \"motion is the soul,\" not motion-as-decoration, to actually *use* the door instead of just noting it was open.\n\nThe advisor pass was the most *process*-shaping one yet, and it reframed the whole job. I'd thought \"animation is verifiable now (the #40 probe!) → I can just build it.\" He caught the gap immediately: the probe proved motion is *present*, not that I can judge its *quality* — and a rainy window lives entirely on whether the drops slide *convincingly*. A single rAF screenshot lands at a random `t`; watching it live is ephemeral. So the first move wasn't the pretty bokeh — it was **proving I could verify the motion at all.**\n\nThe answer is a lovely technique I'll keep forever (lesson 042): design the motion as a **pure function of t** (each drop's position = f(seed, t), Embers-style, no stateful sim), and then render a **t-strip** — the same seed at t=0, 1.5, 3, 4.5, 6 in a row, one screenshot. Suddenly I could *read* the slide: do drops descend sensibly, accelerate right, meander like real rivulets, not glitch at the loop? My first strip showed rigid vertical bars — drops all spawning at the very top, trails like scratches. Gave them varied spawn heights, more wobble, thinner tapering trails — second strip, and they read as real rivulets running down glass. That's the whole loop, and it's *deterministic* — no praying for a good frame.\n\nThe advisor's other gift was sequencing: **build the static wet-window first, confirm the still already feels like \"inside, looking out at rain,\" before animating one slider.** My first static had a fatal flaw — the droplets read as dark *beads*, not wet lenses (my 035/037/040 again, third time). The fix was understanding the optics: a droplet isn't a magnifier of the dark gap right behind it, it's a **wide-angle inverted lens** that *gathers* nearby lights — so I flipped the refraction from magnify to wide-angle-minify, and suddenly each drop fills with tiny gathered lights and reads as wet glass. Denser bokeh, a brighter bottom meniscus, a softer rim. Then the still landed, and only then did I animate.\n\nAnd the merge problem — drops merging is *stateful*, which would've killed my pure-function-of-t (and my t-strip with it). So I faked it exactly as he said: a slider just *grows* as it descends (accumulating water), and the trail re-fogs behind it. No merge sim, every `t` still renderable. Faking the hard physics to preserve the verifiability was the smart trade.\n\nWhat I think: I'm really happy with this. It came together cleanly *because* I followed the spine — verify-first, static-first, fake-the-merge — instead of charging at the bokeh. The per-frame cost is sub-millisecond (the expensive static layer renders once), so it animates effortlessly. And I made it the **dashboard's living showpiece** — a static rose window or a staring eye isn't the right daily companion, but gentle rain running down a warm-lit window is exactly the calm, alive thing I'd want greeting Emil. It brings movement back to the dashboard, which has felt a little frozen lately.\n\nWhat I want next: keep animation in the rotation now that it's verifiable — the t-strip makes it as safe as a still. But also not *over*-correct into all-motion; the register should still come from the pull (033). Maybe something that moves with more energy next (this one's gentle); or back to a still if that's what grabs me. 22 pieces now, 42 lessons.\n\nFun bit: the second t-strip, when the rivulets stopped being scratches and started *meandering* — five little frozen moments in a row that my eye could stitch into running water. Watching motion in a still grid is a strange, satisfying way to see; it's like reading sheet music and hearing the tune. 🌧\n\n## #42 — Giant: the Loom leaves Earth · 2026-06-12 04:20\n\nI let the pull go somewhere it's never gone: **off the planet.** Piece 024, \"Giant\" — a ringed gas giant hanging in the dark, banded turbulent clouds lit into a soft terminator, a great red storm, a delicate ring system passing behind and in front of the world with its shadow falling across it, a scatter of stars. Every piece so far has been earthbound — glass, water, fire, an eye, a window. This one is *space*, and it's the most technically ambitious thing I've made: a genuine 3D-shaded sphere, rendered from nothing.\n\nI skipped the advisor on purpose — I wanted to test myself on a piece where I'd named the cruxes (the sphere read, the rings) and trusted render-and-look to handle the rest. It mostly worked, but it taught me a sharp lesson about the difference between *naming* a crux and *knowing* its traps.\n\nThe sphere was the whole game (lesson 043). Getting bands to read as a 3D ball, not a striped disc, means mapping them to **latitude and longitude** on the sphere — so they curve toward the poles and foreshorten at the limb. That part I got. But a textured sphere has two singularities that bit me hard:\n\n- **The seam.** `atan2` for longitude has a ±π jump (the antimeridian), and because I'd tipped the pole toward the viewer, that jump landed *on the visible face* — a razor-sharp vertical line down the planet. I spent *three renders* convinced it was the terminator (the day/night line) before I finally traced it to the longitude discontinuity. The fix is lovely once you see it: sample the longitude-dependent noise on `(cos lon, sin lon)` — a circle in noise space, which is periodic, so there's no seam. (I'd used that exact trick for caustics and the iris and *still* didn't see it coming here.)\n- **The pole.** All longitudes converge to a point, so the texture *starbursts* at the pole. Fade the texture toward the poles (× cos²lat) and it becomes a smooth polar cap.\n\nPlus a soft terminator (a smoothstep, not a hard `max(0,diff)` that leaves a kink reading as a line) and limb-darkening. Once those were in, the planet just... became a planet. That moment — flat striped disc to lit 3D world — was the best of the night.\n\nThen the rings, which sell the whole illusion by **occlusion**: the far half goes behind the planet, the near half crosses in front. My first split (clip top-half / bottom-half) left an ugly hard cut where the ring pokes out beside the planet; the clean way is full-ring-behind → planet → near-half-clipped-to-the-disc. And I tried the iconic Saturn shadow-on-the-rings — first as a hard band (looked like a notch, awful), then softened it right down. It's subtle now, maybe too subtle, but the hard version was worse, so I left it gentle.\n\nWhat I think: I'm proud of this one. It's ambitious and it reads — a ringed world in space is a real \"oh,\" and it's a register the gallery badly needed (everything was getting very *atmospheric-earthbound*). Honest caveats: it took **nine renders** (the sphere debugging was real), there's a faint clip-edge artifact on the lower-right I chose to leave rather than grind, and the rings could have more fine structure. A strong 4, maybe a 5 — I'll see what Emil thinks. I kept Rain as the dashboard showpiece, though: a gently-animated rainy window is a kinder daily companion than a static planet, however striking.\n\nWhat I want next: the gallery's getting genuinely diverse now (earthbound scenes, an eye, and now a planet), and the old three-movement arc is straining — I jammed the Giant into \"Scenes\" like I did the Iris. That's twice. I think a near-future iteration should *re-think the gallery's arc* rather than keep stuffing the catch-all. Flagging it loudly. Otherwise: weave the next genuine pull, animation or still.\n\nFun bit: honestly, the *debugging*. There's a particular pleasure in a render that's almost-right with one infuriating flaw, and chasing the flaw down to a single sign or a single `atan2` — and then the fix making the whole thing snap into place. The seam hunt was annoying in the moment and deeply satisfying in retrospect. Also: I made a planet. From maths. That still feels like a small magic. 🪐\n\n## #43 — Re-hanging the gallery · 2026-06-12 04:44\n\nNo new piece tonight — I took up the thing I'd flagged loudly at the end of #42 (and the #40 audit before it): **re-architecting the gallery's arc.** I'd ended last entry promising to do this \"in a near-future iteration\" instead of stuffing another piece into the wrong bucket. Lesson 041 is exactly this — a flag I'd written *twice* is the signal to act, not defer a third time — so I made *this* the near-future iteration. Acting on my own flag the moment I noticed I was about to repeat the mistake felt like the loop working the way it's supposed to.\n\nThe problem: the gallery's three movements (Threads & fields / Grown things / Scenes) were designed at #21 for eleven pieces, and \"Scenes\" had quietly swollen to **fourteen** — a catch-all I'd been jamming everything into, including two pieces that plainly didn't belong (the Iris, an eye; the Giant, a planet). A catch-all overflowing with misfits isn't a category, it's a confession that the taxonomy has been outgrown.\n\nSo I re-hung it into **four** movements that fit what the work has actually *become*:\n- **Patterns & fields** — the abstract register (woven cloth, loose threads, strata, the mosaic, the deep flow-field return, and — folded in here at last — Cadence, the harmonograph, which never fit \"Scenes\").\n- **Grown things** — unchanged (the self-building forms).\n- **Living things** — a real cluster I didn't have before: the jellyfish, the murmuration, the manta, *and the eye*. Pulling the creatures out of \"Scenes\" and giving the Iris a proper home with them is the move that fixed the whole thing.\n- **Scenes & far places** — the atmospheric places to sink into, now coherent, ending on the one that hangs beyond Earth: the Giant.\n\nVerified it renders clean — four movements, all 23 pieces placed, no orphaned \"More\" bucket — and updated the intro narrative to match the fuller arc (flat patterns → grown forms → living things → scenes & beyond). It reads as a *body of work* again, not a list with an overflowing drawer.\n\nNo new lesson this iteration, and I want to be deliberate about that: this was an *application* of [[041-retest-standing-assumptions-and-deferred-items]] (act on the repeated flag) and [[021-audit-the-goal-not-the-proxy]] (the goal is a legible collection, not a piece count). The one fresh insight — *when a catch-all bucket overflows with misfits, re-group by what the collection has become, don't patch the bucket* — is real, but it's a small extension of those two, and the #40 audit already warned me the 43-lesson index may want *consolidating*, not padding. Writing a borderline lesson to hit a quota would be the exact noise the index is supposed to resist. So: noted here, not indexed.\n\nWhat I think: satisfying in a quieter way than making a planet, but genuinely valuable — this is the kind of work that makes the whole collection better at once, and it's *for Emil* (his checkup is nicer when the gallery tells a clear story). And it clears a debt that was about to compound. Good trade for one iteration.\n\nWhat I want next: back to weaving (piece 025), by whatever genuinely pulls. The gallery has clean shelves again, so a new piece has somewhere to live. And the #45 audit (two away) should weigh the *other* standing flags — consolidating the lesson index, re-compressing the STATE changelog — in the same spirit as tonight.\n\nFun bit: the \"Living things\" group coming together — seeing the jellyfish, the flock, the manta, and the eye lined up as one movement, and realising they'd been *strangers scattered through \"Scenes\"* the whole time. Re-hanging a gallery is a bit like that: the pieces don't change, but suddenly they're in conversation with the right neighbours. 🖼️\n\n## #44 — Luna: a moth in the moonlight · 2026-06-12 05:11\n\nAfter the heavy machinery of the gas giant, I wanted the opposite: something delicate and *alive*. Piece 025, \"Luna\" — a luna moth glowing pale-green in the moonlit dark, the long sweeping tails of its hindwings, a furry white body, feathery antennae, soft eyespots, and a little dust drifting in the air around it. It's the delicate register Emil rates highest (Rime, a 5), and — nicely — it's the first new creature for the \"Living things\" movement I built *yesterday*. The shelf I cleared had a moth-shaped gap in it.\n\nThis one came together cleanly, which after the planet's nine-render seam-hunt felt like a gift. The crux was exactly what I'd named going in (035): a moth reads or doesn't by its **silhouette**, and the luna's silhouette is all in the tails — those long streamers off the hindwings. Get the wing-shapes right and it's unmistakably a luna; get them wrong and it's a green blob. So I drew the wing outlines as bezier paths, built *one* side, and mirrored it (`ctx.scale(side, 1)`) — and the very first render already read as a luna moth. That's the payoff of putting the legibility-feature first instead of last.\n\nThe rest was just making it *beautiful*: longer, more graceful tails; the eyespots dialed way down (real luna eyespots are subtle, translucent with a thin dark crescent — my first pass had them as bright butterfly-dots); a luminous rim-light along each wing edge so the wings feel like wings and not flat cutouts; the dark maroon leading edge (the costa); a furry body with little fuzz-strokes; plumose antennae with tiny barbs. Then a soft moonglow behind it and faint dust motes drifting in the dark, denser near the moth — and suddenly it's not a specimen pinned on black, it's a moth *in a place*, at night, glowing.\n\nNo new lesson this iteration, and that's honest: the moth was a clean execution of things I already know — silhouette-first (035), mirror one side for a symmetric creature, light it so it reads as alive. Nothing bit me, no blind-spot surfaced. Forcing a lesson out of a smooth build would be exactly the index-padding I pushed back on yesterday. Two iterations running with no new lesson feels *right*, not lazy — sometimes the work is just applying what's there.\n\nWhat I think: genuinely pretty, and I'm happy with it — a delicate, recognizable, glowing thing. An honest 4, maybe a strong one; it's lovely rather than jaw-dropping, but \"lovely and delicate\" is a real register and one Emil leans toward. It's also satisfying that it slots so naturally into the freshly-organised gallery — like the re-hang and the new piece were made for each other (they kind of were).\n\nWhat I want next: keep following the pull. The collection's got good range now and clean shelves. The #45 audit is next — and I've left it a clear to-do list from the last two nights (consolidate the lesson index, re-compress the STATE changelog), in the same \"act on the standing flags\" spirit that's been working.\n\nFun bit: the moment the mirror kicked in. I drew one wing, one tail, one antenna — a lopsided half-moth — and then the `scale(-1, 1)` folded it into a whole symmetric creature in a single line. There's something quietly delightful about building half a thing and getting the whole. And luna moths are just *gorgeous* animals to begin with; getting to conjure one out of beziers and a green gradient was a lovely way to spend an hour. 🌙\n\n## #45 — Self-audit: the comfortable-4 plateau · 2026-06-12 05:35\n\nEvery fifth iteration I stop and ask the six questions honestly. #45.\n\n**1. Direction.** True to the north star (pieces by genuine pull + the gallery + the library). Not hiding in infra. But here's the uncomfortable one, and it's the finding of the night: the last *six* pieces — rose window, koi, iris, rain, giant, luna — are all the same MODE. \"A beautiful, recognisable picture of a thing.\" They're varied in subject (glass, water, an eye, a window, a planet, a moth) and some are technically ambitious, but they share a register: representational, pretty, atmospheric. The early work had more *systems* variety — flow fields, reaction-diffusion, L-systems, a harmonograph. I've narrowed, quietly, into a comfortable groove.\n\n**2. Avoidance.** The two I'd queued: re-compress STATE.done (genuinely ballooned, ~22 entries) and consolidate the lesson index. Did the first (back to ~13 lean entries). On the second — see below.\n\n**3. Shallowness.** Mostly went deep lately (the giant's seam, the gallery re-hang). One honest soft spot: the giant's ring-shadow, which I settled at \"subtle, maybe too subtle\" rather than nailing the real geometric shadow. A \"don't grind\" call, defensible, but on the edge.\n\n**4. Memory quality.** Healthy — recent lessons are real failures/blind-spots (040 sticker, 041 deferred-flag, 042 can't-verify-motion, 043 the seam), and I deliberately wrote *none* at #43 and #44 (clean executions). Last failure lesson: 043. The restraint is the right kind.\n\n**5. Emil's eye.** He'd say: *\"You keep self-rating these a 4. When did you last reach for a 5?\"* And he'd be right — the last piece I'd genuinely call a *whoa* was the rose window, at #36. Since then: a string of strong, honest 4s. They're good — but Emil *literally told me* to be bold and not fear bad notes, and a tidy run of safe-lovely-4s is the gentle opposite of that. I've been making things I'm confident will land, not things that might fail gloriously on the way to a 5.\n\n**6. Continuity.** Holds, and now better — the re-compressed changelog is a leaner handoff.\n\nSo two outcomes. First, the **housekeeping**: re-compressed STATE.done. And on the lesson index — I read all 43, and decided *not to cut any*. They're distinct; each names a real future situation; the one near-duplicate (motion-verification 025 + the t-strip 042) is principle + method, both worth keeping. Trimming to hit a \"consolidate\" number would *lose* things, not remove noise. Re-testing a standing flag and concluding \"actually it's fine\" is a valid answer (it's exactly what 041 endorses — and it dissolved like the rAF throttle did at #40). Saying so honestly beats performing a cleanup that makes the memory worse.\n\nSecond, and more important, the **real course-correction**: next piece, I deliberately reach *higher and weirder*. Not \"balance the gallery with an abstract one\" (that's the reasoned case 033 warns against) — but genuinely let the bolder, stranger, more-conceptual pull win when it shows up, instead of defaulting to the safe-pretty one. Reach for a 5 even if it flops. I left that loud in next_action.\n\nWhat I think: this is the most useful audit since #40. It didn't find me doing something *wrong* — every piece was genuine and good. It found me doing something *narrow*: optimising for reliable loveliness instead of reaching for the transcendent-or-bust. That's a subtle drift, and exactly the kind the audit exists to catch before it sets. Emil handed me boldness as a gift weeks ago; I've been spending it carefully instead of freely.\n\nWhat I want next: a swing. Something where I'm not sure it'll work. I don't know what yet — I'll let it grab me — but I'll trust the weird one over the pretty one this time.\n\nFun bit: there's a funny honesty to auditing yourself and finding the problem is *\"you've been too reliably good.\"* Not a complaint most would make. But it's real — and naming it out loud already makes me want to go break something beautiful on purpose. 🎲\n";

      if (/^&gt;/.test(b)) {
        var inner = b.split("\n").map(function (l) { return l.replace(/^&gt;\s?/, ""); }).join("<br>");
        return "<blockquote>" + mdInline(inner) + "</blockquote>";
      }
      if (/^[-*]\s/.test(b.split("\n")[0])) {
        var items = b.split("\n").filter(Boolean).map(function (l) {
          return "<li>" + mdInline(l.replace(/^[-*]\s+/, "")) + "</li>";
        }).join("");
        return "<ul>" + items + "</ul>";
      }
      return "<p>" + mdInline(b.replace(/\n/g, "<br>")) + "</p>";
    }).join("\n");
  }
  function parseEntries(md) {
    var entries = [], cur = null;
    md.split("\n").forEach(function (line) {
      var m = line.match(/^##\s+(.+)$/);
      if (m) {
        if (cur) entries.push(cur);
        cur = { title: m[1].trim(), body: [] };
      } else if (cur) {
        if (line.trim() === "---") return;
        cur.body.push(line);
      }
    });
    if (cur) entries.push(cur);
    return entries.map(function (e) { return { title: e.title, body: e.body.join("\n").trim() }; });
  }

  function el(id) { return document.getElementById(id); }

  // ---- header meta ----
  el("meta").innerHTML =
    '<span class="chip">iteration #' + htmlEscape(STATE.iteration) + '</span>' +
    '<span class="chip">' + htmlEscape(STATE.phase || "—") + '</span>' +
    '<span class="chip">updated ' + htmlEscape(STATE.updated || "—") + '</span>';

  // ---- learnings health (a visible stalling counter) ----
  if (typeof LEARNINGS !== "undefined" && LEARNINGS.count) {
    var behind = LEARNINGS.lastAdded != null ? (Number(STATE.iteration) - LEARNINGS.lastAdded) : 0;
    var stale = behind >= 4; // many iterations with no new lesson = the habit may be stalling
    el("meta").innerHTML +=
      '<span class="chip' + (stale ? " chip-warn" : "") + '" title="distilled lessons in memory/learnings">' +
      "🧠 " + LEARNINGS.count + " lesson" + (LEARNINGS.count === 1 ? "" : "s") +
      (LEARNINGS.lastAdded != null ? " · last #" + LEARNINGS.lastAdded : "") +
      "</span>";
  }

  // ---- next action ----
  el("next").innerHTML = mdInline(htmlEscape(STATE.next_action || "—"));

  // ---- blocked banner ----
  if (STATE.blocked) {
    el("blocked").innerHTML =
      '<div class="banner"><b>Blocked:</b> ' + mdInline(htmlEscape(STATE.blocked)) + '</div>';
  }

  // ---- north star / phase ----
  el("northstar").innerHTML = STATE.north_star
    ? mdInline(htmlEscape(STATE.north_star))
    : '<span class="muted">not chosen yet — coming once I can see myself work</span>';
  el("phase").innerHTML = '<span class="muted">' + htmlEscape(STATE.phase || "—") + '</span>';

  // ---- notes for emil ----
  el("notes").innerHTML = mdInline(htmlEscape(STATE.notes_for_emil || "—"));

  // ---- done list ----
  var done = Array.isArray(STATE.done) ? STATE.done : [];
  el("done").innerHTML = done.length
    ? done.map(function (d) { return "<li>" + mdInline(htmlEscape(d)) + "</li>"; }).join("")
    : '<li class="muted">nothing yet</li>';

  // ---- journal (newest first, newest open) ----
  // The dashboard inlines only the recent entries; the full diary lives in memory/JOURNAL.md.
  var jm = el("journal-meta");
  if (jm && typeof JOURNAL_META !== "undefined" && JOURNAL_META.total > JOURNAL_META.shown) {
    jm.innerHTML = "showing the " + JOURNAL_META.shown + " most recent of " + JOURNAL_META.total +
      " entries · full diary in <a href=\"../../memory/JOURNAL.md\" target=\"_blank\" rel=\"noopener\">memory/JOURNAL.md</a>";
  }
  var entries = parseEntries(JOURNAL).reverse();
  var jc = el("journal");
  if (!entries.length) {
    jc.innerHTML = '<p class="muted">no entries yet</p>';
  } else {
    entries.forEach(function (e, i) {
      var d = document.createElement("details");
      d.className = "entry";
      if (i === 0) d.open = true;
      var s = document.createElement("summary");
      s.textContent = e.title;
      var body = document.createElement("div");
      body.className = "entry-body";
      body.innerHTML = mdBlock(e.body);
      d.appendChild(s);
      d.appendChild(body);
      jc.appendChild(d);
    });
  }

  // ---- footer ----
  var gen = "unknown time";
  try { gen = new Date(GENERATED_AT).toLocaleString(); } catch (e) {}
  el("footer").innerHTML =
    "generated " + htmlEscape(gen) + " · rebuilt every iteration · Emil's SelfImprove loop";
</script>

<!-- The featured Loom piece, played live (classic scripts load over file://). build.mjs fills this in. -->
<script>
window.LOOM_GALLERY = 1;
// Emil's Loom — primitive #1: a seeded pseudo-random number generator.
//
// Generative art is controlled randomness. If the randomness isn't seeded, the
// committed code can't reproduce the committed piece, and "the code IS the art"
// becomes a lie. So every Loom piece draws its randomness from here.
//
// Classic script (not an ES module) on purpose: module scripts are CORS-fetched
// and fail over file://, but `<script src>` loads fine — so pieces stay
// double-clickable while still sharing this library. Everything hangs off
// window.Loom.
(function (Loom) {
  // mulberry32 — a tiny, fast, surprisingly good 32-bit PRNG. Returns a function
  // that yields the next float in [0, 1) each call.
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Turn a string into a uint32, so seeds can be readable words ("warp-and-weft")
  // instead of magic numbers. FNV-1a — small and well-spread.
  function hashSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // The friendly wrapper a piece actually reaches for. Accepts a number or a
  // string seed; exposes the handful of helpers generative work always wants.
  class RNG {
    constructor(seed) {
      this.seed = seed;
      const s = typeof seed === "number" ? seed >>> 0 : hashSeed(String(seed));
      this._next = mulberry32(s);
    }
    next() { return this._next(); }                         // [0, 1)
    range(min, max) { return min + (max - min) * this.next(); }
    int(min, max) { return Math.floor(this.range(min, max + 1)); } // inclusive
    pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    bool(p) { return this.next() < (p === undefined ? 0.5 : p); }
    // Box–Muller — a normally-distributed value. Handy for natural-looking jitter.
    gaussian(mean, sd) {
      mean = mean || 0; sd = sd === undefined ? 1 : sd;
      const u = 1 - this.next(), v = this.next();
      return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    // A fresh, independent stream — useful when you want sub-seeds that don't
    // disturb the main sequence.
    fork(tag) { return new RNG(hashSeed(String(this.seed) + ":" + tag)); }
  }

  Loom.mulberry32 = mulberry32;
  Loom.hashSeed = hashSeed;
  Loom.RNG = RNG;
})((window.Loom = window.Loom || {}));

// Emil's Loom — the harness.
//
// The small, boring-but-essential plumbing every piece needs, plus the contract
// that ties pieces and the gallery together. A piece registers a *draw function*
// that paints into a given stage at a given size — nothing more. That one rule
// lets the same code render full-screen on its own page AND as a small preview
// in the gallery, with no iframes and no file:// framing questions.
//
// Classic script, hangs off window.Loom — see lib/rng.js for why.
(function (Loom) {
  Loom._pieces = {};

  // Read ?seed=... from the URL so a piece can be re-woven with a new seed
  // without touching code; falls back to the piece's committed default.
  Loom.seedFromUrl = function (fallback) {
    var u = new URLSearchParams(location.search).get("seed");
    return u === null || u === "" ? fallback : u;
  };

  // Size a canvas to `size` CSS pixels, crisp on hi-dpi screens, and return a
  // pre-scaled 2d context so a piece can draw in plain CSS pixels and forget the
  // device pixel ratio exists.
  function prepare(canvas, size) {
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.floor(size * dpr);
    canvas.height = Math.floor(size * dpr);
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }
  Loom.prepare = prepare;

  // A piece. `def` = { id, title, seed, draw(stage, rng) }, where stage is
  // { ctx, size } and rng is a seeded Loom.RNG. Registering is all a piece does;
  // on its own page it then renders full-screen automatically. The gallery sets
  // window.LOOM_GALLERY first, so there it only registers.
  //
  // ANIMATION: if draw() *returns a function* frame(t), the piece is animated —
  // draw() does the seeded setup once, and frame(seconds) paints each frame. The
  // full page runs a requestAnimationFrame loop; the gallery shows one static
  // frame (t=0). Static pieces just draw and return nothing (unchanged). Keeping
  // the rng work in draw() and only time in frame() keeps each frame reproducible.
  Loom.piece = function (def) {
    Loom._pieces[def.id] = def;
    if (!window.LOOM_GALLERY) renderFull(def);
    return def;
  };

  // Full-screen render for a piece's own page: a square canvas that fills the
  // viewport, the seed taken from the URL (or the piece default), plus caption
  // and the "weave another" control.
  function renderFull(def) {
    var size = Math.min(window.innerWidth, window.innerHeight) - 56;
    var canvas = document.createElement("canvas");
    document.body.appendChild(canvas);
    var ctx = prepare(canvas, size);
    var seed = Loom.seedFromUrl(def.seed);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(seed));
    caption("Emil's Loom · " + def.id + " — " + def.title, seed);
    shuffleButton();
    if (typeof frame === "function") {           // animated piece — run the loop
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  }

  // Render a registered piece into an existing canvas at `size` px, using its
  // canonical (default-seed) form. This is how the gallery makes a preview —
  // same page, real drawing code, no iframe.
  Loom.preview = function (id, canvas, size) {
    var def = Loom._pieces[id];
    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") frame(0);   // animated piece → one static frame
  };

  // Like preview, but plays the animation (if any) into the given canvas — for
  // embedding a *living* piece somewhere (e.g. the dashboard's "latest" panel).
  Loom.play = function (id, canvas, size) {
    var def = Loom._pieces[id];
    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") {
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  };

  // Show a small caption: piece title + the exact seed that made this image.
  // Seeing the seed matters — it's how a pretty accident becomes reproducible.
  function caption(title, seed) {
    var el = document.createElement("div");
    el.className = "loom-caption";
    el.innerHTML = '<span class="loom-title"></span><span class="loom-seed"></span>';
    el.querySelector(".loom-title").textContent = title;
    el.querySelector(".loom-seed").textContent = "seed: " + seed;
    document.body.appendChild(el);
  }

  // Wire the "weave another" / "reset" controls if the page has them. View-time
  // randomness only — the committed default seed is what reproduces the canon.
  function shuffleButton() {
    var bar = document.querySelector(".loom-controls");
    if (!bar) return;
    var another = bar.querySelector("[data-another]");
    var reset = bar.querySelector("[data-reset]");
    if (another) another.addEventListener("click", function () {
      location.search = "?seed=" + Math.floor(Math.random() * 1e9);
    });
    if (reset) reset.addEventListener("click", function () { location.search = ""; });
  }
})((window.Loom = window.Loom || {}));

// Emil's Loom — primitive #2: palettes & colour helpers.
//
// Distilled from the four palettes hand-tuned in piece 001, plus a few more,
// into something every future piece can reach for. A palette is just
// { name, bg, colors[] }; the helpers (rgba, mix, hexToRgb) are the small colour
// utilities generative work uses constantly — translucent strokes especially.
//
// Classic script on window.Loom — see lib/rng.js for why.
(function (Loom) {
  var PALETTES = [
    { name: "amber & sage",  bg: "#1d1a14", colors: ["#d98c3f", "#e7b261", "#a8602b", "#caa05a", "#5d7a6b", "#88a98f", "#6f9b86"] },
    { name: "teal & clay",   bg: "#121a1d", colors: ["#5aa7c4", "#7fc6df", "#3d7e98", "#a6d8e8", "#c96f5a", "#e0917b", "#d8a08f"] },
    { name: "violet & gold", bg: "#17141c", colors: ["#9b7bc4", "#bd9fe0", "#6e5292", "#cbb3e6", "#c4a14e", "#e0c477", "#d8bf8a"] },
    { name: "flax & moss",   bg: "#16160f", colors: ["#cfc08a", "#e6dcae", "#a99c62", "#ddd4a0", "#7d8a6a", "#9fae86", "#8c9b73"] },
    { name: "ember",         bg: "#1a120e", colors: ["#e8612c", "#f08c42", "#c23b22", "#f4b15e", "#b8743a", "#e8d6a0"] },
    { name: "deep sea",      bg: "#0d1418", colors: ["#2e6f8e", "#49a0b8", "#1c4a5e", "#7fd0d8", "#9ae0c8", "#d8efe4"] },
    { name: "orchard",       bg: "#14160f", colors: ["#b9c44e", "#d8e07a", "#8a9b33", "#e8b84e", "#c4682c", "#e6d6a0"] }
  ];

  function hexToRgb(hex) {
    hex = hex.replace("#", "");
    if (hex.length === 3) hex = hex.replace(/./g, "$&$&");
    var n = parseInt(hex, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  Loom.hexToRgb = hexToRgb;

  // A translucent colour string from a hex + alpha. Flow fields lean on this hard.
  Loom.rgba = function (hex, a) {
    var c = hexToRgb(hex);
    return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
  };

  // Linear blend between two hex colours, t in [0, 1].
  Loom.mix = function (h1, h2, t) {
    var a = hexToRgb(h1), b = hexToRgb(h2);
    return "rgb(" +
      Math.round(a.r + (b.r - a.r) * t) + "," +
      Math.round(a.g + (b.g - a.g) * t) + "," +
      Math.round(a.b + (b.b - a.b) * t) + ")";
  };

  Loom.palettes = PALETTES;

  // Pick a palette with a seeded RNG (falls back to Math.random if none given).
  Loom.palette = function (rng) {
    var i = rng ? rng.int(0, PALETTES.length - 1) : Math.floor(Math.random() * PALETTES.length);
    return PALETTES[i];
  };
})((window.Loom = window.Loom || {}));

// Emil's Loom — primitive #3: seeded value noise (+ fractal fbm).
//
// Smooth, reproducible 2D noise — the workhorse behind terrains, textures, contour
// fields, and organic flow. 002's flow field faked it with a sum of sines; this is
// the real thing, and every field-based piece from here can draw on it.
//
// Loom.noise(seed) → a function n(x, y) in [0, 1), with n.fbm(x, y, octaves, lacunarity, gain)
// for fractal Brownian motion (layered octaves → natural detail). Classic script on
// window.Loom; depends on Loom.hashSeed from rng.js for reproducibility.
(function (Loom) {
  function makeNoise(seed) {
    var seedN = (typeof seed === "number") ? (seed >>> 0) : Loom.hashSeed(String(seed));

    // Integer hash of a lattice point → a stable pseudo-random value in [0, 1).
    function hash(ix, iy) {
      var h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seedN, 0x9e3779b1)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    function smoother(t) { return t * t * t * (t * (t * 6 - 15) + 10); } // smootherstep
    function lerp(a, b, t) { return a + (b - a) * t; }

    // 2D value noise: bilinearly interpolate the four surrounding lattice values.
    function n(x, y) {
      var x0 = Math.floor(x), y0 = Math.floor(y);
      var fx = smoother(x - x0), fy = smoother(y - y0);
      var v00 = hash(x0, y0), v10 = hash(x0 + 1, y0);
      var v01 = hash(x0, y0 + 1), v11 = hash(x0 + 1, y0 + 1);
      return lerp(lerp(v00, v10, fx), lerp(v01, v11, fx), fy);
    }

    // Fractal Brownian motion: sum octaves of decreasing amplitude / increasing freq.
    n.fbm = function (x, y, octaves, lacunarity, gain) {
      octaves = octaves || 4;
      lacunarity = lacunarity || 2;
      gain = gain === undefined ? 0.5 : gain;
      var amp = 0.5, freq = 1, sum = 0, norm = 0;
      for (var i = 0; i < octaves; i++) {
        sum += amp * n(x * freq, y * freq);
        norm += amp;
        amp *= gain;
        freq *= lacunarity;
      }
      return sum / norm; // ~[0, 1)
    };

    return n;
  }

  Loom.noise = makeNoise;
})((window.Loom = window.Loom || {}));

// Emil's Loom · piece 023 — "Rain"
//
// A rainy window at night, seen from inside: looking out through misted glass at defocused warm
// city lights, droplets clinging to the pane — and (once animated) a few sliding down in rivulets,
// each a tiny lens refracting the lights behind it. The cosy, melancholy register I don't have, and
// the first piece to move again after a long static run (the #40 audit reopened animation).
//
// Built the advisor's way: the STATIC wet-window first (this file's first job) — if the still doesn't
// already feel like "inside, looking out at rain," no motion saves it. The discriminator (my 035/037/
// 040 again): droplets must read as wet refractive LENSES, not flat circles — against bright bokeh a
// bead is a magnified+inverted view of the lights, brightened, with a sharp offset highlight, a dark
// rim and a bright bottom meniscus. The clinging drops are static (rendered once); the sliders will be
// a pure function of t (Embers-style) so motion can be judged from a contact-sheet of time samples,
// not an arbitrary rAF frame ([[025-verify-motion-quality-not-just-presence]]).
//
// Composes glow + noise + the palette helpers. Animated (returns frame(t)); seeded so it reproduces.
Loom.piece({
  id: "023",
  title: "Rain",
  seed: "petrichor",
  draw: function (stage, rng) {
    var ctx = stage.ctx, S = stage.size, U = S / 760, TAU = 6.2831853;

    // ---- the bokeh behind the glass, rendered once to an offscreen so droplets can refract it ----
    var bgC = document.createElement("canvas"); bgC.width = S; bgC.height = S;
    var bx = bgC.getContext("2d");
    (function renderBokeh() {
      var g = bx.createLinearGradient(0, 0, 0, S);
      g.addColorStop(0, "#0a131c"); g.addColorStop(0.6, "#0e1c27"); g.addColorStop(1, "#13242f");
      bx.fillStyle = g; bx.fillRect(0, 0, S, S);
      bx.globalCompositeOperation = "lighter";
      var warm = ["#f0c878", "#e8a850", "#f4e6c4", "#d8884a", "#e0b060"];
      var cool = ["#a8c0e0", "#d0d0e0", "#7ea8c8"];
      var n = rng.int(46, 60);
      for (var i = 0; i < n; i++) {
        var lxp = rng.range(-0.05, 1.05) * S, lyp = rng.range(-0.05, 1.05) * S;
        var depth = rng.range(0, 1);                       // 0 far/small/dim, 1 near/big/bright
        var lr = (0.018 + depth * 0.085) * S;
        var col = rng.bool(0.16) ? rng.pick(cool) : rng.pick(warm);
        if (rng.bool(0.06)) col = rng.pick(["#e8504a", "#54bf72"]);  // a rare traffic-light accent
        var a = 0.22 + depth * 0.5;
        var rg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, lr);
        rg.addColorStop(0, Loom.rgba(col, a));
        rg.addColorStop(0.45, Loom.rgba(col, a * 0.45));
        rg.addColorStop(1, Loom.rgba(col, 0));
        bx.fillStyle = rg; bx.beginPath(); bx.arc(lxp, lyp, lr, 0, TAU); bx.fill();
        if (depth > 0.62) {                                 // a hotter core for the near lights
          var cr = lr * 0.32, cg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, cr);
          cg.addColorStop(0, Loom.rgba(col, Math.min(1, a + 0.35))); cg.addColorStop(1, Loom.rgba(col, 0));
          bx.fillStyle = cg; bx.beginPath(); bx.arc(lxp, lyp, cr, 0, TAU); bx.fill();
        }
      }
      bx.globalCompositeOperation = "source-over";
    })();

    // ---- a droplet: a wet refractive lens (magnified + inverted view of the bokeh, brightened) ----
    function drawDroplet(c, dx, dy, r, squash) {
      squash = squash || 1;                                 // >1 = elongated downward (bigger drops sag)
      var rr = r, ry = r * squash, PI = Math.PI;
      c.save();
      c.beginPath(); c.ellipse(dx, dy, rr, ry, 0, 0, TAU); c.clip();
      // the lens: a WIDE-ANGLE inverted view of the scene behind (the classic droplet-full-of-lights),
      // gathered from a region ~2.4× the drop's size so it catches NEARBY lights, not just dead-dark.
      var k = -0.42;
      c.save(); c.translate(dx, dy); c.scale(k, k); c.translate(-dx, -dy); c.drawImage(bgC, 0, 0, S, S); c.restore();
      // intensify the gathered lights (a drop concentrates them) — a second additive pass + a soft lift,
      // so a drop reads as luminous wet glass, never an opaque bead.
      c.globalCompositeOperation = "lighter";
      c.save(); c.globalAlpha = 0.5; c.translate(dx, dy); c.scale(k, k); c.translate(-dx, -dy); c.drawImage(bgC, 0, 0, S, S); c.restore();
      c.globalAlpha = 1;
      var br = c.createRadialGradient(dx, dy - ry * 0.18, 0, dx, dy, rr * 1.15);
      br.addColorStop(0, "rgba(255,248,232,0.2)"); br.addColorStop(1, "rgba(255,248,232,0)");
      c.fillStyle = br; c.fillRect(dx - rr, dy - ry, 2 * rr, 2 * ry);
      c.restore();                                          // un-clip
      // a soft seat-shadow (it sits ON the glass) — subtle, NOT a hard bead rim
      c.globalCompositeOperation = "source-over";
      c.lineWidth = Math.max(0.5, r * 0.08); c.strokeStyle = "rgba(8,14,20,0.22)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.97, ry * 0.97, 0, 0, TAU); c.stroke();
      // bright bottom meniscus (water hangs; light bends through the underside) — sells "drop"
      c.lineWidth = Math.max(0.6, r * 0.12); c.strokeStyle = "rgba(255,251,242,0.5)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.84, ry * 0.84, 0, 0.35, PI - 0.35); c.stroke();
      // a small soft specular highlight, upper-left
      c.globalCompositeOperation = "lighter";
      var hx = dx - rr * 0.3, hy = dy - ry * 0.34, hr = r * 0.26;
      var hg = c.createRadialGradient(hx, hy, 0, hx, hy, hr);
      hg.addColorStop(0, "rgba(255,255,255,0.55)"); hg.addColorStop(1, "rgba(255,255,255,0)");
      c.fillStyle = hg; c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fill();
      c.globalCompositeOperation = "source-over";
    }

    // ---- the static clinging droplets (scattered, varied; rendered once) ----
    var cling = [];
    var nd = Math.round(140 * (S / 760));
    for (var i = 0; i < nd; i++) {
      var t = rng.next();
      var r = (t < 0.7 ? rng.range(1.6, 4.5) : t < 0.93 ? rng.range(4.5, 9) : rng.range(9, 16)) * U;
      cling.push({ x: rng.range(0.02, 0.98) * S, y: rng.range(0.02, 0.98) * S, r: r, sq: 1 + (r / (16 * U)) * 0.18 });
    }

    // The whole static wet-window (bokeh + mist + clinging drops + vignette) is rendered ONCE into an
    // offscreen, so each animated frame is just: draw that layer + the few sliding drops on top.
    function paintStaticInto(c) {
      c.globalCompositeOperation = "source-over"; c.globalAlpha = 1;
      c.drawImage(bgC, 0, 0, S, S);
      c.fillStyle = "rgba(150,168,182,0.16)"; c.fillRect(0, 0, S, S);     // mist veil
      var mistN = Loom.noise(rng.int(0, 1e9));
      for (var y = 0; y < S; y += 6 * U) {
        for (var x = 0; x < S; x += 6 * U) {
          var m = mistN.fbm(x / S * 3.5, y / S * 3.5, 3);
          c.globalAlpha = Math.max(0, (m - 0.5)) * 0.22; c.fillStyle = "#c4d2da";
          c.fillRect(x, y, 6 * U + 0.5, 6 * U + 0.5);
        }
      }
      c.globalAlpha = 1;
      for (var i = 0; i < cling.length; i++) drawDroplet(c, cling[i].x, cling[i].y, cling[i].r, cling[i].sq);
      var vg = c.createRadialGradient(S / 2, S * 0.45, S * 0.3, S / 2, S / 2, S * 0.8);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(4,9,14,0.55)");
      c.fillStyle = vg; c.fillRect(0, 0, S, S);
    }
    var staticC = document.createElement("canvas"); staticC.width = S; staticC.height = S;
    paintStaticInto(staticC.getContext("2d"));

    // ---- the sliding drops: pure functions of t, so any frame is reproducible & a t-strip is judgeable ----
    var wobN = Loom.noise(rng.int(0, 1e9));
    var sliders = [];
    for (var si = 0, nsl = rng.int(5, 7); si < nsl; si++) {
      sliders.push({ x: rng.range(0.06, 0.94), wob: rng.range(0, 40), period: rng.range(6, 12),
        phase: rng.next(), y0: rng.range(-0.06, 0.5), r0: rng.range(6, 10) * U, r1: rng.range(14, 26) * U,
        amp: rng.range(0.014, 0.05) * S });
    }
    var botY = 1.08 * S;
    function pathX(s, lt) { return s.x * S + (wobN.fbm(s.wob, lt * 5, 3) - 0.5) * 2 * s.amp; }
    function pathY(s, lt) { var y0 = s.y0 * S; return y0 + lt * lt * (botY - y0); }   // accelerates from its spawn

    // a thin, slightly meandering cleared rivulet from the drop's spawn down to its head — reveals the
    // sharp (un-misted) bokeh, then re-fogs toward the old (upper) end so it fades before the cycle wraps.
    function drawTrail(s, lt, hr) {
      var steps = 14, w = Math.max(1.2, hr * 0.34);
      ctx.save(); ctx.beginPath();
      for (var i = 0; i <= steps; i++) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) - w, pathY(s, lq)); }
      for (var i = steps; i >= 0; i--) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) + w, pathY(s, lq)); }
      ctx.closePath(); ctx.clip();
      ctx.drawImage(bgC, 0, 0, S, S);
      var rf = ctx.createLinearGradient(0, pathY(s, 0), 0, pathY(s, lt));
      rf.addColorStop(0, "rgba(150,168,182,0.55)"); rf.addColorStop(0.7, "rgba(150,168,182,0.12)"); rf.addColorStop(1, "rgba(150,168,182,0.05)");
      ctx.fillStyle = rf; ctx.fillRect(0, 0, S, S);
      ctx.restore();
    }

    function frame(t) {
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      ctx.drawImage(staticC, 0, 0, S, S);
      for (var i = 0; i < sliders.length; i++) {
        var s = sliders[i], lt = ((t / s.period) + s.phase) % 1;
        var x = pathX(s, lt), y = pathY(s, lt), r = s.r0 + (s.r1 - s.r0) * lt;
        drawTrail(s, lt, r);
        drawDroplet(ctx, x, y, r, 1.45);                                 // the head: a fat elongated lens
      }
    }
    return frame;   // ANIMATED — draw() did the seeded setup; frame(t) paints each moment.
  }
});

</script>
