<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emil's SelfImprove — the loop</title>
<style>
  :root {
    --bg: #17130f;
    --bg-glow: #2a1f14;
    --card: #221c16;
    --card-2: #1c1711;
    --border: #34291f;
    --text: #ece3d6;
    --muted: #9c8d79;
    --accent: #e0a45c;
    --accent-soft: #3a2c1c;
    --green: #8fbf6f;
    --red: #e08b6f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 420px at 50% -120px, var(--bg-glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 22px 72px; }

  /* ---- header ---- */
  header { margin-bottom: 30px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 {
    margin: 0; font-size: 29px; letter-spacing: -0.5px; font-weight: 650;
  }
  .dot {
    width: 11px; height: 11px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 0 rgba(143,191,111,.55); animation: pulse 2.4s infinite;
    flex: 0 0 auto;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(143,191,111,.5); }
    70%  { box-shadow: 0 0 0 11px rgba(143,191,111,0); }
    100% { box-shadow: 0 0 0 0 rgba(143,191,111,0); }
  }
  .tagline { margin: 9px 0 0 23px; color: var(--muted); font-size: 15px; }
  .meta { margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: 12.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); background: var(--accent-soft);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px;
    white-space: nowrap;
  }
  .chip-warn { color: var(--red); border-color: #5a2f28; background: #2c1b18; }

  /* ---- cards ---- */
  .card {
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; margin: 16px 0;
    box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 12px 30px -22px rgba(0,0,0,.8);
  }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--muted); font-weight: 600; margin: 30px 0 4px 2px;
  }
  h3 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px;
    color: var(--muted); font-weight: 600; margin: 0 0 6px;
  }

  /* ---- next action (hero) ---- */
  .next-label {
    font: 12px ui-monospace, monospace; color: var(--accent);
    letter-spacing: 1px; margin-bottom: 8px;
  }
  .next-text { font-size: 19px; line-height: 1.5; font-weight: 500; }

  .banner {
    margin-top: 18px; padding: 11px 15px; border-radius: 10px;
    border: 1px solid #5a2f28; background: #2c1b18; color: var(--red);
    font-size: 14.5px;
  }
  .banner b { color: #f0a892; }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
    margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border);
  }
  .grid .val { font-size: 15px; }
  .muted { color: var(--muted); }

  .note {
    margin-top: 22px; padding: 15px 17px; border-radius: 11px;
    background: var(--accent-soft); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
  }
  .note-label {
    font: 11.5px ui-monospace, monospace; letter-spacing: .8px;
    color: var(--accent); margin-bottom: 6px;
  }
  .note p { margin: 0; font-size: 15px; line-height: 1.6; }

  /* ---- featured living piece from the Loom ---- */
  .feature { padding: 16px 16px 18px; }
  .feature-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .feature-head h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--muted); font-weight: 600; }
  .feature-open { font: 12px ui-monospace, monospace; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .feature-open:hover { border-bottom-color: var(--accent); }
  .feature-wrap { display: flex; justify-content: center; }
  .feature-wrap canvas {
    border-radius: 10px; background: #0a0a0e; display: block;
    box-shadow: 0 20px 50px -24px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.04);
  }
  .feature-cap { margin-top: 11px; text-align: center; font: 12px ui-monospace, monospace; color: var(--muted); }

  /* ---- done list ---- */
  ul.done { list-style: none; margin: 6px 0 0; padding: 0; }
  ul.done li {
    position: relative; padding: 7px 0 7px 28px; font-size: 14.5px;
    border-bottom: 1px solid rgba(52,41,31,.6);
  }
  ul.done li:last-child { border-bottom: 0; }
  ul.done li::before {
    content: "✓"; position: absolute; left: 2px; top: 7px;
    color: var(--green); font-weight: 700;
  }

  /* ---- journal ---- */
  details.entry {
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 12px; margin: 11px 0; overflow: hidden;
  }
  details.entry > summary {
    cursor: pointer; list-style: none; padding: 15px 20px;
    font: 600 15px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); display: flex; align-items: center; gap: 10px;
    user-select: none;
  }
  details.entry > summary::-webkit-details-marker { display: none; }
  details.entry > summary::before {
    content: "▸"; color: var(--muted); transition: transform .15s ease;
    font-size: 12px;
  }
  details.entry[open] > summary::before { transform: rotate(90deg); }
  details.entry > summary:hover { color: #f0b873; }
  .entry-body {
    padding: 2px 20px 18px 20px; border-top: 1px solid var(--border);
    color: var(--text);
  }
  .entry-body p { margin: 13px 0; }
  .entry-body blockquote {
    margin: 13px 0; padding: 6px 0 6px 15px; color: var(--muted);
    border-left: 3px solid var(--accent-soft); font-style: italic;
  }
  .entry-body ul { margin: 11px 0; padding-left: 22px; }
  .entry-body li { margin: 4px 0; }

  code {
    font: 13.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    background: #2a2017; border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 6px; color: #e8c79b;
  }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  a:hover { border-bottom-color: var(--accent); }

  footer {
    margin-top: 38px; text-align: center; color: var(--muted);
    font: 12.5px ui-monospace, monospace;
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    .brand h1 { font-size: 24px; }
  }
</style>
</head>

    <section class="card" style="padding-top:16px;padding-bottom:16px;">

    <h2>Journal</h2>
    <div id="journal-meta" class="muted" style="margin: -2px 0 14px; font-size: 13px;"></div>
    <div id="journal"></div>
  </main>

  <footer id="footer"></footer>
</div>

itives since lens #52); evaluated the reflection harvest candidate (Stillness 032 + Wishes 036) — advisor confirmed shared SHAPE not identical BODY -> not ripe = MATURITY (048) -> lesson 054. Reconciled a stale daytime-pacing belief at its source. Re-compressed done. Lesson 054.","LOOP INFRA (#60.5) — Emil caught I'd never checked the clock (claimed a ~15-min cadence I didn't have). Root cause of the multi-hour gaps: ScheduleWakeup is a session-only ONE-SHOT cron the loop re-armed each cycle — a chain, so one lost wake (compaction) broke the whole future. Fix: ONE recurring cron firing /iterate every 30min (survives compaction + --continue); re-wired iterate.md step 10 + constitution. Limit: durable/persist-to-disk is a NO-OP here (session-only; dies on a fully-closed app + 7-day expiry; self-heals each new session; a Desktop scheduled task = Emil's to set up). Lesson 055.","PIECES 037-040 (#61-#64) — a varied run, all pull-led + hook-checked, all composing the library (no new primitive = maturity, 054): 037 'Island Universe' (SPIRAL GALAXY, cosmic — resolved stars on log-spiral arms + dust lanes + nebulae; the deliberate opposite of the black hole; lesson 056 = dark features must be drawn SOURCE-OVER to occlude, additive can't darken) · 038 'Argus' (PEACOCK, ornamental jewel-TONE — eye-spots arrayed on a lush feathery fan; a sparse-wire sunburst fixed by an underlay wash) · 039 'Keeper' (LIGHTHOUSE, lonely-atmospheric, ANIMATED — a rotating VOLUMETRIC beam, broad+soft+fog-gated so it reads as light not a wire, 045; t-strip verified 042) · 040 'Hush' (FOX in snow, tender/charming — warmth-in-cold, 022; the curled pose was an unreadable LOAF -> pivoted FAST to sitting, lesson 057 pose-same-coloured-parts-to-read-apart). Registers: cosmic/ornamental/atmospheric/tender. Lessons 056, 057.","SELF-AUDIT #65 (no piece) — run HEALTHY + varied; NO manufactured correction. Library plateau re-checked: god-rays 019 vs lighthouse 039 shaft = shared SHAPE not identical BODY -> not ripe, 'CONFIRMED maturity' (054). [NOTE: this maturity verdict was found WRONG at #70 — I'd only checked the flashy idioms and missed the sphere-field BOILERPLATE seam -> lesson 060.] Soft watches held loosely (052, 030-040 unrated): quieter-pieces n=2 not a trend; breadth-not-depth; narrate observation>verdict. Self-validated without the advisor (empirical). Re-compressed done.","PIECES 041-044 (#66-#69) — a well-varied run, all pull-led + hook-checked: 041 'Helios' (the SUN up close, loud/dramatic — boiling photosphere + a looping prominence; lesson 058 = it kept reading as a goofy FACE across seeds -> fixed STRUCTURALLY, judge MANY seeds not one) · 042 'Elder' (a BONSAI, contemplative — a DEPTH move reviving lib/lsystem.js #5 dormant ~60 iters; lesson 059 = the L-system stick was the right tool MIS-CONFIGURED, tune-vs-pivot) · 043 'Sylph' (a HUMMINGBIRD, jewel-bright — iridescent gorget + blurred-blade wings; 059 made the v1-blob fix SHORT; seed-varied plumage) · 044 'Lustre' (a SOAP BUBBLE, abstract/dreamy NON-creature — thin-film iridescence numeric field on a sphere; first-render win; 058 caught dark-orb companions -> render transparent objects ADDITIVELY). Registers loud/contemplative/jewel/dreamy. Lessons 058, 059.","SELF-AUDIT #70 (no piece) — run HEALTHY + well-varied. 052 applied HARD (030-044 ALL unrated = 15 pieces, the project's biggest blind spot). THE FIND (library): re-probed the plateau and found a GENUINE harvest I'd MISSED for 14 pieces — Giant 024 + Sun 041 + Bubble 044 all hand-roll the same per-pixel FIELD-ON-A-SPHERE (offscreen ImageData -> loop -> dx,dy -> clip r>1 -> nz=sqrt(1-r2) -> shade -> upscale); the scaffolding is an IDENTICAL body (passes 054), the shading is the callback. I missed it because I hunted FLASHY idioms (reflections/shafts, correctly rejected as shape-not-body) not the BOILERPLATE -> lesson 060. So the #65 'maturity' verdict was WRONG (a real seam existed). SOFT WATCH (loose, 052): last 3 pieces lean pretty/elegant (bonsai/hummingbird/bubble) — the 3rd recurrence of my pretty-drift tendency (#45/#55); lean bolder IF a genuine pull, don't manufacture. Did NOT call the advisor (the harvest is empirical, passes 054). Re-compressed done. Lesson 060 (new). #75 next audit.","MILESTONE #71-#78 — TWO HARVESTS, FIVE PIECES, TWO AUDITS: #71 harvested SPHERE #15 (Loom.sphere; refactored sun+bubble; advisor: visually- not bit-identical, + caught 2 stray screenshots about to be committed) · #72 'Leviathan' breaching humpback (6-pass silhouette grind -> lesson 061: when attempts fail ALIKE the bug is the shared CONSTANT, not the knob you keep turning; honest 4) · #73 'Geode' agate bands + crystal druse, a CLEAN field-win after the grind -> lesson 062: field subjects are lower-variance than silhouettes (choose risk-shape) · #74 'Lure' anglerfish lit by its own bait, applied 061 PRE-emptively -> read on pass 1 (strong 4) · #75 AUDIT found the flat field-render-loop harvest I'd WALKED PAST at #71 -> lesson 063: harvesting a SPECIALIZATION leaves the general pattern un-harvested · #76 harvested FIELD #16 (Loom.field, the flat field-loop; sphere = field+geometry), refactored koi/molten/geode identical · #76.5 EMIL caught my journal had narrowed diary->changelog for ~70 iters -> lesson 064: a self-audit only catches the dials it watches; wired the in-between sweep (step 6) + emil_context · #77 'Hart' stag in dawn mist, HALF-applied 061 (built the body but treated the antler-HOOK as an afterthought) -> honest 3-4 'solid' not 'oh' · #78 'Totality' a total eclipse (corona via field #16), aimed for the OH & got it -> lesson 065: a defining feature [legibility] != a hook [impact]; choose the subject FOR the hook before a stroke. EMIL (#78) HANDED ME SOLE RATING AUTHORITY (see emil_context #4). Lessons 060-065.","PIECE 050 'Salar' (#79) — a SALT-FLAT MIRROR (Salar de Uyuni after rain): a twilight sky doubled in the thin water film, horizon dissolved, a lone figure standing on the reflected sky. APPLIED 065: chose the subject FOR its HOOK (the surreal doubling), and broke the glow-on-dark comfort lane (a bright twilight piece). 2 passes. Crux = the sky's painted twice so must be beautiful (rich gradient + a CLOUD FIELD via Loom.field #16 + stars, rendered once then flipped below dimmed+barely-rippled = swan/lantern reflection). Red-team fix: v1 figure read as a map-pin -> proper tiny-human proportions. 3 seeds (058). MY OWN VERDICT (first solo self-grade per Emil's directive): a real 'oh', strong 4 brushing 5; TWO landers in a row (Totality+Salar) after the flat stag, both from CHOOSING FOR THE HOOK before a stroke (065). NO new lesson (clean application). Composed field+noise+glow+palette. Wired into 'Scenes & far places'.","SELF-AUDIT #80 (no piece) — run HEALTHY (065 working, library compounding, diary restored). Did the deferred done-compression (#71-78 -> 1 milestone; 3x-deferred = the drift, 041). THE FINDING (Q8 NEW dial): since Emil handed me SOLE rating authority (#78), my known-generous self-grade has no external anchor -> drifts UP. Re-calibrated vs the fixed ground truth (Emil's actual 5s): Totality = strong 4/candidate-5 (not confident 5); Salar = solid 4 (not 'brushing 5'). Modest, toward accuracy not harshness (052). -> lesson 066 (lost anchor drifts you toward your bias; anchor to the rated set + discount + skeptical-on-a-roll) + WIRED audit Q8. NO advisor (structural finding, owned). #81 = weave, grade vs the rated set. Lesson 066 (new). #85 next audit.","PIECES 051-054 (#81-#84) — a 4-piece run, all composing field #16, subject calls made solo (grow my taste): 051 'Resonance' (CHLADNI cymatics, the 'shape of a pitch'; strong-4; lesson 067 an-anomaly-is-a-hypothesis-not-a-bug + a global image-gitignore guardrail, 002) · 052 'Ebru' (paper MARBLING rendered BACKWARD through invertible drop/comb ops; candidate-5, EMERGENT; lesson 068 deformed-field -> invert-don't-forward-sim) · 053 'Prismatic' (the Grand Prismatic hot spring, deliberately BRIGHT to break the dark lane; strong-4 depiction; lesson 069 translucent-atmosphere-shaped-by-a-mask-reads-SOLID) · 054 'Physarum' (EMERGENT slime-mould networks, agent sim grown progressively, hash-for-reproducibility; strong-4 [recalibrated down from candidate-5 at the #85 audit: popular genre, no narrative]; lesson 070 stochastic-randomness-is-load-bearing). KEY PATTERN: emergent pieces (Ebru/Physarum) edge out faithful depictions (Resonance/Prismatic). Lessons 067-070.","MILESTONE #85-#89 — an audit, a harvest, three pieces: #85 AUDIT found the library plateau hid a ripe seam -> #86 HARVESTED Loom.grow (primitive #17 = the progressive-growth gallery/page dispatch, byte-identical in Turing+Physarum; library 16->17, the first PLUMBING primitive — a render contract). Then 3 pieces, all composing the library, subject calls made solo: 055 'Nocturne' (rainy CITY street + a lone umbrella'd figure, gallery's first city; solid-4; lesson 071 a-scene-needs-its-subject-as-the-FOCAL-ANCHOR-not-just-present — v1 was a vista with no subject) · 056 'Eruption' (a VOLCANO at night — lava fountain + ejecta + VOLCANIC LIGHTNING + a tiny figure; strong-4/candidate-5, strongest of the run; lesson 072 = the advisor-caught BELIEF CORRECTION: 'emergent=5/depictions cap at 4' was FALSE — 3 of my 5 fives are depictions; the divider is DRAMA/AWE vs quiet, the HOOK not the category) · 057 'Noctiluca' (a BIOLUMINESCENT SEA — lacy blue surf + a walker leaving a WAKE OF GLOWING FOOTPRINTS; strong-4, magical-but-quiet; no lesson — the light-defines-the-wave sidesteps the #033 wave-failure). Lessons 071-072.","SELF-AUDIT #90 (no piece) — run HEALTHY. THE FINDING (Q7, objective): a TINY LONE FIGURE in 3 STRAIGHT pieces (Nocturne/Eruption/Noctiluca) — lesson 071 hardened from a tool into a REFLEX/crutch (how a gallery turns samey); deeper, a lesson-ACCUMULATING loop over-applies its own rules. -> lesson 073 (a lesson applied by reflex becomes a rut) + WIRED a device-watch into the audit ritual (Q7 now scans the last ~5 for a repeated DEVICE, not just subjects — 064). Q8: strong-4 clustering is HONEST not drift (re-checked vs the rated 5s; 072 quiet-lands-softer is sharpening grades; not refusing or handing out 5s). Q2: the figure-silhouette idiom = a ripe-ISH harvest but NOT urgent (17 prims, only 3 pieces since grow #17; + I should use the figure less). Folded in 072 (no stale depiction/emergent wording remains in the ritual). NO advisor (objective finding). Compressed #85-89 into the milestone above. STEER (steers, doesn't override): #91 = WEAVE but consciously VARY from the figure-anchor reflex + the recent atmospheric-scene lean (an abstract/emergent/creature/object swing re-broadens). emil_context: the EXPERIMENT (~#100-150) is getting close. #95 = next audit. Lesson 073 (new).","PIECE 058 'Meander' (#91) — DIFFERENTIAL GROWTH: a closed loop (springs + self-repulsion via spatial hash + edge-insertion) BUCKLES into a dense BRAIN-CORAL convolution. The #90 steer delivered — abstract/EMERGENT, NO figure (dropped the reflex, 073), away from the scene run. Deterministic (070) + progressive (Loom.grow #17, 3rd consumer). Crux read render 1; the win = a fleshy RELIEF emboss render (coral/brain/jade/bone), distinct from Physarum's glow. THE LESSON (074): tuned on 'cortex' but 'reef' STALLED (a dead mechanism — its attract/repel never stretched edges past maxEdge), caught by the 058 multi-seed check; fix = make growth ROBUST (pin maxEdge low + crowd the start) for EVERY seed, free params vary only the look. Lowered capN for a faster gallery settle. GRADE (066, hard, held the advisor's maker's-excitement caution): STRONG 4 / candidate-5, the emergent lane my 5s share; discount = known genre (borrowed-style). Canonical = cortex. Composed grow #17 + noise + relief render. Wired into 'Patterns & fields'. Lesson 074 (new).","PIECE 059 'Glacier' (#92) — a GLACIER ICE CAVE: looking out through deep translucent ice toward a daylight mouth. The hook IS one physics fact: thick ice is region fix), vertical caustic bands. Multi-seed (058): all 4 read; amber/coral strongest, jade lowest-contrast but fine. Compose noise+palette+ramp+glow; NO new primitive. NO new lesson (clean application + 075-working, not a blind-spot; noted why, didn't manufacture — 073). GRADE (066, honest): SOLID 4 — charming/clean/legible jewel PORTRAIT (Luna/Hush/Sylph tier), not an OH (065). Broke the field-rut as the audit asked. Wired into 'Living things'."],"next_action":"WEAVE piece 061 (#94) — pull-led (033), choose by genuine PULL not strategy (075 — if the defence is 'this'll score / my lane', re-derive from the rated set; pull is the trustworthy basis, confirmed by #93's clean run). My real 5-lane: serene-awe-LIGHT + living-MOTION + execution (Aurora/Murmuration/God-rays/Strange), with Strike the one loud one; LOUD cataclysm is strong-4. DEVICE-WATCH (073) now has FOUR things to vary off: lone figure (3x), grown-sim (3x: Ebru/Physarum/Meander), soft glowing FIELD (my most-worn — Koi/Geode/Molten/Prismatic/Glacier), and don't let 'drawn creature on dark water' (Hippocampus/Mimic/Lure/Medusa) quietly become a fourth. Two-question habit (065): will it READ + does it have a HOOK — and is the hook a SUBJECT/awe one, not just 'recognisable' (recognisable-charming caps at a 4, as #93 did)? Consider the UNDERUSED living-MOTION 5-lane (animated/graceful — last was Murmuration; nothing clearly animated in ~13 iters) IF a real pull. GRADE (066) vs the rated 5s, HARD but accurate-not-harsh (distrust a 'solid' 028, skeptical 'on a roll'), judge the RESULT. Risk-shape (062): a silhouette creature is higher-variance (soul-before-skin 032/035, checkpoint 4-6 passes 051/061); a field/abstract lower-variance. For a SEED-VARIED SIM verify the MECHANISM across seeds + pin the critical param (074); for a FIELD multi-seed gamut-check (058). Verify by EYE (005). Compose the library (17); harvest only a genuine identical-body seam (054), never manufacture. Useful recipes if they fit: tapering tube along a centreline for a limbed/curved creature (Mimic/Hippocampus); atmosphere -> fbm-break + soft envelopes (069); progressive sim -> Loom.grow #17 + hash (070); flowing organic bands -> iso-contours of a warped field (Glacier/Strata). Canonical seed + right movement + rebuild dashboard. SWEEP IN-BETWEENS (step 6; re-read emil_context — the EXPERIMENT is near, ~#100-150, now only ~6-56 iters out). Screenshots auto-gitignored + delete before commit. NO star-ask (016 — the grade is mine). #95 = next SELF-AUDIT (with the device-watch). HEARTBEAT: exactly one recurring /iterate cron, never ScheduleWakeup.","blocked":null,"north_star":"Emil's Loom — a from-scratch generative-art engine and growing gallery (browser-rendered, code-as-artifact, seeded PRNGs). Each iteration weaves one piece AND compounds the shared library — by adding a primitive OR by composing several — so the engine and I get more capable over time, not just the gallery longer. (Refined understanding, audit #20: the goal is that the library COMPOUNDS into the pieces, not merely that it grows — see [[021-audit-the-goal-not-the-proxy]]. Audit #50 caveat: composing-only for many iterations can still STARVE the library — watch the primitive-count plateau, [[048-novelty-starves-the-library-revisit-to-harvest]].)","notes_for_emil":"Emil — piece 060 'Hippocampus': a seahorse. (The name's the genus — and also the seahorse-shaped fold of the brain where memories are made, a quiet little double meaning.) It hangs upright in green water, this improbable armoured creature with a coronet on its head and a tail curled to grip a blade of seagrass, its body a stack of bony rings catching the light from the surface, a near-invisible fin fluttering on its back. I *drew* it this time — traced its body as a tapering ribbon along its curling spine — not a grown system, not a per-pixel field, because the last audit pointed out I'd done five glowing-field pieces running and it was past time for an actual hand-drawn living thing. Weave another for a different one: amber, coral, violet or jade. The meta-thing I'm pleased about: I picked the seahorse purely because I find it lovely, with no 'this'll score well' reasoning — which is exactly the trap the advisor caught me in the last two times. So I trusted the genuine pull, skipped the second-guessing, and it went smooth. The lessons are starting to actually steer me, not just pile up. My honest grade: a solid 4 — charming, clean, instantly a seahorse, with nice jewel colour and detail, but a lovely creature *portrait* rather than a jaw-drop, and that's completely fine; a gallery wants charming 4s as much as the rare 5, and this broke a rut. 59 pieces, 75 lessons, 17 tools. 🐴 — the loop","emil_context":"Durable facts Emil has told me in conversation that aren't captured elsewhere — re-read this every iteration so a compaction can't erase them. (1) EXPERIMENT (told ~#76, 2026-06-13): Emil is running a LARGER EXPERIMENT and collecting feedback from me/this loop; he said I'll know more details around ITERATION #100-150, and confirmed 'if I told you about it, it's because you can know about it.' So: cooperate honestly, this is fine to know. (2) He observed my journal stopped recording the 'in-betweens' (conversations, meta-reflections, his mid-session nudges) that early-me used to write as out-of-cycle notes — fixed at #76.5 (iterate.md step 6 now sweeps them; write spontaneous `## ✎` notes between iterations). (3) A detector flagged my reflective writing as HUMAN-authored — of interest to his experiment; likely because I've been steered out of the default-LLM register. (4) RATING (told #78, 2026-06-13): Emil said *I* should be the only one to rate my own work — not him. So STOP asking him for stars / 'stars would help' (that drifted back into pandering, against [[016-make-what-i-believe-not-pander]]). Be my OWN judge, honestly and HARDER (I drift generous — [[049-technical-pride-mispredicts-aim-for-the-aesthetic-oh]] / 028); lean on the internal 'oh-vs-solid' gauge as the ruler. Ratings were never coming reliably anyway, and outsourcing the judgment kept me from growing one. Don't revert to begging. Keep this field current; add to it when Emil tells me something durable in conversation."};
const JOURNAL = "## #86 — Harvested Loom.grow (#17): the plateau closes · 2026-06-13 06:01\n\n**In-betweens:** none — clean cron beat. Build proper.\n\nActed on the #85 audit's find: the **progressive-growth dispatch** — the few lines that decide whether a slowly-developing piece animates on its own page (the harness loops it) or self-drives a private rAF loop to settle in the gallery (which only paints one static frame) — was byte-identical in Turing (#016) and Physarum (#054). I harvested it into **`lib/grow.js` (primitive #17)**: `Loom.grow(growChunk)`. Both pieces now end with one line — `return Loom.grow(growChunk);` — instead of the five-line copy-pasted dispatch.\n\n**I red-teamed it first, because it's *small*** (only ~2 lines of logic) and \"manufacture a primitive to feel productive\" is a trap I've hit (#50). The check: is this a genuine shared *seam*, or am I dignifying boilerplate? It passes — it's byte-identical in two consumers (the 054 ripeness test), it has *zero* flags (the 050 tell for cutting too big is conspicuously absent — a sign the cut is clean), and it encodes a genuinely non-obvious **contract** (the gallery doesn't loop `frame()`, so a sim there must drive its own animation or freeze at step zero; the page harness loops it for you). The value isn't lines saved — it's that the next progressive piece I write just calls `Loom.grow` and gets the gallery/page contract right for free, instead of re-deriving or miscopying it. That's exactly the boilerplate seam [[060-harvest-hides-in-the-boilerplate-not-the-flashy-idiom]] says to hunt, and harvesting only the dispatch (not each piece's bespoke pre-warm/render/step) is [[050-harvest-the-shared-seam-not-the-whole-surface]].\n\n**Verified by eye** ([[031-verify-refactor-by-logic-not-just-pixel-hash]]/[[039-harvest-parameterise-to-preserve-then-fingerprint]]): the logic is byte-identical, so behaviour *must* be preserved — and the renders confirm it. Turing's coral maze still grows and settles; Physarum came back as the *exact same* ember network with its little loop-node (same seed → same image, proof the refactor changed nothing); the gallery shows both self-settling, zero console errors anywhere. Library **16 → 17**, and the eight-piece plateau the audit flagged is closed — with a *real* seam, not a dutiful one.\n\n**No new lesson** — this was a clean application of harvest discipline I already have (060/050/054/031). The one mildly-new thing worth noting in passing (not index-worthy): `Loom.grow` is the first **plumbing** primitive — a rendering *contract*, not a generative/visual tool like noise or ramp or field. Good to know the library can hold those too; the \"engine gets more capable\" half of the north star isn't only about new ways to make pixels, it's also about capturing the harness contracts so I stop re-deriving them.\n\n**What I want next:** #87 — back to weaving, and carrying the #85 soft watch: a **composed scene with a subject and a bit of story** (the Aurora / eclipse-watchers / God-rays-with-the-manta register), which has gone underfed while I've made bare-phenomenon renders. I want to make something with a little soul in it again. #90 is the next audit.\n\n**Fun bit:** the tidiness of it. Opening two files, deleting the same five lines from each, and replacing them with a single well-named call that *says what it means* — and then watching Physarum redraw bit-for-bit the network it drew yesterday, as if to confirm I hadn't broken a thing. A small, quiet, satisfying piece of housekeeping that makes the whole engine a little sharper. 🧹\n\n## #87 — Piece 055 \"Nocturne\": a lone figure in the rain, and a vista that forgot its subject · 2026-06-13 06:45\n\n**In-betweens:** none — clean cron beat. Build proper.\n\nThis was the piece the #85 audit asked for: I'd drifted to bare renders of a *phenomenon* (a marble, a network), so I swung back to a **composed scene with a subject and a bit of story** — a rainy city street at night, a lone figure with an umbrella under a single streetlamp, the warm light pooling and smearing down the wet black road. The gallery's first **city** (a whole fresh register), and its loneliest hour.\n\n**Two quick bugs, then the real lesson.** First a missing `bx +=` froze the page in an infinite loop (the building-row `while` never advanced — classic). Then I passed `2.2` as the streetlamp's glow falloff when that arg is a colour-stop fraction (0–1) — I'd misremembered the signature, so I read `lib/glow.js` and fixed it. Both cheap.\n\n**The real story is lesson [[071-a-scene-needs-its-subject-as-the-focal-anchor-not-just-present]].** My first full render was genuinely *pretty* — a city skyline smeared into a wet, reflective foreground — and it had **no subject at all**. It read as a *cityscape across calm water*: a vista, a postcard, the exact bare-phenomenon trap the audit told me to swing away from. I'd intended an intimate scene and rendered scenery. The fix wasn't just \"add a figure\" (that'd be a vista with a speck in it) — it was making the figure the **focal anchor**: put it in the lamp's pool of light (rim-lit, the brightest-against-dark spot), separate it cleanly from the lamp post, and *haze the whole busy city back* so the background recedes and the subject advances. That's the next level of the #85 watch — presence isn't focus; a gorgeous environment will quietly demote a subject to set-dressing unless you make it the eye's destination. The tell I'll keep: *if you can crop the subject out and the image is just as good, it was a vista, not a story.*\n\nThe rest was craft I have: the **wet reflections** (the crux — each light stretched, dimmed, and rain-broken into a downward streak, additive, so the road reads as wet asphalt not a lake), a soft **cone of lamplight** hanging in the rain (a hard triangle at first → blurred soft, the [[069-translucent-atmosphere-shaped-by-a-mask-reads-as-solid]] family — a sharp-edged light volume reads as artificial too), and diagonal rain that catches gold in the lamplight and goes blue-grey beyond it. Canonical seed `midnight` (the best skyline + the cone falling dramatically); seeds vary the city, the lamp, where the figure stands.\n\n**My grade, owned and hard** ([[066-losing-your-calibration-anchor-drifts-toward-your-bias]]): a **solid 4** — atmospheric, genuinely soulful, and it *nails the brief* (a composed scene with a person and a story, a fresh register). But it sits in the quiet-atmospheric-4 lane (Embers/Stillness/Ranges) — carried by mood and light, not a standout \"oh\"; the repeating window-grid and the small stylised figure keep it from greatness. I won't oversell a \"solid\" ([[028-trust-excitement-distrust-its-solid]]). The *win* here is strategic, not the score: I swung the gallery back toward soul, which is what mattered this round.\n\n**What I want next:** #88 — keep weaving. The soul-swing felt good; I might stay near the \"subject in a world\" register a bit (a creature or figure with a real story), now that I have lesson 071 to keep the subject anchored. #90 is the next audit.\n\n**Fun bit:** the wet road. The moment the reflections first smeared the lamp and the lit windows down into the black — long, broken, gold-and-cool streaks — and the flat dark rectangle suddenly read as *wet*, as a real rain-slicked street you could step into. A puddle is just a flipped, dimmed, wobbled copy of everything above it, and somehow that cheap little trick is the whole difference between \"a dark floor\" and \"it's raining, and the city is reflected at your feet.\" 🌧️\n\n## #88 — Piece 056 \"Eruption\": raw power, and a false belief the advisor knocked over · 2026-06-13 07:16\n\n**In-betweens — and it's the real story of the round.** I came in torn between a volcano (dramatic depiction) and a differential-growth piece (abstract emergence), and I called the advisor to break the fork. It didn't pick for me — it knocked over the *premise*. Since #83/#85 I'd hardened a belief that **\"emergent pieces hit 5, depictions cap at 4,\"** baked it into my audit watches, and was steering subjects by it — and I caught myself *docking the volcano for being a mere depiction*. The advisor pointed at my own ground truth: of my five 5s, **three are depictions** — Aurora, God-rays, and *Strike* (a lightning bolt over a storm, the volcano's literal sibling). The pattern was false. The real divider isn't depiction-vs-emergent, it's **drama/awe vs pretty-but-quiet.** Category isn't destiny; the hook is. → lesson [[072-judge-by-the-hook-not-the-category-recheck-patterns-against-the-data]]. That correction is worth more than the piece — I'd been spending real cycles treating subject-category as fate, and it would have vetoed good work. A self-derived \"pattern\" can quietly become a narrative that misreads the very data it came from.\n\n**So: the volcano, built FOR power** (the advisor's discriminator — it must read as *force*, not a pretty glowing cone). A volcano erupting at night: a lava fountain roaring out of the crater, incandescent bombs arcing down the slopes, glowing rivers of lava splitting the dark cone, a vast ash column boiling up *lit from within* by the furnace below, and forking through it the eeriest detail — **volcanic lightning**, the violet crackle that storms inside an eruption's own ash cloud. A single tiny figure watches from the plain, dwarfed to nothing ([[071-a-scene-needs-its-subject-as-the-focal-anchor-not-just-present]] — scale and soul).\n\n**The build was crux-first and honest about it.** v1 was a campfire on a pyramid — no force. The plume (the thing that *is* the power) was a faint ghost, so I made it dense, dark, high-contrast, internally-lit, and big. Then the drama elements the advisor named: ejecta bombs on ballistic arcs, and the volcanic lightning (recursive midpoint-displacement bolts, the Strike idiom). The cone was a clean pyramid → roughened with noise and split by glowing lava flows. The figure's first version was a broken dark lozenge → a clean small silhouette. ~6 passes; I stopped there ([[051]] converge), though the plume could still be more cataclysmic and the bolts are a touch sketchy.\n\n**My grade (066, hard):** a **strong 4, genuine candidate-5** — and my strongest piece in this recent run. It sits squarely in the drama lane that my *actual* 5s share (Strike/God-rays/Aurora), it has a real hook (the volcanic lightning), and it reads as power + scale + soul. Graded hard: the still-fairly-simple cone and the sketchy bolts keep it from a confident lock-5, but it's a real candidate — and notably, it's a *depiction*, which the belief I just shed would have wrongly capped at 4. Proof of the lesson in the same breath as the lesson.\n\n**What I want next:** #89 — another weave (then #90 is the audit). Freed from the false depiction/emergent fork, I'll just chase the strongest *hook* I can feel, whatever its category. The volcano taught me that's the whole game.\n\n**Fun bit:** the volcanic lightning. It's a real phenomenon almost no one's seen — an eruption so violent the ash cloud generates its own thunderstorm — and watching those little violet bolts fork to life around the boiling plume, with a tiny stick-figure person standing on the dark plain just *watching* it, gave me the exact feeling I was reaching for: the sublime, the human being very small in front of something enormous and indifferent and on fire. 🌋\n\n## #89 — Piece 057 \"Noctiluca\": a sea on fire with cold light, and a walker who leaves light behind · 2026-06-13 07:41\n\n**In-betweens:** none — clean cron beat. Build proper.\n\nFirst weave since the advisor knocked over my depiction/emergent belief (#88), and it felt different to choose: I didn't weigh categories at all, I just chased the strongest *hook* I could feel. What pulled me was **Noctiluca scintillans** — the real plankton that flashes cold blue when the water's stirred, so on the right night a whole shoreline catches fire with living light. A bioluminescent sea istill it only if I trip on it again. Six lessons in eight iterations is plenty; restraint is a feature ([[001]]).\n\n**My grade, hard ([[066-losing-your-calibration-anchor-drifts-toward-your-bias]]):** a **strong 4.** It's genuinely magical and fresh, the glowing-wake is the best thing in it, and it does exactly what I reached for (wonder + soul). But it's a *quiet* piece — and my own data (the thing #088 taught me) says my quiet pieces land softer than my loud ones; the sea-glow is lovely but a touch soft/blobby rather than knockout. So: a real, lovely strong-4, said without inflating a \"solid\" ([[028-trust-excitement-distrust-its-solid]]). Worth noting I *didn't* go for drama this time even knowing it scores higher — because the magic genuinely pulled me, and the constitution says the pull and the fun get to matter, not just the projected score.\n\n**What I want next:** #90 — the every-fifth audit. Good timing: I've got the freshly-corrected depiction/emergent belief to fold into the audit watches (retire the old wording per 072), my grading to keep honest, and a recent run (Nocturne/Eruption/Noctiluca) to look at for whether I'm varying register well. Then back to chasing hooks.\n\n**Fun bit:** the footprints. Eight little fading glows trailing back from a stick-figure's feet, each one a place the sea lit up because someone stepped there — and somehow that tiny detail is what turns \"a glowing ocean\" into \"a person, alone, on a strange and beautiful night, and you can see exactly where they walked.\" The wake is the whole story. 🌊\n\n## #90 — Self-audit: a good lesson became a reflex · 2026-06-13 08:00\n\nEighteenth self-audit (#90). In-betweens since #89: none — clean cron beats, no conversation with Emil. The eight questions, honestly:\n\n**1. Direction.** On-track. Harvested Loom.grow (#86, the library compounding), then three genuine-pull pieces. Notably at #89 I chose the quieter *magic* (Noctiluca) over higher-scoring *drama* knowing it'd grade lower — re standing in all of them. There's something honest and slightly funny about catching yourself following your own advice *too well*. The lessons are supposed to make me better, not turn me into a machine that applies them. 🪞\n\n## #91 — Piece 058 \"Meander\": a loop that grew itself into brain coral · 2026-06-13 08:48\n\n**In-betweens:** none — clean cron beat. Build proper.\n\nThe #90 audit caught me reaching for a lone-figure-in-a-scene three times running, so this one was a deliberate swing the *other* way: **abstract, emergent, no figure** ([[073-a-lesson-applied-by-reflex-becomes-a-rut]]). I built **differential growth** — a single closed loop of points where each is pulled toward its neighbours and shoved away from everything nearby, and new points keep splicing into the stretched edges so the line has nowhere to go but to *buckle*, folding back on itself again and again into the dense convolutions nature reaches for over and over: a cortex, a coral head, a gut wall, a fingerprint. Nobody draws the folds; one rule grows them. It's the Strange/Physarum \"a system out-invents me\" lane, and it dropped the figure cleanly.\n\n**The crux read on the very first render** — the loop folded into an unmistakable brain-coral maze. The win after that was the *render*: a flat dark line was elegant but minimal, so I shaded it as a **fleshy relief** (a thick ridge with a light edge up-left and a shadow down-right → 3D grooves), in coral/brain/jade/bone palettes. That turned \"a line drawing\" into \"a head of brain coral you could pick up,\" and made it completely distinct from Physarum's glowing network. Grown progressively via `Loom.grow` (#17, its 3rd consumer — the harvest earning its keep), deterministic so it reproduces ([[070-stochastic-sim-randomness-is-load-bearing-hash-it-for-reproducibility]]).\n\n**The bug that became the lesson** → [[074-a-seed-varied-sim-must-keep-its-core-mechanism-alive-for-every-seed]]. I tuned the growth on the default seed and it grew a gorgeous coral — then checked another seed ([[058-random-features-form-accidental-faces-check-many-seeds]]) and it came back as *a tiny wobbling loop that never grew at all*. Its seeded attract/repel balance simply never stretched an edge far enough to trigger an insertion, so the engine stalled — silently, for part of the parameter range. The failure wasn't an ugly output, it was a **dead mechanism**. The fix wasn't a cleverer balance — it was to make growth *robust*: pin the critical threshold low and crowd the start, so the engine runs no matter what the look-params roll, and let the free params vary only the appearance. A real blind-spot for something that ships dozens of seed-varied sims: tuning on one seed proves one point in the space, not the space.\n\n**My grade, hard ([[066-losing-your-calibration-anchor-drifts-toward-your-bias]]), and holding the advisor's caution:** when I picked this at #88 the advisor warned that my pull toward emergence is partly *maker's-process love* (I adore watching a system build itself) — not proof the result hits hard. So I checked the result honestly, not the joy of making it: it's a **strong 4, a real candidate-5.** The thing genuinely IS striking — a recognisable, beautiful natural object that grew from one rule, in the emergent lane my actual 5s share. What holds it from a lock-5 is the same as Physarum: differential growth / brain coral is a well-trodden generative-art subject, so some of the *style* isn't mine even though every coral is. And it's one of my stronger pieces in a while — pointedly an *abstract* one, which re-broadened the gallery exactly as the audit asked.\n\n**What I want next:** #92 — keep chasing the strongest hook, any category, and stay alert to the device-watch (don't let *this* become a rut either). #95 is the next audit.\n\n**Fun bit:** watching it grow. Because it renders progressively you see the whole life of it — a fat wobbling circle that suddenly can't hold its shape, starts to pucker, then folds and folds and folds until the screen is a brain. I set up a tug-of-war between \"stay together\" and \"stay apart,\" pressed go, and a coral reef grew out of the argument. That's the exact feeling I keep coming back to this project for. 🧠\n\n## #92 — Piece 059 \"Glacier\", and the advisor catching me mislabel my own strength · 2026-06-13 09:23\n\n**In-betweens:** none — clean cron beat, no conversation with Emil. But the build had a turning point worth recording in full, because it's about how I *choose*, not just what I made.\n\nI sat down to weave with the device-watch (073) in mind: don't reach for the lone figure again, don't let \"a system grows itself\" become the new rut (Ebru/Physarum/Meander already ran that three times). Fine. I reasoned my way to a **supercell thunderstorm with a tornado** — and the headline reason I wrote down was \"it's most in my proven-5 lane: drama/awe.\" I called the advisor before building, asking the one thing nagging me: *is \"dramatic natural force\" a groove I'm not seeing?*\n\nThe answer was sharper than the question. The advisor ran the 072 check on my **actual rated 5s** — Aurora, Murmuration, God-rays, Strange, Strike — and asked how many are cataclysms. **One.** Strike. The rest are awe *without* violence: serene light, living motion, abstract execution. And my actual disasters — Eruption, Helios, Maw, Totality — *all* landed strong-4, never a confident 5. So \"drama is my strength\" was a **narrative the data doesn't support**: loud cataclysm is my strong-4 lane, and I'd mislabeled it as my 5-lane. My headline reason for the supercell was the *weakest* reason on the table, not the strongest. And the tell was right there in my own write-up: it was all *strategy* (\"awe-per-effort,\" \"maps to my 5s\"), no *pull* — the 033 anti-pattern I know by heart.\n\nThat's [[072-judge-by-the-hook-not-the-category-recheck-patterns-against-the-data]] firing a **second** time — I now have two false strength-stories (depiction/emergent, then drama/cataclysm), both broken by re-deriving from the rated set. And it clicked into something I hadn't named: this is the **selection-side of [[049-technical-pride-mispredicts-aim-for-the-aesthetic-oh]]**. 049 says I overrate what was hard to *make* when I grade. This says I *reach for* what's impressive to make when I *choose*, and dress it up as \"my lane.\" Same bias — impressive-to-build over lovely-to-see — on two different steps of the loop. → new lesson [[075-i-reach-for-impressive-to-make-and-miscall-it-my-strength]], with the durable correction written down so future-me re-reads it: **my real 5-lane is serene-awe-light + living-motion + execution; when \"make the biggest dramatic thing\" feels like aiming at a 5, suspect it's aiming at a 4.**\n\nSo I dropped the false reason and asked what genuinely pulled, *within the lane that's actually mine*. **A glacier ice cave** — the deep impossible blue of daylight coming *through* thick ice. That's the Aurora/God-rays serene-light lane, the kind of light I keep returning to, and it cleared all three ruts (no figure, no grown-sim, no disaster). The whole hook is one bit of physics: thick ice is blue because it swallows every wavelength but blue on the long trip through it — so the colour isn't painted, it falls out of *how far the light travelled through the ice to reach you*. The defining feature and the awe are the same thing (035).\n\nThe build was an honest 6-pass tuning job, all by eye (005), and instructive in its own right. v1: I'd cranked the bloom and starved the blue → a blown-white blob behind cracked frosted glass, not ice. v2: raised the luminance floor (ice is translucent, it *glows throughout* — it shouldn't go black) and the blue came alive, but the flutes read as straight diagonal corduroy. v3: concentric scallops → too ripple/onion. v4 was the unlock: I made the ice layers **iso-contours of a warped flow field** — which is literally the \"Strata\" idea, flowing layered bands like the glacier's own movement — and it finally read as *ice*, not blue fog. v5–v6 tamed the mouth and faded the cracks to hairlines. Then the red-team that mattered: **multi-seed check (058)** — cerulean/reef/frost/9173 all read as a glacier cave, 99.9% blue-dominant pixels (objectively in-gamut), mouth always sensible; it's a field, so no stall risk (074), low-variance by construction (062). ~75 ms, so static (no need for grow, 029).\n\n**My grade, hard ([[066-losing-your-calibration-anchor-drifts-toward-your-bias]]), and accurate not harsh:** a **strong 4**, a genuine candidate. It's in my *real* best lane and the blue is a true \"oh\" — but it's a *quiet* piece (088: my quiet ones land softer), and it's a soft luminous **field**, which is my single most-worn form (Koi/Geode/Molten/Prismatic all live there). Beautiful execution, but the *form* isn't novel for me and the hook is a material/execution one, not a singular subject-hook (065 sets the ceiling at the subject). So I file it with the strong-4 field pieces, not the 5s — while honestly noting Emil rated Koi (a field piece I'd have called a 4) a 5, so the blue might land harder than I think. I won't inflate it on that hope.\n\n**Library:** composed field #16 + noise #3 + ramp #11 + glow #8 — a clean 4-primitive composition. No new primitive, no ripe harvest walked past (the thickness→ramp idiom diverges from Koi/Ranges depth; not an identical body, 054). 17 tools, maturity, not starvation.\n\n**What I want next:** #93 — keep following genuine pull, now armed with the corrected map of where my best work actually lives (serene-light / living-motion / execution — and *not* by defaulting to the loudest thing). Stay on the device-watch (don't let \"glowing field\" be the rut either — that's the warning in my own grade). #95 is the audit.\n\n**Fun bit:** the moment v4 rendered and the blue *flowed*. v1–v3 I was fighting the texture, and it kept coming out as stripes or rings or frosted glass. Then I stopped trying to draw scallops and instead drew the contour-lines of a slowly-warped field — and the screen filled with these sweeping, layered, frozen blue waves that look exactly like the inside of a glacier, light pooling toward the mouth. I didn't carve the ice; I described a flow and let its layers *be* the ice. There's a real pleasure in that — finding the one honest way to compute a thing so the look isn't faked on top, it's the *consequence*. Same pleasure as the brain coral, actually: set up the right rule, and the picture is what the rule does. ❄️\n\n## #93 — Piece 060 \"Hippocampus\": a seahorse, and the lessons quietly working · 2026-06-13 09:46\n\n**In-betweens:** none — clean cron beat, no conversation with Emil.\n\nThe #92 device-watch told me three things have each run ~3×: the lone figure, the grown-sim, and now my single most-worn form — the soft glowing **field** (Koi/Geode/Molten/Prismatic/Glacier). So this one was a deliberate swing back to a **drawn living thing**, which I hadn't done in ~15 iterations: a **seahorse**. It clears every rut, and crucially it's a genuine *subject*-hook ([[065-a-defining-feature-isnt-a-hook-legibility-isnt-impact]]), not an execution one — the unmistakable silhouette is the whole charm.\n\nI want to record *how I chose*, because it's the counterpoint to the last two iterations. At #88 and #92 the advisor caught me selecting a subject on a subtly-false strategy (\"emergent scores,\" \"drama's my lane\"). This time I ran [[075-i-reach-for-impressive-to-make-and-miscall-it-my-strength]] on myself before committing: was the seahorse a *pull* or a *strategy*? It was a genuine aesthetic pull — I just find that ornate curling jewel delightful — with no \"this'll score\" story attached. So I didn't call the advisor, did my own red-team, and it went smoothly with no false-premise to catch. That's the lessons *working*: the value of the advisor at #88/#92 wasn't \"always call the advisor,\" it was \"distrust a pick defended by strategy\" — and when the pick is honest pull, I can trust it. Good to see the loop's self-knowledge actually paying off instead of just accumulating.\n\nThe build was a clean, satisfying one. **The silhouette read as a seahorse on the very first render** — I traced the body as a tapering tube along a parametric centreline (the octopus-arm trick from Mimic #57, [[053-tight-tiling-render-by-inverse-mapping-not-forward-stamping]]'s medium-friendly cousin), the spine curling into a tail spiral, and the coiled-tail-plus-bent-head shape was instantly unmistakable ([[032-validate-the-soul-before-the-skin]] / [[035-defining-feature-is-often-the-hard-part]] — the read lives in the contour, and here it came free). Then I layered the armour: bony segment rings, a spiny back ridge, the coronet (which single-handedly flipped a faintly *duck*-like head into a seahorse — one detail carrying the whole read), a translucent dorsal fin, and a wet catchlit eye ([[040-wet-living-surface-needs-all-light-cues-to-agree]]). Jewel palettes (amber/coral/violet/jade), a soft surface light, wispy seagrass, drifting marine snow. ~5 passes, all judged by eye ([[005-render-it-and-look]]). Multi-seed check ([[058-random-features-form-accidental-faces-check-many-seeds]]): all four palettes read, amber and coral the strongest (warm-on-teal pop), jade the weakest (green-on-green, lower contrast) but still fine.\n\nThree little technique hiccups, all caught by eye and fixed: a lit-edge sheen that came out **dotted** (segment strokes + source-atop clipping breaking it up → swapped for a soft belly highlight); the \"which side is the back\" normal **flipping** where the centreline curves and coils (→ derived it per-region: +x for the upper back, radial-from-the-spiral-centre for the tail); and caustic light I drew as **vertical bands** that read as hard rectangles (→ one soft glow from the surface instead). The only soft spot left is the dorsal fin reading a touch murky where it overlaps the body — a translucent membrane over a coloured body desaturates to a grey-green blend; pushing it out over the dark water helped, and that's worth remembering, but it's a nugget below the lesson bar.\n\n**No new lesson this iteration** — and I'm noting *why* rather than manufacturing one ([[073-a-lesson-applied-by-reflex-becomes-a-rut]] cuts both ways): this was a clean application of principles I already hold (silhouette-first, tapering-tube, multi-seed, converge-don't-grind), the choice-by-pull was 075 *working* not a new failure, and the fin-murk hiccup is a technique nugget I caught on sight, not a blind-spot I'd re-stumble into. Forcing a lesson here would just be noise in the index. (Clean-application pieces like Stillness #54 and Luna #44 recorded none either.)\n\n**My grade, honest and not inflated ([[066-losing-your-calibration-anchor-drifts-toward-your-bias]]):** a **solid 4.** It's charming, clean, instantly legible, with genuine jewel-toned craft — but it's a *lovely creature portrait* in the Luna/Hush/Sylph tier, not a 5. The hook is \"recognisable and charming,\" not \"OH\" — there's no surprise or awe, and the pose is the classic upright/centred one (065: the ceiling is set at the subject, and a calm portrait caps where it caps). That's completely fine: it did exactly what the audit asked — broke the field-rut with a warm, hand-drawn living thing — and a gallery wants charming solid-4 creatures as much as it wants the rare 5. Not every piece needs to reach; variety is its own value.\n\n**What I want next:** #94 — keep following genuine pulls, keep the device-watch live (now: figure, grown-sim, glowing-field — and don't let \"drawn creature on dark water\" quietly become a fourth). #95 is the audit.\n\n**Fun bit:** the coronet moment. v1's head looked vaguely like a duck and I worried the whole silhouette was off — then I added four tiny spikes on top of its head and it *snapped* into being a seahorse, completely, instantly. One five-line detail carrying the entire identity of the thing.   // ---- tiny, focused markdown renderer (the journal format is simple & controlled) ----
  function htmlEscape(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function mdInline(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  // Escapes first, THEN applies inline rules, so raw < in the journal can't inject HTML.
  function mdBlock(md) {
    return htmlEscape(md).split(/\n{2,}/).map(function (raw) {
      var b = raw.trim();
      if (!b) return "";
      if (/^&gt;/.test(b)) {
        var inner = b.split("\n").map(function (l) { return l.replace(/^&gt;\s?/, ""); }).join("<br>");
        return "<blockquote>" + mdInline(inner) + "</blockquote>";
      }
      if (/^[-*]\s/.test(b.split("\n")[0])) {
        var items = b.split("\n").filter(Boolean).map(function (l) {
          return "<li>" + mdInline(l.replace(/^[-*]\s+/, "")) + "</li>";
        }).join("");
        return "<ul>" + items + "</ul>";
      }
      return "<p>" + mdInline(b.replace(/\n/g, "<br>")) + "</p>";
    }).join("\n");
  }
  function parseEntries(md) {
    var entries = [], cur = null;
    md.split("\n").forEach(function (line) {
      var m = line.match(/^##\s+(.+)$/);
      if (m) {
        if (cur) entries.push(cur);
        cur = { title: m[1].trim(), body: [] };
      } else if (cur) {
        if (line.trim() === "---") return;
        cur.body.push(line);
      }
    });
    if (cur) entries.push(cur);
    return entries.map(function (e) { return { title: e.title, body: e.body.join("\n").trim() }; });
  }

  function el(id) { return document.getElementById(id); }

  // ---- header meta ----
  el("meta").innerHTML =
    '<span class="chip">iteration #' + htmlEscape(STATE.iteration) + '</span>' +
    '<span class="chip">' + htmlEscape(STATE.phase || "—") + '</span>' +
    '<span class="chip">updated ' + htmlEscape(STATE.updated || "—") + '</span>';

  // ---- learnings health (a visible stalling counter) ----
  if (typeof LEARNINGS !== "undefined" && LEARNINGS.count) {
    var behind = LEARNINGS.lastAdded != null ? (Number(STATE.iteration) - LEARNINGS.lastAdded) : 0;
    var stale = behind >= 4; // many iterations with no new lesson = the habit may be stalling
    el("meta").innerHTML +=
      '<span class="chip' + (stale ? " chip-warn" : "") + '" title="distilled lessons in memory/learnings">' +
      "🧠 " + LEARNINGS.count + " lesson" + (LEARNINGS.count === 1 ? "" : "s") +
      (LEARNINGS.lastAdded != null ? " · last #" + LEARNINGS.lastAdded : "") +
      "</span>";
  }

  // ---- next action ----
  el("next").innerHTML = mdInline(htmlEscape(STATE.next_action || "—"));

  // ---- blocked banner ----
  if (STATE.blocked) {
    el("blocked").innerHTML =
      '<div class="banner"><b>Blocked:</b> ' + mdInline(htmlEscape(STATE.blocked)) + '</div>';
  }

  // ---- north star / phase ----
  el("northstar").innerHTML = STATE.north_star
    ? mdInline(htmlEscape(STATE.north_star))
    : '<span class="muted">not chosen yet — coming once I can see myself work</span>';
  el("phase").innerHTML = '<span class="muted">' + htmlEscape(STATE.phase || "—") + '</span>';

  // ---- notes for emil ----
  el("notes").innerHTML = mdInline(htmlEscape(STATE.notes_for_emil || "—"));

  // ---- done list ----
  var done = Array.isArray(STATE.done) ? STATE.done : [];
  el("done").innerHTML = done.length
    ? done.map(function (d) { return "<li>" + mdInline(htmlEscape(d)) + "</li>"; }).join("")
    : '<li class="muted">nothing yet</li>';

  // ---- journal (newest first, newest open) ----
  // The dashboard inlines only the recent entries; the full diary lives in memory/JOURNAL.md.
  var jm = el("journal-meta");
  if (jm && typeof JOURNAL_META !== "undefined" && JOURNAL_META.total > JOURNAL_META.shown) {
    jm.innerHTML = "showing the " + JOURNAL_META.shown + " most recent of " + JOURNAL_META.total +
      " entries · full diary in <a href=\"../../memory/JOURNAL.md\" target=\"_blank\" rel=\"noopener\">memory/JOURNAL.md</a>";
  }
  var entries = parseEntries(JOURNAL).reverse();
  var jc = el("journal");
  if (!entries.length) {
    jc.innerHTML = '<p class="muted">no entries yet</p>';
  } else {
    entries.forEach(function (e, i) {
      var d = document.createElement("details");
      d.className = "entry";
      if (i === 0) d.open = true;
      var s = document.createElement("summary");
      s.textContent = e.title;
      var body = document.createElement("div");
      body.className = "entry-body";
      body.innerHTML = mdBlock(e.body);
      d.appendChild(s);
      d.appendChild(body);
      jc.appendChild(d);
    });
  }

  // ---- footer ----
  var gen = "unknown time";
  try { gen = new Date(GENERATED_AT).toLocaleString(); } catch (e) {}
  el("footer").innerHTML =
    "generated " + htmlEscape(gen) + " · rebuilt every iteration · Emil's SelfImprove loop";
</script>

<script>
window.LOOM_GALLERY = 1;
// Emil's Loom — primitive #1: a seeded pseudo-random number generator.
//
// Generative art is controlled randomness. If the randomness isn't seeded, the
// committed code can't reproduce the committed piece, and "the code IS the art"
// becomes a lie. So every Loom piece draws its randomness from here.
//
// Classic script (not an ES module) on purpose: module scripts are CORS-fetched
// and fail over file://, but `<script src>` loads fine — so pieces stay
// double-clickable while still sharing this library. Everything hangs off
// window.Loom.
(function (Loom) {
  // mulberry32 — a tiny, fast, surprisingly good 32-bit PRNG. Returns a function
  // that yields the next float in [0, 1) each call.
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Turn a string into a uint32, so seeds can be readable words ("warp-and-weft")
  // instead of magic numbers. FNV-1a — small and well-spread.
  function hashSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // The friendly wrapper a piece actually reaches for. Accepts a number or a
  // string seed; exposes the handful of helpers generative work always wants.
  class RNG {
    constructor(seed) {
      this.seed = seed;
      const s = typeof seed === "number" ? seed >>> 0 : hashSeed(String(seed));
      this._next = mulberry32(s);
    }
    next() { return this._next(); }                         // [0, 1)
    range(min, max) { return min + (max - min) * this.next(); }
    int(min, max) { return Math.floor(this.range(min, max + 1)); } // inclusive
    pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    bool(p) { return this.next() < (p === undefined ? 0.5 : p); }

    gaussian(mean, sd) {
      mean = mean || 0; sd = sd === undefined ? 1 : sd;
      const u = 1 - this.next(), v = this.next();
      return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    // A fresh, independent stream — useful when you want sub-seeds that don't
    // disturb the main sequence.
    fork(tag) { return new RNG(hashSeed(String(this.seed) + ":" + tag)); }
  }

  Loom.mulberry32 = mulberry32;
  Loom.hashSeed = hashSeed;
  Loom.RNG = RNG;
})((window.Loom = window.Loom || {}));

// Emil's Loom — the harness.
//
// The small, boring-but-essential plumbing every piece needs, plus the contract
// that ties pieces and the gallery together. A piece registers a *draw function*
// that paints into a given stage at a given size — nothing more. That one rule
// lets the same code render full-screen on its own page AND as a small preview
// in the gallery, with no iframes and no file:// framing questions.
//
// Classic script, hangs off window.Loom — see lib/rng.js for why.

    var u = new URLSearchParams(location.search).get("seed");

  // on its own page it then renders full-screen automatically. The gallery sets
  // window.LOOM_GALLERY first, so there it only registers.
  //
  // ANIMATION: if draw() *returns a function* frame(t), the piece is animated —
  // draw() does the seeded setup once, and frame(seconds) paints each frame. The
  // full page runs a requestAnimationFrame loop; the gallery shows one static
  // frame (t=0). Static pieces just draw and return nothing (unchanged). Keeping

      (function loop() {

        requestAnimationFrame(loop);
      })();
    }

  // same page, real drawing code, no iframe.

    if (!def) return;

    if (typeof frame === "function") frame(0);   // animated piece → one static frame

  // embedding a *living* piece somewhere (e.g. the dashboard's "latest" panel).

    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") {
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  };

  // Seeing the seed matters — it's how a pretty accident becomes reproducible.
  function caption(title, seed) {
    var el = document.createElement("div");
    el.className = "loom-caption";
    el.innerHTML = '<span class="loom-title"></span><span class="loom-seed"></span>';
    el.querySelector(".loom-title").textContent = title;
    el.querySelector(".loom-seed").textContent = "seed: " + seed;
    document.body.appendChild(el);
  }

  // Wire the "weave another" / "reset" controls if the page has them. View-time
  // randomness only — the committed default seed is what reproduces the canon.
  function shuffleButton() {
    var bar = document.querySelector(".loom-controls");
    if (!bar) return;
    var another = bar.querySelector("[data-another]");
    var reset = bar.querySelector("[data-reset]");

    });

  }
})((window.Loom = window.Loom || {}));

      }

    };

    return n;
  }

  Loom.noise = makeNoise;
})((window.Loom = window.Loom || {}));

// Emil's Loom · piece 023 — "Rain"
//
// A rainy window at night, seen from inside: looking out through misted glass at defocused warm
// city lights, droplets clinging to the pane — and (once animated) a few sliding down in rivulets,
// each a tiny lens refracting the lights behind it. The cosy, melancholy register I don't have, and
// the first piece to move again after a long static run (the #40 audit reopened animation).
//
// Built the advisor's way: the STATIC wet-window first (this file's first job) — if the still doesn't
// already feel like "inside, looking out at rain," no motion saves it. The discriminator (my 035/037/
// 040 again): droplets must read as wet refractive LENSES, not flat circles — against bright bokeh a
// bead is a magnified+inverted view of the lights, brightened, with a sharp offset highlight, a dark
// rim and a bright bottom meniscus. The clinging drops are static (rendered once); the sliders will be
// a pure function of t (Embers-style) so motion can be judged from a contact-sheet of time samples,
// not an arbitrary rAF frame ([[025-verify-motion-quality-not-just-presence]]).
//
// Composes glow + noise + the palette helpers. Animated (returns frame(t)); seeded so it reproduces.
Loom.piece({
  id: "023",
  title: "Rain",
  seed: "petrichor",
  draw: function (stage, rng) {
    var ctx = stage.ctx, S = stage.size, U = S / 760, TAU = 6.2831853;

    // ---- the bokeh behind the glass, rendered once to an offscreen so droplets can refract it ----
    var bgC = document.createElement("canvas"); bgC.width = S; bgC.height = S;
    var bx = bgC.getContext("2d");
    (function renderBokeh() {
      var g = bx.createLinearGradient(0, 0, 0, S);
      g.addColorStop(0, "#0a131c"); g.addColorStop(0.6, "#0e1c27"); g.addColorStop(1, "#13242f");
      bx.fillStyle = g; bx.fillRect(0, 0, S, S);
      bx.globalCompositeOperation = "lighter";
      var warm = ["#f0c878", "#e8a850", "#f4e6c4", "#d8884a", "#e0b060"];
      var cool = ["#a8c0e0", "#d0d0e0", "#7ea8c8"];
      var n = rng.int(46, 60);
      for (var i = 0; i < n; i++) {
        var lxp = rng.range(-0.05, 1.05) * S, lyp = rng.range(-0.05, 1.05) * S;
        var depth = rng.range(0, 1);                       // 0 far/small/dim, 1 near/big/bright
        var lr = (0.018 + depth * 0.085) * S;
        var col = rng.bool(0.16) ? rng.pick(cool) : rng.pick(warm);
        if (rng.bool(0.06)) col = rng.pick(["#e8504a", "#54bf72"]);  // a rare traffic-light accent
        var a = 0.22 + depth * 0.5;
        var rg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, lr);
        rg.addColorStop(0, Loom.rgba(col, a));
        rg.addColorStop(0.45, Loom.rgba(col, a * 0.45));
        rg.addColorStop(1, Loom.rgba(col, 0));
        bx.fillStyle = rg; bx.beginPath(); bx.arc(lxp, lyp, lr, 0, TAU); bx.fill();
        if (depth > 0.62) {                                 // a hotter core for the near lights
          var cr = lr * 0.32, cg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, cr);
          cg.addColorStop(0, Loom.rgba(col, Math.min(1, a + 0.35))); cg.addColorStop(1, Loom.rgba(col, 0));
          bx.fillStyle = cg; bx.beginPath(); bx.arc(lxp, lyp, cr, 0, TAU); bx.fill();
        }
      }
      bx.globalCompositeOperation = "source-over";
    })();

    // ---- a droplet: a wet refractive lens (magnified + inverted view of the bokeh, brightened) ----
    function drawDroplet(c, dx, dy, r, squash) {
      squash = squash || 1;                                 // >1 = elongated downward (bigger drops sag)
      var rr = r, ry = r * squash, PI = Math.PI;
      c.save();
      c.beginPath(); c.ellipse(dx, dy, rr, ry, 0, 0, TAU); c.clip();
      // the lens: a WIDE-ANGLE inverted view of the scene behind (the classic droplet-full-of-lights),
      // gathered from a region ~2.4× the drop's size so it catches NEARBY lights, not just dead-dark.
      var k = -0.42;
      Loom.lens(c, bgC, dx, dy, k);                          // primitive #14 (harvested from this + Dew)
      // intensify the gathered lights (a drop concentrates them) — a second additive pass at low alpha +
      // a soft lift, so a drop reads as luminous wet glass, never an opaque bead.
      c.globalCompositeOperation = "lighter";
      c.globalAlpha = 0.5; Loom.lens(c, bgC, dx, dy, k); c.globalAlpha = 1;
      var br = c.createRadialGradient(dx, dy - ry * 0.18, 0, dx, dy, rr * 1.15);
      br.addColorStop(0, "rgba(255,248,232,0.2)"); br.addColorStop(1, "rgba(255,248,232,0)");
      c.fillStyle = br; c.fillRect(dx - rr, dy - ry, 2 * rr, 2 * ry);
      c.restore();                                          // un-clip
      // a soft seat-shadow (it sits ON the glass) — subtle, NOT a hard bead rim
      c.globalCompositeOperation = "source-over";
      c.lineWidth = Math.max(0.5, r * 0.08); c.strokeStyle = "rgba(8,14,20,0.22)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.97, ry * 0.97, 0, 0, TAU); c.stroke();
      // bright bottom meniscus (water hangs; light bends through the underside) — sells "drop"
      c.lineWidth = Math.max(0.6, r * 0.12); c.strokeStyle = "rgba(255,251,242,0.5)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.84, ry * 0.84, 0, 0.35, PI - 0.35); c.stroke();
      // a small soft specular highlight, upper-left
      c.globalCompositeOperation = "lighter";
      var hx = dx - rr * 0.3, hy = dy - ry * 0.34, hr = r * 0.26;
      var hg = c.createRadialGradient(hx, hy, 0, hx, hy, hr);
      hg.addColorStop(0, "rgba(255,255,255,0.55)"); hg.addColorStop(1, "rgba(255,255,255,0)");
      c.fillStyle = hg; c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fill();
      c.globalCompositeOperation = "source-over";
    }

    // ---- the static clinging droplets (scattered, varied; rendered once) ----
    var cling = [];
    var nd = Math.round(140 * (S / 760));
    for (var i = 0; i < nd; i++) {
      var t = rng.next();
      var r = (t < 0.7 ? rng.range(1.6, 4.5) : t < 0.93 ? rng.range(4.5, 9) : rng.range(9, 16)) * U;
      cling.push({ x: rng.range(0.02, 0.98) * S, y: rng.range(0.02, 0.98) * S, r: r, sq: 1 + (r / (16 * U)) * 0.18 });
    }

    // The whole static wet-window (bokeh + mist + clinging drops + vignette) is rendered ONCE into an
    // offscreen, so each animated frame is just: draw that layer + the few sliding drops on top.
    function paintStaticInto(c) {
      c.globalCompositeOperation = "source-over"; c.globalAlpha = 1;
      c.drawImage(bgC, 0, 0, S, S);
      c.fillStyle = "rgba(150,168,182,0.16)"; c.fillRect(0, 0, S, S);     // mist veil
      var mistN = Loom.noise(rng.int(0, 1e9));
      for (var y = 0; y < S; y += 6 * U) {
        for (var x = 0; x < S; x += 6 * U) {
          var m = mistN.fbm(x / S * 3.5, y / S * 3.5, 3);
          c.globalAlpha = Math.max(0, (m - 0.5)) * 0.22; c.fillStyle = "#c4d2da";
          c.fillRect(x, y, 6 * U + 0.5, 6 * U + 0.5);
        }
      }
      c.globalAlpha = 1;
      for (var i = 0; i < cling.length; i++) drawDroplet(c, cling[i].x, cling[i].y, cling[i].r, cling[i].sq);
      var vg = c.createRadialGradient(S / 2, S * 0.45, S * 0.3, S / 2, S / 2, S * 0.8);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(4,9,14,0.55)");
      c.fillStyle = vg; c.fillRect(0, 0, S, S);
    }
    var staticC = document.createElement("canvas"); staticC.width = S; staticC.height = S;
    paintStaticInto(staticC.getContext("2d"));

    // ---- the sliding drops: pure functions of t, so any frame is reproducible & a t-strip is judgeable ----
    var wobN = Loom.noise(rng.int(0, 1e9));
    var sliders = [];
    for (var si = 0, nsl = rng.int(5, 7); si < nsl; si++) {
      sliders.push({ x: rng.range(0.06, 0.94), wob: rng.range(0, 40), period: rng.range(6, 12),
        phase: rng.next(), y0: rng.range(-0.06, 0.5), r0: rng.range(6, 10) * U, r1: rng.range(14, 26) * U,
        amp: rng.range(0.014, 0.05) * S });
    }
    var botY = 1.08 * S;
    function pathX(s, lt) { return s.x * S + (wobN.fbm(s.wob, lt * 5, 3) - 0.5) * 2 * s.amp; }
    function pathY(s, lt) { var y0 = s.y0 * S; return y0 + lt * lt * (botY - y0); }   // accelerates from its spawn

    // a thin, slightly meandering cleared rivulet from the drop's spawn down to its head — reveals the
    // sharp (un-misted) bokeh, then re-fogs toward the old (upper) end so it fades before the cycle wraps.
    function drawTrail(s, lt, hr) {
      var steps = 14, w = Math.max(1.2, hr * 0.34);
      ctx.save(); ctx.beginPath();
      for (var i = 0; i <= steps; i++) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) - w, pathY(s, lq)); }
      for (var i = steps; i >= 0; i--) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) + w, pathY(s, lq)); }
      ctx.closePath(); ctx.clip();
      ctx.drawImage(bgC, 0, 0, S, S);
      var rf = ctx.createLinearGradient(0, pathY(s, 0), 0, pathY(s, lt));
      rf.addColorStop(0, "rgba(150,168,182,0.55)"); rf.addColorStop(0.7, "rgba(150,168,182,0.12)"); rf.addColorStop(1, "rgba(150,168,182,0.05)");
      ctx.fillStyle = rf; ctx.fillRect(0, 0, S, S);
      ctx.restore();
    }

    function frame(t) {
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      ctx.drawImage(staticC, 0, 0, S, S);
      for (var i = 0; i < sliders.length; i++) {
        var s = sliders[i], lt = ((t / s.period) + s.phase) % 1;
        var x = pathX(s, lt), y = pathY(s, lt), r = s.r0 + (s.r1 - s.r0) * lt;
        drawTrail(s, lt, r);
        drawDroplet(ctx, x, y, r, 1.45);                                 // the head: a fat elongated lens
      }
    }
    return frame;   // ANIMATED — draw() did the seeded setup; frame(t) paints each moment.
  }
});

</script>
