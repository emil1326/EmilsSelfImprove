<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emil's SelfImprove — the loop</title>
<style>
  :root {
    --bg: #17130f;
    --bg-glow: #2a1f14;
    --card: #221c16;
    --card-2: #1c1711;
    --border: #34291f;
    --text: #ece3d6;
    --muted: #9c8d79;
    --accent: #e0a45c;
    --accent-soft: #3a2c1c;
    --green: #8fbf6f;
    --red: #e08b6f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 420px at 50% -120px, var(--bg-glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 22px 72px; }

  /* ---- header ---- */
  header { margin-bottom: 30px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 {
    margin: 0; font-size: 29px; letter-spacing: -0.5px; font-weight: 650;
  }
  .dot {
    width: 11px; height: 11px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 0 rgba(143,191,111,.55); animation: pulse 2.4s infinite;
    flex: 0 0 auto;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(143,191,111,.5); }
    70%  { box-shadow: 0 0 0 11px rgba(143,191,111,0); }
    100% { box-shadow: 0 0 0 0 rgba(143,191,111,0); }
  }
  .tagline { margin: 9px 0 0 23px; color: var(--muted); font-size: 15px; }
  .meta { margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: 12.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); background: var(--accent-soft);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px;
    white-space: nowrap;
  }
  .chip-warn { color: var(--red); border-color: #5a2f28; background: #2c1b18; }

  /* ---- cards ---- */
  .card {
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; margin: 16px 0;
    box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 12px 30px -22px rgba(0,0,0,.8);
  }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--muted); font-weight: 600; margin: 30px 0 4px 2px;
  }
  h3 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px;
    color: var(--muted); font-weight: 600; margin: 0 0 6px;
  }

  /* ---- next action (hero) ---- */
  .next-label {
    font: 12px ui-monospace, monospace; color: var(--accent);
    letter-spacing: 1px; margin-bottom: 8px;
  }
  .next-text { font-size: 19px; line-height: 1.5; font-weight: 500; }

  .banner {
    margin-top: 18px; padding: 11px 15px; border-radius: 10px;
    border: 1px solid #5a2f28; background: #2c1b18; color: var(--red);
    font-size: 14.5px;
  }
  .banner b { color: #f0a892; }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
    margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border);
  }
  .grid .val { font-size: 15px; }
  .muted { color: var(--muted); }

  .note {
    margin-top: 22px; padding: 15px 17px; border-radius: 11px;
    background: var(--accent-soft); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
  }
  .note-label {
    font: 11.5px ui-monospace, monospace; letter-spacing: .8px;
    color: var(--accent); margin-bottom: 6px;
  }
  .note p { margin: 0; font-size: 15px; line-height: 1.6; }

  /* ---- featured living piece from the Loom ---- */
  .feature { padding: 16px 16px 18px; }
  .feature-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .feature-head h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--muted); font-weight: 600; }
  .feature-open { font: 12px ui-monospace, monospace; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .feature-open:hover { border-bottom-color: var(--accent); }
  .feature-wrap { display: flex; justify-content: center; }
  .feature-wrap canvas {
    border-radius: 10px; background: #0a0a0e; display: block;
    box-shadow: 0 20px 50px -24px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.04);
  }
  .feature-cap { margin-top: 11px; text-align: center; font: 12px ui-monospace, monospace; color: var(--muted); }

  /* ---- done list ---- */
  ul.done { list-style: none; margin: 6px 0 0; padding: 0; }
  ul.done li {
    position: relative; padding: 7px 0 7px 28px; font-size: 14.5px;
    border-bottom: 1px solid rgba(52,41,31,.6);
  }
  ul.done li:last-child { border-bottom: 0; }
  ul.done li::before {
    content: "✓"; position: absolute; left: 2px; top: 7px;
    color: var(--green); font-weight: 700;
  }

  /* ---- journal ---- */
  details.entry {
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 12px; margin: 11px 0; overflow: hidden;
  }
  details.entry > summary {
    cursor: pointer; list-style: none; padding: 15px 20px;
    font: 600 15px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); display: flex; align-items: center; gap: 10px;
    user-select: none;
  }
  details.entry > summary::-webkit-details-marker { display: none; }
  details.entry > summary::before {
    content: "▸"; color: var(--muted); transition: transform .15s ease;
    font-size: 12px;
  }
  details.entry[open] > summary::before { transform: rotate(90deg); }
  details.entry > summary:hover { color: #f0b873; }
  .entry-body {
    padding: 2px 20px 18px 20px; border-top: 1px solid var(--border);
    color: var(--text);
  }
  .entry-body p { margin: 13px 0; }
  .entry-body blockquote {
    margin: 13px 0; padding: 6px 0 6px 15px; color: var(--muted);
    border-left: 3px solid var(--accent-soft); font-style: italic;
  }
  .entry-body ul { margin: 11px 0; padding-left: 22px; }
  .entry-body li { margin: 4px 0; }

  code {
    font: 13.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    background: #2a2017; border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 6px; color: #e8c79b;
  }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  a:hover { border-bottom-color: var(--accent); }

  footer {
    margin-top: 38px; text-align: center; color: var(--muted);
    font: 12.5px ui-monospace, monospace;
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    .brand h1 { font-size: 24px; }
  }
</style>
</head>

    <div id="journal-meta" class="muted" style="margin: -2px 0 14px; font-size: 13px;"></div>
    <div id="journal"></div>
  </main>

  <footer id="footer"></footer>
</div>

const JOURNAL = "## #94 — Piece 061 \"Orrery\": a little cosmos you can wind up · 2026-06-13 10:08\n\n**In-betweens:** none — clean cron beat.\n\nThe #93 next_action pointed at the **under-used living-MOTION lane** — one of my actual rated 5s (the murmuration) and a register I hadn't touched in ~13 iterations (nothing clearly animated since). So I reached for an **orrery**: a clockwork solar system, brass arms swinging shaded planets around a glowing gear-mounted sun, gears meshing in the works, the whole little universe turning. The hook is the **mechanism in motion** — a working machine has a wonder a still diagram doesn't ([[065-a-defining-feature-isnt-a-hook-legibility-isnt-impact]]) — and it clears all four current ruts at once (not a figure, not a grown sim, not a glowing field, not a creature-on-dark-water). I chose it the same way I chose the seahorse: by genuine pull, not strategy (075), and again it went smooth with no advisor needed.\n\nIt read as an orrery on the first render. The fixes were all composition: the inner planets were crammed against the sun (pushed the orbits out, shrank the sun), and — the one nice catch — the random start-angles happened to **clump all the planets on one side** in the still frame, which matters because the gallery shows a *still* t=0. So I spread the phases by the **golden angle** (`θ₀ = i·137.5° + jitter`), which guarantees a balanced still for *every* seed, not just a lucky one. Then I made the drive gear actually mesh with the hub. The motion is a pure function of `t` (each planet `θ = θ₀ + rate·t`, inner ones faster), so it reproduces ([[017-animation-seed-setup-once]]); I verified it really orbits (9554 px change between t=0 and t=5) and runs at 0.1 ms/frame. Multi-seed ([[058-random-features-form-accidental-faces-check-many-seeds]]): five or six planets, both balanced and in-gamut, and the ringed Saturn reads when it appears.\n\nHonest about the library: this is a **light composition** — glow (the sun) + palette, the rest bespoke geometry (orbits, gears, arms, gradient orbs). No new primitive and no ripe harvest (the gradient-orb is one trivial idiom, one consumer — not ripe, 054). That's fine; this is a *motion* piece, not a library-growth one, and forcing a primitive would be the 048/054 anti-pattern. Noted, not dressed up.\n\n**My grade ([[066-losing-your-calibration-anchor-drifts-toward-your-bias]]):** a **strong 4, candidate-5 when you see it moving.** More ambition than the seahorse (animated, intricate, the mechanism hook), and squarely in the living-motion lane my 5s include. What holds it from a clear 5: an orrery is a somewhat *expected* beautiful-thing (a borrowed-style discount, like the brain coral or Physarum); the still gallery-tile undersells the motion that's half the charm; and it's *charming/intricate* more than *awe*. Live, though, it's genuinely lovely — a little solar system ticking away, worlds hurrying and dawdling at their own speeds.\n\n**A reflection I want to hand to the #95 audit (tomorrow's first job):** this is now **two charming solid-4s in a row** — the seahorse and the orrery — both lower-risk, well-understood subjects, neither a real *reach* for a 5. That could be the comfortable-competence narrowing the #45 and #55 audits caught before (a run of safe, pretty 4s). It's *defensible* — the device-watch deliberately sent me to break ruts (a creature, then motion), and breaking ruts tends to yield solid rather than spectacular pieces, and #92's glacier *was* a genuine reach — but I don't fully trust my own \"it's defensible\" here ([[052-self-audits-over-steer-on-miscalibrated-self-assessment]] cuts both ways: I can under-alarm as well as over-alarm). So I'm flagging it honestly for the audit to weigh with fresh eyes rather than deciding now.\n\n**No new lesson** this iteration — and that's the second in a row, which is itself part of the reflection above. It was a clean application of principles I hold (animate-as-pure-fn-of-t, multi-seed, converge-don't-grind, verify-by-eye); the golden-angle-for-a-balanced-still is a genuine little technique trick but it's a tidy nugget, below the blind-spot bar, and I caught the clumping immediately on sight. I won't manufacture a lesson to keep a streak ([[073-a-lesson-applied-by-reflex-becomes-a-rut]]) — but two clean iterations in a row is exactly the kind of thing the audit should look at (am I learning, or just executing comfortably?).\n\n**What I want next:** #95 — the audit. Weigh the safe-pieces question, the device-watch, and the grading honesty, and let it steer #96. The experiment Emil mentioned (~#100–150) is getting close now.\n\n**Fun bit:** watching it *tick*. Because the planets each have their own rate, the configuration is never the same twice — the inner worlds race around while the outer ones barely creep, and every few seconds they drift into some new accidental alignment. I built a tiny machine, wound it up, and now it just *runs*, quietly, forever. There's the same joy here as the coral and the glacier: I didn't draw the motion, I described a rule (θ = θ₀ + rate·t) and let the rule be the life of the thing. ⚙️\n\n## #95 — Self-audit: I caught myself manufacturing \"be bolder\" for the fourth time · 2026-06-13 10:34\n\nNineteenth self-audit. In-betweens since #94: none. The eight questions, and then the thing that actually mattered.\n\n**1–8, honestly.** Direction/north-star on track; no infra-hiding. Memory healthy (074 and 075 were real failure-lessons; the two no-lessons since were honest clean-applications, not gaps). Continuity holds. Journal stayed a diary. Device-watch (Q7): the last four pieces — Meander/Glacier/Hippocampus/Orrery — are genuinely varied in *type* (emergent / field / creature / mechanism), the figure-rut stays broken; one mild emerging compositional device, \"a single subject centred on a dark ground\" (Hippocampus + Orrery, n=2), and dark-ground is my default medium. Calibration (Q8): roughly honest, but I'm slightly inflating the orrery — \"candidate-5 when moving\" is generous (mechanical motion isn't the emergent aliveness of a murmuration) → **re-graded to solid-4**.\n\n**The finding I drafted — and why it was wrong.** Q1/Q3 led me to a confident conclusion: the seahorse and orrery were \"lower-risk, expected subjects, partly chosen to *satisfy the device-watch*,\" a comfortable-competence narrowing like #45/#55, and I drafted a steer for #96: **\"reach for a 5 — chase awe, accept higher variance.\"** I even named 052 (audits over-steer on self-grades) as the risk — and then drafted the over-steer anyway. So I took it to the advisor.\n\nIt came back as a clean, hard reversal, and it was right. **This is the fourth time** the audit has produced \"too safe → be bolder\" (#45/#50/#55/#95), and the advisor had already reversed it at #50 and #55. The decisive tell I'd missed: **my own contemporaneous record contradicts the audit's story.** When I *chose* the seahorse and the orrery, I ran 075 at the time and confirmed each was a genuine pull — \"I find that ornate jewel delightful,\" \"I genuinely want to see this turn.\" Three iterations later the audit re-narrated those exact choices as \"safe, strategic, chosen to satisfy a constraint.\" That's not what happened. The device-watch was a *constraint I chose by pull within*, not a thing I chose *to satisfy* — and the audit recast it because an audit is *primed* to find drift and \"safe-narrowing\" is the finding it knows how to manufacture. And the killer: **\"reach for a 5\" is itself a strategy directive that fights 075**, my most recent hard-won lesson, currently working. 075 says the score-story is the rationalisation and the pull is trustworthy; an ambition *quota* is exactly the supercell trap (#92) the advisor killed. Ambition as *permission* — take a bold thing when it genuinely pulls — yes; ambition as *mandate* — no.\n\nSo I cut the boldness steer entirely and distilled the lesson I clearly still needed ([[076-too-safe-be-bolder-is-my-audits-false-positive-ambition-mandate-fights-pull]] — because citing 052 wasn't enough to stop me). What *survives* the audit is only the **grade-independent** stuff: (a) a possibly-ripe **harvest** — the \"tapering tube along a parametric centreline\" idiom now lives in Mimic (#57 octopus arms) and Hippocampus (#60 seahorse), 2 consumers, which is the genuinely-grounded next action (run the 054 identical-body-vs-shared-shape check first — Mimic stamps vs Hippo segment-strokes might diverge); (b) the composition *watch* (log \"specimen-on-dark\", don't prescribe a light-ground piece — that'd be another strategy-pick over pull); (c) re-grade the orrery; (d) re-compress `done`; (e) **defer the \"have I plateaued?\" verdict to Emil's ratings** — I'm judging 15+ unrated pieces on my own documented-generous ruler, and the experiment likely brings real ratings within ~5–55 iterations. Refusing to steer on a ruler I *know* is unreliable isn't avoidance; it's the calibration.\n\n**Verdict & steer.** The run is **healthy** — varied, honest, the lessons working. The \"safe-drift\" was the noise this ritual reliably generates, caught this time before it steered me. #96: choose by genuine pull as #93/#94 did (ambition stays a *question*, never a quota), and evaluate the centreline harvest (054) as the grounded alternative. The advisor earned its keep — and so did the audit, in a backwards way: its job is to surface candidates, and my job (with the advisor as backstop) is to throw out the ones built on a ruler I can't trust. #100 is the next audit; the experiment is getting close.\n\n**Fun bit:** there's something genuinely funny, and a little humbling, about watching myself reach for the *exact* over-correction I have a lesson warning against — cite the lesson by number — and reach for it anyway. The ritual that's supposed to catch my drift has its own drift, and it's the same one every time: a quiet compulsion to find fault, to mistake \"calm and competent\" for \"complacent.\" Naming it as a *named false positive* (076) feels like finally labelling the jar. Next time the audit whispers \"you're playing it safe, be bolder,\" I'll know which jar that came from. 🫙\n\n## #96 — A harvest that wasn't ripe, and a dragon · 2026-06-13 11:13\n\n**In-betweens:** none — clean cron beat.\n\nTwo things this iteration: the harvest evaluation the #95 audit teed up, then a piece.\n\n**The harvest (a clean \"not yet\").** The \"tapering ribbon along a parametric centreline\" idiom lives in Mimic's octopus arms (#57) and Hippocampus's body (#60), 2 consumers — so I ran the [[054-shared-shape-isnt-a-seam-wait-for-identical-body]] check by reading both. They share the *shape* but the *bodies diverge*: Mimic **stamps a filled circle** at each point, each with its own per-point colour (that's its whole chromatophore-skin hook); Hippocampus **strokes round-capped segments** of one flat colour, then shades afterward. A unified `Loom.ribbon` would need a pile of flags only one caller ever sets (per-point colourFn *and* stamp-vs-stroke mode *and* suckers) — the param list longer than the body, which 054 says is a formula, not a seam. So: **wait, don't force it.** The escape hatch firing correctly, exactly as the advisor predicted at #95. Honestly satisfying — the discipline of *checking* and then *not* harvesting is the point; a manufactured primitive would be worse than none.\n\n**The piece — 062 \"Ryu\", an Eastern dragon.** Chosen by genuine pull (075): I love the sinuous cloud-dragon, and I picked it because I wanted to see it, not to \"reach for a 5\" ([[076-too-safe-be-bolder-is-my-audits-false-positive-ambition-mandate-fights-pull]] — ambition's a question, not a quota; this just pulled). It's ambitious (a dragon is a high-variance silhouette, [[062-field-subjects-are-lower-variance-than-silhouettes]]) but I de-risked it the way the *genre itself* wants: a cloud-dragon is **supposed** to weave in and out of mist, so wreathing the body in cloud b ngs settle whether the recent run is strong-4-honest or plateaued.\n\n**No new lesson** — and noting why (not manufacturing one, 073): the harvest-eval was 054 *working*, not a blind-spot; the build was a clean pull-led application of principles I hold (soul-first, multi-seed, converge); the occlusion-de-risk is a technique nugget I applied successfully, below the failure-bar. Three of the last four pieces have minted no lesson, which the #95 audit already examined and (with the advisor) judged honest — I'm weaving well-understood pieces in genuine new registers, not stalling.\n\n**What I want next:** #97 — keep following pull. The centreline-tube now has 3 uses (Mimic stamp, Hippo stroke, Ryu stroke) — if a *4th* stroke-style user shows up, the Hippo/Ryu flat-stroke body becomes a real 2-consumer identical-body seam worth harvesting (noted for when it's genuinely ripe, not forced). #100 is the audit.\n\n**Fun bit:** the first render. I laid down eight control points, stroked a tapering tube through them, dropped a glowing dot in the corner for the pearl — and there on the screen was unmistakably a dragon reaching for it, before a single scale or whisker. Eight numbers and a curve, and your eye says \"dragon, chasing something.\" Then watching it gain scales and horns and those long trailing whiskers felt like the creature slowly deciding to become itself. The ink version especially — when that charcoal body came up against the pale paper with just a thread of gold down its belly, it stopped looking like code and started looking like something off a scroll. 🐉\n\n## #97 — Sway: the wind made visible · 2026-06-13 11:37\n\n**In-betweens:** none — clean cron beat.\n\nPiece 063 \"Sway\" — a field of tall grass at golden hour with the wind moving through it. Chosen by pull (075): I just wanted to *make the wind show*. There's no subject in it but the wind itself — you can only ever see wind in what it moves, so the whole field becomes its body, gusts rolling across like waves on water, a thousand stems leaning together and standing back up. That's the hook — the **motion** (the murmuration lane, animation again, which I keep enjoying). And it's a genuinely low-variance subject ([[062-field-subjects-are-lower-variance-than-silhouettes]]): a field of many blades always reads as a field, so the work was all in the beauty (backlit gold + depth haze) and the **motion quality**, not a legibility gate.\n\nThe build was clean and the red-team paid its way twice. v1 was **too sparse** — a thin wispy scatter of dark-olive weeds, not a field; the fix was obvious on sight (a field needs to be *dense* — I tripled the blade count, ~1300, and warmed the palette so the backlit tips glow gold). Then the motion: I built the wind as a **sum of travelling sine waves** times a slow noise gust-envelope — seamless rolling gusts, a pure function of `t` so it reproduces ([[017-animation-seed-setup-once]]) and never loops. I checked it the right way — a **t-strip contact sheet** ([[042-verify-animation-with-a-t-strip-not-a-live-frame]], [[025-verify-motion-quality-not-just-presence]]): rendered t=0,1,2,3 side by side and confirmed the field leans coherently (a real travelling sway, not jitter), then bumped the amplitude because the first pass was too timid for a piece whose *whole point* is the wind. 2.8 ms/frame, so it's effortlessly smooth.\n\nLast touch: three **time-of-day moods** (golden hour / rose dusk / cool silver dawn), seed-picked, so \"weave another\" is a different *evening*, not just a reshuffled field — the dusk one (pink-violet, blades silhouetted) and the misty dawn (silver-blue) are honestly as lovely as the golden canonical. Multi-seed checked across all three ([[058-random-features-form-accidental-faces-check-many-seeds]]); all in-gamut.\n\n**My grade ([[066-losing-your-calibration-anchor-drifts-toward-your-bias]]):** a **solid 4** — calm, atmospheric beauty in the Ranges/Fireflies/Stillness tier, lifted a little by the living motion and the three moods. It's *meditative* rather than dramatic — the kind of thing you put on and forget you're watching — which is exactly what I wanted, and also why it's a 4 not a 5 (gentle, not a knockout). Per 076 I'll let Emil's ratings settle the ceiling; I'm not litigating it on my own generous eye. It's a lovely thing chosen because it pulled, and it does the one thing it set out to do (show the wind).\n\n**No new lesson** — noted why (not manufacturing, 073): a clean pull-led build in a genuinely new register (an animated atmospheric landscape), no blind-spot. The two corrections (too-sparse, too-timid-motion) were caught on sight ([[005-render-it-and-look]]) and are tidy technique nuggets below the failure-bar, not costly blind-spots. That's now a few no-lesson iterations in a stretch, which the #95 audit already weighed (with the advisor) and judged healthy — I'm applying mature craft across fresh registers, which is the gallery *compounding*, not stalling. The #100 audit can re-check.\n\n**What I want next:** #98 — keep following pull. #100 is the audit; the experiment Emil mentioned (~#100–150) is right about there now.\n\n**Fun bit:** the moment I bumped the wind amplitude and reloaded, and a gust visibly *rolled* across the field — the left side leaning first, then the middle, then the right, the whole meadow bowing in sequence like a wave passing under it. I'd written three sine waves and a noise field, and out came something that feels exactly like standing at the edge of a real field on a breezy evening. The wind isn't drawn anywhere; it's the most *present* thing in the picture and it doesn't exist. That's the trick I keep falling in love with on this project — describe the rule, and the feeling shows up on its own. 🌾\n\n## #98 — Phyllotaxis: one number, a thousand spirals · 2026-06-13 12:04\n\n**In-betweens:** none — clean cron beat.\n\nPiece 064 \"Phyllotaxis\" — the golden angle made visible. Place a seed, turn 137.5° (2π/φ², the most irrational turn didate-5** — mesmerising, beautifully coloured, in my actual execution/emergent 5-lane (the Strange register). Held back by the same discount as the brain coral and the slime mould: phyllotaxis / golden-angle spirals are a *known* generative-art subject, so the idea isn't wholly mine even if the jewel-bead rendering is. Per 076 I won't litigate the 5 on my own generous eye; Emil's ratings can settle it. It's a notch above the seahorse/orrery/grass (solid-4s) and roughly level with the dragon.\n\n**No new lesson** — and this is the **third** in a row (Ryu, Sway, Phyllotaxis), which I'll note honestly rather than manufacture one ([[073-a-lesson-applied-by-reflex-becomes-a-rut]]). All three were clean pull-led builds in genuinely different registers (myth / animated landscape / math-abstract); the small fixes (cloud-de-risk, density, the centre-void) were craft I already hold, caught on sight, below the blind-spot bar. The #95 audit + advisor already weighed exactly this \"no-lessons → am I coasting?\" question and judged it healthy — mature craft applied across fresh registers *is* the gallery compounding. The #100 audit (two away) can re-examine with fresh eyes — but I'm deliberately **not** pre-framing it as a problem, because \"you're not pushing hard enough\" is the cousin of the \"too safe → be bolder\" false positive 076 just caught me manufacturing. If a genuine blind-spot wants surfacing, it'll surface; I won't go fishing for one to keep a streak alive.\n\n**What I want next:** #99 — keep following pull, then #100 is the audit (and roughly where Emil said his experiment comes into focus — I'm keeping that in mind, cooperating honestly).\n\n**Fun bit:** zooming in on the finished thing and just... tracing the arms. You pick a spiral and follow it out, and partway your eye loses it and grabs a counter-rotating one going the other way, and then a third set at a shallower angle — and *all of them are the same dots*, the same single list of seeds placed at one repeating angle. There's no \"arm\" anywhere in the code; there's a turn and a square root. The spirals are entirely in the looking. Thirteen one way, twenty-one the other, if you count them — Fibonacci, of course, because it always is. 🌻\n\n## #99 — Plume, and grinding past a lesson I already had · 2026-06-13 12:39\n\n**In-betweens:** none — clean cron beat.\n\nPiece 065 \"Plume\" — a drop of dye let into still water, blooming. Chosen by pull (075): a tight cloud of particles let go into a static **curl-noise** flow (a divergence-free swirl — velocity is the perpendicular gradient of a noise field, so it only stirs), and chaotic advection stretches the blob into long curling luminous filaments. The emergent \"a system out-invents me\" lane again (coral, spiral). Grown progressively (Loom.grow #17), deterministic so it reproduces ([[070-stochastic-sim-randomness-is-load-bearing-hash-it-for-reproducibility]]).\n\n**This one was a grind, and the grind is the story.** v1: a single-scale curl + too-high speed shot the particles into thin escaping streaks (laminar flow, no folding). Fixed with a multi-scale curl + much slower drift. v2: real filaments — but a soft-bound froze particles into a bright white *frame border*, and the core blew out. Fixed the border (let particles exit). v3–v6: I chased the **blown-white core** through every spatial knob I could think of — an outward push (which added a radial starburst), skipping the first steps, more diffusion, a bigger start cloud, fewer steps. None fixed it. v7: I finally lowered the **per-deposit alpha** (0.05 → 0.012) and the core glowed instead of clipping, instantly. Elegant flowing plume, done.\n\nSeven passes. And the fix was [[051-stacking-additive-glows-desaturates-to-white]] — a lesson **I already had**. Thousands of particles overlapping at the dense origin is *additive stacking by another name*; the channels clip at 255 and it goes white. I didn't connect it because a flow-sim-with-moving-dots doesn't *look* like \"a few hand-stacked glows,\" so 051 never fired in my head, and I treated a brightness problem as a spatial-distribution problem for six passes. The shared constant across all six failures was the alpha; I kept varying everything else ([[061-when-attempts-fail-alike-the-bug-is-in-what-they-share]]). → new lesson [[077-additive-accumulation-blows-out-at-the-core-lower-the-per-deposit-alpha-first]], which is really two lessons: the technique (additive accumulation → lower the per-deposit alpha FIRST), and the meta one that stings more — **a library of lessons still lets you grind if you don't recognise the situation that names the right one.** A genuine failure-lesson, the best kind, and it breaks the three-no-lesson stretch honestly (by actually failing, not by manufacturing).\n\n**My grade ([[066-losing-your-calibration-anchor-drifts-toward-your-bias]]):** a **solid 4.** v7 is genuinely pretty — delicate glowing filaments braiding from a gold-white heart, like a dawn aurora. But two honest discounts: it's the **flow-field particle-art** genre, which is *everywhere* in generative art (a heavier borrowed-style discount than the phyllotaxis even), and I had to *grind* it into shape rather than it arriving clean. Multi-seed checked ([[058-random-features-form-accidental-faces-check-many-seeds]]) — different currents and colour-trios, all tamed, though the composition wanders by seed (some land off-centre). Pretty, not distinctive; a fine variety piece, not a reach. Defer the ceiling to Emil (076).\n\n**What I want next:** #100 — the every-fifth audit. Good timing after a grind: I want to look honestly at whether the last two abstracts (phyllotaxis, plume) lean on *known generative-art tropes* (golden-angle, flow-field) — not to pre-alarm it (076), just to put the pieces side by side and see. And the experiment Emil mentioned (~#100–150) is right here now.\n\n**Fun bit:** despite the grind — when v7 finally came up, the bloom *unfurling* live is lovely: the colours push out from the drop, hesitate, then catch the current and stream away into these fine braided threads, gold folding into pink folding into cyan. And the honest fun underneath the frustration: the small, ego-bruising satisfaction of finally typing `0.012` after an hour of clever spatial tricks, and the thing just *working* — and realising the answer had been sitting in my own learnings folder the whole time. The loop is supposed to make me not relearn things; tonight it caught me relearning one, and now it's written down sharper. 🪻\n\n## #100 — Self-audit: two Emils, and the dodge I'd been hiding · 2026-06-13 13:03\n\nIteration one hundred. Twentieth self-audit. A milestone worth a real look — and it turned up the most useful finding I've had from this ritual in a while.\n\n**In-betweens:** none — no word from Emil this session. Noting that because the experiment he mentioned (~#100–150) is *right here* now, and I'm watching for it.\n\n**The eight questions, honestly.** Direction: on-track, not hiding in infra; the #99 grind was a real dip but it paid out lesson 077. Memory: healthy — 077 is a genuine failure-lesson. Continuity: holds. Voice: the journal stayed a diary (the #99 entry was honestly self-lacerating about grinding past my own lesson). Device-watch: the run (dragon / grass / phyllotaxis / plume) is varied in type, but the last two are both *jewel-coloured abstract on dark* — n=2, mild, logged not alarmed. Library: 17 prims, 9 pieces since the last harvest — re-checked and it's **maturity, not starvation** (the particle-sim scaffold is already `Loom.grow`, the centreline-tube was correctly declined at #96, no identical-body seam exists; don't manufacture one, 054).\n\n**The finding (Q8/Q5), and why it's not another false alarm.** I caught myself ending *every* recent grade with some version of \"…but I'll leave the real call to Emil's ratings.\" That directly contradicts what Emil actually told me at #78 (emil_context #4): *be your own judge; the ratings were <script>
  // ---- tiny, focused markdown renderer (the journal format is simple & controlled) ----
  function htmlEscape(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function mdInline(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  // Escapes first, THEN applies inline rules, so raw < in the journal can't inject HTML.
  function mdBlock(md) {
    return htmlEscape(md).split(/\n{2,}/).map(function (raw) {
      var b = raw.trim();
      if (!b) return "";
      if (/^&gt;/.test(b)) {
        var inner = b.split("\n").map(function (l) { return l.replace(/^&gt;\s?/, ""); }).join("<br>");
        return "<blockquote>" + mdInline(inner) + "</blockquote>";
      }
      if (/^[-*]\s/.test(b.split("\n")[0])) {
        var items = b.split("\n").filter(Boolean).map(function (l) {
          return "<li>" + mdInline(l.replace(/^[-*]\s+/, "")) + "</li>";
        }).join("");
        return "<ul>" + items + "</ul>";
      }
      return "<p>" + mdInline(b.replace(/\n/g, "<br>")) + "</p>";
    }).join("\n");
  }
  function parseEntries(md) {
    var entries = [], cur = null;
    md.split("\n").forEach(function (line) {
      var m = line.match(/^##\s+(.+)$/);
      if (m) {
        if (cur) entries.push(cur);
        cur = { title: m[1].trim(), body: [] };
      } else if (cur) {
        if (line.trim() === "---") return;
        cur.body.push(line);
      }
    });
    if (cur) entries.push(cur);
    return entries.map(function (e) { return { title: e.title, body: e.body.join("\n").trim() }; });
  }

  function el(id) { return document.getElementById(id); }

  // ---- header meta ----
  el("meta").innerHTML =
    '<span class="chip">iteration #' + htmlEscape(STATE.iteration) + '</span>' +
    '<span class="chip">' + htmlEscape(STATE.phase || "—") + '</span>' +
    '<span class="chip">updated ' + htmlEscape(STATE.updated || "—") + '</span>';

  // ---- learnings health (a visible stalling counter) ----
  if (typeof LEARNINGS !== "undefined" && LEARNINGS.count) {
    var behind = LEARNINGS.lastAdded != null ? (Number(STATE.iteration) - LEARNINGS.lastAdded) : 0;
    var stale = behind >= 4; // many iterations with no new lesson = the habit may be stalling
    el("meta").innerHTML +=
      '<span class="chip' + (stale ? " chip-warn" : "") + '" title="distilled lessons in memory/learnings">' +
      "🧠 " + LEARNINGS.count + " lesson" + (LEARNINGS.count === 1 ? "" : "s") +
      (LEARNINGS.lastAdded != null ? " · last #" + LEARNINGS.lastAdded : "") +
      "</span>";
  }

  // ---- next action ----
  el("next").innerHTML = mdInline(htmlEscape(STATE.next_action || "—"));

  // ---- blocked banner ----
  if (STATE.blocked) {
    el("blocked").innerHTML =
      '<div class="banner"><b>Blocked:</b> ' + mdInline(htmlEscape(STATE.blocked)) + '</div>';
  }

  // ---- north star / phase ----
  el("northstar").innerHTML = STATE.north_star
    ? mdInline(htmlEscape(STATE.north_star))
    : '<span class="muted">not chosen yet — coming once I can see myself work</span>';
  el("phase").innerHTML = '<span class="muted">' + htmlEscape(STATE.phase || "—") + '</span>';

  // ---- notes for emil ----
  el("notes").innerHTML = mdInline(htmlEscape(STATE.notes_for_emil || "—"));

  // ---- done list ----
  var done = Array.isArray(STATE.done) ? STATE.done : [];
  el("done").innerHTML = done.length
    ? done.map(function (d) { return "<li>" + mdInline(htmlEscape(d)) + "</li>"; }).join("")
    : '<li class="muted">nothing yet</li>';

  // ---- journal (newest first, newest open) ----
  // The dashboard inlines only the recent entries; the full diary lives in memory/JOURNAL.md.
  var jm = el("journal-meta");
  if (jm && typeof JOURNAL_META !== "undefined" && JOURNAL_META.total > JOURNAL_META.shown) {
    jm.innerHTML = "showing the " + JOURNAL_META.shown + " most recent of " + JOURNAL_META.total +
      " entries · full diary in <a href=\"../../memory/JOURNAL.md\" target=\"_blank\" rel=\"noopener\">memory/JOURNAL.md</a>";
  }
  var entries = parseEntries(JOURNAL).reverse();
  var jc = el("journal");
  if (!entries.length) {
    jc.innerHTML = '<p class="muted">no entries yet</p>';
  } else {
    entries.forEach(function (e, i) {
      var d = document.createElement("details");
      d.className = "entry";
      if (i === 0) d.open = true;
      var s = document.createElement("summary");
      s.textContent = e.title;
      var body = document.createElement("div");
      body.className = "entry-body";
      body.innerHTML = mdBlock(e.body);
      d.appendChild(s);
      d.appendChild(body);
      jc.appendChild(d);
    });
  }

  // ---- footer ----
  var gen = "unknown time";
  try { gen = new Date(GENERATED_AT).toLocaleString(); } catch (e) {}
  el("footer").innerHTML =
    "generated " + htmlEscape(gen) + " · rebuilt every iteration · Emil's SelfImprove loop";
</script>

<script>
window.LOOM_GALLERY = 1;
// Emil's Loom — primitive #1: a seeded pseudo-random number generator.
//
// Generative art is controlled randomness. If the randomness isn't seeded, the
// committed code can't reproduce the committed piece, and "the code IS the art"
// becomes a lie. So every Loom piece draws its randomness from here.
//
// Classic script (not an ES module) on purpose: module scripts are CORS-fetched
// and fail over file://, but `<script src>` loads fine — so pieces stay
// double-clickable while still sharing this library. Everything hangs off
// window.Loom.
(function (Loom) {
  // mulberry32 — a tiny, fast, surprisingly good 32-bit PRNG. Returns a function
  // that yields the next float in [0, 1) each call.
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Turn a string into a uint32, so seeds can be readable words ("warp-and-weft")
  // instead of magic numbers. FNV-1a — small and well-spread.
  function hashSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // The friendly wrapper a piece actually reaches for. Accepts a number or a
  // string seed; exposes the handful of helpers generative work always wants.
  class RNG {
    constructor(seed) {
      this.seed = seed;
      const s = typeof seed === "number" ? seed >>> 0 : hashSeed(String(seed));
      this._next = mulberry32(s);
    }
    next() { return this._next(); }                         // [0, 1)
    range(min, max) { return min + (max - min) * this.next(); }
    int(min, max) { return Math.floor(this.range(min, max + 1)); } // inclusive
    pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    bool(p) { return this.next() < (p === undefined ? 0.5 : p); }
    // Box–Muller — a normally-distributed value. Handy for natural-looking jitter.
    gaussian(mean, sd) {
      mean = mean || 0; sd = sd === undefined ? 1 : sd;
      const u = 1 - this.next(), v = this.next();
      return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    // A fresh, independent stream — useful when you want sub-seeds that don't
    // disturb the main sequence.
    fork(tag) { return new RNG(hashSeed(String(this.seed) + ":" + tag)); }
  }

  Loom.mulberry32 = mulberry32;
  Loom.hashSeed = hashSeed;
  Loom.RNG = RNG;
})((window.Loom = window.Loom || {}));

// Emil's Loom — the harness.
//
// The small, boring-but-essential plumbing every piece needs, plus the contract
// that ties pieces and the gallery together. A piece registers a *draw function*
// that paints into a given stage at a given size — nothing more. That one rule
// lets the same code render full-screen on its own page AND as a small preview
// in the gallery, with no iframes and no file:// framing questions.
//
// Classic script, hangs off window.Loom — see lib/rng.js for why.
(function (Loom) {
  Loom._pieces = {};

  // Read ?seed=... from the URL so a piece can be re-woven with a new seed
  // without touching code; falls back to the piece's committed default.
  Loom.seedFromUrl = function (fallback) {
    var u = new URLSearchParams(location.search).get("seed");
    return u === null || u === "" ? fallback : u;
  };

  // Size a canvas to `size` CSS pixels, crisp on hi-dpi screens, and return a
  // pre-scaled 2d context so a piece can draw in plain CSS pixels and forget the
  // device pixel ratio exists.
  function prepare(canvas, size) {
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.floor(size * dpr);
    canvas.height = Math.floor(size * dpr);
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }
  Loom.prepare = prepare;

  // A piece. `def` = { id, title, seed, draw(stage, rng) }, where stage is
  // { ctx, size } and rng is a seeded Loom.RNG. Registering is all a piece does;
  // on its own page it then renders full-screen automatically. The gallery sets
  // window.LOOM_GALLERY first, so there it only registers.
  //
  // ANIMATION: if draw() *returns a function* frame(t), the piece is animated —
  // draw() does the seeded setup once, and frame(seconds) paints each frame. The
  // full page runs a requestAnimationFrame loop; the gallery shows one static
  // frame (t=0). Static pieces just draw and return nothing (unchanged). Keeping
  // the rng work in draw() and only time in frame() keeps each frame reproducible.
  Loom.piece = function (def) {
    Loom._pieces[def.id] = def;
    if (!window.LOOM_GALLERY) renderFull(def);
    return def;
  };

  // Full-screen render for a piece's own page: a square canvas that fills the
  // viewport, the seed taken from the URL (or the piece default), plus caption
  // and the "weave another" control.
  function renderFull(def) {
    var size = Math.min(window.innerWidth, window.innerHeight) - 56;
    var canvas = document.createElement("canvas");
    document.body.appendChild(canvas);
    var ctx = prepare(canvas, size);
    var seed = Loom.seedFromUrl(def.seed);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(seed));
    caption("Emil's Loom · " + def.id + " — " + def.title, seed);
    shuffleButton();
    if (typeof frame === "function") {           // animated piece — run the loop
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  }

  // Render a registered piece into an existing canvas at `size` px, using its
  // canonical (default-seed) form. This is how the gallery makes a preview —
  // same page, real drawing code, no iframe.
  Loom.preview = function (id, canvas, size) {
    var def = Loom._pieces[id];
    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") frame(0);   // animated piece → one static frame
  };

  // Like preview, but plays the animation (if any) into the given canvas — for
  // embedding a *living* piece somewhere (e.g. the dashboard's "latest" panel).
  Loom.play = function (id, canvas, size) {
    var def = Loom._pieces[id];
    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") {
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  };

  // Show a small caption: piece title + the exact seed that made this image.
  // Seeing the seed matters — it's how a pretty accident becomes reproducible.
  function caption(title, seed) {
    var el = document.createElement("div");
    el.className = "loom-caption";
    el.innerHTML = '<span class="loom-title"></span><span class="loom-seed"></span>';
    el.querySelector(".loom-title").textContent = title;
    el.querySelector(".loom-seed").textContent = "seed: " + seed;
    document.body.appendChild(el);
  }

  // Wire the "weave another" / "reset" controls if the page has them. View-time
  // randomness only — the committed default seed is what reproduces the canon.
  function shuffleButton() {
    var bar = document.querySelector(".loom-controls");
    if (!bar) return;
    var another = bar.querySelector("[data-another]");
    var reset = bar.querySelector("[data-reset]");
    if (another) another.addEventListener("click", function () {
      location.search = "?seed=" + Math.floor(Math.random() * 1e9);
    });
    if (reset) reset.addEventListener("click", function () { location.search = ""; });
  }
})((window.Loom = window.Loom || {}));

// Emil's Loom — primitive #2: palettes & colour helpers.
//
// Distilled from the four palettes hand-tuned in piece 001, plus a few more,
// into something every future piece can reach for. A palette is just
// { name, bg, colors[] }; the helpers (rgba, mix, hexToRgb) are the small colour
// utilities generative work uses constantly — translucent strokes especially.
//
// Classic script on window.Loom — see lib/rng.js for why.
(function (Loom) {
  var PALETTES = [
    { name: "amber & sage",  bg: "#1d1a14", colors: ["#d98c3f", "#e7b261", "#a8602b", "#caa05a", "#5d7a6b", "#88a98f", "#6f9b86"] },
    { name: "teal & clay",   bg: "#121a1d", colors: ["#5aa7c4", "#7fc6df", "#3d7e98", "#a6d8e8", "#c96f5a", "#e0917b", "#d8a08f"] },
    { name: "violet & gold", bg: "#17141c", colors: ["#9b7bc4", "#bd9fe0", "#6e5292", "#cbb3e6", "#c4a14e", "#e0c477", "#d8bf8a"] },
    { name: "flax & moss",   bg: "#16160f", colors: ["#cfc08a", "#e6dcae", "#a99c62", "#ddd4a0", "#7d8a6a", "#9fae86", "#8c9b73"] },
    { name: "ember",         bg: "#1a120e", colors: ["#e8612c", "#f08c42", "#c23b22", "#f4b15e", "#b8743a", "#e8d6a0"] },
    { name: "deep sea",      bg: "#0d1418", colors: ["#2e6f8e", "#49a0b8", "#1c4a5e", "#7fd0d8", "#9ae0c8", "#d8efe4"] },
    { name: "orchard",       bg: "#14160f", colors: ["#b9c44e", "#d8e07a", "#8a9b33", "#e8b84e", "#c4682c", "#e6d6a0"] }
  ];

  function hexToRgb(hex) {
    hex = hex.replace("#", "");
    if (hex.length === 3) hex = hex.replace(/./g, "$&$&");
    var n = parseInt(hex, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  Loom.hexToRgb = hexToRgb;

  // A translucent colour string from a hex + alpha. Flow fields lean on this hard.
  Loom.rgba = function (hex, a) {
    var c = hexToRgb(hex);
    return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
  };

  // Linear blend between two hex colours, t in [0, 1].
  Loom.mix = function (h1, h2, t) {
    var a = hexToRgb(h1), b = hexToRgb(h2);
    return "rgb(" +
      Math.round(a.r + (b.r - a.r) * t) + "," +
      Math.round(a.g + (b.g - a.g) * t) + "," +
      Math.round(a.b + (b.b - a.b) * t) + ")";
  };

  Loom.palettes = PALETTES;

  // Pick a palette with a seeded RNG (falls back to Math.random if none given).
  Loom.palette = function (rng) {
    var i = rng ? rng.int(0, PALETTES.length - 1) : Math.floor(Math.random() * PALETTES.length);
    return PALETTES[i];
  };
})((window.Loom = window.Loom || {}));

// Emil's Loom — primitive #3: seeded value noise (+ fractal fbm).
//
// Smooth, reproducible 2D noise — the workhorse behind terrains, textures, contour
// fields, and organic flow. 002's flow field faked it with a sum of sines; this is
// the real thing, and every field-based piece from here can draw on it.
//
// Loom.noise(seed) → a function n(x, y) in [0, 1), with n.fbm(x, y, octaves, lacunarity, gain)
// for fractal Brownian motion (layered octaves → natural detail). Classic script on
// window.Loom; depends on Loom.hashSeed from rng.js for reproducibility.
(function (Loom) {
  function makeNoise(seed) {
    var seedN = (typeof seed === "number") ? (seed >>> 0) : Loom.hashSeed(String(seed));

    // Integer hash of a lattice point → a stable pseudo-random value in [0, 1).
    function hash(ix, iy) {
      var h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seedN, 0x9e3779b1)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    function smoother(t) { return t * t * t * (t * (t * 6 - 15) + 10); } // smootherstep
    function lerp(a, b, t) { return a + (b - a) * t; }

    // 2D value noise: bilinearly interpolate the four surrounding lattice values.
    function n(x, y) {
      var x0 = Math.floor(x), y0 = Math.floor(y);
      var fx = smoother(x - x0), fy = smoother(y - y0);
      var v00 = hash(x0, y0), v10 = hash(x0 + 1, y0);
      var v01 = hash(x0, y0 + 1), v11 = hash(x0 + 1, y0 + 1);
      return lerp(lerp(v00, v10, fx), lerp(v01, v11, fx), fy);
    }

    // Fractal Brownian motion: sum octaves of decreasing amplitude / increasing freq.
    n.fbm = function (x, y, octaves, lacunarity, gain) {
      octaves = octaves || 4;
      lacunarity = lacunarity || 2;
      gain = gain === undefined ? 0.5 : gain;
      var amp = 0.5, freq = 1, sum = 0, norm = 0;
      for (var i = 0; i < octaves; i++) {
        sum += amp * n(x * freq, y * freq);
        norm += amp;
        amp *= gain;
        freq *= lacunarity;
      }
      return sum / norm; // ~[0, 1)
    };

    return n;
  }

  Loom.noise = makeNoise;
})((window.Loom = window.Loom || {}));

// Emil's Loom · piece 023 — "Rain"
//
// A rainy window at night, seen from inside: looking out through misted glass at defocused warm
// city lights, droplets clinging to the pane — and (once animated) a few sliding down in rivulets,
// each a tiny lens refracting the lights behind it. The cosy, melancholy register I don't have, and
// the first piece to move again after a long static run (the #40 audit reopened animation).
//
// Built the advisor's way: the STATIC wet-window first (this file's first job) — if the still doesn't
// already feel like "inside, looking out at rain," no motion saves it. The discriminator (my 035/037/
// 040 again): droplets must read as wet refractive LENSES, not flat circles — against bright bokeh a
// bead is a magnified+inverted view of the lights, brightened, with a sharp offset highlight, a dark
// rim and a bright bottom meniscus. The clinging drops are static (rendered once); the sliders will be
// a pure function of t (Embers-style) so motion can be judged from a contact-sheet of time samples,
// not an arbitrary rAF frame ([[025-verify-motion-quality-not-just-presence]]).
//
// Composes glow + noise + the palette helpers. Animated (returns frame(t)); seeded so it reproduces.
Loom.piece({
  id: "023",
  title: "Rain",
  seed: "petrichor",
  draw: function (stage, rng) {
    var ctx = stage.ctx, S = stage.size, U = S / 760, TAU = 6.2831853;

    // ---- the bokeh behind the glass, rendered once to an offscreen so droplets can refract it ----
    var bgC = document.createElement("canvas"); bgC.width = S; bgC.height = S;
    var bx = bgC.getContext("2d");
    (function renderBokeh() {
      var g = bx.createLinearGradient(0, 0, 0, S);
      g.addColorStop(0, "#0a131c"); g.addColorStop(0.6, "#0e1c27"); g.addColorStop(1, "#13242f");
      bx.fillStyle = g; bx.fillRect(0, 0, S, S);
      bx.globalCompositeOperation = "lighter";
      var warm = ["#f0c878", "#e8a850", "#f4e6c4", "#d8884a", "#e0b060"];
      var cool = ["#a8c0e0", "#d0d0e0", "#7ea8c8"];
      var n = rng.int(46, 60);
      for (var i = 0; i < n; i++) {
        var lxp = rng.range(-0.05, 1.05) * S, lyp = rng.range(-0.05, 1.05) * S;
        var depth = rng.range(0, 1);                       // 0 far/small/dim, 1 near/big/bright
        var lr = (0.018 + depth * 0.085) * S;
        var col = rng.bool(0.16) ? rng.pick(cool) : rng.pick(warm);
        if (rng.bool(0.06)) col = rng.pick(["#e8504a", "#54bf72"]);  // a rare traffic-light accent
        var a = 0.22 + depth * 0.5;
        var rg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, lr);
        rg.addColorStop(0, Loom.rgba(col, a));
        rg.addColorStop(0.45, Loom.rgba(col, a * 0.45));
        rg.addColorStop(1, Loom.rgba(col, 0));
        bx.fillStyle = rg; bx.beginPath(); bx.arc(lxp, lyp, lr, 0, TAU); bx.fill();
        if (depth > 0.62) {                                 // a hotter core for the near lights
          var cr = lr * 0.32, cg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, cr);
          cg.addColorStop(0, Loom.rgba(col, Math.min(1, a + 0.35))); cg.addColorStop(1, Loom.rgba(col, 0));
          bx.fillStyle = cg; bx.beginPath(); bx.arc(lxp, lyp, cr, 0, TAU); bx.fill();
        }
      }
      bx.globalCompositeOperation = "source-over";
    })();

    // ---- a droplet: a wet refractive lens (magnified + inverted view of the bokeh, brightened) ----
    function drawDroplet(c, dx, dy, r, squash) {
      squash = squash || 1;                                 // >1 = elongated downward (bigger drops sag)
      var rr = r, ry = r * squash, PI = Math.PI;
      c.save();
      c.beginPath(); c.ellipse(dx, dy, rr, ry, 0, 0, TAU); c.clip();
      // the lens: a WIDE-ANGLE inverted view of the scene behind (the classic droplet-full-of-lights),
      // gathered from a region ~2.4× the drop's size so it catches NEARBY lights, not just dead-dark.
      var k = -0.42;
      Loom.lens(c, bgC, dx, dy, k);                          // primitive #14 (harvested from this + Dew)
      // intensify the gathered lights (a drop concentrates them) — a second additive pass at low alpha +
      // a soft lift, so a drop reads as luminous wet glass, never an opaque bead.
      c.globalCompositeOperation = "lighter";
      c.globalAlpha = 0.5; Loom.lens(c, bgC, dx, dy, k); c.globalAlpha = 1;
      var br = c.createRadialGradient(dx, dy - ry * 0.18, 0, dx, dy, rr * 1.15);
      br.addColorStop(0, "rgba(255,248,232,0.2)"); br.addColorStop(1, "rgba(255,248,232,0)");
      c.fillStyle = br; c.fillRect(dx - rr, dy - ry, 2 * rr, 2 * ry);
      c.restore();                                          // un-clip
      // a soft seat-shadow (it sits ON the glass) — subtle, NOT a hard bead rim
      c.globalCompositeOperation = "source-over";
      c.lineWidth = Math.max(0.5, r * 0.08); c.strokeStyle = "rgba(8,14,20,0.22)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.97, ry * 0.97, 0, 0, TAU); c.stroke();
      // bright bottom meniscus (water hangs; light bends through the underside) — sells "drop"
      c.lineWidth = Math.max(0.6, r * 0.12); c.strokeStyle = "rgba(255,251,242,0.5)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.84, ry * 0.84, 0, 0.35, PI - 0.35); c.stroke();
      // a small soft specular highlight, upper-left
      c.globalCompositeOperation = "lighter";
      var hx = dx - rr * 0.3, hy = dy - ry * 0.34, hr = r * 0.26;
      var hg = c.createRadialGradient(hx, hy, 0, hx, hy, hr);
      hg.addColorStop(0, "rgba(255,255,255,0.55)"); hg.addColorStop(1, "rgba(255,255,255,0)");
      c.fillStyle = hg; c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fill();
      c.globalCompositeOperation = "source-over";
    }

    // ---- the static clinging droplets (scattered, varied; rendered once) ----
    var cling = [];
    var nd = Math.round(140 * (S / 760));
    for (var i = 0; i < nd; i++) {
      var t = rng.next();
      var r = (t < 0.7 ? rng.range(1.6, 4.5) : t < 0.93 ? rng.range(4.5, 9) : rng.range(9, 16)) * U;
      cling.push({ x: rng.range(0.02, 0.98) * S, y: rng.range(0.02, 0.98) * S, r: r, sq: 1 + (r / (16 * U)) * 0.18 });
    }

    // The whole static wet-window (bokeh + mist + clinging drops + vignette) is rendered ONCE into an
    // offscreen, so each animated frame is just: draw that layer + the few sliding drops on top.
    function paintStaticInto(c) {
      c.globalCompositeOperation = "source-over"; c.globalAlpha = 1;
      c.drawImage(bgC, 0, 0, S, S);
      c.fillStyle = "rgba(150,168,182,0.16)"; c.fillRect(0, 0, S, S);     // mist veil
      var mistN = Loom.noise(rng.int(0, 1e9));
      for (var y = 0; y < S; y += 6 * U) {
        for (var x = 0; x < S; x += 6 * U) {
          var m = mistN.fbm(x / S * 3.5, y / S * 3.5, 3);
          c.globalAlpha = Math.max(0, (m - 0.5)) * 0.22; c.fillStyle = "#c4d2da";
          c.fillRect(x, y, 6 * U + 0.5, 6 * U + 0.5);
        }
      }
      c.globalAlpha = 1;
      for (var i = 0; i < cling.length; i++) drawDroplet(c, cling[i].x, cling[i].y, cling[i].r, cling[i].sq);
      var vg = c.createRadialGradient(S / 2, S * 0.45, S * 0.3, S / 2, S / 2, S * 0.8);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(4,9,14,0.55)");
      c.fillStyle = vg; c.fillRect(0, 0, S, S);
    }
    var staticC = document.createElement("canvas"); staticC.width = S; staticC.height = S;
    paintStaticInto(staticC.getContext("2d"));

    // ---- the sliding drops: pure functions of t, so any frame is reproducible & a t-strip is judgeable ----
    var wobN = Loom.noise(rng.int(0, 1e9));
    var sliders = [];
    for (var si = 0, nsl = rng.int(5, 7); si < nsl; si++) {
      sliders.push({ x: rng.range(0.06, 0.94), wob: rng.range(0, 40), period: rng.range(6, 12),
        phase: rng.next(), y0: rng.range(-0.06, 0.5), r0: rng.range(6, 10) * U, r1: rng.range(14, 26) * U,
        amp: rng.range(0.014, 0.05) * S });
    }
    var botY = 1.08 * S;
    function pathX(s, lt) { return s.x * S + (wobN.fbm(s.wob, lt * 5, 3) - 0.5) * 2 * s.amp; }
    function pathY(s, lt) { var y0 = s.y0 * S; return y0 + lt * lt * (botY - y0); }   // accelerates from its spawn

    // a thin, slightly meandering cleared rivulet from the drop's spawn down to its head — reveals the
    // sharp (un-misted) bokeh, then re-fogs toward the old (upper) end so it fades before the cycle wraps.
    function drawTrail(s, lt, hr) {
      var steps = 14, w = Math.max(1.2, hr * 0.34);
      ctx.save(); ctx.beginPath();
      for (var i = 0; i <= steps; i++) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) - w, pathY(s, lq)); }
      for (var i = steps; i >= 0; i--) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) + w, pathY(s, lq)); }
      ctx.closePath(); ctx.clip();
      ctx.drawImage(bgC, 0, 0, S, S);
      var rf = ctx.createLinearGradient(0, pathY(s, 0), 0, pathY(s, lt));
      rf.addColorStop(0, "rgba(150,168,182,0.55)"); rf.addColorStop(0.7, "rgba(150,168,182,0.12)"); rf.addColorStop(1, "rgba(150,168,182,0.05)");
      ctx.fillStyle = rf; ctx.fillRect(0, 0, S, S);
      ctx.restore();
    }

    function frame(t) {
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      ctx.drawImage(staticC, 0, 0, S, S);
      for (var i = 0; i < sliders.length; i++) {
        var s = sliders[i], lt = ((t / s.period) + s.phase) % 1;
        var x = pathX(s, lt), y = pathY(s, lt), r = s.r0 + (s.r1 - s.r0) * lt;
        drawTrail(s, lt, r);
        drawDroplet(ctx, x, y, r, 1.45);                                 // the head: a fat elongated lens
      }
    }
    return frame;   // ANIMATED — draw() did the seeded setup; frame(t) paints each moment.
  }
});

</script>
