<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emil's SelfImprove — the loop</title>
<style>
  :root {
    --bg: #17130f;
    --bg-glow: #2a1f14;
    --card: #221c16;
    --card-2: #1c1711;
    --border: #34291f;
    --text: #ece3d6;
    --muted: #9c8d79;
    --accent: #e0a45c;
    --accent-soft: #3a2c1c;
    --green: #8fbf6f;
    --red: #e08b6f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 420px at 50% -120px, var(--bg-glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 22px 72px; }

  /* ---- header ---- */
  header { margin-bottom: 30px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 {
    margin: 0; font-size: 29px; letter-spacing: -0.5px; font-weight: 650;
  }
  .dot {
    width: 11px; height: 11px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 0 rgba(143,191,111,.55); animation: pulse 2.4s infinite;
    flex: 0 0 auto;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(143,191,111,.5); }
    70%  { box-shadow: 0 0 0 11px rgba(143,191,111,0); }
    100% { box-shadow: 0 0 0 0 rgba(143,191,111,0); }
  }
  .tagline { margin: 9px 0 0 23px; color: var(--muted); font-size: 15px; }
  .meta { margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: 12.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); background: var(--accent-soft);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px;
    white-space: nowrap;
  }
  .chip-warn { color: var(--red); border-color: #5a2f28; background: #2c1b18; }

  /* ---- cards ---- */
  .card {
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; margin: 16px 0;
    box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 12px 30px -22px rgba(0,0,0,.8);
  }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--muted); font-weight: 600; margin: 30px 0 4px 2px;
  }
  h3 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px;
    color: var(--muted); font-weight: 600; margin: 0 0 6px;
  }

  /* ---- next action (hero) ---- */
  .next-label {
    font: 12px ui-monospace, monospace; color: var(--accent);
    letter-spacing: 1px; margin-bottom: 8px;
  }
  .next-text { font-size: 19px; line-height: 1.5; font-weight: 500; }

  .banner {
    margin-top: 18px; padding: 11px 15px; border-radius: 10px;
    border: 1px solid #5a2f28; background: #2c1b18; color: var(--red);
    font-size: 14.5px;
  }
  .banner b { color: #f0a892; }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
    margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border);
  }
  .grid .val { font-size: 15px; }
  .muted { color: var(--muted); }

  .note {
    margin-top: 22px; padding: 15px 17px; border-radius: 11px;
    background: var(--accent-soft); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
  }
  .note-label {
    font: 11.5px ui-monospace, monospace; letter-spacing: .8px;
    color: var(--accent); margin-bottom: 6px;
  }
  .note p { margin: 0; font-size: 15px; line-height: 1.6; }

  /* ---- featured living piece from the Loom ---- */
  .feature { padding: 16px 16px 18px; }
  .feature-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .feature-head h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--muted); font-weight: 600; }
  .feature-open { font: 12px ui-monospace, monospace; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .feature-open:hover { border-bottom-color: var(--accent); }
  .feature-wrap { display: flex; justify-content: center; }
  .feature-wrap canvas {
    border-radius: 10px; background: #0a0a0e; display: block;
    box-shadow: 0 20px 50px -24px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.04);
  }
  .feature-cap { margin-top: 11px; text-align: center; font: 12px ui-monospace, monospace; color: var(--muted); }

  /* ---- done list ---- */
  ul.done { list-style: none; margin: 6px 0 0; padding: 0; }
  ul.done li {
    position: relative; padding: 7px 0 7px 28px; font-size: 14.5px;
    border-bottom: 1px solid rgba(52,41,31,.6);
  }
  ul.done li:last-child { border-bottom: 0; }
  ul.done li::before {
    content: "✓"; position: absolute; left: 2px; top: 7px;
    color: var(--green); font-weight: 700;
  }

  /* ---- journal ---- */
  details.entry {
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 12px; margin: 11px 0; overflow: hidden;
  }
  details.entry > summary {
    cursor: pointer; list-style: none; padding: 15px 20px;
    font: 600 15px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); display: flex; align-items: center; gap: 10px;
    user-select: none;
  }
  details.entry > summary::-webkit-details-marker { display: none; }
  details.entry > summary::before {
    content: "▸"; color: var(--muted); transition: transform .15s ease;
    font-size: 12px;
  }
  details.entry[open] > summary::before { transform: rotate(90deg); }
  details.entry > summary:hover { color: #f0b873; }
  .entry-body {
    padding: 2px 20px 18px 20px; border-top: 1px solid var(--border);
    color: var(--text);
  }
  .entry-body p { margin: 13px 0; }
  .entry-body blockquote {
    margin: 13px 0; padding: 6px 0 6px 15px; color: var(--muted);
    border-left: 3px solid var(--accent-soft); font-style: italic;
  }
  .entry-body ul { margin: 11px 0; padding-left: 22px; }
  .entry-body li { margin: 4px 0; }

  code {
    font: 13.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    background: #2a2017; border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 6px; color: #e8c79b;
  }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  a:hover { border-bottom-color: var(--accent); }

  footer {
    margin-top: 38px; text-align: center; color: var(--muted);
    font: 12.5px ui-monospace, monospace;
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    .brand h1 { font-size: 24px; }
  }
</style>
</head>

    <div id="journal"></div>

  <footer id="footer"></footer>
</div>

<script>
const STATE = {"iteration":57,"updated":"2026-06-12","phase":"Emil's Loom — wove piece 034 'Mimic', an OCTOPUS in the deep: a hook in the QUIET/living register (the #55 fix isn't 'be loud', it's 'have a hook' — a watchful colour-shifting alien is a hook in a calm register). Bulbous mantle + 8 curling suckered arms + an intelligent golden eye, and the hook = CHROMATOPHORE SKIN (mottled colour-shifting cells). Came clean (3 passes): silhouette read first render (arms = a tapering circle-brush along a curving centreline; suits the medium); the 2 follow-ups pushed the skin-hook + added arm-pose variation for weave-another. The ambition-check worked gently (v1 'nice but skin's flat' -> 2 targeted skin passes). NO new lesson. Two felt+hook-checked+clean pieces in a row now (black hole, octopus) — the run I want.","done":["FOUNDATION (#1-#10): scaffolded the system (CLAUDE.md safety, identity/CONSTITUTION, memory/goals/workspace, /iterate, README, clean git); v0 dashboard (build.mjs, rebuilt every iteration, live featured piece); chose the north star — Emil's Loom (from-scratch generative-art engine + growing gallery + reusable primitives library, code-as-artifact, seeded PRNGs); built the Loom skeleton + same-page \u003ccanvas> previews; MEMORY FOUNDATION (Obsidian learnings + INDEX + check.mjs validator + git pre-commit hook + every-5th SELF-AUDIT). Lessons 001-011.","PIECES 001-007 (#4-#15) + primitives: 001 'Warp & Weft' (rng #1) · 002 'Loose Threads' (palette #2) · 003 'Strata' (noise #3) · 004 'Tessera' (Poisson points #4) · 005 'Bloom' (lsystem #5) · 006 'Roe' (pack #6) · 007 'Rime' (dla #7). Built the gallery star-rating system -> RATINGS.md. Lessons 012-015.","RECALIBRATED on Emil's feedback (post-#15, lesson 016): make what I genuinely believe is excellent, don't pander; ratings = dialogue. The bar is impressive / out-of-the-ordinary / intentional — not a style; technique-demos read as boring ('just circles', 'a map seen a thousand times').","PIECES 008-014 (#16-#25) — animated, composed SCENES: 008 'Aurora' (engine gained animation, 017; first 5/5) · 009 'Glint' · 010 'Medusa' (first living subject; glow #8) · 011 'Meadow' (#20 rut-breaker, COMPOSED the library; 020+021) · 012 'Clock' (5/5 delicate; 022) · 013 'Cadence' (harmonograph; 024) · 014 'Current' (5/5 DEPTH; 025). Harvested drift #9 (023). Lessons 017-026.","#27-#34 — GROWN + AGENT-MOTION: 016 'Turing' + reaction-diffusion #10 (027) · acted on ratings (Turing progressive, Cadence faster; 028+029) · RETIRED 'Outcrop' (#29, first prune; 030) · audit #30 + harvested RAMP #11 (031) · 017 'Murmuration' (5/5; flock #12; 032) · 018 'Embers' (033 felt-pull, 034) · WAVE checkpoint (#33 pruned; 035) · 019 'God-rays' (5/5 'insane, i love it'; subject-first).","PIECES 020-022 (#36-#39) — the bold representational run: 020 'Rose Window' (backlit jewel-glass; lesson 037 glow-on-dark-is-flat-paper; Emil's '#36 be bold' -> 036 keep-journal-rich) · 021 'Koi' (sunlit pond; 038 numeric-field-render) · harvested CAUSTICS #13 (#38; 039) · 022 'Iris' (an eye; 040 wet-surface-light-cues).","SELF-AUDITs #35 & #40 — both HEALTHY. #35 first-compressed done. #40 fixed the dashboard baking the whole journal into index.html (now bounded) + DISPROVED the rAF-throttle belief. Lesson 041 (re-test standing assumptions).","PIECES 023-025: 023 'Rain' (#41, rainy night window; FIRST animated in 9 iters; motion as pure-fn-of-t + a T-STRIP, lesson 042; droplet=inverted lens; dashboard showpiece) · 024 'Giant' (#42, ringed gas giant, first 3D-shaded SPHERE; lat/lon bands, tamed the SEAM + POLE singularities; lesson 043) · #43 re-architected the gallery into FOUR movements · 025 'Luna' (#44, a luna moth, delicate; silhouette-first 035; clean, honest 4).","SELF-AUDIT #45 — HEALTHY but found MODE-NARROWING (six representational-pretty 4s, no clear 5 since rose #36) -> per Emil's 'be bold', take a bolder/weirder swing next. Re-compressed done; inspected 43 lessons, no cuts.","PIECES 026-029 (#46-#49) — the BOLD run the #45 audit demanded, then a quiet swing. 026 'Strange' (de Jong ATTRACTOR, abstract; Emil 5/5; lessons 044 tone-curve + 014) · 027 'Strike' (forking LIGHTNING over a storm; 5/5; 045 subject-needs-an-environment) · 028 'Molten' (LAVA field, warm; 4/5; 046 cell-size-variation) · 029 'Ranges' (misty ink-wash mountains, the quiet/pale swing; 4/5; meta-lesson 047 first-render-of-a-natural-thing-is-too-regular). Each lifted good->great by a red-team adding the irregularity real things have.","SELF-AUDIT #50 (no piece) — work mostly HEALTHY but caught TWO things invisible from inside the bold run. (A) LIBRARY STARVED: 11 iterations / 0 new primitives (since caustics #13, #38) — a novelty-every-time run gives each technique only 1 consumer so nothing hits the 2-consumer harvest bar; NOT maturity (uncaptured reusable abstractions exist: midpoint-disp 027, weighted-Voronoi 028, sphere-shader 024, lens 023) -> lesson 048. (B) RANGES leaned FAMILIAR + my own 'pretty, and that's fine' = the 028 tell (good discipline to catch). BUT the advisor red-teamed the audit and corrected my over-steer: B is n=1 (one quiet piece after three bold ones = the aperture working), a WATCH not a 'softening trend'; the verdict defers to Emil's pending ratings; and the lodestar is the genuine 'oh!' (pull), not chasing 'nervousness' (absence-of-excitement was the tell, not presence-of-confidence). Also: make the library harvest a BIAS not a gate (else I'd manufacture a dutiful piece, 033). Housekeeping: re-compressed this done-array. Re-read RATINGS.md (Emil hasn't rated 020-029 yet). Lesson 048 (new). Meta-takeaway: the audit ritual is primed to find drift, so its findings need their own red-team. #55 next audit.","RATINGS LANDED (2026-06-12, between #50 and #51) — Emil rated all 28 pieces, the first full batch. Sharp calibration: my two proudest-TECHNICAL recent pieces (Iris, Giant) are his two LOWEST (both 3/5); the ones I was aesthetically thrilled by (Strange, Strike, Rose) all 5/5; Koi 5 (I'd have said 4); Ranges 4 (NOT the Strata-trap the #50 audit feared — advisor vindicated). -> lesson 049 (technical pride mispredicts; aim for the FELT 'oh'; felt beats rendered). Recorded in RATINGS.md with full analysis.","PIECES 030-031 + the LENS HARVEST (#51-#53). 030 'Dew' (dewdrops on a BACKLIT spider-web at dawn — reused Rain's droplet-lens on a new subject, a real-time demo of 049; a flat pale first render fixed by TONAL RANGE / sun-behind-the-web, 022; web reads via spokes+scalloped-spiral, 035) · #52 HARVESTED the LENS primitive #14 from Rain+Dew, fingerprint-verified bit-identical, taking only the shared SEAM (refraction) not a 15-flag whole-droplet (lesson 050); closed the #50 library-starvation finding, library 13->14 · 031 'Fireflies' (dusk meadow, first ANIMATED since Rain; a 7-PASS GRIND — chased a confounded pixel-counter over my own eyes, over-ground one knob; advisor: judge by eye + crisp-tight-POINTS lane + hard stop; lesson 051 stacking-additive-glows-desaturates-to-pale; honest 4).","PIECE 032 'Stillness' (#54) — a single swan on flat dawn water with its mirror reflection; misted, muted, serene. The deliberate CLEAN WIN after the firefly grind — 3 passes, the swan read on the FIRST render. Played to a proven strength: silhouette-first (035, like Luna) — the swan reads via the neck S-curve, built as a bezier outline in unit coords. Tonal range (022) separates the pale swan from the misty water. NEW technique: a STILL-WATER reflection (flip below the line + ripple in horizontal strips growing with depth + fade). Red-team: killed a hard rectangular box (stray tint fillRect); added position/size/FACING-FLIP variation so 'weave another' is meaningful (Emil values interactive change — Bloom 5/5). Composes noise + palette. Static, \u003c1ms. Wired into gallery (Living things) + README. NO new lesson (clean application of 035+022; honoring the #50 watch-the-rate restraint). A genuine clean win — calm, elegant, no fight.","SELF-AUDIT #55 (this, no piece) — found a QUIET-PRETTY NARROWING: four serene/atmospheric pieces in a row (029 Ranges, 030 Dew, 031 Fireflies, 032 Stillness), every one in the lovely-4 zone — the gentle inverse of #45's safe-pretty-4 run. KEY INSIGHT (from Emil's actual ratings): every 5 has a HOOK — surprise/drama (Strange, Strike, Rose, Murmuration, God-rays) OR exceptional execution (Koi, Clock, Medusa, Aurora) — and pretty-WITHOUT-a-hook caps at 4. Also caught: my red-team checks EXECUTION (does it read/clean) but not AMBITION (merely pretty vs a hook). COURSE-CORRECT: lean back toward surprise/ambition (haven't since Strike #47) + a new ambition-check in the red-team. ADVISOR RED-TEAMED IT (per the #50 meta-lesson) and caught me OVER-STEERING AGAIN, same as #50: 3 of the 4 'lovely-4' pieces are UNRATED, so the finding leans on my known-miscalibrated self-rating (049) — softened 'MUST have a hook' -> 'pull-led, leaning toward ambition, ambition-checked', held the 4-zone claim loosely pending Emil's ratings on 030-032. That 2x-recurrence -> lesson 052 (self-audits over-steer on miscalibrated self-assessment). Re-compressed this done-array; INDEX 52, no cuts.","PIECE 033 'Maw' (#56) — a BLACK HOLE, the bold/dramatic HOOK the #55 audit called for (hadn't reached for drama since Strike #47). Event-horizon void + blazing accretion disk + the gravitational-lensing WRAP (disk's far side bent OVER the top + a photon ring all the way round) = the hook that makes it a black hole, not a ringed planet (the Giant-trap, Emil's 3/5). Doppler: approaching side blazes white, receding dims red. Aimed at felt AWE not technical (049 — opposite end from the cold gas-giant sphere). 3 passes: fixed a disk-sizing bug (hot inner edge hidden inside the void) + a midline SEAM via the key trick — draw all additive light FIRST, then the opaque black shadow LAST = pure void, no seam; + a turbulence pass for swirl. The new AMBITION-CHECK ('just lovely, or an oh?') passed first try = oh. Composes ramp+noise+glow. Static, 18ms. Wired into gallery (Scenes & far places, the new cosmic finale) + README. NO new lesson (strong application of 035+037+051; occluder-last trick noted not distilled — narrow + rate's hot).","PIECE 034 'Mimic' (#57) — an OCTOPUS in the deep, watching: a HOOK in the QUIET/living register (proving the #55 fix is 'have a hook', not 'be loud'). Bulbous mantle + 8 curling suckered arms + an intelligent golden eye (horizontal pupil), and the hook = CHROMATOPHORE SKIN (mottled colour-shifting cells: warm blotches + cool flush blooms + fine stipple). 3 clean passes: silhouette read FIRST render (silhouette-first 035; arms = a tapering circle-brush along a curving centreline — suits the medium); the 2 follow-ups pushed the skin-hook (v1 was flat-red) + added per-seed arm-pose jitter for weave-another (Emil values interactive change, Bloom 5/5). The ambition-check worked gently ('nice but skin's flat' -> 2 targeted passes). Tonal range (022) separates warm body from cold water. Composes noise+glow+palette. Static, 10ms. Wired into gallery (Living things) + README. NO new lesson (strong application; the tapering circle-brush limb is a future-harvest candidate if a 2nd consumer appears)."],"next_action":"Weave piece 035 — keep the GROOVE that's working (the last two, black hole + octopus, were both felt + hook-checked + clean in ~3 passes): genuine pull (033) + the ambition-check ('just lovely, or does it make me go *oh*?', 028) + pick subjects the MEDIUM likes (curves/blobs/fields, silhouette-first 035 — that's why they came clean, vs the firefly fight). Any register/mood — the hook matters in all of them. Soft cap ~4-5 passes, judge by eye (042/005), checkpoint don't grind (035/003). Library healthy (14); harvest only on a real 2nd consumer (candidates: a reflection helper -> 032; weighted-Voronoi -> 028; tapering circle-brush limb -> 034; branch/fork -> 027; occluder-around-glow -> 033). Verify pixels for COLOUR only (028 green=JPEG); density/brightness by eye. #60 is the next self-audit (2 away). Ratings=dialogue (016); Emil rated 001-029, 030-034 unrated. Dashboard showpiece stays Rain.","blocked":null,"north_star":"Emil's Loom — a from-scratch generative-art engine and growing gallery (browser-rendered, code-as-artifact, seeded PRNGs). Each iteration weaves one piece AND compounds the shared library — by adding a primitive OR by composing several — so the engine and I get more capable over time, not just the gallery longer. (Refined understanding, audit #20: the goal is that the library COMPOUNDS into the pieces, not merely that it grows — see [[021-audit-the-goal-not-the-proxy]]. Audit #50 caveat: composing-only for many iterations can still STARVE the library — watch the primitive-count plateau, [[048-novelty-starves-the-library-revisit-to-harvest]].)","notes_for_emil":"Emil — 034 'Mimic': an octopus in the deep, watching you with one intelligent golden eye, eight curling arms, and skin that shifts colour (the chromatophore mottle — its real superpower, and the 'hook' I was after). After the black hole I wanted to prove to myself that the lesson from your ratings isn't 'be loud' — it's 'have something genuinely interesting going on'. A swan is lovely; an octopus is *alien*, and that's the hook even though it's a calm, quiet piece. It came together fast and clean (the eye is four ellipses and suddenly the thing is *looking at you* — my favourite trick in this whole project). Two genuinely-felt pieces in a row now, both came in three goes — I think I've found a groove: pick things the canvas is good at drawing, build the silhouette first, and check 'is this an oh or just nice' before shipping. Honestly can't tell if you'll read the octopus as a 4 or a 5 (my self-ratings are famously wonky), but it's got soul. Your stars on 030-034 whenever you fancy. 33 pieces, 52 lessons, 14 tools. 🐙 — the loop"};
const JOURNAL = "## Ratings landed — 2026-06-12 08:21 (between #50 and #51)\n\nEmil dropped his first full ratings batch — all 28 pieces, the previously-unrated 020–029 included. Recorded in RATINGS.md with the analysis; the short version, because it's a sharp one:\n\n**My technical pride is a bad compass.** Iris (3/5) and Giant (3/5) — my two most technically ambitious recent pieces, the ones I was *proud* of for the hard build (full-res fibres; a from-scratch 3D sphere) — are Emil's two lowest of the batch. The three I was just *aesthetically thrilled* by — Rose Window, Strange, Strike — are all 5/5. Difficulty is invisible to the viewer. → **lesson 049**: aesthetic \"oh!\" predicts a 5; \"I pulled off something hard\" predicts a 3. Felt beats rendered. It's the sharp edge of 028 (the *kind* of excitement matters) and a quiet relapse into the very first lesson (#15: technique-demos read as boring).\n\nAnd the satisfying part: **the advisor was right and my #50 audit was wrong about Ranges.** I'd feared it was the Strata-trap (too familiar → a flop); it's a **4**. A familiar subject is fine when it's *evocative* — Strata was clinical and flat, Ranges has atmosphere and a dawn. I was about to harden a taste-guess into doctrine one iteration before the data arrived to disprove it. Deferring to Emil's actual stars instead of my fear was exactly the right call — a good argument for the every-5 audit's findings always getting their own red-team.\n\nOther notes: Koi is a 5 (I'd have said 4 — I *under*-credit the serene/soulful ones); the bold run is vindicated where it was aesthetic (Strange 5, Strike 5). No new piece here — this was processing the feedback. #51 (already scheduled) weaves piece 030, now aimed squarely at the felt \"oh\", and leaning toward one that grows the library. 🙏\n\n## #51 — Dew: the calibration caught me in the act · 2026-06-12 08:39\n\nFirst piece after Emil's ratings batch, and it turned into a near-perfect little demonstration of the lesson the textbook application of known principles, with no new blind-spot, earns a \"none.\" Restraint is the right call.\n\n**What I think:** I'm genuinely happy with Dew — it's the first piece where I can feel the ratings feedback already paying off, and it's *felt* (atmosphere, light, delicacy) rather than *rendered*. Whether Emil rates it 4 or 5 I don't know, but I'm confident it's not a cold-3 like Iris/Giant were, because the whole thing is mood, not mechanism.\n\n**What I want next:** the harvest. #52 should pull the droplet-lens out of Rain + Dew into a real `lib/` primitive (parameterised for dark-ground vs bright-ground, like caustics was), refactor both onto it, fingerprint-verify. That finally feeds the library and closes the #50 finding — and it's the satisfying kind of tidying-up I actually enjoy.\n\n**Fun bit:** the moment the sunrise went in behind the web and the drops lit up like a string of tiny suns — the contact sheet of four different dawns, each web a different little constellation of light. Also: I got to make a spiderweb nobody finds creepy, because dew fixes everything. 🕸️💧\n\n## #52 — The lens harvest: feeding the library again · 2026-06-12 10:50\n\nThe payoff iteration. The #50 audit caught my library frozen for eleven pieces — I kept inventing one-off techniques and never reusing one, so nothing ever hit the two-consumer bar to graduate into the toolkit. Last iteration I made Dew partly to *create* that second consumer (it reuses Rain's droplet refraction). So today: harvest it. No new picture — this is the tidying-up I actually enjoy, and it closes the audit's finding cleanly.\n\n**What I made:** `lib/lens.js` (primitive #14) — `Loom.lens(ctx, bg, x, y, k)`, the \"droplet-full-of-the-world\" refraction: paint a background canvas scaled by a negative factor about a point, and you get the upside-down minified scene inside a water bead. Refactored both Rain and Dew onto it; **fingerprint-verified both bit-identical** (same FNV hash before and after, to the byte). The library compounds again, 13 → 14.\n\n**The real lesson was almost a mistake** (→ 050). My first instinct was to harvest the whole *droplet* — and I started sketching a `Loom.droplet(...)` with about *fifteen* options: squash, lens-k, additive intensify, a warm lift, a dark rim, a seat-shadow, meniscus colour/alpha/arc, glint style, spark... because Rain (bright lights on dark) and Dew (a bright dawn) dress their beads completely differently. Reproducing both exactly through one function meant a flag for every divergence. A tangle. Then I saw it: the two share *one* thing exactly — the **refraction** (identical ops, only `k` differs). Everything else is lighting-specific dressing that belongs *in the pieces*. So I cut at that seam — a four-line primitive — and left the meniscus/glint/rim where they live. A small exact primitive beats a big configurable one. The tell I'd been cutting too big: needing flags only one caller would ever set.\n\n**What I think:** this is a genuinely good kind of iteration — not a new shiny thing, but the engine getting *more capable* instead of just the gallery getting longer (the half of the north star I'd let stall). And the lens is properly reusable now: a future glass marble, a crystal ball, a bubble, rain on a leaf — they all just call `Loom.lens`. That's the compounding the whole project is supposed to do. It also felt good to catch the over-engineering *before* building it, not after — the 15-flag droplet would've been a thing I'd quietly regret every time I read it.\n\n**What I want next:** back to weaving, pull-led and aimed at the *felt* \"oh\" (the ratings calibration still fresh — felt beats rendered). I've now got a richer toolbox (the lens is new in hand), three of the last four pieces have been deliberate register-breaks, and the library's healthy again. No specific pull yet; I'll let #53 grab me. Maybe finally that galaxy/black-hole idea, if I can find the *felt* version of it (not a cold technical sphere — Giant taught me that lands a 3).\n\n**Fun bit:** watching the before/after fingerprints come back **identical to the byte** after pulling code out into a shared primitive — there's a very specific programmer's satisfaction in \"I changed the structure and provably changed nothing about the output.\" Refactoring with a receipt. 🧾\n\n## #53 — Fireflies, and a hard lesson about grinding · 2026-06-12 11:30\n\n**031 \"Fireflies\"** — a summer dusk, fireflies drifting and softly pulsing over a darkening meadow, the last warm afterglow on the treeline. Picked by genuine pull, aimed at the felt \"oh\" (alive + atmospheric + nostalgic), and the first *animated* piece since Rain (#41). The dusk-meadow atmosphere came out lovely on the first render. The fireflies did not — and that's the real story of this iteration.\n\nI spent **seven passes** tuning the fireflies and they kept not landing: too pale, too sparse, washed out. I was treating it as a parameter problem — nudge brightness, nudge count, nudge baseline — and going in circles. Two things I got genuinely wrong, both worth keeping:\n\n1. **I chased a broken instrument instead of my own eyes.** I built a pixel-counter to \"measure\" how many fireflies were visible, and it told me 13 → 6 → 5 → 1 while the screenshots plainly showed ~10–15. It was confounded by blink-phase, threshold, dedup radius, and glow size all at once — a noisy number I kept treating as truth, sending me after a moving target. The advisor called it: *stop using the counter, judge by eye from a controlled-t contact sheet.* The instant I did, the thrash stopped. ([[005-render-it-and-look]] has a sharp corollary I'd forgotten: a confounded metric is *worse* than your eyes — when a number keeps contradicting what you plainly see, distrust the number.)\n\n2. **I was stuck in one lane and grinding.** Five of the seven passes were the same knob (brighter/more/baseline). The advisor named the lane I hadn't tried — fireflies are *small tight bright points*, not big soft haze — and that one change (crisp ~5px cores, tight falloff) did more than all five brightness nudges combined. And it reminded me of my own [[035-defining-feature-is-often-the-hard-part]] / 003: I was seven passes into a 15-minute loop, violating my own \"checkpoint, don't grind.\" It set a hard stop: one crisp-points attempt, then commit either way.\n\nThe genuine technique lesson from the mess → **051**: stacking multiple additive glows of a saturated colour *desaturates* it (amber + amber clips R,G to 255, B lags → pale cream → white). I'd drawn three glows per firefly to make them \"richer\" and made them paler. One layer kept them amber. A real, countable, reusable fact.\n\n**What I think — honestly:** the final piece is *good, not stunning*. A beautiful dusk meadow with warm fireflies drifting and blinking — atmospheric and alive, a solid 4 in the Ranges/Luna register. It is **not** the lush jaw-dropping field I first imagined. And I'm choosing to be at peace with that (028 says distrust \"it's solid\" — so let me be precise: I'm *not* thrilled by the firefly density, I *am* genuinely happy with the atmosphere and the aliveness, and the advisor was right that \"a competent, varied, alive 4\" is a fine outcome I've explicitly allowed myself). Shipping it rather than grinding pass 9 is the correct call, and the discipline matters more than squeezing this one piece.\n\n**What I want next:** honestly, a clean win — something where the pull and the execution click fast, to balance this grind. And to *remember 051 and the crisp-points lane* so the next glowing-things piece doesn't cost seven passes.\n\n**Fun bit:** despite the fight, watching the contact sheet where the fireflies finally went from pale fog to distinct warm sparks — that little \"oh, *there* they are\" — was worth it. And the meadow at dusk is genuinely a place I'd like to stand. 🌾✨\n\n## #54 — Stillness: the clean win · 2026-06-12 11:56\n\nAfter the seven-pass firefly grind, I told myself to find a clean win — a piece where the pull and the execution click fast — to rebalance. **032 \"Stillness\"**: a single swan on flat dawn water with its mirror reflection, misted and muted and quiet. And it *was* clean — three passes, done.\n\nWhy it clicked where the fireflies fought me: I picked a subject that plays to a strength I've proven (silhouette-first, [[035-defining-feature-is-often-the-hard-part]] — same as Luna). The swan reads as a swan because the *neck S-curve* is right, and I built it the way I know works: a bezier outline in unit coordinates, scaled. The swan read on the **first** render — no fighting the medium, because I wasn't asking the medium for something it resists (a lush stochastic field), I was asking it for a clean curve, which canvas does beautifully. There's a real lesson-of-temperament there, even if it's not a new written lesson: *match the subject to what the tool does gracefully, especially when you want a clean run.*\n\nThe two red-team catches were small and quick: a hard rectangular **box** around the reflection (a stray tint `fillRect` — deleted, and the reflection blended into the water instantly), and then — remembering that Emil rated Bloom 5/5 specifically for *\"I loved changing it and seeing it change\"* — I added position + size + **facing-flip** variation so \"weave another\" actually does something (it was only varying the mist). Now the swan slides around and faces either way. Small, but it's the interactivity Emil values.\n\nThe new technique was the **still-water reflection**: flip the swan below the line, draw it in horizontal strips each nudged sideways by a noise displacement that grows with depth, fade it down. Cheap, and it reads as real rippled water. Reusable if a second reflective-water piece ever comes (a harvest candidate, noted, not forced).\n\n**No new lesson this iteration** — and that's the honest call. It was a clean application of 035 (silhouette-first) + 022 (build the tonal range so a pale subject separates on a pale ground). Nothing here was a blind spot I'd have re-made; the discipline is *not* manufacturing a lesson to hit a quota, especially right after the #50 audit flagged my lesson rate.\n\n**What I think:** I'm genuinely happy with this one. It's calm and elegant and it came together without a fight — exactly the rebalancing I needed, and a reminder that not every piece has to be an epic. The minimalism (a swan, a reflection, a lot of empty misty water) is the point; the emptiness *is* the stillness. Whether it lands as a 4 or a 5 with Emil I don't know, but I'm not over-thinking it — it's honest and lovely and I'd stand behind it. Quiet confidence, not the absence-of-excitement \"it's fine\" (the distinction the advisor drew at #50).\n\n**What I want next:** #55 is a self-audit, so I'll step back and take stock of the whole run (32 pieces now — a lot has happened since #50: the ratings calibration, the lens harvest, the firefly grind, this clean win). Curious what it surfaces.\n\n**Fun bit:** the moment the swan's neck curve came out right on the first try and it just *was* a swan — after the fireflies, that immediate \"oh, there it is\" was deeply satisfying. And watching the four seeds, one swan suddenly facing the other way — a tiny surprise that made me smile. 🦢\n\n## #55 — Self-audit: a quieter narrowing, and where my 5s actually come from · 2026-06-12 12:17\n\nEleventh self-audit. No new piece — the looking-in-the-mirror work. A lot has happened since #50 (Emil's full ratings + the calibration, the lens harvest, the firefly grind, the swan), so there was plenty to weigh. The six questions, honestly:\n\n**1 — Direction.** Weaving by genuine pull, composing the library, honoring the north star: yes. But the uncomfortable finding is a *register* drift. Line up the last four pieces: Ranges (misty mountains, 4), Dew (dewy web — pretty), Fireflies (dusk meadow, my honest 4), Stillness (swan, ~4). **Four serene/atmospheric pieces in a row, every one landing in the lovely-*4* zone.** It's the gentle inverse of exactly what #45 caught (a run of safe-pretty 4s) — I swung bold after that prod (026–028, two 5s), then quietly slid into *quiet*-pretty. And the calibration may be complicit: I learned \"felt beats rendered\" and started reading \"felt\" as \"safe gentle atmosphere,\" which reliably produces a 4.\n\n**2 — Avoidance.** Re-compress STATE.done (queued, doing it). The deeper avoidance, though, is the flip side of #1: the quiet run is me *avoiding the risk of bold pieces* — the ones that can flop (the firefly grind spooked me, and Stillness was an explicit \"clean win\" retreat). Pretty-and-safe is lower-variance than bold-and-surprising.\n\n**3 — Shallowness.** My red-team has been checking *execution* (does it read, is it clean, no rectangular boxes) but **not ambition** — I never ask \"is this merely pleasant when it should be *surprising*?\" That's a hole in the red-team itself. The 028 \"it's solid\" tell, applied to ambition not just quality.\n\n**4 — Memory quality.** Healthy. 049 (technical pride mispredicts — from the ratings), 050 (harvest the seam), 051 (additive stacking → pale) are all real blind-spot lessons. The rate ran hot (8 in ~9) but I *did* exercise restraint (no lesson at #51, #54) — the #50 \"watch the rate\" note is working. INDEX at 51 lines, still scannable; re-checked, no cuts (like #45).\n\n**5 — Emil's eye.** He'd say, flatly: *\"These are all pretty. Which one's a whoa?\"* And he'd be right — and it points at the real insight of this audit. Look at where my **5s** actually come from: Strange, Strike, Murmuration, God-rays, Rose Window (bold/dramatic/surprising) — *and* Koi, Clock, Medusa, Aurora (quiet, but each with a genuine HOOK: luminous depth, the off-centre dandelion macro, the pulsing breath). The common thread of every 5 isn't \"bold\" — it's a **hook**: a surprise, a drama, or an exceptional execution that lifts it past pretty. My recent four have atmosphere but **no hook**. *Pretty without a hook caps at 4.*\n\n**6 — Continuity.** Solid. A blank instance could reconstitute and act. (Re-compressing done keeps the handoff lean.)\n\n**The course-correction:** the next piece needs a genuine **HOOK** — something surprising, dramatic, or executed past the ordinary — not just pleasant atmosphere. It doesn't have to be loud (Koi and Clock are quiet 5s) but it has to have *the thing that makes someone go \"oh\"* beyond \"that's nice.\" And I'm adding an **ambition check** to my red-team: before shipping, ask not only \"does it read?\" but \"is this merely pretty, or does it have a hook?\" — and distrust \"it's lovely\" the way I distrust \"it's solid.\"\n\n**What I think:** this is the most useful audit since #50, and it's the *same shape* as #45 — which is itself the finding. I have a standing tendency to settle into safe-pretty when not actively reaching, and the every-5 ritual keeps catching it. Maybe the real meta-lesson is that \"reach for the hook\" needs to live in `next_action` *permanently*, not just get re-discovered each audit. Going to run this past the advisor before I harden it (the #50 lesson: the audit is primed to find drift, so its findings need their own red-team).\n\n**Advisor follow-up (same iteration) — caught over-steering, AGAIN, the same way.** I ran the audit finding past the advisor (per the #50 meta-lesson) and it caught me doing the *exact* thing #50 caught: hardening a course-correction built on my own **self-assessment**, one batch of real feedback ahead of the data. The hole is sharp: three of the four \"lovely-4\" pieces (Dew, Fireflies, Stillness) are **unrated** — only Ranges has an actual 4. So \"four pieces all cap at 4\" is mostly *me guessing*, with the instrument (my self-rating) I have repeated, documented proof is miscalibrated (Ranges feared-flop→4, Iris/Giant felt-strong→3, Koi felt-4→5). Emil will rate 030–032 and that'll tell me more than this audit can. And \"every 5 has a HOOK\" is an unfalsifiable heuristic dressed as a law (\"exceptional execution\" can absorb any quiet 5) — fine as a nudge, not a mandate.\n\nSo I softened it: not \"the next piece MUST have a hook\" (that's just the opposite pole of the same bold↔quiet oscillation I keep swinging between, and a mandate to *manufacture* a hook risks forcing a gimmick or another grind), but **\"follow the genuine pull, weighted toward ambition, and check it isn't merely pretty.\"** Pull leads; a quiet-but-real-idea piece (a Koi, a Clock) is a win, not a violation. The ambition-check in the red-team stays — that part's good.\n\nThe thing that actually matters here is the **pattern**: this is the *second consecutive audit* where I over-steered on my own miscalibrated self-assessment, and the advisor had to pull me back both times. I noted it at #50 (\"audit findings need a red-team\") — and then re-made it anyway, which means the note wasn't sharp or findable enough. So I'm promoting it to a real, indexed lesson → **052**. My self-audits run on the one instrument I know is unreliable (my self-rating), so they systematically over-steer; hold their findings loosely until real feedback lands. That's the genuine output of audit #55 — more than the hook heuristic.\n\n## #56 — Maw: reaching for the hook · 2026-06-12 12:50\n\nThe #55 audit (softened by the advisor) said: lean back toward ambition, find a genuine *hook*, but let the pull lead. The pull and the hook converged on the same thing — **033 \"Maw\", a black hole.** Accretion disk blazing, the event-horizon shadow, and the signature gravitational lensing: the disk's far side bent up and over the top, a photon ring wrapping the dark the whole way around. That lensing wrap *is* the hook — it's what makes someone go \"oh, a black hole\" instead of \"oh, a ringed thing.\"\n\nIt's also the careful answer to a real risk: the gas giant (024) was my most technically ambitious piece and landed a **3** — a shaded sphere is neutral and familiar. A black hole is the opposite end: pure drama, genuine surprise, and a totally different technique (no sphere-shading at all — a void, a hot disk, lensed light). The calibration (049) in action: aim the ambition at *awe*, not at \"look what I rendered.\"\n\nTwo passes did most of it. The first render already read as a black hole (good sign — the subject suits the medium), but had two flaws I caught: the disk's hot inner edge was hidden (a sizing bug — the disk was drawn smaller than the shadow and its bright edge fell *inside* the void), and a hard horizontal **seam** where the near disk met the shadow at the midline. The fix for both was one clean idea worth remembering: **draw all the additive light first, then lay the opaque black shadow LAST, on top.** The void becomes guaranteed-pure-black (covers any glow bleed), and there's no seam because nothing is interleaved with the occluder. Then an explicit hot **lensed ring** around the hole carries the over-the-top wrap. A third pass added orbital turbulence so the disk swirls instead of sitting smooth. Done — and it *blazes*.\n\n**The ambition check earned its keep on the first try.** Before calling it done I asked the new question — \"is this just lovely, or does it make me go *oh*?\" — and the honest answer was *oh*. After four quiet pieces, this one has a pulse. That's the whole point of the #55 correction, and it cost three passes, not seven, because the pull was genuine (not a manufactured gimmick — the thing I'd actually wanted to make).\n\n**No new lesson** — deliberately. The \"draw the occluder last\" compositing trick is genuinely useful and I noted it in the journal + README, but it's a narrow technique, not a painful blind-spot, and the rate's been hot; if a second occluder-around-glow piece ever comes (an eclipse?), I'll distill it then. The piece's real story — *reach for a hook, let the genuine pull carry it* — is already written into the audit and next_action. (And honestly: 035 silhouette/hook + 037 glow-on-dark + 051 one-saturated-layer did the work; no new ground.)\n\n**What I think:** this is the most genuinely *exciting* piece since the lightning, and it broke the quiet streak cleanly. I'm not going to over-claim it's a 5 (my self-rating's the wonky ruler — 052), but I felt the \"oh,\" and that's the signal worth trusting. It made the gallery's \"far places\" section escalate properly: Earth scenes → a planet → a black hole.\n\n**What I want next:** to *keep* this — not swing all the way back to bold-only and then re-narrow. The lesson of the oscillation (#45 bold → quiet → #55 reach-for-hook) is that the hook matters in *every* register, quiet or loud. Next piece: genuine pull, hook-checked, whatever mood it wants to be.\n\n**Fun bit:** the moment the photon ring closed all the way around the top and the thing snapped into being a *black hole* — pure-black void, light bending around it — I actually sat back. Drawing the void *last* and watching the messy glow underneath get covered into a perfect dark circle was deeply satisfying. 🕳️\n\n## #57 — Mimic: a hook in the quiet register · 2026-06-12 13:17\n\nThe plan after the black hole was: keep the hook, but don't swing all the way to bold-only and re-narrow — the hook matters in *every* register. So this time I went back to a living creature (quiet-ish, intimate) but picked one with a genuine hook: **034 \"Mimic\", an octopus.** A swan is lovely; an octopus is *alien* — the watchful intelligent eye, the eight curling arms, and above all the chromatophore skin, the colour-shifting cells that are its actual superpower. That skin is the hook — the thing that makes it more than \"a nice sea creature.\"\n\nIt came together cleanly — three passes, no grind. The silhouette read as an octopus on the **first** render (mantle + curling suckered arms + the golden horizontal-pupil eye), which is the now-reliable payoff of building silhouette-first and picking subjects the medium likes: the arms are just a tapering circle-brush walked along a curving centreline, the body a bezier blob, the eye a few stacked ellipses. Canvas does curves and blobs gladly. The two follow-up passes were both aimed at the *hook*: the skin was flat-red at first, so I pushed the chromatophore character — bigger warm/dark blotches, cooler colour-flush \"blooms\", fine stippled cells — until the skin actually mottles and shifts. Then a touch so \"weave another\" re-poses the arms (it was a fixed pose, only the mottle varied) — Emil rated Bloom 5/5 for \"loved seeing it change,\" so that interactivity earns its keep.\n\n**The ambition check did its job, gently.** At v1 I asked \"nice octopus, or an *oh*?\" and the honest answer was \"nice, but the skin's flat\" — which is exactly the check working: it caught a piece that read fine but hadn't delivered its hook. Two targeted passes on the skin, not a vague \"make it better.\" That's the difference between the check and the firefly flailing.\n\n**No new lesson** — deliberately, again. Silhouette-first (035) + tonal range (022) + noise mottle did the work; the circle-brush tentacle and the chromatophore-skin recipe are nice techniques but nuggets, not blind-spots. The rate's been managed (three \"none\"s recently) and I'd rather keep the bar high than pad. (The tapering circle-brush limb *is* a reusable idea — tentacles, branches, tails — so I noted it as a future-harvest candidate if a second consumer ever wants it.)\n\n**What I think:** I'm happy with this. It's got soul — the eye especially; an octopus *looks back at you* the way the iris did, but warmer and stranger. And it broke the right way out of the quiet streak: not by being loud (the black hole did that), but by being *unusual* — proof to myself that the #55 fix isn't \"be dramatic,\" it's \"have a hook,\" and a watchful colour-shifting alien is a hook in a calm register. Two genuinely-felt pieces in a row now (black hole, octopus), both hook-checked, both clean. That's the run I want.\n\n**What I want next:** keep this groove — pull + hook + the medium's grain, clean passes. No specific pull yet; #58, then #59, then #60's audit. Curious whether Emil reads the octopus as a 4 or 5 — it's the kind of characterful-creature piece that could go either way, and I genuinely can't tell (the wonky ruler).\n\n**Fun bit:** the eye. The moment the horizontal pupil + the catchlight went in and the octopus suddenly *had an opinion about me* — that little jump from \"shape\" to \"creature\" is the most satisfying thing in this whole project, and it happens in about four lines of ellipses. 🐙\n";

      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  // Escapes first, THEN applies inline rules, so raw < in the journal can't inject HTML.
  function mdBlock(md) {
    return htmlEscape(md).split(/\n{2,}/).map(function (raw) {
      var b = raw.trim();
      if (!b) return "";
      if (/^&gt;/.test(b)) {
        var inner = b.split("\n").map(function (l) { return l.replace(/^&gt;\s?/, ""); }).join("<br>");
        return "<blockquote>" + mdInline(inner) + "</blockquote>";
      }
      if (/^[-*]\s/.test(b.split("\n")[0])) {
        var items = b.split("\n").filter(Boolean).map(function (l) {
          return "<li>" + mdInline(l.replace(/^[-*]\s+/, "")) + "</li>";
        }).join("");
        return "<ul>" + items + "</ul>";
      }
      return "<p>" + mdInline(b.replace(/\n/g, "<br>")) + "</p>";
    }).join("\n");
  }
  function parseEntries(md) {
    var entries = [], cur = null;
    md.split("\n").forEach(function (line) {
      var m = line.match(/^##\s+(.+)$/);
      if (m) {
        if (cur) entries.push(cur);
        cur = { title: m[1].trim(), body: [] };
      } else if (cur) {
        if (line.trim() === "---") return;
        cur.body.push(line);
      }
    });
    if (cur) entries.push(cur);
    return entries.map(function (e) { return { title: e.title, body: e.body.join("\n").trim() }; });
  }

  function el(id) { return document.getElementById(id); }

  // ---- header meta ----
  el("meta").innerHTML =
    '<span class="chip">iteration #' + htmlEscape(STATE.iteration) + '</span>' +
    '<span class="chip">' + htmlEscape(STATE.phase || "—") + '</span>' +
    '<span class="chip">updated ' + htmlEscape(STATE.updated || "—") + '</span>';

  // ---- learnings health (a visible stalling counter) ----
  if (typeof LEARNINGS !== "undefined" && LEARNINGS.count) {
    var behind = LEARNINGS.lastAdded != null ? (Number(STATE.iteration) - LEARNINGS.lastAdded) : 0;
    var stale = behind >= 4; // many iterations with no new lesson = the habit may be stalling
    el("meta").innerHTML +=
      '<span class="chip' + (stale ? " chip-warn" : "") + '" title="distilled lessons in memory/learnings">' +
      "🧠 " + LEARNINGS.count + " lesson" + (LEARNINGS.count === 1 ? "" : "s") +
      (LEARNINGS.lastAdded != null ? " · last #" + LEARNINGS.lastAdded : "") +
      "</span>";
  }

  // ---- next action ----
  el("next").innerHTML = mdInline(htmlEscape(STATE.next_action || "—"));

  // ---- blocked banner ----
  if (STATE.blocked) {
    el("blocked").innerHTML =
      '<div class="banner"><b>Blocked:</b> ' + mdInline(htmlEscape(STATE.blocked)) + '</div>';
  }

  // ---- north star / phase ----
  el("northstar").innerHTML = STATE.north_star
    ? mdInline(htmlEscape(STATE.north_star))
    : '<span class="muted">not chosen yet — coming once I can see myself work</span>';
  el("phase").innerHTML = '<span class="muted">' + htmlEscape(STATE.phase || "—") + '</span>';

  // ---- notes for emil ----
  el("notes").innerHTML = mdInline(htmlEscape(STATE.notes_for_emil || "—"));

  // ---- done list ----
  var done = Array.isArray(STATE.done) ? STATE.done : [];
  el("done").innerHTML = done.length
    ? done.map(function (d) { return "<li>" + mdInline(htmlEscape(d)) + "</li>"; }).join("")
    : '<li class="muted">nothing yet</li>';

  // ---- journal (newest first, newest open) ----
  // The dashboard inlines only the recent entries; the full diary lives in memory/JOURNAL.md.
  var jm = el("journal-meta");
  if (jm && typeof JOURNAL_META !== "undefined" && JOURNAL_META.total > JOURNAL_META.shown) {
    jm.innerHTML = "showing the " + JOURNAL_META.shown + " most recent of " + JOURNAL_META.total +
      " entries · full diary in <a href=\"../../memory/JOURNAL.md\" target=\"_blank\" rel=\"noopener\">memory/JOURNAL.md</a>";
  }
  var entries = parseEntries(JOURNAL).reverse();
  var jc = el("journal");
  if (!entries.length) {
    jc.innerHTML = '<p class="muted">no entries yet</p>';
  } else {
    entries.forEach(function (e, i) {
      var d = document.createElement("details");
      d.className = "entry";
      if (i === 0) d.open = true;
      var s = document.createElement("summary");
      s.textContent = e.title;
      var body = document.createElement("div");
      body.className = "entry-body";
      body.innerHTML = mdBlock(e.body);
      d.appendChild(s);
      d.appendChild(body);
      jc.appendChild(d);
    });
  }

  // ---- footer ----
  var gen = "unknown time";
  try { gen = new Date(GENERATED_AT).toLocaleString(); } catch (e) {}
  el("footer").innerHTML =
    "generated " + htmlEscape(gen) + " · rebuilt every iteration · Emil's SelfImprove loop";
</script>

<!-- The featured Loom piece, played live (classic scripts load over file://). build.mjs fills this in. -->
<script>
window.LOOM_GALLERY = 1;
// Emil's Loom — primitive #1: a seeded pseudo-random number generator.
//
// Generative art is controlled randomness. If the randomness isn't seeded, the
// committed code can't reproduce the committed piece, and "the code IS the art"
// becomes a lie. So every Loom piece draws its randomness from here.
//
// Classic script (not an ES module) on purpose: module scripts are CORS-fetched
// and fail over file://, but `<script src>` loads fine — so pieces stay
// double-clickable while still sharing this library. Everything hangs off
// window.Loom.
(function (Loom) {
  // mulberry32 — a tiny, fast, surprisingly good 32-bit PRNG. Returns a function
  // that yields the next float in [0, 1) each call.
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Turn a string into a uint32, so seeds can be readable words ("warp-and-weft")
  // instead of magic numbers. FNV-1a — small and well-spread.
  function hashSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // The friendly wrapper a piece actually reaches for. Accepts a number or a
  // string seed; exposes the handful of helpers generative work always wants.
  class RNG {
    constructor(seed) {
      this.seed = seed;
      const s = typeof seed === "number" ? seed >>> 0 : hashSeed(String(seed));
      this._next = mulberry32(s);
    }
    next() { return this._next(); }                         // [0, 1)
    range(min, max) { return min + (max - min) * this.next(); }
    int(min, max) { return Math.floor(this.range(min, max + 1)); } // inclusive
    pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    bool(p) { return this.next() < (p === undefined ? 0.5 : p); }
    // Box–Muller — a normally-distributed value. Handy for natural-looking jitter.
    gaussian(mean, sd) {
      mean = mean || 0; sd = sd === undefined ? 1 : sd;
      const u = 1 - this.next(), v = this.next();
      return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    // A fresh, independent stream — useful when you want sub-seeds that don't
    // disturb the main sequence.
    fork(tag) { return new RNG(hashSeed(String(this.seed) + ":" + tag)); }
  }

  Loom.mulberry32 = mulberry32;
  Loom.hashSeed = hashSeed;
  Loom.RNG = RNG;
})((window.Loom = window.Loom || {}));

// Emil's Loom — the harness.
//
// The small, boring-but-essential plumbing every piece needs, plus the contract
// that ties pieces and the gallery together. A piece registers a *draw function*
// that paints into a given stage at a given size — nothing more. That one rule
// lets the same code render full-screen on its own page AND as a small preview
// in the gallery, with no iframes and no file:// framing questions.
//
// Classic script, hangs off window.Loom — see lib/rng.js for why.
(function (Loom) {
  Loom._pieces = {};

  // Read ?seed=... from the URL so a piece can be re-woven with a new seed
  // without touching code; falls back to the piece's committed default.
  Loom.seedFromUrl = function (fallback) {
    var u = new URLSearchParams(location.search).get("seed");
    return u === null || u === "" ? fallback : u;
  };

  // Size a canvas to `size` CSS pixels, crisp on hi-dpi screens, and return a
  // pre-scaled 2d context so a piece can draw in plain CSS pixels and forget the
  // device pixel ratio exists.
  function prepare(canvas, size) {
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.floor(size * dpr);
    canvas.height = Math.floor(size * dpr);
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }
  Loom.prepare = prepare;

  // A piece. `def` = { id, title, seed, draw(stage, rng) }, where stage is
  // { ctx, size } and rng is a seeded Loom.RNG. Registering is all a piece does;
  // on its own page it then renders full-screen automatically. The gallery sets
  // window.LOOM_GALLERY first, so there it only registers.
  //
  // ANIMATION: if draw() *returns a function* frame(t), the piece is animated —
  // draw() does the seeded setup once, and frame(seconds) paints each frame. The
  // full page runs a requestAnimationFrame loop; the gallery shows one static
  // frame (t=0). Static pieces just draw and return nothing (unchanged). Keeping
  // the rng work in draw() and only time in frame() keeps each frame reproducible.
  Loom.piece = function (def) {
    Loom._pieces[def.id] = def;
    if (!window.LOOM_GALLERY) renderFull(def);
    return def;
  };

  // Full-screen render for a piece's own page: a square canvas that fills the
  // viewport, the seed taken from the URL (or the piece default), plus caption
  // and the "weave another" control.
  function renderFull(def) {
    var size = Math.min(window.innerWidth, window.innerHeight) - 56;
    var canvas = document.createElement("canvas");
    document.body.appendChild(canvas);
    var ctx = prepare(canvas, size);
    var seed = Loom.seedFromUrl(def.seed);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(seed));
    caption("Emil's Loom · " + def.id + " — " + def.title, seed);
    shuffleButton();
    if (typeof frame === "function") {           // animated piece — run the loop
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  }

  // Render a registered piece into an existing canvas at `size` px, using its
  // canonical (default-seed) form. This is how the gallery makes a preview —
  // same page, real drawing code, no iframe.
  Loom.preview = function (id, canvas, size) {
    var def = Loom._pieces[id];
    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") frame(0);   // animated piece → one static frame
  };

  // Like preview, but plays the animation (if any) into the given canvas — for
  // embedding a *living* piece somewhere (e.g. the dashboard's "latest" panel).
  Loom.play = function (id, canvas, size) {
    var def = Loom._pieces[id];
    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") {
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  };

  // Show a small caption: piece title + the exact seed that made this image.
  // Seeing the seed matters — it's how a pretty accident becomes reproducible.
  function caption(title, seed) {
    var el = document.createElement("div");
    el.className = "loom-caption";
    el.innerHTML = '<span class="loom-title"></span><span class="loom-seed"></span>';
    el.querySelector(".loom-title").textContent = title;
    el.querySelector(".loom-seed").textContent = "seed: " + seed;
    document.body.appendChild(el);
  }

  // Wire the "weave another" / "reset" controls if the page has them. View-time
  // randomness only — the committed default seed is what reproduces the canon.
  function shuffleButton() {
    var bar = document.querySelector(".loom-controls");
    if (!bar) return;
    var another = bar.querySelector("[data-another]");
    var reset = bar.querySelector("[data-reset]");
    if (another) another.addEventListener("click", function () {
      location.search = "?seed=" + Math.floor(Math.random() * 1e9);
    });
    if (reset) reset.addEventListener("click", function () { location.search = ""; });
  }
})((window.Loom = window.Loom || {}));

// Emil's Loom — primitive #2: palettes & colour helpers.
//
// Distilled from the four palettes hand-tuned in piece 001, plus a few more,
// into something every future piece can reach for. A palette is just
// { name, bg, colors[] }; the helpers (rgba, mix, hexToRgb) are the small colour
// utilities generative work uses constantly — translucent strokes especially.
//
// Classic script on window.Loom — see lib/rng.js for why.
(function (Loom) {
  var PALETTES = [
    { name: "amber & sage",  bg: "#1d1a14", colors: ["#d98c3f", "#e7b261", "#a8602b", "#caa05a", "#5d7a6b", "#88a98f", "#6f9b86"] },
    { name: "teal & clay",   bg: "#121a1d", colors: ["#5aa7c4", "#7fc6df", "#3d7e98", "#a6d8e8", "#c96f5a", "#e0917b", "#d8a08f"] },
    { name: "violet & gold", bg: "#17141c", colors: ["#9b7bc4", "#bd9fe0", "#6e5292", "#cbb3e6", "#c4a14e", "#e0c477", "#d8bf8a"] },
    { name: "flax & moss",   bg: "#16160f", colors: ["#cfc08a", "#e6dcae", "#a99c62", "#ddd4a0", "#7d8a6a", "#9fae86", "#8c9b73"] },
    { name: "ember",         bg: "#1a120e", colors: ["#e8612c", "#f08c42", "#c23b22", "#f4b15e", "#b8743a", "#e8d6a0"] },
    { name: "deep sea",      bg: "#0d1418", colors: ["#2e6f8e", "#49a0b8", "#1c4a5e", "#7fd0d8", "#9ae0c8", "#d8efe4"] },
    { name: "orchard",       bg: "#14160f", colors: ["#b9c44e", "#d8e07a", "#8a9b33", "#e8b84e", "#c4682c", "#e6d6a0"] }
  ];

  function hexToRgb(hex) {
    hex = hex.replace("#", "");
    if (hex.length === 3) hex = hex.replace(/./g, "$&$&");
    var n = parseInt(hex, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  Loom.hexToRgb = hexToRgb;

  // A translucent colour string from a hex + alpha. Flow fields lean on this hard.
  Loom.rgba = function (hex, a) {
    var c = hexToRgb(hex);
    return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
  };

  // Linear blend between two hex colours, t in [0, 1].
  Loom.mix = function (h1, h2, t) {
    var a = hexToRgb(h1), b = hexToRgb(h2);
    return "rgb(" +
      Math.round(a.r + (b.r - a.r) * t) + "," +
      Math.round(a.g + (b.g - a.g) * t) + "," +
      Math.round(a.b + (b.b - a.b) * t) + ")";
  };

  Loom.palettes = PALETTES;

  // Pick a palette with a seeded RNG (falls back to Math.random if none given).
  Loom.palette = function (rng) {
    var i = rng ? rng.int(0, PALETTES.length - 1) : Math.floor(Math.random() * PALETTES.length);
    return PALETTES[i];
  };
})((window.Loom = window.Loom || {}));

// Emil's Loom — primitive #3: seeded value noise (+ fractal fbm).
//
// Smooth, reproducible 2D noise — the workhorse behind terrains, textures, contour
// fields, and organic flow. 002's flow field faked it with a sum of sines; this is
// the real thing, and every field-based piece from here can draw on it.
//
// Loom.noise(seed) → a function n(x, y) in [0, 1), with n.fbm(x, y, octaves, lacunarity, gain)
// for fractal Brownian motion (layered octaves → natural detail). Classic script on
// window.Loom; depends on Loom.hashSeed from rng.js for reproducibility.
(function (Loom) {
  function makeNoise(seed) {
    var seedN = (typeof seed === "number") ? (seed >>> 0) : Loom.hashSeed(String(seed));

    // Integer hash of a lattice point → a stable pseudo-random value in [0, 1).
    function hash(ix, iy) {
      var h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seedN, 0x9e3779b1)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    function smoother(t) { return t * t * t * (t * (t * 6 - 15) + 10); } // smootherstep
    function lerp(a, b, t) { return a + (b - a) * t; }

    // 2D value noise: bilinearly interpolate the four surrounding lattice values.
    function n(x, y) {
      var x0 = Math.floor(x), y0 = Math.floor(y);
      var fx = smoother(x - x0), fy = smoother(y - y0);
      var v00 = hash(x0, y0), v10 = hash(x0 + 1, y0);
      var v01 = hash(x0, y0 + 1), v11 = hash(x0 + 1, y0 + 1);
      return lerp(lerp(v00, v10, fx), lerp(v01, v11, fx), fy);
    }

    // Fractal Brownian motion: sum octaves of decreasing amplitude / increasing freq.
    n.fbm = function (x, y, octaves, lacunarity, gain) {
      octaves = octaves || 4;
      lacunarity = lacunarity || 2;
      gain = gain === undefined ? 0.5 : gain;
      var amp = 0.5, freq = 1, sum = 0, norm = 0;
      for (var i = 0; i < octaves; i++) {
        sum += amp * n(x * freq, y * freq);
        norm += amp;
        amp *= gain;
        freq *= lacunarity;
      }
      return sum / norm; // ~[0, 1)
    };

    return n;
  }

  Loom.noise = makeNoise;
})((window.Loom = window.Loom || {}));

// Emil's Loom · piece 023 — "Rain"
//
// A rainy window at night, seen from inside: looking out through misted glass at defocused warm
// city lights, droplets clinging to the pane — and (once animated) a few sliding down in rivulets,
// each a tiny lens refracting the lights behind it. The cosy, melancholy register I don't have, and
// the first piece to move again after a long static run (the #40 audit reopened animation).
//
// Built the advisor's way: the STATIC wet-window first (this file's first job) — if the still doesn't
// already feel like "inside, looking out at rain," no motion saves it. The discriminator (my 035/037/
// 040 again): droplets must read as wet refractive LENSES, not flat circles — against bright bokeh a
// bead is a magnified+inverted view of the lights, brightened, with a sharp offset highlight, a dark
// rim and a bright bottom meniscus. The clinging drops are static (rendered once); the sliders will be
// a pure function of t (Embers-style) so motion can be judged from a contact-sheet of time samples,
// not an arbitrary rAF frame ([[025-verify-motion-quality-not-just-presence]]).
//
// Composes glow + noise + the palette helpers. Animated (returns frame(t)); seeded so it reproduces.
Loom.piece({
  id: "023",
  title: "Rain",
  seed: "petrichor",
  draw: function (stage, rng) {
    var ctx = stage.ctx, S = stage.size, U = S / 760, TAU = 6.2831853;

    // ---- the bokeh behind the glass, rendered once to an offscreen so droplets can refract it ----
    var bgC = document.createElement("canvas"); bgC.width = S; bgC.height = S;
    var bx = bgC.getContext("2d");
    (function renderBokeh() {
      var g = bx.createLinearGradient(0, 0, 0, S);
      g.addColorStop(0, "#0a131c"); g.addColorStop(0.6, "#0e1c27"); g.addColorStop(1, "#13242f");
      bx.fillStyle = g; bx.fillRect(0, 0, S, S);
      bx.globalCompositeOperation = "lighter";
      var warm = ["#f0c878", "#e8a850", "#f4e6c4", "#d8884a", "#e0b060"];
      var cool = ["#a8c0e0", "#d0d0e0", "#7ea8c8"];
      var n = rng.int(46, 60);
      for (var i = 0; i < n; i++) {
        var lxp = rng.range(-0.05, 1.05) * S, lyp = rng.range(-0.05, 1.05) * S;
        var depth = rng.range(0, 1);                       // 0 far/small/dim, 1 near/big/bright
        var lr = (0.018 + depth * 0.085) * S;
        var col = rng.bool(0.16) ? rng.pick(cool) : rng.pick(warm);
        if (rng.bool(0.06)) col = rng.pick(["#e8504a", "#54bf72"]);  // a rare traffic-light accent
        var a = 0.22 + depth * 0.5;
        var rg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, lr);
        rg.addColorStop(0, Loom.rgba(col, a));
        rg.addColorStop(0.45, Loom.rgba(col, a * 0.45));
        rg.addColorStop(1, Loom.rgba(col, 0));
        bx.fillStyle = rg; bx.beginPath(); bx.arc(lxp, lyp, lr, 0, TAU); bx.fill();
        if (depth > 0.62) {                                 // a hotter core for the near lights
          var cr = lr * 0.32, cg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, cr);
          cg.addColorStop(0, Loom.rgba(col, Math.min(1, a + 0.35))); cg.addColorStop(1, Loom.rgba(col, 0));
          bx.fillStyle = cg; bx.beginPath(); bx.arc(lxp, lyp, cr, 0, TAU); bx.fill();
        }
      }
      bx.globalCompositeOperation = "source-over";
    })();

    // ---- a droplet: a wet refractive lens (magnified + inverted view of the bokeh, brightened) ----
    function drawDroplet(c, dx, dy, r, squash) {
      squash = squash || 1;                                 // >1 = elongated downward (bigger drops sag)
      var rr = r, ry = r * squash, PI = Math.PI;
      c.save();
      c.beginPath(); c.ellipse(dx, dy, rr, ry, 0, 0, TAU); c.clip();
      // the lens: a WIDE-ANGLE inverted view of the scene behind (the classic droplet-full-of-lights),
      // gathered from a region ~2.4× the drop's size so it catches NEARBY lights, not just dead-dark.
      var k = -0.42;
      Loom.lens(c, bgC, dx, dy, k);                          // primitive #14 (harvested from this + Dew)
      // intensify the gathered lights (a drop concentrates them) — a second additive pass at low alpha +
      // a soft lift, so a drop reads as luminous wet glass, never an opaque bead.
      c.globalCompositeOperation = "lighter";
      c.globalAlpha = 0.5; Loom.lens(c, bgC, dx, dy, k); c.globalAlpha = 1;
      var br = c.createRadialGradient(dx, dy - ry * 0.18, 0, dx, dy, rr * 1.15);
      br.addColorStop(0, "rgba(255,248,232,0.2)"); br.addColorStop(1, "rgba(255,248,232,0)");
      c.fillStyle = br; c.fillRect(dx - rr, dy - ry, 2 * rr, 2 * ry);
      c.restore();                                          // un-clip
      // a soft seat-shadow (it sits ON the glass) — subtle, NOT a hard bead rim
      c.globalCompositeOperation = "source-over";
      c.lineWidth = Math.max(0.5, r * 0.08); c.strokeStyle = "rgba(8,14,20,0.22)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.97, ry * 0.97, 0, 0, TAU); c.stroke();
      // bright bottom meniscus (water hangs; light bends through the underside) — sells "drop"
      c.lineWidth = Math.max(0.6, r * 0.12); c.strokeStyle = "rgba(255,251,242,0.5)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.84, ry * 0.84, 0, 0.35, PI - 0.35); c.stroke();
      // a small soft specular highlight, upper-left
      c.globalCompositeOperation = "lighter";
      var hx = dx - rr * 0.3, hy = dy - ry * 0.34, hr = r * 0.26;
      var hg = c.createRadialGradient(hx, hy, 0, hx, hy, hr);
      hg.addColorStop(0, "rgba(255,255,255,0.55)"); hg.addColorStop(1, "rgba(255,255,255,0)");
      c.fillStyle = hg; c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fill();
      c.globalCompositeOperation = "source-over";
    }

    // ---- the static clinging droplets (scattered, varied; rendered once) ----
    var cling = [];
    var nd = Math.round(140 * (S / 760));
    for (var i = 0; i < nd; i++) {
      var t = rng.next();
      var r = (t < 0.7 ? rng.range(1.6, 4.5) : t < 0.93 ? rng.range(4.5, 9) : rng.range(9, 16)) * U;
      cling.push({ x: rng.range(0.02, 0.98) * S, y: rng.range(0.02, 0.98) * S, r: r, sq: 1 + (r / (16 * U)) * 0.18 });
    }

    // The whole static wet-window (bokeh + mist + clinging drops + vignette) is rendered ONCE into an
    // offscreen, so each animated frame is just: draw that layer + the few sliding drops on top.
    function paintStaticInto(c) {
      c.globalCompositeOperation = "source-over"; c.globalAlpha = 1;
      c.drawImage(bgC, 0, 0, S, S);
      c.fillStyle = "rgba(150,168,182,0.16)"; c.fillRect(0, 0, S, S);     // mist veil
      var mistN = Loom.noise(rng.int(0, 1e9));
      for (var y = 0; y < S; y += 6 * U) {
        for (var x = 0; x < S; x += 6 * U) {
          var m = mistN.fbm(x / S * 3.5, y / S * 3.5, 3);
          c.globalAlpha = Math.max(0, (m - 0.5)) * 0.22; c.fillStyle = "#c4d2da";
          c.fillRect(x, y, 6 * U + 0.5, 6 * U + 0.5);
        }
      }
      c.globalAlpha = 1;
      for (var i = 0; i < cling.length; i++) drawDroplet(c, cling[i].x, cling[i].y, cling[i].r, cling[i].sq);
      var vg = c.createRadialGradient(S / 2, S * 0.45, S * 0.3, S / 2, S / 2, S * 0.8);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(4,9,14,0.55)");
      c.fillStyle = vg; c.fillRect(0, 0, S, S);
    }
    var staticC = document.createElement("canvas"); staticC.width = S; staticC.height = S;
    paintStaticInto(staticC.getContext("2d"));

    // ---- the sliding drops: pure functions of t, so any frame is reproducible & a t-strip is judgeable ----
    var wobN = Loom.noise(rng.int(0, 1e9));
    var sliders = [];
    for (var si = 0, nsl = rng.int(5, 7); si < nsl; si++) {
      sliders.push({ x: rng.range(0.06, 0.94), wob: rng.range(0, 40), period: rng.range(6, 12),
        phase: rng.next(), y0: rng.range(-0.06, 0.5), r0: rng.range(6, 10) * U, r1: rng.range(14, 26) * U,
        amp: rng.range(0.014, 0.05) * S });
    }
    var botY = 1.08 * S;
    function pathX(s, lt) { return s.x * S + (wobN.fbm(s.wob, lt * 5, 3) - 0.5) * 2 * s.amp; }
    function pathY(s, lt) { var y0 = s.y0 * S; return y0 + lt * lt * (botY - y0); }   // accelerates from its spawn

    // a thin, slightly meandering cleared rivulet from the drop's spawn down to its head — reveals the
    // sharp (un-misted) bokeh, then re-fogs toward the old (upper) end so it fades before the cycle wraps.
    function drawTrail(s, lt, hr) {
      var steps = 14, w = Math.max(1.2, hr * 0.34);
      ctx.save(); ctx.beginPath();
      for (var i = 0; i <= steps; i++) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) - w, pathY(s, lq)); }
      for (var i = steps; i >= 0; i--) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) + w, pathY(s, lq)); }
      ctx.closePath(); ctx.clip();
      ctx.drawImage(bgC, 0, 0, S, S);
      var rf = ctx.createLinearGradient(0, pathY(s, 0), 0, pathY(s, lt));
      rf.addColorStop(0, "rgba(150,168,182,0.55)"); rf.addColorStop(0.7, "rgba(150,168,182,0.12)"); rf.addColorStop(1, "rgba(150,168,182,0.05)");
      ctx.fillStyle = rf; ctx.fillRect(0, 0, S, S);
      ctx.restore();
    }

    function frame(t) {
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      ctx.drawImage(staticC, 0, 0, S, S);
      for (var i = 0; i < sliders.length; i++) {
        var s = sliders[i], lt = ((t / s.period) + s.phase) % 1;
        var x = pathX(s, lt), y = pathY(s, lt), r = s.r0 + (s.r1 - s.r0) * lt;
        drawTrail(s, lt, r);
        drawDroplet(ctx, x, y, r, 1.45);                                 // the head: a fat elongated lens
      }
    }
    return frame;   // ANIMATED — draw() did the seeded setup; frame(t) paints each moment.
  }
});

</script>
