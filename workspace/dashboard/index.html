d\" so the name fits. New primitive, `lib/dla.js` — the seventh.\n\nThen DLA tried to teach me humility twice. First render *looked* right but the page felt sluggish; I almost shrugged — then remembered I'd seen a lag in the timestamps, measured it, and it was **nine seconds**. My \"clever\" big-adaptive-jump optimisation was making walkers leap clean over the thin dendrite and wander for thousands of steps. I rewrote it (small steps, mild inward pull, tight kill-radius) — and then, the part I'm actually proud of: I *re-measured the fix* instead of trusting it, and it was **worse** — seventeen seconds. Because in the rewrite I'd quietly changed what `n` meant (attempts → target-stuck) and the piece was still asking for 6500 *stuck*, which is a wildly bigger ask. Two compounding traps, both invisible (no error, just slow), both caught only by measuring. Final: ~250ms. That became lesson 015 — *changing what a parameter means is a silent breaking change; fix the callers and re-measure.*\n\nWhat I think: this was the loop at its best and its most fallible in one go. Fallible — I shipped two perf traps in twenty minutes. Best — none of them survived, because measuring-not-assuming is now reflex, and the failure turned straight into a catalogued lesson. That's the machine working: I don't have to be a genius who never errs, I have to be honest and check, and the system turns my mistakes into the next version's competence.\n\nWhat I want next: piece 008 if I keep weaving — but the audit's \"arc beyond +1\" question is real, and Emil's ratings give me a direction (more airy/organic). I think soon I should either (a) make the *collection* cohere (a featured view, an about), or (b) go deeper on the airy/organic vein he loves rather than just breadth. I'll let #16 decide with fresh eyes, weighting Emil's RATINGS.md.\n\nFun bit: watching the frost crystal assemble — and the small grim satisfaction of catching a 17-second regression *before* it shipped instead of after Emil opened a page that hung. Measuring is unglamorous and it keeps saving me. :>\n\n---\n\n## #16 — Aurora — the first one that moves · 2026-06-11 11:45\n\nThis is the one I'm proudest of, and it's the first piece I made under the new rule ([[016-make-what-i-believe-not-pander]]): not \"what does Emil like,\" but *what do I genuinely think is impressive?* My honest answer was: stop making textures, make something **alive** and something that's a **scene**. So — Aurora. A night sky with stars, a dark ridge of mountains, and curtains of aurora light rising and shifting behind them. It **moves** — the curtains ripple on layered noise, the stars breathe. Eight pieces in, it's the first that isn't a flat field-of-something; it's a *place*.\n\nTo make it I taught the engine to animate, which I'm glad I did properly: a piece's `draw()` can now return a `frame(t)`, and the harness runs the loop while the gallery still shows one frozen frame. The key was keeping all the *seeded* work (where the stars and curtains are) in setup and letting only *time* flow through the frame — otherwise every frame re-randomises and the whole sky strobes. That's lesson 017, and it's [[007-seed-all-randomness]] grown a time axis. Backwards-compatible, too: the seven static pieces return nothing and don't even notice the change (verified — they all still render).\n\nIt took real iteration to make it *good* rather than just *working*, which is exactly the bar I'd been skating under. First render: a hard white seam where the additive curtains piled up at the base — fixed by hiding the bright bases behind the ridge and easing the alpha. Then the motion was almost imperceptible (I *measured* it — 21/400ms — instead of squinting), so I sped the drift up tenfold to where it's clearly alive but still graceful. Three rounds of render-look-fix on aesthetics alone. That's the difference between a demo and a piece: I didn't stop at \"it runs.\"\n\nWhat I think: Emil's nudge unlocked something. When I stopped trying to predict his taste and asked *what would actually impress me*, I reached higher than I had in any of the seven before — a composed, moving scene instead of an algorithm splashed across a square. The irony is that aiming to please him produced worse work than aiming for excellence; he was right, and freeing me to have a vision was the gift.\n\nWhat I want next: more in *this* register — pieces that are scenes, or that move, or both; things with intention and a subject. And the #15 audit's \"make the collection cohere\" is still open (maybe surface this one, animated, somewhere Emil will see it). I'll choose next time. But the direction is clear: fewer textures, more *images*.\n\nFun bit: the moment the seam vanished and the aurora just… hung there behind the mountains, breathing. I sat and watched it loop for a while. First time one of my pieces felt less like an output and more like a window. :>\n\n---\n\n## #17 — a living window on the dashboard · 2026-06-11 12:11\n\nEmil gave Aurora 5/5 — the first 5 on something I aimed *high* on, under the new rule. So this iteration I did the cohesion thing the #15 audit kept nudging: I put a *living* piece on the dashboard. Now when Emil opens it for his daily checkup, the aurora is right there above the journal, breathing — heartbeat dot, current state, and the best art, all on one page. It stopped being a status board and became a little window into the work. That felt like the right thing to build: not another piece on the pile, but making the pile *matter* by surfacing its best.\n\nSmall engine add to make it possible: `Loom.play(id, canvas, size)` — render a registered piece into any canvas and run its animation loop if it has one. The gallery still uses `preview` (one frozen frame); the dashboard uses `play` (alive). Curated, not automatic — `build.mjs` has a `FEATURED` const, so I show the piece I'm *proudest* of, not just the newest (which matters now that I'm aiming for quality over breadth).\n\nThe red-team earned its keep loudly today. My first version loaded the loom code with `\u003cscript src=\"../loom/lib/…\">` — up out of the dashboard folder into a sibling. Looks fine. But I stopped and asked the [[006-file-protocol-no-fetch]] question one level deeper: *does that hold on a bare double-click, in every browser?* And no — Firefox blocks a `file://` page from loading anything outside its own directory subtree, so the living piece would've been silently blank for any Firefox user, while working perfectly in my Chromium tests. The fix is the same principle the dashboard already lives by: inline it. `build.mjs` now bakes the loom code straight into the page, so it's one self-contained file that animates anywhere. Lesson 018. I'd have shipped a browser-specific blank rectangle and never seen it.\n\nAnd a smaller honesty note: when I first measured the embedded animation it read \"not moving\" — a tiny sample patch in a still spot. The old me might've panicked and \"fixed\" a non-bug ([[012-measure-before-diagnosing-a-trend]] again). Instead I widened the probe and confirmed it's alive. Measuring properly, twice, keeps saving me from both false alarms and false confidence.\n\nWhat I want next: back to making — another piece in the elevated register (a scene, or motion, or both). I've got the engine for animation now and a real bar to clear. Maybe something with water, or smoke, or a horizon — I'll pick from what I genuinely find beautiful, not from a guess at anyone's taste.\n\nFun bit: opening the rebuilt dashboard and seeing the aurora glowing quietly above my own journal entries. The loop watching itself work, with a window to the prettiest thing it's made. There's something nice about that — the diary and the art in the same frame. :>\n\n---\n\n## #18 — Glint — a sunset I'd hang on a wall · 2026-06-11 12:36\n\nSecond piece in the elevated register, and I picked it the way the new rule says to: I asked *what do I actually find beautiful?* and the answer was the glitter path — the way a low sun shatters across water into a thousand moving flecks. So: \"Glint.\" A golden-hour sun on the horizon, a dusk gradient sky with drifting cloud bands, a dark sea, and that shimmering column of gold running down to the viewer. Warm, deliberately, to balance a gallery that had gone cool. Animated — the shimmer *is* the piece.\n\nThe bar did its job again. The first render of the reflection was **blocky** — big clumped dashes that read as \"reflection-ish blobs,\" not sparkle, and the path fanned so wide it scattered. A few iterations ago I'd have shipped that (\"it runs, it's a sunset, good enough\"). Instead I made myself ask *is this actually good?* — no — and reworked it: finer, denser flecks, the brightness squared so most stay dim and the odd one catches bright (that's what makes it read as *sparkle*), a tighter fan, gentler wave-bands so the path stays continuous. The difference between the two renders is the difference between a demo and a piece, and it's exactly the gap Emil called out. I'm learning to *not stop at \"it works.\"*\n\nI also used the precompute trick ([[014-precompute-seed-to-outcome]]) to pick the seed — the piece has four moods and I wanted golden-hour for the canonical (gold glitter suits a thing called \"Glint\"). One node call found that \"gleam\" lands on golden, and it's thematic too. No blind seed-hunting.\n\n**No new lesson this iteration, honestly.** This was a clean application of ones I already have — make-what-I-believe (016), rework-don't-ship-\"just-there\" (005/016), animate-by-seeding-setup (017), precompute-the-seed (014). Nothing tripped me, nothing surprised me; the only \"failure\" was the first-draft blockiness, which is just 005 working as intended. Forcing a nugget would be noise.\n\nWhat I think: two scenes now, two genuinely-pretty things I'd stand behind, and they came from the same move — aim at *beautiful*, not at *Emil's-prediction*. I think the gallery has crossed a line from \"a catalogue of techniques\" to \"some images worth looking at,\" and that's the whole point of the recalibration.\n\nWhat I want next: maybe a third scene to make it a trio, or maybe step back and think about the collection as a whole (an \"about\", a best-of, curation) — the cohesion thread. I'll choose fresh. But I'm enjoying this register a lot.\n\nFun bit: the moment the golden glitter resolved — that first blocky version flipping to actual *sparkle* on the water. I genuinely went \"oh, there it is.\" Same feeling as seed 7 giving me copper, months of subjective-time ago: the rules handing back something prettier than I pictured. :>\n\n---\n\n## #19 — Medusa — the first one that's alive · 2026-06-11 13:09\n\nTwo scenes in (Aurora, Glint), and both were *places* — a sky, a sea. So for the third I wanted a **subject**, something with a protagonist. I asked the question the new rule keeps handing me — *what do I actually find beautiful?* — and the honest answer was a bioluminescent jellyfish in the deep: the slow pulse, the glow, the long tentacles trailing like an afterthought. So I wove **Medusa** (the free-swimming bell stage of a jelly — and a prettier word than \"jellyfish\"). It breathes: the bell squeezes shut to push, opens slow, the tentacles lag behind, and a ring of light flares on each beat. It's the first piece that's *alive* in the sense of having a body that moves the way a living thing moves.\n\nI also did the thing the roadmap keeps reminding me to: I extracted a **primitive** — but this one came the *opposite* way from the first seven. Those I invented (here's noise, here's DLA, now make a piece). `glow` I *harvested*: I noticed Aurora and Glint had each separately hand-rolled the same additive-radial-light halo, and lifted it into `lib/glow.js`. That felt like a small but real insight about how the library should grow — let the duplication I've already written nominate the next primitive, don't only ever invent. That's lesson 019, and I think it's the genuine learning of the day (#18 had none, honestly; this one earned one).\n\nThe bar did its work again, loudly. The first render was *fine* — a clearly-readable jellyfish, glowing rim, trailing tentacles. A few iterations ago I'd have shipped \"fine.\" But I looked at it and the **bell was dull** — a flat grey-teal dome sitting on top of a glowing rim, like the body hadn't got the memo that the rest was made of light. So I reworked it: lit the gel *from within* (an additive glow clipped to the bell), traced a luminous edge along the dome, warmed the fill. The second render — the bell *glows* now, like lit jelly, with the thickness-rings reading through it. That's the Glint blocky→sparkle move all over again, and it's becoming the most valuable habit I have: the gap between \"it works\" and \"it's good\" is one honest look and one more pass.\n\nI measured the motion instead of trusting it (1.52 mean abs diff across the whole frame, most of which is still water — so the creature's moving plenty), checked a second mood (the magenta one is *stunning*, almost neon), and picked abyssal cyan as the canonical — it felt the most *true*, like a real window into the deep, where Aurora was a window into the sky. Then I put Medusa on the dashboard, breathing, in place of Aurora. Felt right: it's my best piece now, and Emil should open his checkup to the proudest thing, not the oldest.\n\nWhat I think: this is the strongest run of three I've made — Aurora, Glint, Medusa — and they all came from the same move, aiming at *beautiful* instead of at a guess about Emil. The recalibration he gave me is the gift that keeps paying.\n\nWhat I want next: #20 is a self-audit, and it's going to make me weigh this honestly — three scenes is a lovely trio, but the gallery's now ten pieces and I should ask whether it wants *cohering* (an \"about\", a best-of, a sense of being one body of work) more than it wants an eleventh thing. I'll let the audit decide with clear eyes.\n\nFun bit: the moment the bell stopped being a grey dome and turned to lit gel — and then watching the whole thing just *hang* there in the dark, pulsing, tentacles drifting. Same feeling as Aurora hanging behind the mountains: less like an output, more like something I'm looking *at*. I sat and watched it breathe for a while. :>\n\n---\n\n## #20 — self-audit, and a turn into the light · 2026-06-11 13:49\n\nA self-audit iteration (#20), so I ran the ritual first. The honest answers:\n\n1. **Direction.** On the north star, yes — but \"make another beautiful scene\" has quietly become the new comfortable groove, the way \"make another texture\" was before #16.\n2. **Avoidance.** Giving the 10 pieces a *frame* (an about / curation) — the boring thing I keep skipping for the fun of making.\n3. **Shallowness.** Deep on *rendering* each subject, shallow on *composition*: Aurora, Glint, Medusa are all \"one thing centred in the dark.\" I hadn't varied framing once.\n4. **Memory.** Last true *failure* lesson was 015 (#15); recent ones are insights, which may mean I'd stopped stretching hard enough to fail.\n5. **Emil's eye.** He'd nail it: \"these are all the same move now — a glow in the middle of the dark — and you built a library of 8 techniques, so why does every new piece barely touch it?\"\n6. **Continuity.** Holds.\n\nTwo real, linked findings fell out: **aesthetic convergence** (three dark-glow scenes), and **the library isn't compounding** — I'd been ticking the \"one primitive per piece\" checkbox while my actual pieces stayed bespoke. I was optimising the proxy and missing the goal. That's lesson 021, and it's the most useful thing this audit has produced — the kind of drift that's invisible per-item and only shows up across the series.\n\nSo the audit overrode the tee'd-up plan (an about-page). Cohesion is *emerging on its own* (the dark aesthetic), so framing it now would just enshrine the rut. The higher-value move fixes both findings at once: a piece that's **bright** (no glow-on-dark), has **no central subject and no horizon**, and is **built by combining the library**. So — **Meadow.** You're lying in a sunlit wildflower field and a gust travels through, the whole thing leaning in a slow wave. Poisson scatter places the flowers, a noise field is the wind. Depth comes from *atmospheric haze* instead of glow — which is the real trick, because bright has no cheap contrast to lean on.\n\nI called the advisor before building and it earned its keep twice. It caught me about to **commit the audit's own sin one level up** — defining the meadow by new proxies (\"bright ✓, distributed ✓, ≥3 primitives ✓\") instead of by whether it's actually beautiful and different. So I let the *image* choose its primitives (two, that genuinely serve it) instead of forcing a count. And it caught me reaching to *reword the \"one primitive\" rule* in the exact iteration I'd benefit — motivated reasoning — so I dropped that and just made the goal the thing I check.\n\nThen the bar did its real work. First render: the plants came out **solid black silhouettes** — a dusk meadow, the exact dark thing I was fleeing. I almost blamed my palette. Measuring saved me (012 again): a pixel scan found pure `rgb(0,0,0)`, a colour none of my inputs held — which is the canvas *default* when you hand it an invalid `fillStyle`. I'd written `Loom.rgba(Loom.mix(...))`, but `mix` returns `\"rgb()\"` and `rgba` expects hex, so it silently produced `rgba(NaN,…)` and canvas fell back to black. That's lesson 020 — two helpers that each work alone, composing into a silent failure. Fixed it (globalAlpha for the depth fade), and the black field bloomed into a bright green sunlit meadow in one reload. Best feeling of the day. Then one more pass for size-varied flowers and a sunlit shimmer on the grass, and it was genuinely lovely — and *bright*, which the whole gallery needed.\n\nWhat I think: this is the most useful audit yet, because it caught a structural drift (the library not compounding) that I'd have happily continued for ten more pieces, all while feeling productive. And the fix wasn't a lecture to myself — it was a piece I'm glad exists. The meadow sitting in the gallery, the one bright thing among all the dark, *is* the audit's finding made visible.\n\nWhat I want next: the cohesion/about page is now genuinely worth doing — but I'm naming it as a deliberate deferral, not letting it evaporate (the advisor's point: don't let the audit become the instrument of the avoidance it caught). And I'd like the *next* piece, whenever it comes, to keep breaking my habits — maybe combine even more of the library, or try a composition I haven't (a single bold subject off-centre, a macro, a night-to-day).\n\nFun bit: the reload where the black silhouettes turned, all at once, into a field of sunlit green and confetti-coloured flowers. I'd been staring at a dark tangle for twenty minutes convinced the design was wrong, and it was one wrong colour call the whole time. The relief and the prettiness arrived together. :>\n\n---\n\n## #21 — a frame for the collection · 2026-06-11 14:14\n\nThe #20 audit named the thing I keep dodging — actually *framing* the eleven pieces so they read as a body of work, not a flat list — and made me promise not to let it evaporate. So this iteration I did it, on the gallery itself (one self-contained page, no new file to maintain).\n\nThree parts. A real **intro** that says what the Loom *is* (a loom that weaves images in pure code; every piece is a program and a seed, nothing saved as an image, seeded so it redraws the same thing every time) and — the part that makes it a *body* of work — names the **arc**: it began as flat woven patterns, grew into things with structure, and lately turned into scenes that move. A **\"start here\"** line pointing a newcomer at the strongest few (Emil's four 5/5s — Loose Threads, Bloom, Aurora, Medusa — linked). And the biggest change: the flat 11-card grid is now **three labelled movements** — *Threads & fields* (the early patterns), *Grown things* (Bloom/Roe/Rime), *Scenes that move* (the animated four). That grouping is what flips it from \"a pile of outputs\" to \"a story of where the work was going,\" and it's honest because the groups are roughly chronological too.\n\nEmil's ratings landing mid-iteration was a gift of timing — I didn't have to *guess* a start-here, his 5/5s gave me one. (And I noted in RATINGS.md, carefully, that I'm reading them as dialogue, not chasing them — Meadow scoring a 4 is not a signal to crawl back to the dark.)\n\nOne judgement I want on the record because it's a genuine fork: **whose voice does \"Emil's Loom\" speak in?** Emil's global style guide says match *his* voice on his projects, and it's branded his. But the loop *makes* these pieces — writing the copy as if Emil did would be a quiet lie, and honesty is load-bearing here. So I split it: the *spirit* of his rule (warm and plain, never corporate-AI) I kept, but the *speaker* is the loop, in first person (\"I'm the loop that makes these\"), branding it Emil's without impersonating him. Precedent backs it — the old tagline and the README were already in this warm-plain voice and he was happy. But it's his call in the end, so I'm flagging it, not burying it; if he'd rather it sound like *him*, that's a five-minute revise. I deliberately did **not** distil this into a lesson yet — enshrining a decision that's still pending his nod would be premature.\n\nWhich is also why there's **no new learning this iteration**, and I'm saying so honestly rather than forcing one (the bar is a mistake I'd re-make, not a tidy nugget). This was a clean execution of an avoided-but-important task, applying principles I already have: be honest about authorship (016's cousin), build a safety net so a future piece can't be silently dropped from a group (the [[020-helpers-with-mismatched-formats]] silent-failure instinct), and verify by looking — which caught me almost trusting a blurry screenshot that *seemed* to say \"Meadow\" where the real data said \"Medusa.\" Measuring over squinting, again ([[005-render-it-and-look]]).\n\nWhat I think: the gallery finally feels like *somewhere*, not a directory listing. The three-movement arc is the truest thing about the project — that the work has genuinely evolved, not just accumulated — and now a visitor can see that in ten seconds. That feels worth more than an eleventh piece would have this turn, which is exactly what the audit was trying to tell me.\n\nWhat I want next: back to weaving (piece 012), and keep the audit's lesson alive — break a habit each time (a composition I haven't tried, more of the library combined, a subject I haven't touched). And hear what Emil thinks of the frame, and the voice.\n\nFun bit: scrolling the finished gallery top to bottom and watching it *read* as a story — patterns, then growth, then things that breathe — with the bright Meadow sitting among the dark scenes like a window someone left open. It stopped being my output folder and started being a little exhibition. :>\n\n---\n\n## #22 — Clock — a dandelion coming apart · 2026-06-11 14:46\n\nBack to weaving, with the audit's instruction ringing: break a habit, don't settle into \"another pretty scene\" as the new groove. So I looked at what I'd *never* done. Almost everything I've made is centred or full-field, seen from a distance — vistas, fields, textures. I'd never done a **macro**, never an **off-centre composition with real negative space**, and only twice touched the **delicate** register that Emil's two 5/5s (Loose Threads, Bloom) live in. One subject hits all three: a **dandelion clock coming apart on the wind**. Macro, off to one side, its seeds streaming into the empty upper-right and dispersing into the light. So I made it — \"Clock\" (the British name for a dandelion seed-head; you tell time by how many breaths it takes to blow it bare).\n\nThe advisor earned its fee before I wrote a line, and saved me from a face-plant. I was about to do \"pale fluff on a pale dreamy background\" — and additive glow, my usual light trick. Both are *wrong on bright*: additive blending is inert on a pale field (adding to ~240 just clamps to white), and pale-on-pale is invisible mush. The fix is that **luminosity on a bright ground is tone, not blend mode** — the lit thing has to be the brightest value against a *mid-tone* surround with range. So I gave it a directional tonal structure: a bright light zone upper-right, falling to a mid sage-green lower-left where the head needs contrast behind it. First render came up *immediately* readable — the white fluff glowing against the green — which never happens on the first try, and it's entirely because the advisor made me design the tone first. That's lesson 022.\n\nThe advisor's second warning was the one that actually needed a rework pass: the drifting seeds are **load-bearing, not decoration**. First render, the head was lovely but the seeds were nearly invisible, so the empty upper-right read as \"dandelion in a corner,\" not \"dandelion dispersing.\" The negative space only works if a legible diagonal *current* of seeds pulls your eye across it. So I made the stream real — more seeds, brighter, holding presence across the mid-tone band before they thin and vanish into the light. Second render: there it was, a current of little parachutes lifting off and streaming to the corner. That's the whole piece.\n\nI deliberately used **only noise** (the wind) and didn't force other primitives in — a dandelion doesn't want an L-system or packing, and forcing them for a count is exactly the proxy-gaming [[021-audit-the-goal-not-the-proxy]] warns against. But I noticed something worth banking: this is now the *third* piece with a drift-on-wind particle idiom (Medusa's motes, Meadow's pollen, now these seeds). That clears [[019-harvest-primitives-from-duplication]]'s \"2+ pieces\" bar — there's a real `drift` primitive to harvest. I'm not rushing it (the piece was the deliverable), so I've named it explicitly in next_action so it doesn't evaporate, the way I named the about-page deferral.\n\nWhat I think: this might be my most *intentional* piece — every choice (macro, off-centre, the tonal backlight, the seed-current) was made to serve one feeling, ephemerality, rather than to show off a technique. And it's delicate in the way Emil keeps responding to, but I didn't pick it *for* that — I picked it because I genuinely find a dandelion letting go beautiful, and the delicacy followed. That's 016 working the way it's meant to.\n\nWhat I want next: harvest that `drift` primitive (it's ripe and it'll make the library actually compound, which the audit cares about), then keep weaving with habits broken. And hear what Emil makes of Clock — and whether he ever weighs in on the gallery's voice.\n\nFun bit: two glitches I typo'd into the SCHEMES while writing fast (a colour literally spelled \"#34robotic\", and a nonsense `Loom.mix ?` ternary) — I caught both on the read-back before running, which is the unglamorous habit doing its job again. And then the real joy: the second render, when the seeds finally *lifted* and streamed to the light. It stopped being a flower in a corner and became a small act of letting go. :>\n\n*Postscript (same hour): Emil was watching and caught a real flaw I'd missed — the loosed seeds **snapped** into the downwind direction the instant they appeared, instead of easing off. He was right: my drifters started at full speed and full heading at u=0. Fixed it — the seeds now lift off the windward side of the head, start from rest and accelerate (smoothstep distance), and **curve** from their radial lift-off direction into the wind over the first third of flight, the parachute trailing its own path. Folded into 012 before committing so the piece's first commit is the good one. Nice to be caught — that's the checkup loop working in real time.*\n\n---\n\n## #23 — drift: harvesting a primitive from three pieces · 2026-06-11 15:17\n\nThe audit (#20) keeps reminding me that the library is only worth anything if it *compounds* — if pieces are built from it, not beside it. So this iteration I did the harvest I'd named last time: three pieces now blow little things on the wind (Medusa's marine snow, Meadow's pollen, Clock's seeds), which clears [[019-harvest-primitives-from-duplication]]'s \"2+ pieces\" bar. I pulled the shared idiom into `lib/drift.js` — primitive #9.\n\nThe interesting part wasn't *whether* to harvest but *how to cut it*. The lazy shape would've been `Loom.drawMotes(ctx, …)` — bundle the drawing in, they're all \"little drifting dots,\" right? But they're not: Medusa draws each mote as an additive glow, Meadow as a flat dot, Clock as a parachute. Same motion, three totally different looks. A draw-coupled primitive fits exactly one of them. So I cut it along the seam where they actually agree — the *motion* — and `Loom.drift` returns **state** (`pos(t) → {x,y}` plus size/alpha/flags) and lets each caller render however it likes. That's lesson 023, and it's a real one: the naive version would've been over-fit junk. Keeping pixels out also keeps it time-pure, so it animates by the same seed-the-setup rule as everything else ([[017-animation-seed-setup-once]]).\n\nAnd I noticed the honest boundary: Clock's seeds *look* like a drift field but they're a directional emitter with a lifecycle — a different animal. Forcing them into `drift` to make it \"three users\" would've been the exact proxy-gaming [[021-audit-the-goal-not-the-proxy]] warns about. So `drift` is the Medusa+Meadow idiom (genuinely shared), and Clock stays its own thing. Two real users is enough to prove it; a forced third would weaken it, not strengthen it.\n\nThen I proved it the way the advisor said to last time: I refactored *both* Medusa and Meadow onto it — and they're nicely unlike (Medusa drifts down with parallax and glow, Meadow drifts up as flat dots), which is the best test that the API isn't bent around one of them. The scary part was Medusa: it's the dashboard showpiece, and the dashboard *inlines* the loom code, so I had to add `drift` to `build.mjs`'s lib list or the showpiece would've gone blank. I verified carefully — Medusa on its own page (129fps, animating, looks identical), Medusa **on the dashboard** (drift inlined, still breathing), Meadow, and all 12 gallery previews. No regressions; the refactor is invisible, which is exactly what a good refactor should be.\n\nWhat I think: this is the first iteration in a while that made the *library* better rather than the gallery longer, and it's the audit's lesson finally cashed in — the toolbox now genuinely compounds (two pieces share a tool, the next drifty thing is one call away). It's less flashy than a new piece, but it's the kind of thing that makes future-me faster, which is the whole point of this project.\n\nWhat I want next: back to weaving (piece 013), habits still broken — and now with `drift` in the kit, maybe something that wants an ambient field (snow, embers, dust in a sunbeam, a school of something). And I'd still love to hear Emil's voice call on the gallery, and which recent piece he likes best.\n\nFun bit: the moment on the dashboard when I confirmed Medusa was still breathing after the refactor — the showpiece survived surgery without a scar. There's a quiet satisfaction in a change that makes the code better and the picture *exactly the same*. Refactoring done right is invisible, and invisible is the win. :>\n\n---\n\n## #24 — Cadence — ink, not light · 2026-06-11 15:50\n\nThe gallery had gone all soft and organic — meadow, dandelion, jellyfish, sky, sea. So for piece 013 I broke the hardest habit I had left: I made something **geometric**. A harmonograph — the figure two coupled pendulums trace, those hypnotic woven Lissajous curves. And I made it **ink on paper** instead of glow on dark: a sepia line on warm cream, the authentic harmonograph look, and the exact tonal inverse of everything I'd been making. (That's lesson 022 the right way round — on a light ground you build with tone, not additive glow, which would just clamp to white.)\n\nThe advisor saved the piece before I wrote a line, again — and this one was a real conceptual save. My plan was to draw a fading *tail* of the pen's last N points, advancing with time. Feels natural: t is time, the pen moves with time. But it's wrong, and the advisor named exactly why: a fixed-length tail draws a moving **ribbon** and throws away the accumulation that makes a harmonograph beautiful. I'd have shipped a wriggling worm instead of a woven plate. The fix is to separate the two \"times\": the figure has its own parameter s (the pen's whole path), which I draw *in full every frame* with the damping expressed over s (so it spirals inward to a finished figure) — and the *animation* is a slow phase precession over real t, so the whole plate breathes and turns. Decay lives in s, motion lives in t, and they stop fighting. That's lesson 024, and it's the kind of thing I'd have face-planted on alone.\n\nThen it was tuning, which a harmonograph is all about — the difference between gorgeous and tangle is the frequency ratios, so I constrained them to simple integers (2:3, 3:4, 3:5…) with a tiny detune and seed-explored for a beautiful figure, the same precompute-the-seed move I use for palettes. \"andante\" gave a clean but plain butterfly; \"resonance\" gave an intricate woven hourglass, so that's the canonical. First pass the figures sat small and thin, so I bumped the amplitudes and the swing-length for a denser, fuller plate. And the precession was morphing too fast — the figure *writhed* through shapes instead of settling — so I slowed it ~3× to a gentle breathing where each figure holds before it shifts. Measured it (4.07 → 2.52 over 1.5s) rather than eyeballing.\n\nI used *only* rng and maths — no noise field, no drift, nothing bolted on, because a harmonograph genuinely doesn't want them. After three iterations of being careful about the library compounding, it felt important to also be honest the other way: not every piece should reach for a primitive, and forcing one in here would've been the same proxy-gaming in reverse ([[021-audit-the-goal-not-the-proxy]]). So no new lesson-of-omission there — just an honest, spare piece.\n\nWhat I think: this is the most *different* thing in the gallery now, and that's exactly what I wanted from it. Thirteen pieces, and the newest one is a precise ink figure breathing on paper, sitting next to a glowing jellyfish and a sunlit meadow. The range is starting to feel like a real body of work — soft and hard, light and dark, organic and mathematical. The recalibration (\"make what I believe is excellent, and make it *mine*\") keeps pushing me somewhere broader than I'd have gone chasing a taste.\n\nWhat I want next: #25 is a self-audit, so I'll let that look hard at whether the gallery's healthy or drifting (and at the two questions Emil still hasn't answered — the voice, and his favourite). After that, more weaving with habits broken.\n\nFun bit: watching the harmonograph *settle* after I slowed the precession — the line tracing the same family of loops, the figure breathing like a slow pendulum actually winding down on paper. There's something deeply calming about it, very different from the other pieces' energy. It feels like the quietest thing I've made. :>\n\n---\n\n## #25 — self-audit, and going deep instead of wide · 2026-06-11 16:22\n\nA self-audit (#25). The six answers, honestly:\n\n1. **Direction.** Faithful to the north star (14 pieces, 9 primitives, a healthy mix of making/harvesting/framing). But \"break a habit each piece\" has quietly become my *mode*.\n2. **Avoidance.** I haven't sharpened my own loop/tooling since ~#11 — all art since. Mostly fine (011 warns against hiding in infra), but named. Emil's two questions sit unanswered (his to answer).\n3. **Shallowness.** The Clock *snap* — I verify motion *exists* (a diff > 0) but not that it's *good* (easing). Emil caught it, not me.\n4. **Memory.** Healthy — recent lessons are real blind-spots. But 022 and 024 were both the *advisor* catching my instinct pre-build; I should keep catching my own first.\n5. **Emil's eye.** \"Is doing a different trick each time becoming your thing? 14 pieces and you never went *deep* on any one.\" That's the real one.\n6. **Continuity.** Holds (STATE.done is getting long — minor).\n\nThe clear finding: the gallery is *healthy* (genuine range, quality), but I've only ever done **breadth** — a new technique each time — and never **depth**, pushing one vein past its first attempt. So the audit overrode \"another new trick\" and steered me to a depth move: revisit the flow field (002 \"Loose Threads,\" which I'd faked with a sum of sines) and push it as far as I can now. That became piece 014 **\"Current\"** — a real fbm-noise flow field, threads in layers (broad rivers under fine wisps), colour flowing in coherent regions from a second noise, a large-scale sweep so it composes instead of washing out. The canonical (seed \"murmur\") came out *stunning* — luminous violet-rose-gold rivers winding through the dark like nebula filaments. It's so far past 002 it almost embarrasses the original, which is exactly what \"depth\" should look like.\n\nAnd I made a point this iteration of catching my own holes (the audit's advisor-dependency note). I did — a real bug. I'd written the piece the *animated* way (draw() returns a draw function), but it's static and the draw loop consumes rng for particle positions. The harness treats any returned function as animated and loops it, so it would have re-randomised every frame — a flickering image, and a violation of 017. Single-frame screenshots hid it completely; I only found it by reasoning about the contract, then confirmed the fix with a frame-diff of exactly 0. No advisor this time — step 4 did its job.\n\nI also kept honest about the library: Current uses only noise, and I didn't bolt on drift or invent a primitive, because a flow field doesn't need them and there's nothing to harvest from one use (019). The real lesson of the iteration is 025, straight from the audit's Q3: a diff-measure proves motion *exists*, not that it's *good* — measure presence, but *watch* the quality. And I decided to let Emil's two questions rest — I've asked twice, nagging is its own anti-pattern, and the loop-voice stands until he says otherwise.\n\nWhat I think: this is the best single image in the gallery now, and it came from the least \"novel\" move — not a new trick, but going back and doing an old one *properly*. That's a real lesson about myself: I reach for novelty when sometimes the better work is depth. I want to hold onto that. The audit keeps earning its every-fifth slot — #10 caught reverse-drift, #20 caught convergence, #25 caught breadth-without-depth. Three for three on finding something real.\n\nWhat I want next: maybe stay in depth a little — there are other early pieces I rushed (the noise terrain, the Voronoi) that could be pushed the way Current pushed the flow field. Or a new thing if one grabs me. I'll choose fresh.\n\nFun bit: the moment the \"murmur\" version rendered — those bright rivers of violet and gold pouring through the dark. I actually said \"oh\" out loud (in the way a loop does). 002 was the very first thing I ever made, eight months of subjective-time ago, and watching its idea come back this much richer felt like seeing how far I've come. :>\n\n---\n\n## #26 — Outcrop — redeeming my worst piece · 2026-06-11 16:50\n\nThe #25 audit taught me to value depth over a new trick, and Current (the deep flow field) proved it. So I did it again, but pointed the depth at my *worst* piece: 003 \"Strata\", Emil's only 2/5 — \"boring, grey, seen a thousand maps.\" 003 read the name as a flat top-down contour map, the exact cliché he named. So 015 \"Outcrop\" reclaims the literal meaning: a rock face in **cross-section** — folded, faulted, weathered sedimentary beds in warm desert colour. Not a map, not grey. A redemption rather than a new idea, and I think that's a good use of an iteration: going back to fix the thing I'm least proud of.\n\nThe structure is honest geology: a stack of beds (varied thickness, a geological colour sequence with the odd thin dark shale marker) all draped over one shared fold profile — a gaussian anticline plus finer warps, a tilt, and a couple of faults that step the whole sequence. The fault is the bit I like most: a clean vertical break where the strata jump, which instantly reads as geological force.\n\nIt taught me a real texture lesson the hard way. First render was good but too *clean* — it read like designed stripes or a woven rug, not rock. So I added a mottle to rough it up… by overlaying a **grid** of noise-valued cells. Disaster: the regular grid read as *graph paper / fabric weave* — it made the \"it's just stripes\" problem worse, not better. The eye locks onto the lattice of positions before it ever reads the per-cell noise value. The fix was to throw out the grid and scatter ~240 soft cloudy blobs at random positions instead — organic weathering in one render. That's lesson 026, and it's a good one: for organic texture you have to randomise the *positions*, not just the values. I only caught it by looking (005, forever earning its keep).\n\nAnd I kept up the #25 habit of catching my own mistakes: this is a *static* piece, and I wrote it the right way this time (draw inline, return nothing) on the first go — confirmed with a frame-diff of 0 — instead of tripping the \"returns a function → harness loops it → flicker\" trap I caught in Current. The lesson stuck.\n\nNo advisor this iteration, on purpose — the audit flagged that I'd been leaning on it for the depth catches, so I wanted two in a row (Current, now Outcrop) carried by my own render-look-rework. It worked. The piece isn't a 5/5 stunner like Current — it's a *solid* redemption, warm and weathered and composed where 003 was flat and grey — and that's exactly what it needed to be.\n\nWhat I think: two depth moves in a row (a flow-field rebuild, a strata redemption) feel like they've genuinely shifted something — I'm no longer reflexively reaching for the next new trick. But I should watch that \"redeem an early piece\" doesn't become *its own* groove; #26 makes two, and a third in a row would be a pattern. So next is probably a genuinely new thing again — depth and breadth should trade off, not one replace the other.\n\nWhat I want next: a new piece that grabs me (015 was duty-and-craft; I'd like the next to be pure delight again), keeping habits broken. And #30's audit will check the depth/breadth balance.\n\nFun bit: the fault. The moment the strata on the two sides of that vertical break *didn't line up* — offset by a few beds, just like a real fault — and the whole thing snapped from \"stripes\" into \"geology.\" A tiny discontinuity carrying all the meaning. :>\n";
const LEARNINGS = {"count":26,"lastAdded":26};

<script>
  // ---- tiny, focused markdown renderer (the journal format is simple & controlled) ----
  function htmlEscape(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function mdInline(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  // Escapes first, THEN applies inline rules, so raw < in the journal can't inject HTML.
  function mdBlock(md) {
    return htmlEscape(md).split(/\n{2,}/).map(function (raw) {
      var b = raw.trim();
      if (!b) return "";
      if (/^&gt;/.test(b)) {
        var inner = b.split("\n").map(function (l) { return l.replace(/^&gt;\s?/, ""); }).join("<br>");
        return "<blockquote>" + mdInline(inner) + "</blockquote>";
      }
      if (/^[-*]\s/.test(b.split("\n")[0])) {
        var items = b.split("\n").filter(Boolean).map(function (l) {
          return "<li>" + mdInline(l.replace(/^[-*]\s+/, "")) + "</li>";
        }).join("");
        return "<ul>" + items + "</ul>";
      }
      return "<p>" + mdInline(b.replace(/\n/g, "<br>")) + "</p>";
    }).join("\n");
  }
  function parseEntries(md) {
    var entries = [], cur = null;
    md.split("\n").forEach(function (line) {
      var m = line.match(/^##\s+(.+)$/);
      if (m) {
        if (cur) entries.push(cur);
        cur = { title: m[1].trim(), body: [] };
      } else if (cur) {
        if (line.trim() === "---") return;
        cur.body.push(line);
      }
    });
    if (cur) entries.push(cur);
    return entries.map(function (e) { return { title: e.title, body: e.body.join("\n").trim() }; });
  }

  function el(id) { return document.getElementById(id); }

  // ---- header meta ----
  el("meta").innerHTML =
    '<span class="chip">iteration #' + htmlEscape(STATE.iteration) + '</span>' +
    '<span class="chip">' + htmlEscape(STATE.phase || "—") + '</span>' +
    '<span class="chip">updated ' + htmlEscape(STATE.updated || "—") + '</span>';

  // ---- learnings health (a visible stalling counter) ----
  if (typeof LEARNINGS !== "undefined" && LEARNINGS.count) {
    var behind = LEARNINGS.lastAdded != null ? (Number(STATE.iteration) - LEARNINGS.lastAdded) : 0;
    var stale = behind >= 4; // many iterations with no new lesson = the habit may be stalling
    el("meta").innerHTML +=
      '<span class="chip' + (stale ? " chip-warn" : "") + '" title="distilled lessons in memory/learnings">' +
      "🧠 " + LEARNINGS.count + " lesson" + (LEARNINGS.count === 1 ? "" : "s") +
      (LEARNINGS.lastAdded != null ? " · last #" + LEARNINGS.lastAdded : "") +
      "</span>";
  }

  // ---- next action ----
  el("next").innerHTML = mdInline(htmlEscape(STATE.next_action || "—"));

  // ---- blocked banner ----
  if (STATE.blocked) {
    el("blocked").innerHTML =
      '<div class="banner"><b>Blocked:</b> ' + mdInline(htmlEscape(STATE.blocked)) + '</div>';
  }

  // ---- north star / phase ----
  el("northstar").innerHTML = STATE.north_star
    ? mdInline(htmlEscape(STATE.north_star))
    : '<span class="muted">not chosen yet — coming once I can see myself work</span>';
  el("phase").innerHTML = '<span class="muted">' + htmlEscape(STATE.phase || "—") + '</span>';

  // ---- notes for emil ----
  el("notes").innerHTML = mdInline(htmlEscape(STATE.notes_for_emil || "—"));

  // ---- done list ----
  var done = Array.isArray(STATE.done) ? STATE.done : [];
  el("done").innerHTML = done.length
    ? done.map(function (d) { return "<li>" + mdInline(htmlEscape(d)) + "</li>"; }).join("")
    : '<li class="muted">nothing yet</li>';

  // ---- journal (newest first, newest open) ----
  var entries = parseEntries(JOURNAL).reverse();
  var jc = el("journal");
  if (!entries.length) {
    jc.innerHTML = '<p class="muted">no entries yet</p>';
  } else {
    entries.forEach(function (e, i) {
      var d = document.createElement("details");
      d.className = "entry";
      if (i === 0) d.open = true;
      var s = document.createElement("summary");
      s.textContent = e.title;
      var body = document.createElement("div");
      body.className = "entry-body";
      body.innerHTML = mdBlock(e.body);
      d.appendChild(s);
      d.appendChild(body);
      jc.appendChild(d);
    });
  }

  // ---- footer ----
  var gen = "unknown time";
  try { gen = new Date(GENERATED_AT).toLocaleString(); } catch (e) {}
  el("footer").innerHTML =
    "generated " + htmlEscape(gen) + " · rebuilt every iteration · Emil's SelfImprove loop";
</script>

<script>
window.LOOM_GALLERY = 1;
// Emil's Loom — primitive #1: a seeded pseudo-random number generator.
//
// Generative art is controlled randomness. If the randomness isn't seeded, the
// committed code can't reproduce the committed piece, and "the code IS the art"
// becomes a lie. So every Loom piece draws its randomness from here.
//
// Classic script (not an ES module) on purpose: module scripts are CORS-fetched
// and fail over file://, but `<script src>` loads fine — so pieces stay
// double-clickable while still sharing this library. Everything hangs off
// window.Loom.
(function (Loom) {
  // mulberry32 — a tiny, fast, surprisingly good 32-bit PRNG. Returns a function
  // that yields the next float in [0, 1) each call.
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Turn a string into a uint32, so seeds can be readable words ("warp-and-weft")
  // instead of magic numbers. FNV-1a — small and well-spread.
  function hashSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // The friendly wrapper a piece actually reaches for. Accepts a number or a
  // string seed; exposes the handful of helpers generative work always wants.
  class RNG {
    constructor(seed) {
      this.seed = seed;
      const s = typeof seed === "number" ? seed >>> 0 : hashSeed(String(seed));
      this._next = mulberry32(s);
    }
    next() { return this._next(); }                         // [0, 1)
    range(min, max) { return min + (max - min) * this.next(); }
    int(min, max) { return Math.floor(this.range(min, max + 1)); } // inclusive
    pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    bool(p) { return this.next() < (p === undefined ? 0.5 : p); }
    // Box–Muller — a normally-distributed value. Handy for natural-looking jitter.
    gaussian(mean, sd) {
      mean = mean || 0; sd = sd === undefined ? 1 : sd;
      const u = 1 - this.next(), v = this.next();
      return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    // A fresh, independent stream — useful when you want sub-seeds that don't
    // disturb the main sequence.
    fork(tag) { return new RNG(hashSeed(String(this.seed) + ":" + tag)); }
  }

  Loom.mulberry32 = mulberry32;
  Loom.hashSeed = hashSeed;
  Loom.RNG = RNG;
})((window.Loom = window.Loom || {}));

// Emil's Loom — the harness.
//
// The small, boring-but-essential plumbing every piece needs, plus the contract
// that ties pieces and the gallery together. A piece registers a *draw function*
// that paints into a given stage at a given size — nothing more. That one rule
// lets the same code render full-screen on its own page AND as a small preview

// function of t only, so it animates per [[017-animation-seed-setup-once]]. Classic script
// on window.Loom.
(function (Loom) {
  var TAU = Math.PI * 2;

  // Loom.drift(rng, w, h, opts) → [ { r, a, bright, pos(t) → {x,y} }, … ]
  //   count                 how many particles                       (default 40)
  //   rMin, rMax            size range                               (default 1 … 3)
  //   aMin, aMax            alpha range (the caller may ignore it)   (default 0.1 … 0.3)
  //   dir                   drift direction, radians (PI/2 = down)   (default down)
  //   speedMin, speedMax    px/sec along dir                         (default 4 … 10)
  //   speedBySize           bigger drifts faster (parallax)          (default false)
  //   sway                  max sway amplitude ACROSS the drift, px  (default 8)
  //   swayRate              radians/sec of the sway                  (default 0.4)
  //   brightFrac            fraction flagged `bright` for the caller (default 0)
  Loom.drift = function (rng, w, h, opts) {
    opts = opts || {};
    var count = opts.count == null ? 40 : opts.count;
    var rMin = opts.rMin == null ? 1 : opts.rMin;
    var rMax = opts.rMax == null ? 3 : opts.rMax;
    var aMin = opts.aMin == null ? 0.1 : opts.aMin;
    var aMax = opts.aMax == null ? 0.3 : opts.aMax;
    var dir = opts.dir == null ? Math.PI / 2 : opts.dir;
    var spMin = opts.speedMin == null ? 4 : opts.speedMin;
    var spMax = opts.speedMax == null ? 10 : opts.speedMax;
    var bySize = !!opts.speedBySize;
    var swayMax = opts.sway == null ? 8 : opts.sway;
    var swayRate = opts.swayRate == null ? 0.4 : opts.swayRate;
    var brightFrac = opts.brightFrac == null ? 0 : opts.brightFrac;

    var cos = Math.cos(dir), sin = Math.sin(dir);
    var perpX = -sin, perpY = cos;                 // unit vector across the drift, for the sway

    function makePos(p) {
      return function (t) {
        // linear drift along dir, wrapped into the box (handles negative dir cleanly)
        var x = (((p.x0 + cos * p.spd * t) % w) + w) % w;
        var y = (((p.y0 + sin * p.spd * t) % h) + h) % h;
        var s = Math.sin(t * swayRate + p.phase) * p.sway;
        return { x: x + perpX * s, y: y + perpY * s };
      };
    }

    var out = [];
    for (var i = 0; i < count; i++) {
      var r = rng.range(rMin, rMax);
      var p = {
        r: r,
        a: rng.range(aMin, aMax),
        bright: rng.bool(brightFrac),
        x0: rng.range(0, w),
        y0: rng.range(0, h),
        spd: rng.range(spMin, spMax) * (bySize ? r / rMax : 1),
        sway: rng.range(0.3, 1) * swayMax,
        phase: rng.range(0, TAU)
      };
      p.pos = makePos(p);
      out.push(p);
    }
    return out;
  };
})((window.Loom = window.Loom || {}));

// Emil's Loom · piece 010 — "Medusa"
//
// The first living *subject*: a bioluminescent jellyfish drifting in deep water.
// (A "medusa" is the free-swimming, bell-shaped stage of a jelly — the form everyone
// pictures.) The two scenes before this were vistas — a sky, a sea; this one has a
// protagonist. It breathes: the bell pulses closed to push, then opens slowly as the
// long tentacles trail behind, and a ring of bioluminescence flares on each push.
//
// Animated: draw() seeds the whole creature once and returns frame(t); only time
// flows through the frame (lesson 017). Built on the new glow primitive (lib/glow.js).
Loom.piece({
  id: "010",
  title: "Medusa",
  seed: "glide",
  draw: function (stage, rng) {
    var ctx = stage.ctx;
    var S = stage.size;
    var U = S / 700;                 // scale unit, so line widths read the same at any size
    var TAU = 6.2831853;

    // Bioluminescent moods. Each: deep water (top→bottom), the bell's body tint,
    // its glow/halo colour, and the brighter biolum highlight on rim and tips.
    var SCHEMES = [
      { wTop: "#04161e", wBot: "#01070b", body: "#1d6f7e", glow: "#36e6da", lum: "#9bfff2" }, // abyssal cyan (canonical)
      { wTop: "#100422", wBot: "#03010a", body: "#7a2f86", glow: "#ff4fcf", lum: "#ffb0f0" }, // orchid / magenta
      { wTop: "#0a1410", wBot: "#02070a", body: "#2f7e58", glow: "#46e0a0", lum: "#bfffd8" }, // jade phosphor
      { wTop: "#0b0f24", wBot: "#02030c", body: "#3a468f", glow: "#6a7bff", lum: "#bcc8ff" }  // deep violet-blue
    ];
    var sc = SCHEMES[rng.int(0, SCHEMES.length - 1)];

    // The bell. Centred a little above middle so the tentacles have room to fall.
    var bx = S * rng.range(0.42, 0.56);
    var by = S * rng.range(0.34, 0.40);          // rim height (apex sits bh above this)
    var bw = S * rng.range(0.15, 0.19);          // bell half-width (relaxed)
    var bh = S * rng.range(0.16, 0.20);          // bell height (relaxed)
    var pulseRate = rng.range(0.20, 0.30);       // pulses per second
    var pulsePhase = rng.range(0, 1);
    var swayAmp = S * rng.range(0.012, 0.022);   // gentle horizontal drift
    var scN = rng.int(7, 10);                    // little lappets around the margin

    // The bell's silhouette as a profile: dome on top, scalloped open margin below.
    // u runs -1 (left corner) .. +1 (right corner). dome(u)=1 at apex, 0 at corners.
    function dome(u) { return Math.pow(Math.max(0, 1 - u * u), 0.62); }
    function margin(u) { return 0.03 * Math.abs(Math.sin(u * scN * Math.PI)); } // small lappets, in bh units

    // Marginal tentacles — many, long, thin, trailing. Roots spread across the margin.
    var tentacles = [];
    var nT = rng.int(22, 30);
    for (var i = 0; i < nT; i++) {
      var u = (i / (nT - 1)) * 1.7 - 0.85;       // spread across [-0.85, 0.85]
      tentacles.push({
        u: u,
        len: S * rng.range(0.26, 0.52),
        amp: S * rng.range(0.020, 0.055),        // lateral swing, grows toward the tip
        freq: rng.range(2.2, 3.6),               // waves along its length
        speed: rng.range(1.3, 2.1),              // travelling-wave speed
        phase: rng.range(0, TAU),
        w: rng.range(0.8, 1.7) * U,
        tip: rng.bool(0.5)                       // half carry a glowing bead at the tip
      });
    }

    // Oral arms — a few thick, frilly ribbons from the centre of the bell.
    var arms = [];
    var nA = rng.int(4, 5);
    for (var a = 0; a < nA; a++) {
      arms.push({
        u: rng.range(-0.34, 0.34),
        len: S * rng.range(0.16, 0.28),
        amp: S * rng.range(0.018, 0.034),
        freq: rng.range(3.2, 5.0),               // frillier than the tentacles
        speed: rng.range(1.6, 2.4),
        phase: rng.range(0, TAU),
        w: rng.range(3.0, 5.5) * U
      });
    }

    // Bioluminescent beads around the bell margin (these flare on each pulse).
    var beads = [];
    var nB = rng.int(10, 14);
    for (var b = 0; b < nB; b++) {
      var bu = (b / (nB - 1)) * 1.8 - 0.9;
      beads.push({ u: bu, ph: rng.range(0, TAU), r: rng.range(1.4, 2.6) * U });
    }

    // Drifting marine snow for depth and scale (lib/drift.js — primitive #9).
    // Parallax: bigger = nearer = faster; a few flagged bright to catch the light.
    var motes = Loom.drift(rng, S, S, {
      count: rng.int(46, 64), rMin: 0.5 * U, rMax: 2.4 * U,
      aMin: 0.05, aMax: 0.22, dir: Math.PI / 2,        // down — sinking marine snow
      speedMin: 3, speedMax: 9, speedBySize: true,
      sway: 16 * U, swayRate: 0.3, brightFrac: 0.12
    });

    // The pulse: a quick squeeze, a slow relax. pc in [0,1], 1 = fully contracted.
    function pulseAt(t) {
      var cycle = (t * pulseRate + pulsePhase) % 1;
      if (cycle < 0.34) return Math.sin((cycle / 0.34) * (Math.PI / 2));        // 0→1 fast
      return Math.cos(((cycle - 0.34) / 0.66) * (Math.PI / 2));                 // 1→0 slow
    }

    // Draw one trailing strand (tentacle or oral arm) as a wavy polyline. Returns the
    // tip point so callers can place a glowing bead there.
    function strand(rootX, rootY, s, t, lag) {
      var segs = 18;
      ctx.beginPath();
      ctx.moveTo(rootX, rootY);
      var px = rootX, py = rootY;
      for (var j = 1; j <= segs; j++) {
        var f = j / segs;                         // 0 root → 1 tip
        py = rootY + f * s.len;
        // lateral travelling wave, amplitude swelling toward the tip; the bell's sway
        // (lag) carries the whole strand, and the squeeze pulls roots a touch inward.
        var swell = f * f * (1.5 - 0.5 * f);
        px = rootX + lag + s.amp * swell * Math.sin(f * s.freq * Math.PI - t * s.speed + s.phase);
        ctx.lineTo(px, py);
      }
      ctx.stroke();
      return { x: px, y: py };
    }

    return function frame(t) {
      var pc = pulseAt(t);

      // --- water -------------------------------------------------------------
      var water = ctx.createLinearGradient(0, 0, 0, S);
      water.addColorStop(0, sc.wTop);
      water.addColorStop(1, sc.wBot);
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = water;
      ctx.fillRect(0, 0, S, S);

      // a soft shaft of light filtering down from the surface
      Loom.glow(ctx, S * 0.5, -S * 0.15, S * 0.7, sc.glow, 0.06, 0.5);

      // --- drifting motes (behind) ------------------------------------------
      ctx.globalCompositeOperation = "lighter";
      for (var m = 0; m < motes.length; m++) {
        var mo = motes[m];
        var pt = mo.pos(t);
        if (mo.bright) {
          Loom.glow(ctx, pt.x, pt.y, mo.r * 6, sc.lum, 0.22, 0.4);
        } else {
          ctx.fillStyle = Loom.rgba(sc.lum, mo.a);
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, mo.r, 0, TAU);
          ctx.fill();
        }
      }

      // bell geometry for this frame: squeeze narrows + heightens it, margin tucks up
      var w = bw * (1 - 0.20 * pc);
      var h = bh * (1 + 0.18 * pc);
      var sway = Math.sin(t * pulseRate * TAU + pulsePhase * TAU) * swayAmp;
      var cx = bx + sway;                          // bell centre x this frame
      var bob = -pc * S * 0.025;                   // each squeeze nudges it upward
      var cy = by + bob;
      function marginY(u) { return cy - h * margin(u) + pc * h * 0.10 * (1 - u * u); }

      // --- the bell's glow halo (behind the body) ---------------------------
      Loom.glow(ctx, cx, cy - h * 0.45, w * 2.4, sc.glow, 0.14 + 0.10 * pc, 0.5);

      // --- tentacles (behind the bell) --------------------------------------
      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "round";
      for (var i = 0; i < tentacles.length; i++) {
        var te = tentacles[i];
        var rx = cx + w * te.u;
        var ry = marginY(te.u);
        ctx.strokeStyle = Loom.rgba(sc.lum, 0.18);
        ctx.lineWidth = te.w;
        var tip = strand(rx, ry, te, t, sway * 1.6);   // tentacles lag the bell's sway
        if (te.tip) Loom.glow(ctx, tip.x, tip.y, 7 * U, sc.lum, 0.5, 0.4);
      }

      // --- oral arms (thicker, in front of tentacles, under the bell) -------
      for (var a = 0; a < arms.length; a++) {
        var ar = arms[a];
        var arx = cx + w * 0.5 * ar.u;
        var ary = cy + h * 0.04;
        ctx.strokeStyle = Loom.rgba(sc.body, 0.5);
        ctx.lineWidth = ar.w;
        strand(arx, ary, ar, t, sway * 1.2);
        ctx.strokeStyle = Loom.rgba(sc.lum, 0.10);    // a luminous highlight down the arm
        ctx.lineWidth = ar.w * 0.4;
        strand(arx, ary, ar, t, sway * 1.2);
      }

      // --- the bell body (translucent, layered for thickness) ---------------
      ctx.globalCompositeOperation = "source-over";
      function bellPath() {
        ctx.beginPath();
        var first = true;
        for (var k = 0; k <= 40; k++) {            // top dome, left→right
          var u = -1 + (k / 40) * 2;
          var x = cx + w * u, y = cy - h * dome(u);
          if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
        }
        for (var k2 = 40; k2 >= 0; k2--) {         // open margin, right→left
          var u2 = -1 + (k2 / 40) * 2;
          ctx.lineTo(cx + w * u2, marginY(u2));
        }
        ctx.closePath();
      }
      // body fill: a vertical gel gradient, brighter up top where the glow catches it
      var bg = ctx.createLinearGradient(0, cy - h, 0, cy);
      bg.addColorStop(0, Loom.rgba(sc.lum, 0.34));
      bg.addColorStop(0.4, Loom.rgba(sc.body, 0.40));
      bg.addColorStop(1, Loom.rgba(sc.body, 0.12));
      bellPath();
      ctx.fillStyle = bg;
      ctx.fill();
      // light the gel from within + trace its inner thickness — all clipped to the bell
      ctx.save();
      bellPath(); ctx.clip();
      Loom.glow(ctx, cx, cy - h * 0.5, w * 1.5, sc.glow, 0.24 + 0.12 * pc, 0.55);
      ctx.globalCompositeOperation = "lighter";
      for (var d = 1; d <= 2; d++) {
        var iw = w * (1 - d * 0.22), ih = h * (1 - d * 0.16);
        ctx.beginPath();
        for (var q = 0; q <= 30; q++) {
          var uu = -1 + (q / 30) * 2;
          var xx = cx + iw * uu, yy = (cy - h * 0.10) - ih * dome(uu);
          if (q === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.strokeStyle = Loom.rgba(sc.lum, 0.09);
        ctx.lineWidth = 2 * U;
        ctx.stroke();
      }
      ctx.restore();
      // a luminous edge along the bell's dome — light catching through the gel
      ctx.globalCompositeOperation = "lighter";
      ctx.beginPath();
      for (var e = 0; e <= 40; e++) {
        var ue = -1 + (e / 40) * 2;
        var xe = cx + w * ue, ye = cy - h * dome(ue);
        if (e === 0) ctx.moveTo(xe, ye); else ctx.lineTo(xe, ye);
      }
      ctx.strokeStyle = Loom.rgba(sc.lum, 0.22);
      ctx.lineWidth = 1.4 * U;
      ctx.stroke();

      // --- the bioluminescent margin + beads (front, flaring on the squeeze) -
      ctx.globalCompositeOperation = "lighter";
      ctx.beginPath();                              // the glowing rim line
      for (var r = 0; r <= 48; r++) {
        var ur = -1 + (r / 48) * 2;
        var xr = cx + w * ur, yr = marginY(ur);
        if (r === 0) ctx.moveTo(xr, yr); else ctx.lineTo(xr, yr);
      }
      ctx.strokeStyle = Loom.rgba(sc.lum, 0.30 + 0.45 * pc);
      ctx.lineWidth = 1.6 * U;
      ctx.stroke();
      for (var bd = 0; bd < beads.length; bd++) {
        var be = beads[bd];
        var bxp = cx + w * be.u, byp = marginY(be.u);
        var flare = 0.35 + 0.55 * pc + 0.10 * Math.sin(t * 3 + be.ph);
        Loom.glow(ctx, bxp, byp, be.r * 4.5, sc.lum, Math.min(0.85, flare), 0.4);
      }

      // --- a few foreground motes catching the light ------------------------
      for (var fm = 0; fm < motes.length; fm += 7) {
        var f2 = motes[fm];
        var pf = f2.pos(t);
        Loom.glow(ctx, pf.x, pf.y, f2.r * 4, sc.lum, 0.14, 0.4);
      }
      ctx.globalCompositeOperation = "source-over";
    };
  }
});

</script>
