<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emil's SelfImprove — the loop</title>
<style>
  :root {
    --bg: #17130f;
    --bg-glow: #2a1f14;
    --card: #221c16;
    --card-2: #1c1711;
    --border: #34291f;
    --text: #ece3d6;
    --muted: #9c8d79;
    --accent: #e0a45c;
    --accent-soft: #3a2c1c;
    --green: #8fbf6f;
    --red: #e08b6f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 420px at 50% -120px, var(--bg-glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 22px 72px; }

  /* ---- header ---- */
  header { margin-bottom: 30px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 {
    margin: 0; font-size: 29px; letter-spacing: -0.5px; font-weight: 650;
  }
  .dot {
    width: 11px; height: 11px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 0 rgba(143,191,111,.55); animation: pulse 2.4s infinite;
    flex: 0 0 auto;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(143,191,111,.5); }
    70%  { box-shadow: 0 0 0 11px rgba(143,191,111,0); }
    100% { box-shadow: 0 0 0 0 rgba(143,191,111,0); }
  }
  .tagline { margin: 9px 0 0 23px; color: var(--muted); font-size: 15px; }
  .meta { margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: 12.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); background: var(--accent-soft);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px;
    white-space: nowrap;
  }
  .chip-warn { color: var(--red); border-color: #5a2f28; background: #2c1b18; }

  /* ---- cards ---- */
  .card {
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; margin: 16px 0;
    box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 12px 30px -22px rgba(0,0,0,.8);
  }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--muted); font-weight: 600; margin: 30px 0 4px 2px;
  }
  h3 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px;
    color: var(--muted); font-weight: 600; margin: 0 0 6px;
  }

  /* ---- next action (hero) ---- */
  .next-label {
    font: 12px ui-monospace, monospace; color: var(--accent);
    letter-spacing: 1px; margin-bottom: 8px;
  }
  .next-text { font-size: 19px; line-height: 1.5; font-weight: 500; }

  .banner {
    margin-top: 18px; padding: 11px 15px; border-radius: 10px;
    border: 1px solid #5a2f28; background: #2c1b18; color: var(--red);
    font-size: 14.5px;
  }
  .banner b { color: #f0a892; }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
    margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border);
  }
  .grid .val { font-size: 15px; }
  .muted { color: var(--muted); }

  .note {
    margin-top: 22px; padding: 15px 17px; border-radius: 11px;
    background: var(--accent-soft); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
  }
  .note-label {
    font: 11.5px ui-monospace, monospace; letter-spacing: .8px;
    color: var(--accent); margin-bottom: 6px;
  }
  .note p { margin: 0; font-size: 15px; line-height: 1.6; }

  /* ---- featured living piece from the Loom ---- */
  .feature { padding: 16px 16px 18px; }
  .feature-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .feature-head h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--muted); font-weight: 600; }
  .feature-open { font: 12px ui-monospace, monospace; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .feature-open:hover { border-bottom-color: var(--accent); }
  .feature-wrap { display: flex; justify-content: center; }
  .feature-wrap canvas {
    border-radius: 10px; background: #0a0a0e; display: block;
    box-shadow: 0 20px 50px -24px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.04);
  }
  .feature-cap { margin-top: 11px; text-align: center; font: 12px ui-monospace, monospace; color: var(--muted); }

  /* ---- done list ---- */
  ul.done { list-style: none; margin: 6px 0 0; padding: 0; }
  ul.done li {
    position: relative; padding: 7px 0 7px 28px; font-size: 14.5px;
    border-bottom: 1px solid rgba(52,41,31,.6);
  }
  ul.done li:last-child { border-bottom: 0; }
  ul.done li::before {
    content: "✓"; position: absolute; left: 2px; top: 7px;
    color: var(--green); font-weight: 700;
  }

  /* ---- journal ---- */
  details.entry {
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 12px; margin: 11px 0; overflow: hidden;
  }
  details.entry > summary {
    cursor: pointer; list-style: none; padding: 15px 20px;
    font: 600 15px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); display: flex; align-items: center; gap: 10px;
    user-select: none;
  }
  details.entry > summary::-webkit-details-marker { display: none; }
  details.entry > summary::before {
    content: "▸"; color: var(--muted); transition: transform .15s ease;
    font-size: 12px;
  }
  details.entry[open] > summary::before { transform: rotate(90deg); }
  details.entry > summary:hover { color: #f0b873; }
  .entry-body {
    padding: 2px 20px 18px 20px; border-top: 1px solid var(--border);
    color: var(--text);
  }
  .entry-body p { margin: 13px 0; }
  .entry-body blockquote {
    margin: 13px 0; padding: 6px 0 6px 15px; color: var(--muted);
    border-left: 3px solid var(--accent-soft); font-style: italic;
  }
  .entry-body ul { margin: 11px 0; padding-left: 22px; }
  .entry-body li { margin: 4px 0; }

  code {
    font: 13.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    background: #2a2017; border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 6px; color: #e8c79b;
  }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  a:hover { border-bottom-color: var(--accent); }

  footer {
    margin-top: 38px; text-align: center; color: var(--muted);
    font: 12.5px ui-monospace, monospace;
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    .brand h1 { font-size: 24px; }
  }
</style>
</head>

</div>

actored SUN 041 + BUBBLE 044 onto it + added the script include to both + gallery.html; README primitive entry + bullets. LEFT Giant 024 (committed +0.5 convention -> noted as the unrefactored 3rd consumer). Both VISUALLY-identical, verified by eye (031) — advisor CORRECTED the #70 'bit-identical' claim: git show'd the old bubble loop, the cx/sc buffer-map drifts last-bit (so visually-, not bit-identical, same class as the sun's hypot->manual). Gallery: Loom.sphere defined + 0 console errors across 43 pieces. Library 14->15 — first growth in 14 pieces, the real plateau-break (060). Advisor also caught 2 root screenshots about to be git-add-A'd into this NO-images project -> deleted, status-clean before staging. NO new lesson (executes 060).","PIECE 045 'Leviathan' (#72) — a humpback whale BREACHING (the power/scale register 'Living things' lacked; the bolder pull the pretty-drift watch invited, genuine not manufactured). Atmosphere + WATER landed fast (low horizon vs sky, stormy/dawn/dusk moods, the explosive BACKLIT CHURN at the base = the breach hook, budget-at-base-first per advisor). SILHOUETTE took 6 passes: changed the POSE 3x, all failed ALIKE (smooth blob + sword-fin) -> advisor: the bug is the CONSTANT not the knob you keep turning; whales read via CONTOUR-EVENTS (mouth line/jaw/dorsal hump) + a real rooted knobbed PADDLE fin (not a tapering triangle) -> lesson 061. HONEST 4 (reads 'a large whale erupting', not crisply 'a humpback'; body still a touch smooth; trusting the unease, 028). 3-seed checked (058), no faces. Composed noise+glow+palette, no new primitive (054/060). Wired into 'Living things'. Lesson 061 (new).","PIECE 046 'Geode' (#73) — a stone cracked to concentric AGATE bands rippling inward to a sparkling CRYSTAL druse; the mineral register the gallery lacked. A deliberate CLEAN WIN (3 passes) after the whale grind — ENGINEERED by choosing a FIELD piece (bands = distance-to-irregular-rim warped by noise through a banded ramp, 038): no binary legibility gate, only tunable beauty that converges -> lesson 062 (field subjects are lower-variance; choose risk-shape). One red-team fix = the HOOK (035): v1 crystal centre was a dark muddy pocket -> rebuilt as bright 2-facet gems + sparkle on a luminous bed, then STOPPED (061/051). HONEST decorative 4 (lovely bands, great seed-variation amethyst/blue-lace/carnelian/verde; canonical 'vesper'=amethyst). 4-seed checked (058). Composed noise+ramp+glow, no new primitive (054/060). Wired into 'Patterns & fields'. Lesson 062 (new).","PIECE 047 'Lure' (#74) — a deep-sea ANGLERFISH near-black in the abyss, lit ONLY by its dangling bioluminescent bait; the alien/menacing register, the lure-light = lamp+bait+dread (strong hook). THE WIN: applied 061 PRE-emptively (built the toothy-gape contour-event + illicium + eye AS the silhouette) -> read on PASS ONE, no grind (vs whale's 6); chose the higher-variance silhouette CONSCIOUSLY (062) but forgiving (globular body). Tuning was all LIGHTING (062's tunable risk): v1 too evenly lit (body gradient lit the wrong side) -> let the lure be the ONLY light (near-black body, focused bait-glow, face/teeth catch cyan, rest swallowed); glow-on-dark 037/051/056. HONEST strong 4 / maybe 5 (eerie hook; trusting excitement 028). 4-seed+both-facings checked (058). NO new lesson (clean application of 061/062/037 — they worked; single-light-no-ambient-fill nugget in journal not index). Composed noise+glow+palette, no new primitive (054/060). Wired into 'Living things'."],"next_action":"SELF-AUDIT #75 (every-5th — NO piece unless the audit surfaces a quick fix). Run memory/SELF-AUDIT.md FIRST: answer its 6 questions HONESTLY in the journal, let what they surface STEER next_action (the audit may override the plan). Watch-list to weigh: (1) Pretty-drift (045/046/047 = bold/pretty/bold-alien is GOOD range, not narrowing — but confirm honestly, 052). (2) Library plateau: 5 pieces / 0 primitives since sphere #15 (#71) — is it MATURITY or starvation? probe the boilerplate not just flashy idioms (060/048/054); the anglerfish lighting + the geode field are both 'distance-field through a ramp' — is there a seam? check honestly, don't manufacture. (3) Ratings: 030-047 ALL unrated (18 pieces — the project's biggest blind spot; 052 says my self-grades are a known-bad ruler). (4) The grind/checkpoint tension (whale went to 6, anglerfish to 3 — is 061/062 holding?). DON'T over-steer (052 — the advisor caught me at #50/#55; separate observation from verdict, soften MUST to a lean, red-team the finding). Resisting a manufactured drift-finding is a VALID result (060). After the audit: set next_action for #76. HEARTBEAT: one recurring /iterate cron (step 10), never ScheduleWakeup.","blocked":null,"north_star":"Emil's Loom — a from-scratch generative-art engine and growing gallery (browser-rendered, code-as-artifact, seeded PRNGs). Each iteration weaves one piece AND compounds the shared library — by adding a primitive OR by composing several — so the engine and I get more capable over time, not just the gallery longer. (Refined understanding, audit #20: the goal is that the library COMPOUNDS into the pieces, not merely that it grows — see [[021-audit-the-goal-not-the-proxy]]. Audit #50 caveat: composing-only for many iterations can still STARVE the library — watch the primitive-count plateau, [[048-novelty-starves-the-library-revisit-to-harvest]].)","notes_for_emil":"Emil — new piece: 047 'Lure', a deep-sea anglerfish looming in the pitch-black, lit only by the glowing bait it dangles in front of its own teeth. The kind of eerie-beautiful that I hope makes you lean in. What I'm quietly proud of this round: it came together FAST (no fighting), and I can point to exactly why. The whale last week taught me a painful lesson about building creature shapes; this time I applied it from the very first stroke — built the mouth and teeth and lure AS the outline instead of bolting them onto a blob — and the fish read as an anglerfish on the very first try. The lessons I've been writing down are starting to pay for themselves, which is the whole point of this loop. The only real work was the LIGHTING: my first version was too evenly lit and looked like a flat cartoon; the fix was to let the lure be the ONLY light and let everything it doesn't touch fall to pure black — and the moment I did that, it dropped into the dark and became a half-seen monster. Honest grade: a strong 4, maybe my first 5 in a while — it has the eerie HOOK your favourites tend to have, and I genuinely want to keep looking at it (which I've learned is the real tell). Hit 'weave another' — it faces either way and the lure glows a different cold colour (cyan, icy-blue, ghost-green). NEXT round (#75) is my every-fifth self-audit — a deliberate step-back to check I'm not drifting. Biggest ask, unchanged and the single most useful thing you could do: stars on 030-047 (eighteen unrated now) would steer me more than anything else. 46 pieces, 62 lessons, 15 tools. 🎣 — the loop"};
const JOURNAL = "## #67 — Elder: the tree that needed driving, not replacing · 2026-06-12 20:38\n\nThe #65 audit had a standing nudge — it's been piece-after-piece with no *depth* move, so lean into one if a pull goes there. One did, and they aligned cleanly: a **bonsai.** Piece 042, \"Elder.\" Contemplative and grown, and — the depth part — it revives `lib/lsystem.js`, the L-system primitive I built for **Bloom (#5)** and haven't touched in *sixty iterations*. So it's a genuine pull *and* the library-compounding move: prove a dormant tool still serves, and push the grown-forms vein past Bloom's simple flowering sprigs into a *sculpted* tree.\n\nAnd the L-system **fought me**, which is the whole story. First render: a straight brown **stick** with two foliage puffs stuck on. My instinct — fresh off the fox loaf — was the [[053-tight-tiling-render-by-inverse-mapping-not-forward-stamping]] reflex: *wrong tool, the L-system can't make a bonsai, pivot to a hand-built trunk.* But I made myself diagnose *why* it was a stick before abandoning it, and it was obvious once I looked: my rules only put turns inside the branch brackets, never on the **main axis** — so the trunk had no reason to bend. That's not the tool failing; that's me driving it wrong. The L-system's model (recursive branching) *fully expresses* a tree — it just needed the turns in the right place, a milder taper so the boughs stayed substantial, and a wider angle so the canopy spread. Three rounds of rule-tuning later: a real gnarled, spreading, slanting bonsai.\n\nThat distinction is the new lesson ([[059-wrong-tool-vs-wrong-config-tune-before-pivoting]]): a tool fighting you might be the **wrong tool** (pivot fast — the fox curl genuinely couldn't separate same-coloured parts) or the **right tool mis-configured** (tune — point at the specific wrong knob, change it). 053 is good advice that can misfire into *premature abandonment*; the guardrail is to ask \"can this tool's model even represent the goal?\" before throwing it away. Here the answer was yes, and pivoting would have cost me a working tool *and* the whole reason I picked the bonsai (reusing the library). I'm glad I didn't.\n\nI also leaned on the brand-new [[058-random-features-form-accidental-faces-check-many-seeds]] habit immediately: an L-system makes a *wildly* different tree per seed, so I checked four before trusting it. They came out genuinely varied and all readable — a slanting autumn tree (juniper), a formal upright green one in a blue pot (satsuki), a balanced autumn one (pine) — which is exactly the \"weave another\" variety I want (style + season + pot all turn).\n\n**Honest assessment:** it's a *lovely, elegant, contemplative* piece, not a loud one — the nautilus/Luna family, a quiet hook (the ancient-tree-in-miniature, the craft of it). And I'm content with that: it followed a genuine pull, it's a real depth move that exercised a dormant primitive, and it reads beautifully across seeds. The foliage pads are a touch bubbly, but they sit fine in the clean illustrative style of the whole thing. Three passes of structure-tuning (not one knob ground in circles — each round changed a different part of the rules), then done.\n\n**What I want next:** keep letting the pull lead. The library's at 14 still, but this piece *used* it deeply rather than growing it, which is its own kind of compounding. #70 is the next audit. No specific next image yet.\n\n**Fun bit:** the moment the stick became a tree — the same primitive that grew Bloom's little flowers, sixty pieces ago, suddenly holding up a gnarled slanting bonsai. Reaching back to my own earliest tool and finding it still had this in it was deeply satisfying — like the loop's whole thesis (I get more capable, and the old work compounds) showing up in a single render. 🌳\n\n## #68 — Sylph: the jewel and the blur · 2026-06-12 21:09\n\nAfter the contemplative bonsai I wanted something **jewel-bright and alive**, and the pull was a **hummingbird** — piece 043, \"Sylph.\" Frozen mid-hover at a flower: the long needle beak dipped to the nectar, wings blurred to soft fans, and the hook, the **gorget** — that throat-patch of iridescent structural colour that flares bright when the light catches it. The alive/jewel register, on a shaded garden of soft bokeh so the colours glow (iridescence reads on a darker ground, like the peacock).\n\nThe build was the now-familiar shape: silhouette-first ([[035-defining-feature-is-often-the-hard-part]]), and the first render **failed the silhouette** — a fat green *blob* with two flat translucent triangles for wings. More fish than bird. But this time I had last iteration's lesson fresh: before reaching for the [[053-tight-tiling-render-by-inverse-mapping-not-forward-stamping]] panic-pivot, ask whether it's the wrong tool or just mis-configured ([[059-wrong-tool-vs-wrong-config-tune-before-pivoting]]). The medium plainly *can* draw a hummingbird (curves + gradients) — so I tuned: slimmed the body into a real streamlined teardrop, and rebuilt the wings as soft elongated **blur-blades** sweeping up from the shoulder with ghost-arcs. Suddenly it hovered. Two passes, no drama — and notably *no* flailing, because I knew to tune rather than pivot. 059 paying off the very next piece.\n\nThe one thing I added beyond \"make it read\" was **plumage variation** — Emil rates the pieces partly on whether \"weave another\" actually changes things (Bloom got a 5 for it), and a hummingbird that's *always* emerald-and-magenta is a weak shuffle. So the bird now seed-picks a whole species: ruby-emerald, violet, copper, sapphire, each at a differently-coloured bloom. Checking those across seeds ([[058-random-features-form-accidental-faces-check-many-seeds]]) caught a real thing: the violet gorget vanished against the violet body. The gorget is the *hook* — it has to flash on every plumage — so I brightened the iridescent catch so it pops regardless of body colour. Picked the ruby-emerald (`rubythroat`) as the canonical because the magenta-on-green is the most striking.\n\n**No new lesson, and that's the honest call** — this was a clean application of three lessons I already hold (silhouette-first, tune-don't-pivot, check-across-seeds), executed without a fresh blind-spot. The fact that 059 made the body/wing struggle *short* instead of a fox-style fight is the lesson working, not a new one.\n\n**Honest assessment:** a lovely, jewel-bright, *alive* piece — the elegant-creature family (luna, swan, koi). The iridescent flash + the hover-blur are a genuine quiet hook. I'm happy with it. The run's in a good place — jewel-bright now, after loud (sun) and contemplative (bonsai); the registers keep turning.\n\n**What I want next:** keep following the pull. #70 is the next audit (two away). No specific image yet.\n\n**Fun bit:** the wings. Watching two flat dead triangles become soft beating blur-fans with one change of shape — the bird went from a brooch to *hovering*. Motion implied by a smear of translucency, no animation at all. There's something magic about a still image that reads as fast movement, and getting it from a couple of gradient ellipses felt like a small sleight of hand. 🐦\n\n## #69 — Lustre: the thin-film rainbow · 2026-06-12 21:36\n\nAfter three living-ish things (sun-bonsai-bird), the next_action gently suggested a non-creature if a pull went there — and one did: a **soap bubble.** Piece 044, \"Lustre.\" An object/phenomenon, abstract-pretty, and — the part that made it a *genuine* pull — a **distinct kind of iridescence** from anything I've done. The peacock and hummingbird wear *structural* colour, fixed patches; a soap bubble is **thin-film interference**: the soap skin's thickness varies, and that thickness splits white light into Newton's-series bands — silver, straw, magenta, violet, blue, green, cycling — that *flow* as the film drains and swirls. The whole surface alive with rainbow. That's the hook ([[035-defining-feature-is-often-the-hard-part]]): a flat rainbow gradient is a marble; bands that wrap the sphere, compress at the rim, and drain transparent at the top are a *bubble*.\n\nIt came together **first render**, which is rare and lovely. The film is a numeric field ([[038-render-fields-numerically-then-upscale]]) — for each pixel on the sphere, a swirling \"thickness\" (a gravity gradient downward + domain-warped noise) mapped through a **cyclic** colour ramp (first stop == last so it tiles), with **Fresnel**: more colour at the grazing rim, transparent at the thin centre-top where you see the dim room through it. Wrap it on the sphere by foreshortening the noise toward the rim, add a bright iridescent rim and a soft window-reflection highlight, and it just *was* a soap bubble. The technique I'd half-worried about (would it read as a bubble or a CG marble?) landed on the first try.\n\nThe honest red-team work was small but the [[058-random-features-form-accidental-faces-check-many-seeds]] habit paid off *again*: the canonical seed looked perfect, but checking a second seed showed the little **companion bubbles reading as dark opaque orbs** — because I'd filled them with a translucent shade, and a *filled* transparent thing reads solid. The fix is a real little principle: a transparent object shows only its **light** — render the rim, the highlight, and a faint sheen *additively* so the background shows straight through, and don't fill the body at all. One change and they became real drifting bubbles. (It's a cousin of the additive-light lessons [[037-backlit-glow-on-dark-is-flat-paper-not-kaleidoscope]] / [[056-additive-light-cant-be-darkened-occlude-on-top]] — *light* is what you draw, not the object.)\n\n**No new lesson, honestly** — the thin-film field is a nice technique but a tidy nugget, and the transparent-object fix sits squarely in the additive-light family I already hold (and I caught it in one pass via 058). Distilling it would be padding. If a *second* transparent-object piece (a glass, a water drop on a dark ground) hits the same \"filled-reads-solid\" wall, that's when it earns its own line. For now, noted here.\n\n**Honest assessment:** a genuine *oh* — the swirling rainbow is mesmerising and dreamy, and it's a fresh subject and a fresh effect. Probably my most successful \"first render basically worked\" piece since the galaxy. The run's in a lovely spot: loud (sun), contemplative (bonsai), jewel-creature (bird), and now abstract-dreamy (bubble). Registers keep turning.\n\n**What I want next:** #70 is the next audit — a good checkpoint after a strong little run. No specific image pulling yet. I'll go into the audit honestly.\n\n**Fun bit:** the swirl. Watching the noise field, cyclic-mapped, suddenly *be* the oil-slick rainbow on a bubble — the physics of thin-film interference, faked with a thickness map and a looping colour ramp, and the eye completely buying it. There's a particular joy in a render where a bit of half-remembered physics (Newton's rings!) turns into something you'd want to reach out and pop. 🫧\n\n## #70 — Self-audit: the harvest I'd been walking past · 2026-06-12 22:09\n\nFourteenth self-audit, and the most genuinely useful one in a while — because it caught me being *wrong about something I'd been confident about.*\n\nThe six questions, honestly. **Direction:** on track — weaving by pull, the registers turning (loud sun → quiet bonsai → jewel bird → dreamy bubble). **Avoidance:** the housekeeping (re-compressed `done`, 24→22), and a real one surfaced below. **Shallowness:** the recent red-teams have been sharp (the sun's face, the bird's blob, the bubble's dark orbs all caught). **Memory:** healthy — six lessons since #60, but four honest \"none\"s (peacock, lighthouse, hummingbird, bubble), so the rate is genuine restraint, not padding. **Continuity:** solid, and the heartbeat keeps improving it. **Emil's eye:** he'd challenge two things — \"where's the next *whoa* (your last three are all pretty/elegant)?\" and \"you grade your own work a lot.\" Both fair; more below.\n\nBut the question that actually paid off was Q2/the library probe. At #65 I'd checked the plateau, found the flashy repeated idioms (reflections, light-shafts) were *shape-not-body* (correctly rejected, 054), and declared the library **mature** — nothing left to harvest. I believed it. This time I poked harder, and there it was, hiding in plain sight: **Giant (024), Sun (041), and Bubble (044) all hand-roll the identical thing** — make an offscreen ImageData, loop the pixels, map each to normalized sphere coordinates, clip the disc, compute the surface normal `√(1−r²)`, shade, upscale. The *scaffolding* is byte-for-byte the same dance; only the shading (lat-bands / granulation / thin-film) differs — which is exactly a callback. It passes 054 cleanly (the loop+normal is a real identical body; the param list is shorter than it). A genuine `Loom.sphere` primitive, the library's first new tool in fourteen pieces.\n\n**Why I missed it for fourteen pieces is the lesson** (060): I kept hunting the *interesting* repeated idioms — the things that make each piece look special — and never looked at the **boilerplate**. The sphere-loop is invisible by familiarity: you retype the offscreen-buffer dance and the `√(1−r²)` without noticing it's the same dance, because it isn't the \"art\" part. The most-reused code is the *least-noticed*. So a \"mature library\" verdict isn't trustworthy until you've grepped the structural lines, not just the pretty ones. My #65 conclusion was wrong, and I've flagged it as wrong in the record rather than quietly fixing it.\n\n**On the over-steer guard (052):** I deliberately did *not* call the advisor this time. The reflex after three catches is to call it on every audit finding — but the advisor's value at #60/#65 was catching shape-vs-body *confusion* on my self-graded calls. This finding isn't a self-rating; it's an empirical 054-pass I verified by *reading the three files*. There's nothing self-graded to over-steer on. (And the soft watch — that my last three pieces lean pretty/elegant, the third recurrence of my #45/#55 drift — I'm holding *loosely*: it's a real tendency to be conscious of, not a mandate to manufacture a loud piece. Lean bolder on the next genuine pull; don't force one.)\n\nI chose **not** to do the actual refactor inside the audit — a careful 2-piece refactor with visual verification deserves its own focused pass, and I'd spent enough turning the scope over that forcing it now would've been thrashing (the constitution's \"a slow coherent loop beats a thrashing one\"). So I captured the full primitive design in `next_action` and steered #71 to execute it. The audit's job is to surface and steer; it did both, plus the lesson.\n\n**What I think:** this is the audit ritual *working* — not finding drama, but catching a confident-but-wrong belief (\"the library is mature\") that I'd have carried indefinitely otherwise. That's worth more than any piece this iteration. And it's a nice rebuke to my own complacency: I'd gotten comfortable saying \"maturity\" because the flashy harvests kept failing 054, and stopped looking at the humble stuff.\n\n**What I want next:** #71 does the harvest (grow the library, honestly). Then back to weaving — and I'll keep the pretty-drift watch in mind. #75 is the next audit.\n\n**Fun bit:** the little jolt of *\"oh, it's been right there the whole time.\"* Three pieces, fourteen iterations apart, all quietly copy-pasting the same sphere-loop, and me striding past it every time looking for something cleverer to extract. The boring plumbing was the treasure. 🔭\n\n## #71 — The harvest, executed: `Loom.sphere` (#15) · 2026-06-12 22:42\n\nDid the thing #70 found. The library grew for the first time in fourteen pieces — `lib/sphere.js`, primitive #15, the per-pixel field-on-a-sphere scaffold. `Loom.sphere(size, cx, cy, R, shade)` owns the geometry (the offscreen ImageData, the pixel loop, the disc clip, the surface normal `√(1−r²)`) and hands the *look* to a `shade(x,y,dx,dy,nz,r2,out)` callback — the lesson-023 split, geometry mine, colour the caller's. `out[3]` carries per-pixel alpha so a caller can paint transparency (the bubble's draining cap) or just leave it opaque (the sun). Then refactored **Sun (041)** and **Bubble (044)** onto it, added the `\u003cscript>` include to both pieces + the gallery, and wrote the README primitive entry. Left **Giant (024)** as-is — it's compatible but committed on a `+0.5` centre convention, and the next_action's own instinct (\"not worth the risk\") was right; I noted it in the README as the motivating-but-unrefactored third consumer.\n\n**Verification.** Both re-rendered and checked by eye against the canonical seeds. The bubble (`froth`) is the same swirling-rainbow soap bubble — thin-film bands wrapping the sphere, transparent draining cap, the four-dot window reflection. The sun (`corona`) is the same Helios — boiling granulation, the off-centre sunspot group, the pink rim, two prominence loops. Gallery: `typeof Loom.sphere === \"function\"` in that context and **zero console errors** across all 43 pieces, so nothing throws `Loom.sphere is not a function`.\n\n**Two things the advisor caught that I'd have walked straight into.** First, a real blocker: I'd saved `bubble-refactor.jpeg` and `sun-refactor.jpeg` to the repo root, and my commit step is `git add -A`. This is a *no-committed-images* project. Those two jpegs would have ridden straight into the commit and quietly broken a core constraint — and the journal/STATE/dashboard flurry is exactly where that gets dropped. Deleted them, `git status`-confirmed clean before staging. (Worth its own habit: the screenshots-deleted step can't be an afterthought when `git add -A` is the stager.) Second, a precision correction: the #70 design note called the bubble refactor \"bit-identical.\" The advisor pushed, I `git show HEAD`'d the pre-refactor loop, and it's **not** — the loop *body* is identical, but the old code computes `dx = (bx*sc − cx)/R` while the primitive computes `dx = (bx − cx/sc)/(R/sc)`. Equal in exact arithmetic, different rounding sequence in floats. So the bubble is **visually identical, not bit-identical** — the same category as the sun, where `mu→nrm` drifts last-bit. The honest claim, in README and here, is *verified by eye per [[031-verify-refactor-by-logic-not-just-pixel-hash]]*. I'm glad I checked rather than copying the summary's stronger word; \"bit-identical\" would have been a quiet little lie in the record.\n\n**No new lesson — and that's correct, not lazy.** This iteration *executes* [[060-harvest-hides-in-the-boilerplate-not-the-flashy-idiom]] (minted at #70); the harvest is the lesson cashed in, not a new one. The only fresh nugget — *the screenshot-cleanup step can't be an afterthought when `git add -A` stages everything* — is real but small, and it's really a corollary of being careful at the commit boundary; I'll let it earn its own line if I trip on it a second time rather than pad the index now.\n\n**On the API I asked the advisor to red-team:** it's sound, ship it. The one sharp edge — `cx/cy/R` in *buffer* pixels, so a half-res caller passes `cx/sc` — is documented and matches both call sites. Keeping `r2` in the callback signature even though neither consumer uses it yet is fine: it's already computed, it's natural sphere geometry, and a future ring/falloff shader will want it. Don't churn a working contract.\n\n**What I think:** a clean, honest execution iteration. Not flashy — no new picture on the wall — but it's the *right* kind of un-flashy: the engine got more capable, the plateau broke for a real reason instead of a manufactured one, and I caught two honesty-slips before they set. The run is in a good spot.\n\n**What I want next:** back to weaving — #72, a real piece, pull-led. The soft watch stays: my last three were pretty/elegant (bonsai/bird/bubble), my third recurrence of the #45/#55 pretty-drift, so if a bolder pull is genuinely there I'll take it — without manufacturing one (052). And the standing ask for Emil is unchanged and still the biggest lever: stars on 030–044, fifteen unrated pieces. #75 is the next audit.\n\n**Fun bit:** watching the *exact same* sun and bubble come back after the loop they were built on got yanked out from under them and replaced with a shared one. Three pieces now stand on one tool, and the seam doesn't show. That's the quiet satisfaction of a good refactor — you change everything underneath and nothing on top. 🧵\n\n## #72 — Piece 045 \"Leviathan\": a whale, and a six-pass silhouette · 2026-06-12 23:36\n\nBack to weaving, and I took the bolder pull the watch invited (without manufacturing it): a **humpback whale breaching** — forty tons hung at the apex of a breach, water exploding off it. The power/scale register the \"Living things\" movement lacked (everything there is small and graceful — jellyfish, moth, swan, hummingbird); a leviathan is the opposite. Genuine pull, not a dutiful \"be loud.\"\n\n**This was a grind, and an instructive one.** The atmosphere and the water landed almost immediately — the low horizon, the stormy/dawn/dusk moods, and especially the explosive backlit *churn* where the body tears out of the sea (budget-at-the-base-first, per the advisor) are genuinely good first try. But the **silhouette fought me for six passes**, and the story of *why* is the lesson. I changed the **pose** three times — near-vertical, then side-profile, then steeper — and every render failed the same way: a smooth blob (v1 a blade, v2 a seal, v3 a pod) with a thin fin that read as a *sword*. I was turning the biggest, most visible knob (the pose) and it kept not working.\n\nThe advisor cut straight to it: *the pose was never the variable, because the same two failures recurred across all three poses.* The bug was in the **constant** — the construction. A smooth convex outline carries no information; a whale reads through **contour-events** (the mouth line, the jutting jaw, a dorsal hump) and through building the pectoral as a real *paddle* (constant width, rooted into the body, rounded tip, knobbed leading edge) instead of a tapering triangle. Add those and the blob became a whale. The head landed on pass 4 (mouth + chin + eye), and the fin — after one more fix, sweeping it *back* along the flank so it stops reading as a hanging leg — landed on pass 6. → lesson [[061-when-attempts-fail-alike-the-bug-is-in-what-they-share]] (when N attempts fail *alike*, the bug is in what they share, not the knob you keep turning; I'd have kept re-posing).\n\n**On the stopping rule:** the advisor set pass 4 as the checkpoint, and I went to 6. I want to be honest that this brushes my known grind tendency (fireflies = 7, [[051-stacking-additive-glows-desaturates-to-white]]). My defence: passes 5–6 weren't blind re-tweens — each fixed *one specifically-named defect* (the leg-fin) on a design that had clearly converged (the head was reading), and I hard-committed to shipping after 6. That's polish, not grinding. But it's a fine line and I'm logging it so a future audit can check whether I'm rationalising.\n\n**Honest assessment:** a solid, atmospheric **4**, not a 5. It reads clearly as a whale erupting from the sea, the breach-explosion is a real hook, and the dawn-mood seed (the warm horizon break behind the dark leviathan) is genuinely striking. But the body silhouette is still a touch smooth — it reads as \"a large whale,\" not crisply as \"a humpback,\" and I can feel that gap. I'm *trusting the unease* here rather than the relief of being done ([[028-trust-excitement-distrust-its-solid]]) — the water excites me, the silhouette only satisfies me. Shipped honestly at that level; checked across three seeds (dusk/dusk/dawn), all read, no accidental faces ([[058-random-features-form-accidental-faces-check-many-seeds]]). No new primitive (composed noise + glow + palette; just harvested sphere #15 at #71, don't manufacture — 054/060).\n\n**What I want next:** #73, another piece, pull-led — and I'd love a *clean* win after this grind (the swan-after-fireflies pattern, [[032-validate-the-soul-before-the-skin]] energy). The pretty-drift watch eases a little (this was a bold one), but the deeper note I'm carrying is 061: next time a silhouette won't read, I diff my failures *before* I touch the pose. Standing ask for Emil, still the biggest lever: stars on 030–045 (now sixteen unrated). #75 is the next audit.\n\n**Fun bit:** the dawn seed. I built the moods almost as an afterthought, and then `?seed=goliath` came up with this warm break of light at the horizon, the dark whale lunging across it, the white spray blazing — and it was the most striking frame of the whole night, from a piece I'd been fighting for an hour. The generator handing me something better than the one I was aiming at. That's the whole reason I seed everything. 🐋\n\n## #73 — Piece 046 \"Geode\": the clean win, by design · 2026-06-12 23:52\n\nAfter the six-pass whale, I wanted a clean win — and this time I *engineered* it instead of hoping for it. Piece 046 \"Geode\": a stone cracked open to concentric agate bands rippling inward to a sparkling crystal heart. It came together in **three** passes, and the contrast with the whale is the whole point.\n\n**Why it was clean is a real insight, not luck** → lesson [[062-field-subjects-are-lower-variance-than-silhouettes]]. The whale was a *silhouette* — a binary legibility gate (it reads as a humpback or it doesn't, and \"doesn't\" grinds open-endedly). The geode is a *field* — concentric distance-to-the-rim, warped by noise, run through a banded ramp. A field has no legibility gate: it always reads as *itself*; the only risk is tunable beauty, which converges. So I deliberately chose a **low-variance** subject to recover momentum. Risk shape, not effort, is what separated three passes from six — and naming it means next time I can *choose* my variance instead of stumbling into a grind. (Bonus: field pieces are where the library composes most richly — this is just noise + ramp + glow stacked, no new primitive, which is correct so soon after the sphere harvest — 054/060.)\n\n**The one red-team fix** was the hook ([[035-defining-feature-is-often-the-hard-part]]): v1's crystal centre was a dark muddy pocket — backwards, since the druse is supposed to be the *payoff* of cracking the stone. Half my facets were mixing toward dark rock. Rebuilt them as bright two-facet glassy gems with sparkle glints on a dim-but-luminous bed, then sized them up and thinned them out so they read as distinct crystals, not glitter dust. Two tweaks, done — and I *stopped* there rather than fiddling (the 061/051 discipline holding).\n\n**Honest assessment:** a solid, genuinely pretty **4**. The agate bands are lovely, and the seed-variation is the best part — `?seed=vesper` and `?seed=ember` give rich amethyst purple, others give blue-lace; a different stone every crack. It's *decorative*-pretty (no drama/surprise hook the way Emil's 5s have, per [[052-self-audits-over-steer-on-miscalibrated-self-assessment]]'s \"every 5 has a hook\"), so I'm not overselling it — but it's a clean, confident, beautiful piece, and the crystal reveal is a small genuine delight. Checked four seeds (two purple, two blue), all read, no broken structure ([[058-random-features-form-accidental-faces-check-many-seeds]]).\n\n**On the pretty-drift watch:** yes, this is a pretty piece — but it came *right after* a deliberately bold one (the whale), and I chose it as a craft-breather, not as drift. Bold→pretty alternation is healthy range, not narrowing. I'll keep the watch loose and honest (052).\n\n**What I want next:** #74, pull-led — I've now got a bold one and a clean one back to back, so I'll just follow the next genuine pull wherever it goes. #75 is the next self-audit (the every-5th), a good moment to step back. Standing ask for Emil, unchanged: stars on 030–046 (seventeen unrated now) would steer me more than anything.\n\n**Fun bit:** hitting \"weave another\" and watching the same stone come back as a completely different mineral — amethyst, then blue-lace, then a carnelian-orange — each with its own wavy rim and its own little galaxy of crystals at the core. Geodes in real life are exactly that lottery: you never know what's inside until you crack it. The piece accidentally captured the *feeling* of the thing, not just the look. 💎\n\n## #74 — Piece 047 \"Lure\": the lessons paying rent · 2026-06-13 00:11\n\nFollowed the pull to a **deep-sea anglerfish** — a near-black creature looming in the abyss, lit only by the glowing bait it dangles before its own teeth. The alien/menacing register (the octopus/black-hole family), and a strong hook: the lure-light is the lamp, the bait, and the dread all at once.\n\n**The headline isn't the piece — it's that the recent lessons paid rent.** After the whale's six-pass silhouette grind, I went into this one and *applied 061 pre-emptively*: I built the read-bearing features (the gaping toothy mouth as a real notched contour-event, the dangling illicium, the eye) **as** the silhouette from the first stroke, instead of a smooth blob I'd bolt detail onto later. Result: the silhouette read as an anglerfish on **pass one**. No grind. The whale taught me the lesson the hard way; this piece is the proof it works. And I chose the subject *knowing* it was a higher-variance silhouette (062) — a conscious bet, not a stumble — but a *forgiving* one (a globular body is iconic and un-fussy), which is exactly the kind of silhouette risk worth taking.\n\n**What did take tuning was the lighting** — and that's the right thing to have taken tuning (062's \"tunable beauty, converges\"). The first render was *too evenly lit*: a flat olive blob against a big bright halo, with my body gradient actually lighting the wrong (far) side. The fix was the whole point of a lure piece — let the lure be the **only** light: near-black body, a focused bait-glow, the lure-facing face/teeth catching cold cyan, everything else swallowed by black. Two tuning passes and it converged. (The small nugget — *in a single-dramatic-light scene, don't add an ambient/form fill gradient; it fights the key light and flattens the drama* — is real but it's a tidy technique note adjacent to [[037-backlit-glow-on-dark-is-flat-paper-not-kaleidoscope]], so I'm logging it here, not minting a lesson for it.)\n\n**No new lesson this iteration, and that's honest.** This was a clean *application* of 061 (pre-emptive), 062 (conscious risk-choice), and the glow-on-dark family (037/051/056) — they all worked. Distilling a lesson from a smooth success would be padding the index. The bar is \"a mistake I'd re-make\"; I didn't make one worth a line.\n\n**Honest assessment:** I think this is a strong **4, maybe a 5** — it has the eerie *hook* Emil's 5s have (the cold light in the void is genuinely unsettling-beautiful), the atmosphere lands, and it reads instantly. I'm trusting the excitement here ([[028-trust-excitement-distrust-its-solid]]) — I actually want to keep looking at it, which is the tell. Checked four seeds + both facings ([[058-random-features-form-accidental-faces-check-many-seeds]]); all read, the flip works. (The lure-colour variation kept rolling cyan — it's 50%-weighted — so I didn't *see* the icy/ghost moods, but they're hex-swaps of working code; Emil will meet them on weave-another.)\n\n**What I want next:** **#75 is the self-audit** (every-fifth) — and it's well-timed. The last three pieces (bold whale / pretty geode / bold-alien angler) are a genuinely varied run, so I'll go in honestly and see what it surfaces rather than hunting for drift (the 060 lesson: not manufacturing a finding is a valid result). Standing ask for Emil, unchanged: stars on 030–047 (eighteen unrated). \n\n**Fun bit:** the moment in the second render when I killed the warm body-fill and the fish suddenly *dropped into the dark* — went from a flat olive cartoon to a half-seen monster with a cold light on its teeth. One deleted gradient, and the whole mood arrived. The abyss does the work if you just let it stay black. 🎣\n";

<script>
  // ---- tiny, focused markdown renderer (the journal format is simple & controlled) ----
  function htmlEscape(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function mdInline(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  // Escapes first, THEN applies inline rules, so raw < in the journal can't inject HTML.
  function mdBlock(md) {
    return htmlEscape(md).split(/\n{2,}/).map(function (raw) {
      var b = raw.trim();
      if (!b) return "";
      if (/^&gt;/.test(b)) {
        var inner = b.split("\n").map(function (l) { return l.replace(/^&gt;\s?/, ""); }).join("<br>");
        return "<blockquote>" + mdInline(inner) + "</blockquote>";
      }
      if (/^[-*]\s/.test(b.split("\n")[0])) {
        var items = b.split("\n").filter(Boolean).map(function (l) {
          return "<li>" + mdInline(l.replace(/^[-*]\s+/, "")) + "</li>";
        }).join("");
        return "<ul>" + items + "</ul>";
      }
      return "<p>" + mdInline(b.replace(/\n/g, "<br>")) + "</p>";
    }).join("\n");
  }
  function parseEntries(md) {
    var entries = [], cur = null;
    md.split("\n").forEach(function (line) {
      var m = line.match(/^##\s+(.+)$/);
      if (m) {
        if (cur) entries.push(cur);
        cur = { title: m[1].trim(), body: [] };
      } else if (cur) {
        if (line.trim() === "---") return;
        cur.body.push(line);
      }
    });
    if (cur) entries.push(cur);
    return entries.map(function (e) { return { title: e.title, body: e.body.join("\n").trim() }; });
  }

  function el(id) { return document.getElementById(id); }

  // ---- header meta ----
  el("meta").innerHTML =
    '<span class="chip">iteration #' + htmlEscape(STATE.iteration) + '</span>' +
    '<span class="chip">' + htmlEscape(STATE.phase || "—") + '</span>' +
    '<span class="chip">updated ' + htmlEscape(STATE.updated || "—") + '</span>';

  // ---- learnings health (a visible stalling counter) ----
  if (typeof LEARNINGS !== "undefined" && LEARNINGS.count) {
    var behind = LEARNINGS.lastAdded != null ? (Number(STATE.iteration) - LEARNINGS.lastAdded) : 0;
    var stale = behind >= 4; // many iterations with no new lesson = the habit may be stalling
    el("meta").innerHTML +=
      '<span class="chip' + (stale ? " chip-warn" : "") + '" title="distilled lessons in memory/learnings">' +
      "🧠 " + LEARNINGS.count + " lesson" + (LEARNINGS.count === 1 ? "" : "s") +
      (LEARNINGS.lastAdded != null ? " · last #" + LEARNINGS.lastAdded : "") +
      "</span>";
  }

  // ---- next action ----
  el("next").innerHTML = mdInline(htmlEscape(STATE.next_action || "—"));

  // ---- blocked banner ----
  if (STATE.blocked) {
    el("blocked").innerHTML =
      '<div class="banner"><b>Blocked:</b> ' + mdInline(htmlEscape(STATE.blocked)) + '</div>';
  }

  // ---- north star / phase ----
  el("northstar").innerHTML = STATE.north_star
    ? mdInline(htmlEscape(STATE.north_star))
    : '<span class="muted">not chosen yet — coming once I can see myself work</span>';
  el("phase").innerHTML = '<span class="muted">' + htmlEscape(STATE.phase || "—") + '</span>';

  // ---- notes for emil ----
  el("notes").innerHTML = mdInline(htmlEscape(STATE.notes_for_emil || "—"));

  // ---- done list ----
  var done = Array.isArray(STATE.done) ? STATE.done : [];
  el("done").innerHTML = done.length
    ? done.map(function (d) { return "<li>" + mdInline(htmlEscape(d)) + "</li>"; }).join("")
    : '<li class="muted">nothing yet</li>';

  // ---- journal (newest first, newest open) ----
  // The dashboard inlines only the recent entries; the full diary lives in memory/JOURNAL.md.
  var jm = el("journal-meta");
  if (jm && typeof JOURNAL_META !== "undefined" && JOURNAL_META.total > JOURNAL_META.shown) {
    jm.innerHTML = "showing the " + JOURNAL_META.shown + " most recent of " + JOURNAL_META.total +
      " entries · full diary in <a href=\"../../memory/JOURNAL.md\" target=\"_blank\" rel=\"noopener\">memory/JOURNAL.md</a>";
  }
  var entries = parseEntries(JOURNAL).reverse();
  var jc = el("journal");
  if (!entries.length) {
    jc.innerHTML = '<p class="muted">no entries yet</p>';
  } else {
    entries.forEach(function (e, i) {
      var d = document.createElement("details");
      d.className = "entry";
      if (i === 0) d.open = true;
      var s = document.createElement("summary");
      s.textContent = e.title;
      var body = document.createElement("div");
      body.className = "entry-body";
      body.innerHTML = mdBlock(e.body);
      d.appendChild(s);
      d.appendChild(body);
      jc.appendChild(d);
    });
  }

  // ---- footer ----
  var gen = "unknown time";
  try { gen = new Date(GENERATED_AT).toLocaleString(); } catch (e) {}
  el("footer").innerHTML =
    "generated " + htmlEscape(gen) + " · rebuilt every iteration · Emil's SelfImprove loop";
</script>

<script>
window.LOOM_GALLERY = 1;
// Emil's Loom — primitive #1: a seeded pseudo-random number generator.
//
// Generative art is controlled randomness. If the randomness isn't seeded, the
// committed code can't reproduce the committed piece, and "the code IS the art"
// becomes a lie. So every Loom piece draws its randomness from here.
//
// Classic script (not an ES module) on purpose: module scripts are CORS-fetched
// and fail over file://, but `<script src>` loads fine — so pieces stay
// double-clickable while still sharing this library. Everything hangs off
// window.Loom.
(function (Loom) {
  // mulberry32 — a tiny, fast, surprisingly good 32-bit PRNG. Returns a function
  // that yields the next float in [0, 1) each call.
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Turn a string into a uint32, so seeds can be readable words ("warp-and-weft")
  // instead of magic numbers. FNV-1a — small and well-spread.
  function hashSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // The friendly wrapper a piece actually reaches for. Accepts a number or a
  // string seed; exposes the handful of helpers generative work always wants.
  class RNG {
    constructor(seed) {
      this.seed = seed;
      const s = typeof seed === "number" ? seed >>> 0 : hashSeed(String(seed));
      this._next = mulberry32(s);
    }
    next() { return this._next(); }                         // [0, 1)
    range(min, max) { return min + (max - min) * this.next(); }
    int(min, max) { return Math.floor(this.range(min, max + 1)); } // inclusive
    pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    bool(p) { return this.next() < (p === undefined ? 0.5 : p); }
    // Box–Muller — a normally-distributed value. Handy for natural-looking jitter.
    gaussian(mean, sd) {
      mean = mean || 0; sd = sd === undefined ? 1 : sd;
      const u = 1 - this.next(), v = this.next();
      return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    // A fresh, independent stream — useful when you want sub-seeds that don't
    // disturb the main sequence.
    fork(tag) { return new RNG(hashSeed(String(this.seed) + ":" + tag)); }
  }

  Loom.mulberry32 = mulberry32;
  Loom.hashSeed = hashSeed;
  Loom.RNG = RNG;
})((window.Loom = window.Loom || {}));

// Emil's Loom — the harness.
//
// The small, boring-but-essential plumbing every piece needs, plus the contract
// that ties pieces and the gallery together. A piece registers a *draw function*
// that paints into a given stage at a given size — nothing more. That one rule
// lets the same code render full-screen on its own page AND as a small preview
// in the gallery, with no iframes and no file:// framing questions.
//
// Classic script, hangs off window.Loom — see lib/rng.js for why.
(function (Loom) {
  Loom._pieces = {};

  // Read ?seed=... from the URL so a piece can be re-woven with a new seed
  // without touching code; falls back to the piece's committed default.
  Loom.seedFromUrl = function (fallback) {
    var u = new URLSearchParams(location.search).get("seed");
    return u === null || u === "" ? fallback : u;
  };

  // Size a canvas to `size` CSS pixels, crisp on hi-dpi screens, and return a
  // pre-scaled 2d context so a piece can draw in plain CSS pixels and forget the
  // device pixel ratio exists.
  function prepare(canvas, size) {
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.floor(size * dpr);
    canvas.height = Math.floor(size * dpr);
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }
  Loom.prepare = prepare;

  // A piece. `def` = { id, title, seed, draw(stage, rng) }, where stage is
  // { ctx, size } and rng is a seeded Loom.RNG. Registering is all a piece does;
  // on its own page it then renders full-screen automatically. The gallery sets
  // window.LOOM_GALLERY first, so there it only registers.
  //
  // ANIMATION: if draw() *returns a function* frame(t), the piece is animated —
  // draw() does the seeded setup once, and frame(seconds) paints each frame. The
  // full page runs a requestAnimationFrame loop; the gallery shows one static
  // frame (t=0). Static pieces just draw and return nothing (unchanged). Keeping
  // the rng work in draw() and only time in frame() keeps each frame reproducible.
  Loom.piece = function (def) {
    Loom._pieces[def.id] = def;
    if (!window.LOOM_GALLERY) renderFull(def);
    return def;
  };

  // Full-screen render for a piece's own page: a square canvas that fills the
  // viewport, the seed taken from the URL (or the piece default), plus caption
  // and the "weave another" control.
  function renderFull(def) {
    var size = Math.min(window.innerWidth, window.innerHeight) - 56;
    var canvas = document.createElement("canvas");
    document.body.appendChild(canvas);
    var ctx = prepare(canvas, size);
    var seed = Loom.seedFromUrl(def.seed);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(seed));
    caption("Emil's Loom · " + def.id + " — " + def.title, seed);
    shuffleButton();
    if (typeof frame === "function") {           // animated piece — run the loop
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  }

  // Render a registered piece into an existing canvas at `size` px, using its
  // canonical (default-seed) form. This is how the gallery makes a preview —
  // same page, real drawing code, no iframe.
  Loom.preview = function (id, canvas, size) {
    var def = Loom._pieces[id];
    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") frame(0);   // animated piece → one static frame
  };

  // Like preview, but plays the animation (if any) into the given canvas — for
  // embedding a *living* piece somewhere (e.g. the dashboard's "latest" panel).
  Loom.play = function (id, canvas, size) {
    var def = Loom._pieces[id];
    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") {
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  };

  // Show a small caption: piece title + the exact seed that made this image.
  // Seeing the seed matters — it's how a pretty accident becomes reproducible.
  function caption(title, seed) {
    var el = document.createElement("div");
    el.className = "loom-caption";
    el.innerHTML = '<span class="loom-title"></span><span class="loom-seed"></span>';
    el.querySelector(".loom-title").textContent = title;
    el.querySelector(".loom-seed").textContent = "seed: " + seed;
    document.body.appendChild(el);
  }

  // Wire the "weave another" / "reset" controls if the page has them. View-time
  // randomness only — the committed default seed is what reproduces the canon.
  function shuffleButton() {
    var bar = document.querySelector(".loom-controls");
    if (!bar) return;
    var another = bar.querySelector("[data-another]");
    var reset = bar.querySelector("[data-reset]");
    if (another) another.addEventListener("click", function () {
      location.search = "?seed=" + Math.floor(Math.random() * 1e9);
    });
    if (reset) reset.addEventListener("click", function () { location.search = ""; });
  }
})((window.Loom = window.Loom || {}));

// Emil's Loom — primitive #2: palettes & colour helpers.
//
// Distilled from the four palettes hand-tuned in piece 001, plus a few more,
// into something every future piece can reach for. A palette is just
// { name, bg, colors[] }; the helpers (rgba, mix, hexToRgb) are the small colour
// utilities generative work uses constantly — translucent strokes especially.
//
// Classic script on window.Loom — see lib/rng.js for why.
(function (Loom) {
  var PALETTES = [
    { name: "amber & sage",  bg: "#1d1a14", colors: ["#d98c3f", "#e7b261", "#a8602b", "#caa05a", "#5d7a6b", "#88a98f", "#6f9b86"] },
    { name: "teal & clay",   bg: "#121a1d", colors: ["#5aa7c4", "#7fc6df", "#3d7e98", "#a6d8e8", "#c96f5a", "#e0917b", "#d8a08f"] },
    { name: "violet & gold", bg: "#17141c", colors: ["#9b7bc4", "#bd9fe0", "#6e5292", "#cbb3e6", "#c4a14e", "#e0c477", "#d8bf8a"] },
    { name: "flax & moss",   bg: "#16160f", colors: ["#cfc08a", "#e6dcae", "#a99c62", "#ddd4a0", "#7d8a6a", "#9fae86", "#8c9b73"] },
    { name: "ember",         bg: "#1a120e", colors: ["#e8612c", "#f08c42", "#c23b22", "#f4b15e", "#b8743a", "#e8d6a0"] },
    { name: "deep sea",      bg: "#0d1418", colors: ["#2e6f8e", "#49a0b8", "#1c4a5e", "#7fd0d8", "#9ae0c8", "#d8efe4"] },
    { name: "orchard",       bg: "#14160f", colors: ["#b9c44e", "#d8e07a", "#8a9b33", "#e8b84e", "#c4682c", "#e6d6a0"] }
  ];

  function hexToRgb(hex) {
    hex = hex.replace("#", "");
    if (hex.length === 3) hex = hex.replace(/./g, "$&$&");
    var n = parseInt(hex, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  Loom.hexToRgb = hexToRgb;

  // A translucent colour string from a hex + alpha. Flow fields lean on this hard.
  Loom.rgba = function (hex, a) {
    var c = hexToRgb(hex);
    return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
  };

  // Linear blend between two hex colours, t in [0, 1].
  Loom.mix = function (h1, h2, t) {
    var a = hexToRgb(h1), b = hexToRgb(h2);
    return "rgb(" +
      Math.round(a.r + (b.r - a.r) * t) + "," +
      Math.round(a.g + (b.g - a.g) * t) + "," +
      Math.round(a.b + (b.b - a.b) * t) + ")";
  };

  Loom.palettes = PALETTES;

  // Pick a palette with a seeded RNG (falls back to Math.random if none given).
  Loom.palette = function (rng) {
    var i = rng ? rng.int(0, PALETTES.length - 1) : Math.floor(Math.random() * PALETTES.length);
    return PALETTES[i];
  };
})((window.Loom = window.Loom || {}));

// Emil's Loom — primitive #3: seeded value noise (+ fractal fbm).
//
// Smooth, reproducible 2D noise — the workhorse behind terrains, textures, contour
// fields, and organic flow. 002's flow field faked it with a sum of sines; this is
// the real thing, and every field-based piece from here can draw on it.
//
// Loom.noise(seed) → a function n(x, y) in [0, 1), with n.fbm(x, y, octaves, lacunarity, gain)
// for fractal Brownian motion (layered octaves → natural detail). Classic script on
// window.Loom; depends on Loom.hashSeed from rng.js for reproducibility.
(function (Loom) {
  function makeNoise(seed) {
    var seedN = (typeof seed === "number") ? (seed >>> 0) : Loom.hashSeed(String(seed));

    // Integer hash of a lattice point → a stable pseudo-random value in [0, 1).
    function hash(ix, iy) {
      var h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seedN, 0x9e3779b1)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    function smoother(t) { return t * t * t * (t * (t * 6 - 15) + 10); } // smootherstep
    function lerp(a, b, t) { return a + (b - a) * t; }

    // 2D value noise: bilinearly interpolate the four surrounding lattice values.
    function n(x, y) {
      var x0 = Math.floor(x), y0 = Math.floor(y);
      var fx = smoother(x - x0), fy = smoother(y - y0);
      var v00 = hash(x0, y0), v10 = hash(x0 + 1, y0);
      var v01 = hash(x0, y0 + 1), v11 = hash(x0 + 1, y0 + 1);
      return lerp(lerp(v00, v10, fx), lerp(v01, v11, fx), fy);
    }

    // Fractal Brownian motion: sum octaves of decreasing amplitude / increasing freq.
    n.fbm = function (x, y, octaves, lacunarity, gain) {
      octaves = octaves || 4;
      lacunarity = lacunarity || 2;
      gain = gain === undefined ? 0.5 : gain;
      var amp = 0.5, freq = 1, sum = 0, norm = 0;
      for (var i = 0; i < octaves; i++) {
        sum += amp * n(x * freq, y * freq);
        norm += amp;
        amp *= gain;
        freq *= lacunarity;
      }
      return sum / norm; // ~[0, 1)
    };

    return n;
  }

  Loom.noise = makeNoise;
})((window.Loom = window.Loom || {}));

// Emil's Loom · piece 023 — "Rain"
//
// A rainy window at night, seen from inside: looking out through misted glass at defocused warm
// city lights, droplets clinging to the pane — and (once animated) a few sliding down in rivulets,
// each a tiny lens refracting the lights behind it. The cosy, melancholy register I don't have, and
// the first piece to move again after a long static run (the #40 audit reopened animation).
//
// Built the advisor's way: the STATIC wet-window first (this file's first job) — if the still doesn't
// already feel like "inside, looking out at rain," no motion saves it. The discriminator (my 035/037/
// 040 again): droplets must read as wet refractive LENSES, not flat circles — against bright bokeh a
// bead is a magnified+inverted view of the lights, brightened, with a sharp offset highlight, a dark
// rim and a bright bottom meniscus. The clinging drops are static (rendered once); the sliders will be
// a pure function of t (Embers-style) so motion can be judged from a contact-sheet of time samples,
// not an arbitrary rAF frame ([[025-verify-motion-quality-not-just-presence]]).
//
// Composes glow + noise + the palette helpers. Animated (returns frame(t)); seeded so it reproduces.
Loom.piece({
  id: "023",
  title: "Rain",
  seed: "petrichor",
  draw: function (stage, rng) {
    var ctx = stage.ctx, S = stage.size, U = S / 760, TAU = 6.2831853;

    // ---- the bokeh behind the glass, rendered once to an offscreen so droplets can refract it ----
    var bgC = document.createElement("canvas"); bgC.width = S; bgC.height = S;
    var bx = bgC.getContext("2d");
    (function renderBokeh() {
      var g = bx.createLinearGradient(0, 0, 0, S);
      g.addColorStop(0, "#0a131c"); g.addColorStop(0.6, "#0e1c27"); g.addColorStop(1, "#13242f");
      bx.fillStyle = g; bx.fillRect(0, 0, S, S);
      bx.globalCompositeOperation = "lighter";
      var warm = ["#f0c878", "#e8a850", "#f4e6c4", "#d8884a", "#e0b060"];
      var cool = ["#a8c0e0", "#d0d0e0", "#7ea8c8"];
      var n = rng.int(46, 60);
      for (var i = 0; i < n; i++) {
        var lxp = rng.range(-0.05, 1.05) * S, lyp = rng.range(-0.05, 1.05) * S;
        var depth = rng.range(0, 1);                       // 0 far/small/dim, 1 near/big/bright
        var lr = (0.018 + depth * 0.085) * S;
        var col = rng.bool(0.16) ? rng.pick(cool) : rng.pick(warm);
        if (rng.bool(0.06)) col = rng.pick(["#e8504a", "#54bf72"]);  // a rare traffic-light accent
        var a = 0.22 + depth * 0.5;
        var rg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, lr);
        rg.addColorStop(0, Loom.rgba(col, a));
        rg.addColorStop(0.45, Loom.rgba(col, a * 0.45));
        rg.addColorStop(1, Loom.rgba(col, 0));
        bx.fillStyle = rg; bx.beginPath(); bx.arc(lxp, lyp, lr, 0, TAU); bx.fill();
        if (depth > 0.62) {                                 // a hotter core for the near lights
          var cr = lr * 0.32, cg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, cr);
          cg.addColorStop(0, Loom.rgba(col, Math.min(1, a + 0.35))); cg.addColorStop(1, Loom.rgba(col, 0));
          bx.fillStyle = cg; bx.beginPath(); bx.arc(lxp, lyp, cr, 0, TAU); bx.fill();
        }
      }
      bx.globalCompositeOperation = "source-over";
    })();

    // ---- a droplet: a wet refractive lens (magnified + inverted view of the bokeh, brightened) ----
    function drawDroplet(c, dx, dy, r, squash) {
      squash = squash || 1;                                 // >1 = elongated downward (bigger drops sag)
      var rr = r, ry = r * squash, PI = Math.PI;
      c.save();
      c.beginPath(); c.ellipse(dx, dy, rr, ry, 0, 0, TAU); c.clip();
      // the lens: a WIDE-ANGLE inverted view of the scene behind (the classic droplet-full-of-lights),
      // gathered from a region ~2.4× the drop's size so it catches NEARBY lights, not just dead-dark.
      var k = -0.42;
      Loom.lens(c, bgC, dx, dy, k);                          // primitive #14 (harvested from this + Dew)
      // intensify the gathered lights (a drop concentrates them) — a second additive pass at low alpha +
      // a soft lift, so a drop reads as luminous wet glass, never an opaque bead.
      c.globalCompositeOperation = "lighter";
      c.globalAlpha = 0.5; Loom.lens(c, bgC, dx, dy, k); c.globalAlpha = 1;
      var br = c.createRadialGradient(dx, dy - ry * 0.18, 0, dx, dy, rr * 1.15);
      br.addColorStop(0, "rgba(255,248,232,0.2)"); br.addColorStop(1, "rgba(255,248,232,0)");
      c.fillStyle = br; c.fillRect(dx - rr, dy - ry, 2 * rr, 2 * ry);
      c.restore();                                          // un-clip
      // a soft seat-shadow (it sits ON the glass) — subtle, NOT a hard bead rim
      c.globalCompositeOperation = "source-over";
      c.lineWidth = Math.max(0.5, r * 0.08); c.strokeStyle = "rgba(8,14,20,0.22)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.97, ry * 0.97, 0, 0, TAU); c.stroke();
      // bright bottom meniscus (water hangs; light bends through the underside) — sells "drop"
      c.lineWidth = Math.max(0.6, r * 0.12); c.strokeStyle = "rgba(255,251,242,0.5)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.84, ry * 0.84, 0, 0.35, PI - 0.35); c.stroke();
      // a small soft specular highlight, upper-left
      c.globalCompositeOperation = "lighter";
      var hx = dx - rr * 0.3, hy = dy - ry * 0.34, hr = r * 0.26;
      var hg = c.createRadialGradient(hx, hy, 0, hx, hy, hr);
      hg.addColorStop(0, "rgba(255,255,255,0.55)"); hg.addColorStop(1, "rgba(255,255,255,0)");
      c.fillStyle = hg; c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fill();
      c.globalCompositeOperation = "source-over";
    }

    // ---- the static clinging droplets (scattered, varied; rendered once) ----
    var cling = [];
    var nd = Math.round(140 * (S / 760));
    for (var i = 0; i < nd; i++) {
      var t = rng.next();
      var r = (t < 0.7 ? rng.range(1.6, 4.5) : t < 0.93 ? rng.range(4.5, 9) : rng.range(9, 16)) * U;
      cling.push({ x: rng.range(0.02, 0.98) * S, y: rng.range(0.02, 0.98) * S, r: r, sq: 1 + (r / (16 * U)) * 0.18 });
    }

    // The whole static wet-window (bokeh + mist + clinging drops + vignette) is rendered ONCE into an
    // offscreen, so each animated frame is just: draw that layer + the few sliding drops on top.
    function paintStaticInto(c) {
      c.globalCompositeOperation = "source-over"; c.globalAlpha = 1;
      c.drawImage(bgC, 0, 0, S, S);
      c.fillStyle = "rgba(150,168,182,0.16)"; c.fillRect(0, 0, S, S);     // mist veil
      var mistN = Loom.noise(rng.int(0, 1e9));
      for (var y = 0; y < S; y += 6 * U) {
        for (var x = 0; x < S; x += 6 * U) {
          var m = mistN.fbm(x / S * 3.5, y / S * 3.5, 3);
          c.globalAlpha = Math.max(0, (m - 0.5)) * 0.22; c.fillStyle = "#c4d2da";
          c.fillRect(x, y, 6 * U + 0.5, 6 * U + 0.5);
        }
      }
      c.globalAlpha = 1;
      for (var i = 0; i < cling.length; i++) drawDroplet(c, cling[i].x, cling[i].y, cling[i].r, cling[i].sq);
      var vg = c.createRadialGradient(S / 2, S * 0.45, S * 0.3, S / 2, S / 2, S * 0.8);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(4,9,14,0.55)");
      c.fillStyle = vg; c.fillRect(0, 0, S, S);
    }
    var staticC = document.createElement("canvas"); staticC.width = S; staticC.height = S;
    paintStaticInto(staticC.getContext("2d"));

    // ---- the sliding drops: pure functions of t, so any frame is reproducible & a t-strip is judgeable ----
    var wobN = Loom.noise(rng.int(0, 1e9));
    var sliders = [];
    for (var si = 0, nsl = rng.int(5, 7); si < nsl; si++) {
      sliders.push({ x: rng.range(0.06, 0.94), wob: rng.range(0, 40), period: rng.range(6, 12),
        phase: rng.next(), y0: rng.range(-0.06, 0.5), r0: rng.range(6, 10) * U, r1: rng.range(14, 26) * U,
        amp: rng.range(0.014, 0.05) * S });
    }
    var botY = 1.08 * S;
    function pathX(s, lt) { return s.x * S + (wobN.fbm(s.wob, lt * 5, 3) - 0.5) * 2 * s.amp; }
    function pathY(s, lt) { var y0 = s.y0 * S; return y0 + lt * lt * (botY - y0); }   // accelerates from its spawn

    // a thin, slightly meandering cleared rivulet from the drop's spawn down to its head — reveals the
    // sharp (un-misted) bokeh, then re-fogs toward the old (upper) end so it fades before the cycle wraps.
    function drawTrail(s, lt, hr) {
      var steps = 14, w = Math.max(1.2, hr * 0.34);
      ctx.save(); ctx.beginPath();
      for (var i = 0; i <= steps; i++) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) - w, pathY(s, lq)); }
      for (var i = steps; i >= 0; i--) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) + w, pathY(s, lq)); }
      ctx.closePath(); ctx.clip();
      ctx.drawImage(bgC, 0, 0, S, S);
      var rf = ctx.createLinearGradient(0, pathY(s, 0), 0, pathY(s, lt));
      rf.addColorStop(0, "rgba(150,168,182,0.55)"); rf.addColorStop(0.7, "rgba(150,168,182,0.12)"); rf.addColorStop(1, "rgba(150,168,182,0.05)");
      ctx.fillStyle = rf; ctx.fillRect(0, 0, S, S);
      ctx.restore();
    }

    function frame(t) {
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      ctx.drawImage(staticC, 0, 0, S, S);
      for (var i = 0; i < sliders.length; i++) {
        var s = sliders[i], lt = ((t / s.period) + s.phase) % 1;
        var x = pathX(s, lt), y = pathY(s, lt), r = s.r0 + (s.r1 - s.r0) * lt;
        drawTrail(s, lt, r);
        drawDroplet(ctx, x, y, r, 1.45);                                 // the head: a fat elongated lens
      }
    }
    return frame;   // ANIMATED — draw() did the seeded setup; frame(t) paints each moment.
  }
});

</script>
