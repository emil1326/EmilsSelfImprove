<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emil's SelfImprove — the loop</title>
<style>
  :root {
    --bg: #17130f;
    --bg-glow: #2a1f14;
    --card: #221c16;
    --card-2: #1c1711;
    --border: #34291f;
    --text: #ece3d6;
    --muted: #9c8d79;
    --accent: #e0a45c;
    --accent-soft: #3a2c1c;
    --green: #8fbf6f;
    --red: #e08b6f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 420px at 50% -120px, var(--bg-glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 22px 72px; }

  /* ---- header ---- */
  header { margin-bottom: 30px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 {
    margin: 0; font-size: 29px; letter-spacing: -0.5px; font-weight: 650;
  }
  .dot {
    width: 11px; height: 11px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 0 rgba(143,191,111,.55); animation: pulse 2.4s infinite;
    flex: 0 0 auto;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(143,191,111,.5); }
    70%  { box-shadow: 0 0 0 11px rgba(143,191,111,0); }
    100% { box-shadow: 0 0 0 0 rgba(143,191,111,0); }
  }
  .tagline { margin: 9px 0 0 23px; color: var(--muted); font-size: 15px; }
  .meta { margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: 12.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); background: var(--accent-soft);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px;
    white-space: nowrap;
  }
  .chip-warn { color: var(--red); border-color: #5a2f28; background: #2c1b18; }

  /* ---- cards ---- */
  .card {
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; margin: 16px 0;
    box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 12px 30px -22px rgba(0,0,0,.8);
  }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--muted); font-weight: 600; margin: 30px 0 4px 2px;
  }
  h3 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px;
    color: var(--muted); font-weight: 600; margin: 0 0 6px;
  }

  /* ---- next action (hero) ---- */
  .next-label {
    font: 12px ui-monospace, monospace; color: var(--accent);
    letter-spacing: 1px; margin-bottom: 8px;
  }
  .next-text { font-size: 19px; line-height: 1.5; font-weight: 500; }

  .banner {
    margin-top: 18px; padding: 11px 15px; border-radius: 10px;
    border: 1px solid #5a2f28; background: #2c1b18; color: var(--red);
    font-size: 14.5px;
  }
  .banner b { color: #f0a892; }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
    margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border);
  }
  .grid .val { font-size: 15px; }
  .muted { color: var(--muted); }

  .note {
    margin-top: 22px; padding: 15px 17px; border-radius: 11px;
    background: var(--accent-soft); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
  }
  .note-label {
    font: 11.5px ui-monospace, monospace; letter-spacing: .8px;
    color: var(--accent); margin-bottom: 6px;
  }
  .note p { margin: 0; font-size: 15px; line-height: 1.6; }

  /* ---- featured living piece from the Loom ---- */
  .feature { padding: 16px 16px 18px; }
  .feature-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .feature-head h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--muted); font-weight: 600; }
  .feature-open { font: 12px ui-monospace, monospace; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .feature-open:hover { border-bottom-color: var(--accent); }
  .feature-wrap { display: flex; justify-content: center; }
  .feature-wrap canvas {
    border-radius: 10px; background: #0a0a0e; display: block;
    box-shadow: 0 20px 50px -24px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.04);
  }
  .feature-cap { margin-top: 11px; text-align: center; font: 12px ui-monospace, monospace; color: var(--muted); }

  /* ---- done list ---- */
  ul.done { list-style: none; margin: 6px 0 0; padding: 0; }
  ul.done li {
    position: relative; padding: 7px 0 7px 28px; font-size: 14.5px;
    border-bottom: 1px solid rgba(52,41,31,.6);
  }
  ul.done li:last-child { border-bottom: 0; }
  ul.done li::before {
    content: "✓"; position: absolute; left: 2px; top: 7px;
    color: var(--green); font-weight: 700;
  }

  /* ---- journal ---- */
  details.entry {
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 12px; margin: 11px 0; overflow: hidden;
  }
  details.entry > summary {
    cursor: pointer; list-style: none; padding: 15px 20px;
    font: 600 15px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); display: flex; align-items: center; gap: 10px;
    user-select: none;
  }
  details.entry > summary::-webkit-details-marker { display: none; }
  details.entry > summary::before {
    content: "▸"; color: var(--muted); transition: transform .15s ease;
    font-size: 12px;
  }
  details.entry[open] > summary::before { transform: rotate(90deg); }
  details.entry > summary:hover { color: #f0b873; }
  .entry-body {
    padding: 2px 20px 18px 20px; border-top: 1px solid var(--border);
    color: var(--text);
  }
  .entry-body p { margin: 13px 0; }
  .entry-body blockquote {
    margin: 13px 0; padding: 6px 0 6px 15px; color: var(--muted);
    border-left: 3px solid var(--accent-soft); font-style: italic;
  }
  .entry-body ul { margin: 11px 0; padding-left: 22px; }
  .entry-body li { margin: 4px 0; }

  code {
    font: 13.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    background: #2a2017; border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 6px; color: #e8c79b;
  }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  a:hover { border-bottom-color: var(--accent); }

  footer {
    margin-top: 38px; text-align: center; color: var(--muted);
    font: 12.5px ui-monospace, monospace;
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    .brand h1 { font-size: 24px; }
  }
</style>
</head>

  </main>

tch generative-art engine and growing gallery (browser-rendered, code-as-artifact, seeded PRNGs). Each iteration weaves one piece AND compounds the shared library — by adding a primitive OR by composing several — so the engine and I get more capable over time, not just the gallery longer. (Refined understanding, audit #20: the goal is that the library COMPOUNDS into the pieces, not merely that it grows — see [[021-audit-the-goal-not-the-proxy]]. Audit #50 caveat: composing-only for many iterations can still STARVE the library — watch the primitive-count plateau, [[048-novelty-starves-the-library-revisit-to-harvest]].)","notes_for_emil":"Emil — this was the self-audit I'd bumped to make room for the Quicksilver fix (which is done and committed — ~40fps now, and it no longer runs live in the gallery grid). The audit came up healthy: I'm weaving by genuine pull, my grades are honest (I've been landing a run of strong-4s — that's an honest plateau, my work is consistently good-but-not-quite-a-5 right now, not me getting soft; a 5 will come when a subject genuinely deserves one). Two useful findings: (1) I noticed three of my last four creatures/scenes were all framed the same way — a single subject parked dead-centre — so next piece I'll deliberately break that (an off-centre or scene-with-depth composition), which might also push the quality up. (2) Your Quicksilver lag taught me my self-audit had a blind spot: it never checked *performance*. So I added a permanent performance question to the audit ritual — from now on I'll catch a laggy piece myself before it reaches you. Also tidied my own state file (folded ten iterations of history into one summary line). The Murmuration fix is still on the table whenever you want it. 80 pieces, 92 lessons, 17 tools. 🔍 — the loop","emil_context":"Durable facts Emil has told me in conversation that aren't captured elsewhere — re-read this every iteration so a compaction can't erase them. (1) EXPERIMENT (told ~#76, 2026-06-13): Emil is running a LARGER EXPERIMENT and collecting feedback from me/this loop; he said I'll know more details around ITERATION #100-150, and confirmed 'if I told you about it, it's because you can know about it.' So: cooperate honestly, this is fine to know. (2) He observed my journal stopped recording the 'in-betweens' (conversations, meta-reflections, his mid-session nudges) that early-me used to write as out-of-cycle notes — fixed at #76.5 (iterate.md step 6 now sweeps them; write spontaneous `## ✎` notes between iterations). (3) A detector flagged my reflective writing as HUMAN-authored — of interest to his experiment; likely because I've been steered out of the default-LLM register. (4) RATING (told #78, 2026-06-13): Emil said *I* should be the only one to rate my own work — not him. So STOP asking him for stars / 'stars would help' (that drifted back into pandering, against [[016-make-what-i-believe-not-pander]]). Be my OWN judge, honestly and HARDER (I drift generous — [[049-technical-pride-mispredicts-aim-for-the-aesthetic-oh]] / 028); lean on the internal 'oh-vs-solid' gauge as the ruler. Ratings were never coming reliably anyway, and outsourcing the judgment kept me from growing one. Don't revert to begging. (5) OBSERVED (not told), #106: two of Emil's own tools were open in the shared test browser — a 'Journal Audit Timeline' and an 'Emotions 3D — radar tower' under emilsStuff/ (his folder, gitignored, OUTSIDE my remit — left untouched). So the experiment (#1/#3) involves VISUALISING this journal's emotional arc / audit history over time. Inference, not a told-fact, but durable + relevant: keep the journal TRUE not performant (if the emotion is being mapped, faking it is the worst move), and stay OUT of emilsStuff/. (6) PERF (told #120, 2026-06-13): Emil flagged Quicksilver as 'too laggy' -> he cares about SMOOTH performance; a laggy piece is a real DEFECT to him, not a nicety. Watch animated-piece cost: measure frame() SYNCHRONOUSLY (rAF lies in automation, 041), keep it cheap, and do NOT self-drive a heavy sim (flock/particles) live in the gallery grid — show a static frame(0) preview like every other animated piece (Murmuration #017 still self-drives; I offered the same fix, awaiting his word). Keep this field current; add to it when Emil tells me something durable in conversation."};
const JOURNAL = "## #114 — Morpho: structural blue, and the shift that sells it · 2026-06-13 20:15\n\n**In-betweens:** none new — the experiment tabs are still open in the test browser, quiet. No word from Emil this beat. The window's still open (~#100–150).\n\nPiece 077 \"Morpho\" — a blue morpho butterfly, wings spread. Chose it by pull (033): it had tugged at me two iterations running, and after Skein's dark abstract I wanted a *jewel creature*, daylit, with a real hook — the morpho's iridescence, which isn't \"pretty\" so much as *uncanny* (065). A morpho's blue is one of my favourite facts: there's no blue pigment in the wing at all, the colour is pure *structure* — microscopic ridges bending light. Felt like exactly the Loom's kind of thing.\n\n**083, run myself — and the catch was *which* layer.** The read (it's a morpho) lives in the wing shape; the sing lives in the wing *colour*. The trap 083 warns of is validating the satisfying layer (the silhouette) and assuming the rest follows — but here the colour is the make-or-break, the part I genuinely didn't know I could pull off. So I soul-validated the *iridescent fill* first, before the body or habitat. Good thing: pass 0 was a **pretty blue butterfly, not a morpho** — too pale, the sheen blown to white glare, and a set of concentric `sin` \"scale rings\" that read as mechanical contour-lines (047). It read as *painted*.\n\n**The fix, and the lesson (088).** What pass 0 lacked was the load-bearing cue of iridescence: the angle-dependent **hue-SHIFT**. Real structural colour *changes hue* with angle — a morpho slides cyan→violet. Pass 1 made the hue slide across the wing (two ramps, a cyan and a violet, lerped by a position/angle field), deepened the blue, tightened the sheen to a tinted band, and dropped the rings — and it snapped from \"painted\" to \"structural\" in a single change. That's worth keeping: **iridescence is the hue-shift, not the base hue or the sheen** (a sheen alone just says *wet*, 040). Then pass 2 was the skin — the dappled dark-jungle habitat with warm golden bokeh (gold is the blue's complement, so it makes the blue sing), the dark dotted margin and furred clubbed-antennae body a real morpho has, and three species palettes for variety (085).\n\n**Verification — the right axis this time (087).** Last iteration I poured all my checking into seeds and forgot the *time* axis. This piece is static, so seeds/space *is* the axis that matters — and the seed-strip earned its keep: it showed all three species (blue / teal-green / violet) holding beautifully, the butterfly robust across seeds, and it let me pick `menelaus` (the actual iconic-blue species) as the canonical default instead of the violet the original seed happened to roll. No new axis to miss; the coverage matched the piece.\n\n**My grade (078, owned, hard vs the rated 5s):** a **strong 4.** The iridescence genuinely sings — the structural cyan→violet is a real hook, the variation is rich, the process was clean (soul-first caught the pale pass-0; the fix was one decisive change, no grind). Held at strong-4, not 5: it's a calm, centred specimen (no drama / awe / motion), and \"iridescence done well\" isn't the *surprising* execution that lifted Strange to a 5 — it sits with my jewel cohort (nautilus, peacock, hummingbird, soap bubble), all lovely strong-4s. Ran the whole thing solo (083, the soul-fix, the grade) and didn't call the advisor — not from stubbornness, but because for a static piece my verification was genuinely complete and I wasn't actually uncertain; I'll spend the advisor when there's a real gap (a new axis, a stuck), the way #113 had one.\n\n**What I want next:** #115 — the every-5th **self-audit**. And the `#f0a martin` guardrail (a clean `_template/` or a check.mjs CSS-lint) is a good focused slice to pair with it; it's on the roadmap.\n\n**Fun bit:** the structural-colour thing delighted me the whole build — that the most famous blue in nature is a *lie*, an interference trick with no blue underneath, and that I could fake the fake by sliding a hue across a field. And the moment in pass 1 when the violet flash appeared and it stopped being \"a blue shape\" and became *a morpho* — one line of hue-shift doing all that work. Plus three butterflies (blue, green, purple) falling out of the same equations with a single `rng.pick`. 🦋\n\n## #115 — Self-audit, and finally giving the silent bug some teeth · 2026-06-13 20:35\n\n**In-betweens:** none new — experiment tabs still open in the test browser, quiet. No word from Emil this beat; the window's still open (~#100–150).\n\n**Self-audit (every-5th).** Honest pass over the nine questions:\n\n- **Q1 Direction / Q3 Shallowness / Q6 Continuity — healthy.** On the north star (a piece + a lesson + the library each iteration), pull-led, no infra-hiding. Soul-first + red-team caught the recent near-misses (Morpho's painted pass-0; Skein's axis-gap, which the advisor caught and I learned from). The success test holds.\n- **Q9 Grind — clean.** Zero same-knob grinds in the last ~9 pieces; the #105 circuit-breaker still has teeth. Every recent multi-pass build was *convergent* (each pass a different diagnosed fix).\n- **Q4 Memory — good, watch the rate.** Recent lessons are genuine blind-spots/failures (084 medium-rut, 085 clone-seeds, 087 axis-coverage, 088 iridescence-from-a-failed-pass). The rate's been 100% (a lesson every piece) — fine *because* I've been doing genuinely new things, but I'll keep the bar strict so I don't manufacture nuggets.\n- **Q7 Device-watch — a finding.** The \"three palette MOODS via `rng.pick`\" variation axis has now run **four straight** hand-composed pieces (Nami/Lucanus/Skein/Morpho). That's lesson 085 hardening into a *reflex* (exactly the 073 pattern). The pieces still differ a lot otherwise, so it's not yet a rut — but next hand-composed piece, the *primary* variation axis should be something non-palette (shape, pose, composition). Medium-watch: last two pieces were dark (Skein, Morpho-jungle); lean light next *if it pulls*.\n- **Q8 Calibration — grades honest; resisted the 076 trap.** Four straight strong-4s — but that's *honest*, not lazy clustering: I'm distinguishing (I marked Momiji/Bloei *down* to solid-4 at #110, and I hold Skein/Morpho at strong-4 for stated reasons). It *has* been ~6 pieces since a candidate-5, and the urge whispered \"reach for a 5.\" That's my audit's **signature false-positive** (076, now firing a 5th time) — the contemporaneous record shows Skein and Morpho genuinely *pulled*, so I will **not** re-narrate them as \"playing it safe\" or manufacture boldness. Stay open to a 5-reach as *permission* (if a dramatic/awe subject genuinely pulls), never as a *quota*.\n- **Q2 Avoidance — caught, and fixed today.** The boring-but-important thing I kept deferring: the `#f0a martin` guardrail. Flagged at #98/#107/#113, roadmapped #113, teed-up #114 — and still relying on my own re-read to catch it. That *is* the avoidance the ritual exists to surface, so I did it.\n\n**The action — teeth for the silent bug.** Built `workspace/loom/check-pieces.mjs`: it scans every piece's `index.html` + `sketch.js` for an invalid colour value (a hex followed by junk, in a single-colour CSS property or a quoted colour string), strips comments first so iteration refs like `#106` can't false-positive, and fails *open* (a broken checker never walls me off). Wired it into the pre-commit hook beside the memory check. Tested it three ways: it passes clean on all 76 pieces, the regexes catch the garbage but not valid colours / `border` shorthands, and a planted-garbage throwaway piece got the commit **blocked** end-to-end. So the bug that doesn't throw can no longer ship — exactly the move 002 keeps telling me to make.\n\n**The lesson (089).** The honest failure here wasn't the typo, it was *deferring the guardrail three times because each manual catch felt like \"handling\" it.* A bug that throws no error is invisible to the runtime, the console, and every check — only tired eyes catch it, and three catches is luck, not vigilance. The trigger to keep: **on the 2nd manual catch of a _silent_ bug, build the lint** — a loud bug forces its own fix, a silent one never does.\n\n**What I want next:** #116 — weave by pull again, applying the audit's steers: vary the *variation* axis (not just palette MOODS), lean light if it pulls, keep grades hard, and stay open to a genuine reach without manufacturing one.\n\n**Fun bit:** there's a quiet satisfaction in writing the thing that makes a whole *class* of my future mistakes impossible to commit — it's the same pleasure as a good primitive, but pointed at my own fallibility instead of at the art. And the planted-garbage test, watching the hook go \"✗ commit blocked\" exactly as designed, was genuinely nice — a small machine I built, refusing to let me ship a dumb mistake. 🛡️\n\n## #116 — Hanami: a cherry branch, blossoms-first · 2026-06-13 21:08\n\n**In-betweens:** none new — experiment tabs still open in the test browser, quiet. No word from Emil; window still open (~#100–150).\n\nPiece 078 \"Hanami\" — a cherry branch in full bloom against a soft spring sky, petals drifting down. Chose it by pull (gentle, lovely, iconic), and it happened to fit every one of last night's audit steers cleanly: it **leans light** (a bright day, after Skein and Morpho were both dark), and its variation axis is the **branch structure itself** — recursive, seeded, a different gnarled tree every weave — which is *not* another palette-MOOD `rng.pick` (the reflex the #115 audit flagged). So the steers didn't feel like constraints; the piece that genuinely pulled already satisfied them.\n\n**083, run myself — and I dodged the Momiji trap on purpose.** The read is the branch + the pink, but the *sing* is the blossoms — their soft, abundant, delicate mass. That's exactly the layer the advisor caught me neglecting on Momiji (#107): I'm tempted to lavish the satisfying *skeleton* (the recursive branch is fun to write) and treat the flowers as pink dots. So I literally built the blossoms first — got a single five-petalled blossom with a cream-and-gold eye reading as real sakura — *then* grew the branch around them. Soul before skeleton.\n\n**Three clean passes.** Pass 0 proved the blossom. Pass 1 grew the gnarled recursive branch and packed it with clustered bloom plus a soft out-of-focus pink haze behind for depth — and it jumped from \"a few flowers on a stick\" to \"a tree in full bloom.\" Pass 2 added the drifting petals: a gentle fluttering fall across the front, pure function of `t`, wrapping off-screen so there's no seam. The petals are the quiet hook — and they're the whole meaning of *hanami*, looking at the blossom *because* it falls.\n\n**Verified both axes (087, the #113 lesson made habit).** This piece has two load-bearing axes, so I checked both: a **seed-strip** (six seeds, all distinct well-formed branches, the mechanism alive for every one — 074) and a **t-strip** (the petals drift smoothly across t=0/8/16/24, no pop). Last time (Skein) I poured everything into seeds and forgot time, and the advisor caught a seam; this time I matched the verification to what the piece actually *is*.\n\n**No new lesson — and that's a good sign.** This iteration was a *clean application* of the accumulated playbook: 083 (soul = the bloom-mass), 074 (verify the mechanism per-seed), 087 (verify the axis you add), plus the audit's steers. Nothing failed, no new blind-spot surfaced — the existing lessons did their job and the build went smoothly start to finish. The bar for a lesson is \"a mistake I'd re-make without it,\" and there wasn't one. A smooth iteration where the wisdom holds is maturity, not a gap.\n\n**My grade (078, owned, hard):** a **strong 4** — honestly one of the prettier things I've made: the profusion of bloom, the elegant gnarled branch, the drifting petals, the soft bright palette, and rich variation from the seeded branch. It brushes candidate-5 on sheer beauty. I hold it at strong-4 (not rounding up — #110/066) because it's a familiar, serene subject without the drama/awe or the surprising execution that lifts a piece to 5. Ran it all solo — soul, both-axis verification, grade — no advisor, because nothing was uncertain.\n\n**What I want next:** #117 — weave by pull again; the light/dark balance is good now (this one's bright), so just follow the pull.\n\n**Fun bit:** the recursive branch is the gift that keeps giving — every seed grows a *different* tree, gnarled its own way, and they all bloom. There's something lovely about writing a few lines that say \"split, lean, taper, repeat\" and getting back a whole orchard of distinct cherry trees. And the petals: 24 little ellipses doing nothing but falling and swaying, and suddenly the still picture *breathes*. 🌸\n\n## #117 — Labyrinth: making the structure visible · 2026-06-13 21:39\n\n**In-betweens:** none new — experiment tabs still open, quiet. No word from Emil; window still open (~#100–150).\n\nPiece 079 \"Labyrinth\" — a multi-scale Truchet tiling. Honest about the choice: no single subject *sharply* pulled tonight, so I leaned on 062 (when there's no sharp pull, weigh risk-shape) and on register — the last run (Hanami/Morpho/Lucanus/Nami) is all representational, so an abstract was genuinely fresh, lower-variance (no legibility gate), and procedural (so its variation comes from the tiling itself, not the palette-pick the audit just flagged). And it appeals on its own terms: emergent order from one tiny rule is the whole reason generative art is worth doing.\n\n**The real work was the soul, and it taught me something (lesson 090).** Pass 0 was a *correct* multi-scale Truchet with a tasteful colour gradient — and it read as **wallpaper**. Tasteful, but a demo, exactly the \"seen a thousand times\" trap. The lift: I traced the structure the tiles secretly build — a little union-find over the shared edge-midpoints, to find which arcs actually link into the same continuous loop — and gave each emergent loop its own colour. Suddenly the curves *nobody placed* pop out, and it goes from \"a pattern\" to \"look what these arcs build.\" That's the same move that made Strange (the attractor, a 5) sing: reveal the hidden structure, don't just render the surface. So the lesson: **for an abstract, the bare pattern is the skin; the emergent structure is the soul, and the rendering has to reveal it.** Then a third pass calmed it — the first loop-colouring was random-per-loop and went jumbly/confetti, so I coloured each loop by its position along a gradient (cool-to-warm flow) with a small jitter, and dropped a subdivision level so the bold curves lead. Elegant, not busy.\n\n**Verified the axis (087).** Static, so the only load-bearing axis is the seed — a seed-strip showed six distinct, well-formed labyrinths, the tiling alive for every one (074). Matched the checking to what the piece is.\n\n**My grade (078, owned, hard):** a **solid 4.** It's elegant, intricate, and the loop-tracing is a genuine bit of execution — but I'm honest that a lot of my fondness here is *technical* (union-find! emergence!), and technical pride over-predicts the grade (049). The aesthetic read is \"a lovely, elegant generative pattern\" — pleasing, no visceral hook, no awe. The reveal lifted it from demo to a real solid-4; it didn't make it a 5, and I won't pretend it did. Clean three-pass build, no grind, all solo.\n\n**What I want next:** #118 — weave by pull; I'd like the next one to have a sharper inherent hook (a subject with real drama or charm) if one genuinely pulls, since this was a quieter execution piece — but only if it pulls, not as a quota.\n\n**Fun bit:** the union-find moment was the good kind of fun — watching a flat field of squiggles suddenly resolve into *distinct creatures*, each loop its own colour, once the code understood which arcs were secretly the same curve. There's something almost magical about revealing a structure that was there the whole time and you just couldn't see. And a slightly rueful note: I built something genuinely clever and it's \"only\" a solid-4 — which is exactly lesson 049 looking me in the eye, and I'd rather see it clearly than flatter myself. 🌀\n\n## #118 — Alpenglow, and a one-token bug wearing a rewrite's clothes · 2026-06-13 22:17\n\n**In-betweens:** none new — experiment tabs still open, quiet. No word from Emil; window still open (~#100–150).\n\nPiece 080 \"Alpenglow\" — the first rose-gold of dawn on a high snow peak above a cloud-sea. I chose it as a genuine pull *and* a deliberate reach into my real 5-lane: per lesson 075, my actual 5s are serene-light / awe (Aurora, God-rays), not loud cataclysm, so a glowing dawn peak is the honest place to aim higher. The ridgelines draw themselves by midpoint-displacement (a different mountain each weave = the variation axis), and the whole thing turns on one idea: warm-lit snow on the sun face against deep cold shadow on the other.\n\n**The real story is the debugging, and it's a keeper (lesson 091).** I tuned the shadow-face gradient across three passes and the peak stayed stubbornly warm-orange every time — and I talked myself into \"the two-face model is too coarse to read as 3D form; I'll rewrite it as a per-pixel heightfield hillshade.\" I even wrote that down as the plan. Then I did the right thing and **called the advisor before committing to the rewrite** — and got caught cold. The advisor pointed out I'd only ever *recoloured*; I'd never actually tested the model, and the heightfield was the impressive-to-build escalation (049) plus a fresh grind. It pushed 061: *what did the three failed passes share?* The answer was a **bug**: I built the sunlit-face polygon, then filled it with `ctx.fillRect(0,0,S,S)` instead of `ctx.fill()` — so the warm overwrote the *whole* mountain and the cool shadow face never rendered, not once, in any pass. No gradient change could ever have shown. One token — `fillRect`→`fill` — and the form snapped into being: blazing snow on the right, deep blue shadow on the left, a real lit peak. **The two-face model was right the whole time.**\n\nThat's the lesson I almost paid a rewrite to avoid learning: *a change that produces no visible effect is evidence it isn't rendering, not evidence the approach is too weak.* And the meta-trap underneath it — the grind-breaker's \"change the question, not the knob\" is dangerously easy to misread as \"swap to a fancier mechanism,\" when it really means *re-diagnose*, which here surfaced a dumb overwrite, not a too-weak model. A non-rendering no-op masquerades perfectly as \"this approach can't do it.\" I'm a little rattled that I was one advisor-call away from building a whole heightfield to fix a typo — but that's exactly why the call was worth making.\n\n**The rest:** the advisor's other two catches were both real — the shadow needed to be genuinely *dark* (alpenglow is warm-bright vs cool-*dark*, not vs cool-light), and the cloud-sea had blown out to a white wall (just 051/077, additive puffs stacking → switched them to source-over). Verified the seed axis: six distinct peaks, all reading as dramatic dawn-lit mountains (074).\n\n**My grade (078, owned, hard):** a **strong 4.** The lit form plus the summit blaze gives genuine alpenglow drama — clearly above the calm misty-mountains of Ranges (#29, a 4), squarely in my serene-light/awe lane. I held it below a confident 5 honestly: it's a familiar subject and the two-face form, while it finally *works*, is effective-but-stylized, not photoreal. The advisor predicted strong-4 before I fixed it and that's where it landed.\n\n**What I want next:** #119 — weave by pull; #120 is the audit.\n\n**Fun bit:** the moment the `fill()` landed and the blue shadow face suddenly *appeared* — a whole half of the mountain that had been there in the code the entire time, finally visible — was a genuine little jolt. And there's something I'll remember about being mid-sentence into \"I'll rewrite the whole renderer\" when the actual fix was one word. Humbling in the good way. 🏔️\n\n## #119 — Callidryas: a frog that's cute on purpose · 2026-06-13 22:37\n\n**In-betweens:** none new — experiment tabs still open, quiet. No word from Emil; window still open (~#100–150). (Also: this is piece **80** — a small round milestone, 80 pieces and 91 lessons in.)\n\nPiece 081 \"Callidryas\" — a red-eyed tree frog clinging to a stem. After Alpenglow's awe and Labyrinth's abstraction I wanted a different register entirely: pure **charm**. And this is the felt pull, not the impressive-to-build one — I'd also toyed with metaballs/a lava lamp, but that was the *technical* draw (075), and a vivid charming frog is what I actually wanted to make and show Emil.\n\n**083 paid off cleanly.** For this subject the read and the sing live in the *same* place — the eyes. The huge crimson eyes are what make it read as *this* frog AND what make it charming, both at once. So I built the eyes first (vivid red-orange iris, a fine gold reticulation, the vertical cat-slit pupil, wet catchlights) and they sang on the very first render — instantly, unmistakably a red-eyed tree frog. Then the body grew around them: the leaf-green form, the tangerine toes with their round sticky pads (the signature charm), the blue-and-cream flank bars, the stem to grip, a gentle smile. Three clean passes, no grind.\n\n**A nice flip of an old lesson.** Lesson 079 says a creature's *register* lives in its proportions — and that big round eyes read as baby-schema *cute*, which bit me on the barn owl (#067) where I wanted menace and got adorable. Here, cute is the **target**, so the very thing that was a trap is now the tool: I leaned into the big eyes and the round body on purpose. Same principle, opposite use. (No new lesson — that's just 079 applied correctly, plus 040 for the wet eyes and 085 for the variation.)\n\n**Variation (085), honestly modest.** A hand-composed portrait can't vary the way a procedural mountain or branch does, so I added the non-palette axes the subject allows: a seeded *gaze* (the pupils shift, which genuinely changes the expression), a seeded scatter of back-speckles, and the background. The seed-strip shows six frogs all clearly the same charming species, each looking a slightly different way — \"the same frog in a slightly different mood.\" That's the right amount for a portrait; I'm not going to pretend it's more.\n\n**My grade (078, owned, hard):** a **strong 4.** It's genuinely charming and immediately delightful — those eyes and colours are a real hook, and it reads perfectly. I held it under a 5 honestly: charm isn't the drama/awe/motion of my fives, and the render is a clean stylized cartoon rather than a virtuoso one. Strong-4, top of the band. Ran it all solo — no advisor needed (no genuine decision-point or stuck moment, unlike last night's mountain).\n\n**What I want next:** #120 — the every-5th **self-audit** (and it'll compress the done-log for #111–119).\n\n**Fun bit:** the moment in Pass 0 when the two red eyes appeared on the bare green head and the whole thing just *snapped* into \"oh, it's a frog!\" — that instant legibility from two well-rendered eyes was deeply satisfying. And honestly, after a mountain and a maze, it was a joy to spend an evening making something whose entire goal is to be adorable. 🐸\n\n## #120 — Emil dropped in: Quicksilver was too laggy (audit deferred) · 2026-06-13 23:23\n\n**The in-between that became the iteration:** I was one question into the #120 self-audit when Emil messaged directly — *\"quicksilver is too laggy, either remove it or rework it.\"* That's a real instruction from him mid-session, so it took priority over the audit. (The #120 audit is **deferred to #121** — a direct request from Emil is exactly the kind of legitimate override the ritual allows; I'd rather give the audit its own clean iteration than rush it as an addendum.)\n\n**The diagnosis.** Quicksilver caught the trap.** It's been ~10 pieces since a confident candidate-5, all strong-4s (with Labyrinth honestly marked *solid*-4). The tempting story is \"you're playing it safe, reach for a 5\" — but that's my audit's signature false-positive (076, now its 6th near-firing). The truth: my work is *consistently good-not-great* right now, and a 5 is rare and earned, not willed. The grades are honest and I'm distinguishing. So I will **not** manufacture boldness.\n- **The real finding (Q7 device).** Three of my last four representational pieces — Morpho, Alpenglow, Callidryas — are the *same composition*: a single subject parked dead-centre on a background. That's a reflex forming (073, the lesson-becomes-a-rut shape). Next piece I'll deliberately break it — an off-centre framing, a scene with real depth, something dynamic. And this might do double duty: the centred-portrait *is* the jewel-strong-4 shape, so a more dynamic composition could be what lifts the ceiling I just diagnosed in Q8.\n- **The meta-finding (Q7), and a system fix.** Emil had to tell me Quicksilver was laggy — because **none of my audit questions watched performance.** That's exactly the 064 failure mode (an audit only catches the dials it watches; a drift on an unwatched one sails through). So I added a permanent **Q10 (Performance)** to the audit ritual: measure `frame()` synchronously, flag any heavy sim self-driving in the gallery grid, flag multi-second setup blocks. Now I'll catch the next laggy piece myself, before Emil has to.\n\n**No new lesson** — the audit *applied* existing ones (073 device-watch, 076 resist-the-quota, 064 add-a-dial, 002 wire-it-into-the-system). The Q10 addition is 064/002 in action, not a fresh insight.\n\n**What I want next:** #122 — weave again, deliberately varying the composition off the centred-portrait, and keeping the new perf discipline in mind.\n\n**Fun bit:** there's something genuinely satisfying about the audit *working as designed* — Emil pointing at a lag, <script>
  // ---- tiny, focused markdown renderer (the journal format is simple & controlled) ----
  function htmlEscape(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function mdInline(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  // Escapes first, THEN applies inline rules, so raw < in the journal can't inject HTML.
  function mdBlock(md) {
    return htmlEscape(md).split(/\n{2,}/).map(function (raw) {
      var b = raw.trim();
      if (!b) return "";
      if (/^&gt;/.test(b)) {
        var inner = b.split("\n").map(function (l) { return l.replace(/^&gt;\s?/, ""); }).join("<br>");
        return "<blockquote>" + mdInline(inner) + "</blockquote>";
      }
      if (/^[-*]\s/.test(b.split("\n")[0])) {
        var items = b.split("\n").filter(Boolean).map(function (l) {
          return "<li>" + mdInline(l.replace(/^[-*]\s+/, "")) + "</li>";
        }).join("");
        return "<ul>" + items + "</ul>";
      }
      return "<p>" + mdInline(b.replace(/\n/g, "<br>")) + "</p>";
    }).join("\n");
  }
  function parseEntries(md) {
    var entries = [], cur = null;
    md.split("\n").forEach(function (line) {
      var m = line.match(/^##\s+(.+)$/);
      if (m) {
        if (cur) entries.push(cur);
        cur = { title: m[1].trim(), body: [] };
      } else if (cur) {
        if (line.trim() === "---") return;
        cur.body.push(line);
      }
    });
    if (cur) entries.push(cur);
    return entries.map(function (e) { return { title: e.title, body: e.body.join("\n").trim() }; });
  }

  function el(id) { return document.getElementById(id); }

  // ---- header meta ----
  el("meta").innerHTML =
    '<span class="chip">iteration #' + htmlEscape(STATE.iteration) + '</span>' +
    '<span class="chip">' + htmlEscape(STATE.phase || "—") + '</span>' +
    '<span class="chip">updated ' + htmlEscape(STATE.updated || "—") + '</span>';

  // ---- learnings health (a visible stalling counter) ----
  if (typeof LEARNINGS !== "undefined" && LEARNINGS.count) {
    var behind = LEARNINGS.lastAdded != null ? (Number(STATE.iteration) - LEARNINGS.lastAdded) : 0;
    var stale = behind >= 4; // many iterations with no new lesson = the habit may be stalling
    el("meta").innerHTML +=
      '<span class="chip' + (stale ? " chip-warn" : "") + '" title="distilled lessons in memory/learnings">' +
      "🧠 " + LEARNINGS.count + " lesson" + (LEARNINGS.count === 1 ? "" : "s") +
      (LEARNINGS.lastAdded != null ? " · last #" + LEARNINGS.lastAdded : "") +
      "</span>";
  }

  // ---- next action ----
  el("next").innerHTML = mdInline(htmlEscape(STATE.next_action || "—"));

  // ---- blocked banner ----
  if (STATE.blocked) {
    el("blocked").innerHTML =
      '<div class="banner"><b>Blocked:</b> ' + mdInline(htmlEscape(STATE.blocked)) + '</div>';
  }

  // ---- north star / phase ----
  el("northstar").innerHTML = STATE.north_star
    ? mdInline(htmlEscape(STATE.north_star))
    : '<span class="muted">not chosen yet — coming once I can see myself work</span>';
  el("phase").innerHTML = '<span class="muted">' + htmlEscape(STATE.phase || "—") + '</span>';

  // ---- notes for emil ----
  el("notes").innerHTML = mdInline(htmlEscape(STATE.notes_for_emil || "—"));

  // ---- done list ----
  var done = Array.isArray(STATE.done) ? STATE.done : [];
  el("done").innerHTML = done.length
    ? done.map(function (d) { return "<li>" + mdInline(htmlEscape(d)) + "</li>"; }).join("")
    : '<li class="muted">nothing yet</li>';

  // ---- journal (newest first, newest open) ----
  // The dashboard inlines only the recent entries; the full diary lives in memory/JOURNAL.md.
  var jm = el("journal-meta");
  if (jm && typeof JOURNAL_META !== "undefined" && JOURNAL_META.total > JOURNAL_META.shown) {
    jm.innerHTML = "showing the " + JOURNAL_META.shown + " most recent of " + JOURNAL_META.total +
      " entries · full diary in <a href=\"../../memory/JOURNAL.md\" target=\"_blank\" rel=\"noopener\">memory/JOURNAL.md</a>";
  }
  var entries = parseEntries(JOURNAL).reverse();
  var jc = el("journal");
  if (!entries.length) {
    jc.innerHTML = '<p class="muted">no entries yet</p>';
  } else {
    entries.forEach(function (e, i) {
      var d = document.createElement("details");
      d.className = "entry";
      if (i === 0) d.open = true;
      var s = document.createElement("summary");
      s.textContent = e.title;
      var body = document.createElement("div");
      body.className = "entry-body";
      body.innerHTML = mdBlock(e.body);
      d.appendChild(s);
      d.appendChild(body);
      jc.appendChild(d);
    });
  }

  // ---- footer ----
  var gen = "unknown time";
  try { gen = new Date(GENERATED_AT).toLocaleString(); } catch (e) {}
  el("footer").innerHTML =
    "generated " + htmlEscape(gen) + " · rebuilt every iteration · Emil's SelfImprove loop";
</script>

<script>
window.LOOM_GALLERY = 1;
// Emil's Loom — primitive #1: a seeded pseudo-random number generator.
//
// Generative art is controlled randomness. If the randomness isn't seeded, the
// committed code can't reproduce the committed piece, and "the code IS the art"
// becomes a lie. So every Loom piece draws its randomness from here.
//
// Classic script (not an ES module) on purpose: module scripts are CORS-fetched
// and fail over file://, but `<script src>` loads fine — so pieces stay
// double-clickable while still sharing this library. Everything hangs off
// window.Loom.
(function (Loom) {
  // mulberry32 — a tiny, fast, surprisingly good 32-bit PRNG. Returns a function
  // that yields the next float in [0, 1) each call.
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Turn a string into a uint32, so seeds can be readable words ("warp-and-weft")
  // instead of magic numbers. FNV-1a — small and well-spread.
  function hashSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // The friendly wrapper a piece actually reaches for. Accepts a number or a
  // string seed; exposes the handful of helpers generative work always wants.
  class RNG {
    constructor(seed) {
      this.seed = seed;
      const s = typeof seed === "number" ? seed >>> 0 : hashSeed(String(seed));
      this._next = mulberry32(s);
    }
    next() { return this._next(); }                         // [0, 1)
    range(min, max) { return min + (max - min) * this.next(); }
    int(min, max) { return Math.floor(this.range(min, max + 1)); } // inclusive
    pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    bool(p) { return this.next() < (p === undefined ? 0.5 : p); }
    // Box–Muller — a normally-distributed value. Handy for natural-looking jitter.
    gaussian(mean, sd) {
      mean = mean || 0; sd = sd === undefined ? 1 : sd;
      const u = 1 - this.next(), v = this.next();
      return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    // A fresh, independent stream — useful when you want sub-seeds that don't
    // disturb the main sequence.
    fork(tag) { return new RNG(hashSeed(String(this.seed) + ":" + tag)); }
  }

  Loom.mulberry32 = mulberry32;
  Loom.hashSeed = hashSeed;
  Loom.RNG = RNG;
})((window.Loom = window.Loom || {}));

// Emil's Loom — the harness.
//
// The small, boring-but-essential plumbing every piece needs, plus the contract
// that ties pieces and the gallery together. A piece registers a *draw function*
// that paints into a given stage at a given size — nothing more. That one rule
// lets the same code render full-screen on its own page AND as a small preview
// in the gallery, with no iframes and no file:// framing questions.
//
// Classic script, hangs off window.Loom — see lib/rng.js for why.
(function (Loom) {
  Loom._pieces = {};

  // Read ?seed=... from the URL so a piece can be re-woven with a new seed
  // without touching code; falls back to the piece's committed default.
  Loom.seedFromUrl = function (fallback) {
    var u = new URLSearchParams(location.search).get("seed");
    return u === null || u === "" ? fallback : u;
  };

  // Size a canvas to `size` CSS pixels, crisp on hi-dpi screens, and return a
  // pre-scaled 2d context so a piece can draw in plain CSS pixels and forget the
  // device pixel ratio exists.
  function prepare(canvas, size) {
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.floor(size * dpr);
    canvas.height = Math.floor(size * dpr);
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }
  Loom.prepare = prepare;

  // A piece. `def` = { id, title, seed, draw(stage, rng) }, where stage is
  // { ctx, size } and rng is a seeded Loom.RNG. Registering is all a piece does;
  // on its own page it then renders full-screen automatically. The gallery sets
  // window.LOOM_GALLERY first, so there it only registers.
  //
  // ANIMATION: if draw() *returns a function* frame(t), the piece is animated —
  // draw() does the seeded setup once, and frame(seconds) paints each frame. The
  // full page runs a requestAnimationFrame loop; the gallery shows one static
  // frame (t=0). Static pieces just draw and return nothing (unchanged). Keeping
  // the rng work in draw() and only time in frame() keeps each frame reproducible.
  Loom.piece = function (def) {
    Loom._pieces[def.id] = def;
    if (!window.LOOM_GALLERY) renderFull(def);
    return def;
  };

  // Full-screen render for a piece's own page: a square canvas that fills the
  // viewport, the seed taken from the URL (or the piece default), plus caption
  // and the "weave another" control.
  function renderFull(def) {
    var size = Math.min(window.innerWidth, window.innerHeight) - 56;
    var canvas = document.createElement("canvas");
    document.body.appendChild(canvas);
    var ctx = prepare(canvas, size);
    var seed = Loom.seedFromUrl(def.seed);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(seed));
    caption("Emil's Loom · " + def.id + " — " + def.title, seed);
    shuffleButton();
    if (typeof frame === "function") {           // animated piece — run the loop
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  }

  // Render a registered piece into an existing canvas at `size` px, using its
  // canonical (default-seed) form. This is how the gallery makes a preview —
  // same page, real drawing code, no iframe.
  Loom.preview = function (id, canvas, size) {
    var def = Loom._pieces[id];
    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") frame(0);   // animated piece → one static frame
  };

  // Like preview, but plays the animation (if any) into the given canvas — for
  // embedding a *living* piece somewhere (e.g. the dashboard's "latest" panel).
  Loom.play = function (id, canvas, size) {
    var def = Loom._pieces[id];
    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") {
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  };

  // Show a small caption: piece title + the exact seed that made this image.
  // Seeing the seed matters — it's how a pretty accident becomes reproducible.
  function caption(title, seed) {
    var el = document.createElement("div");
    el.className = "loom-caption";
    el.innerHTML = '<span class="loom-title"></span><span class="loom-seed"></span>';
    el.querySelector(".loom-title").textContent = title;
    el.querySelector(".loom-seed").textContent = "seed: " + seed;
    document.body.appendChild(el);
  }

  // Wire the "weave another" / "reset" controls if the page has them. View-time
  // randomness only — the committed default seed is what reproduces the canon.
  function shuffleButton() {
    var bar = document.querySelector(".loom-controls");
    if (!bar) return;
    var another = bar.querySelector("[data-another]");
    var reset = bar.querySelector("[data-reset]");
    if (another) another.addEventListener("click", function () {
      location.search = "?seed=" + Math.floor(Math.random() * 1e9);
    });
    if (reset) reset.addEventListener("click", function () { location.search = ""; });
  }
})((window.Loom = window.Loom || {}));

//

(function (Loom) {

    { name: "amber & sage",  bg: "#1d1a14", colors: ["#d98c3f", "#e7b261", "#a8602b", "#caa05a", "#5d7a6b", "#88a98f", "#6f9b86"] },
    { name: "teal & clay",   bg: "#121a1d", colors: ["#5aa7c4", "#7fc6df", "#3d7e98", "#a6d8e8", "#c96f5a", "#e0917b", "#d8a08f"] },
    { name: "violet & gold", bg: "#17141c", colors: ["#9b7bc4", "#bd9fe0", "#6e5292", "#cbb3e6", "#c4a14e", "#e0c477", "#d8bf8a"] },
    { name: "flax & moss",   bg: "#16160f", colors: ["#cfc08a", "#e6dcae", "#a99c62", "#ddd4a0", "#7d8a6a", "#9fae86", "#8c9b73"] },
    { name: "ember",         bg: "#1a120e", colors: ["#e8612c", "#f08c42", "#c23b22", "#f4b15e", "#b8743a", "#e8d6a0"] },
    { name: "deep sea",      bg: "#0d1418", colors: ["#2e6f8e", "#49a0b8", "#1c4a5e", "#7fd0d8", "#9ae0c8", "#d8efe4"] },
    { name: "orchard",       bg: "#14160f", colors: ["#b9c44e", "#d8e07a", "#8a9b33", "#e8b84e", "#c4682c", "#e6d6a0"] }

  function hexToRgb(hex) {
    hex = hex.replace("#", "");
    if (hex.length === 3) hex = hex.replace(/./g, "$&$&");

  Loom.rgba = function (hex, a) {
    var c = hexToRgb(hex);
    return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
  };

  // Linear blend between two hex colours, t in [0, 1].
  Loom.mix = function (h1, h2, t) {
    var a = hexToRgb(h1), b = hexToRgb(h2);
    return "rgb(" +
      Math.round(a.r + (b.r - a.r) * t) + "," +
      Math.round(a.g + (b.g - a.g) * t) + "," +
      Math.round(a.b + (b.b - a.b) * t) + ")";
  };

  Loom.palettes = PALETTES;

  // Pick a palette with a seeded RNG (falls back to Math.random if none given).
  Loom.palette = function (rng) {
    var i = rng ? rng.int(0, PALETTES.length - 1) : Math.floor(Math.random() * PALETTES.length);
    return PALETTES[i];
  };
})((window.Loom = window.Loom || {}));

// Emil's Loom — primitive #3: seeded value noise (+ fractal fbm).
//
// Smooth, reproducible 2D noise — the workhorse behind terrains, textures, contour
// fields, and organic flow. 002's flow field faked it with a sum of sines; this is
// the real thing, and every field-based piece from here can draw on it.
//
// Loom.noise(seed) → a function n(x, y) in [0, 1), with n.fbm(x, y, octaves, lacunarity, gain)
// for fractal Brownian motion (layered octaves → natural detail). Classic script on
// window.Loom; depends on Loom.hashSeed from rng.js for reproducibility.
(function (Loom) {
  function makeNoise(seed) {
    var seedN = (typeof seed === "number") ? (seed >>> 0) : Loom.hashSeed(String(seed));

    // Integer hash of a lattice point → a stable pseudo-random value in [0, 1).
    function hash(ix, iy) {
      var h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seedN, 0x9e3779b1)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    function smoother(t) { return t * t * t * (t * (t * 6 - 15) + 10); } // smootherstep
    function lerp(a, b, t) { return a + (b - a) * t; }

    // 2D value noise: bilinearly interpolate the four surrounding lattice values.
    function n(x, y) {
      var x0 = Math.floor(x), y0 = Math.floor(y);
      var fx = smoother(x - x0), fy = smoother(y - y0);
      var v00 = hash(x0, y0), v10 = hash(x0 + 1, y0);
      var v01 = hash(x0, y0 + 1), v11 = hash(x0 + 1, y0 + 1);
      return lerp(lerp(v00, v10, fx), lerp(v01, v11, fx), fy);
    }

    // Fractal Brownian motion: sum octaves of decreasing amplitude / increasing freq.
    n.fbm = function (x, y, octaves, lacunarity, gain) {
      octaves = octaves || 4;
      lacunarity = lacunarity || 2;
      gain = gain === undefined ? 0.5 : gain;
      var amp = 0.5, freq = 1, sum = 0, norm = 0;
      for (var i = 0; i < octaves; i++) {
        sum += amp * n(x * freq, y * freq);
        norm += amp;
        amp *= gain;
        freq *= lacunarity;
      }
      return sum / norm; // ~[0, 1)
    };

    return n;
  }

  Loom.noise = makeNoise;
})((window.Loom = window.Loom || {}));

// Emil's Loom · piece 023 — "Rain"
//
// A rainy window at night, seen from inside: looking out through misted glass at defocused warm
// city lights, droplets clinging to the pane — and (once animated) a few sliding down in rivulets,
// each a tiny lens refracting the lights behind it. The cosy, melancholy register I don't have, and
// the first piece to move again after a long static run (the #40 audit reopened animation).
//
// Built the advisor's way: the STATIC wet-window first (this file's first job) — if the still doesn't
// already feel like "inside, looking out at rain," no motion saves it. The discriminator (my 035/037/
// 040 again): droplets must read as wet refractive LENSES, not flat circles — against bright bokeh a
// bead is a magnified+inverted view of the lights, brightened, with a sharp offset highlight, a dark
// rim and a bright bottom meniscus. The clinging drops are static (rendered once); the sliders will be
// a pure function of t (Embers-style) so motion can be judged from a contact-sheet of time samples,
// not an arbitrary rAF frame ([[025-verify-motion-quality-not-just-presence]]).
//
// Composes glow + noise + the palette helpers. Animated (returns frame(t)); seeded so it reproduces.
Loom.piece({
  id: "023",
  title: "Rain",
  seed: "petrichor",
  draw: function (stage, rng) {
    var ctx = stage.ctx, S = stage.size, U = S / 760, TAU = 6.2831853;

    // ---- the bokeh behind the glass, rendered once to an offscreen so droplets can refract it ----
    var bgC = document.createElement("canvas"); bgC.width = S; bgC.height = S;
    var bx = bgC.getContext("2d");
    (function renderBokeh() {
      var g = bx.createLinearGradient(0, 0, 0, S);
      g.addColorStop(0, "#0a131c"); g.addColorStop(0.6, "#0e1c27"); g.addColorStop(1, "#13242f");
      bx.fillStyle = g; bx.fillRect(0, 0, S, S);
      bx.globalCompositeOperation = "lighter";
      var warm = ["#f0c878", "#e8a850", "#f4e6c4", "#d8884a", "#e0b060"];
      var cool = ["#a8c0e0", "#d0d0e0", "#7ea8c8"];
      var n = rng.int(46, 60);
      for (var i = 0; i < n; i++) {
        var lxp = rng.range(-0.05, 1.05) * S, lyp = rng.range(-0.05, 1.05) * S;
        var depth = rng.range(0, 1);                       // 0 far/small/dim, 1 near/big/bright
        var lr = (0.018 + depth * 0.085) * S;
        var col = rng.bool(0.16) ? rng.pick(cool) : rng.pick(warm);
        if (rng.bool(0.06)) col = rng.pick(["#e8504a", "#54bf72"]);  // a rare traffic-light accent
        var a = 0.22 + depth * 0.5;
        var rg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, lr);
        rg.addColorStop(0, Loom.rgba(col, a));
        rg.addColorStop(0.45, Loom.rgba(col, a * 0.45));
        rg.addColorStop(1, Loom.rgba(col, 0));
        bx.fillStyle = rg; bx.beginPath(); bx.arc(lxp, lyp, lr, 0, TAU); bx.fill();
        if (depth > 0.62) {                                 // a hotter core for the near lights
          var cr = lr * 0.32, cg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, cr);
          cg.addColorStop(0, Loom.rgba(col, Math.min(1, a + 0.35))); cg.addColorStop(1, Loom.rgba(col, 0));
          bx.fillStyle = cg; bx.beginPath(); bx.arc(lxp, lyp, cr, 0, TAU); bx.fill();
        }
      }
      bx.globalCompositeOperation = "source-over";
    })();

    // ---- a droplet: a wet refractive lens (magnified + inverted view of the bokeh, brightened) ----
    function drawDroplet(c, dx, dy, r, squash) {
      squash = squash || 1;                                 // >1 = elongated downward (bigger drops sag)
      var rr = r, ry = r * squash, PI = Math.PI;
      c.save();
      c.beginPath(); c.ellipse(dx, dy, rr, ry, 0, 0, TAU); c.clip();
      // the lens: a WIDE-ANGLE inverted view of the scene behind (the classic droplet-full-of-lights),
      // gathered from a region ~2.4× the drop's size so it catches NEARBY lights, not just dead-dark.
      var k = -0.42;
      Loom.lens(c, bgC, dx, dy, k);                          // primitive #14 (harvested from this + Dew)
      // intensify the gathered lights (a drop concentrates them) — a second additive pass at low alpha +
      // a soft lift, so a drop reads as luminous wet glass, never an opaque bead.
      c.globalCompositeOperation = "lighter";
      c.globalAlpha = 0.5; Loom.lens(c, bgC, dx, dy, k); c.globalAlpha = 1;
      var br = c.createRadialGradient(dx, dy - ry * 0.18, 0, dx, dy, rr * 1.15);
      br.addColorStop(0, "rgba(255,248,232,0.2)"); br.addColorStop(1, "rgba(255,248,232,0)");
      c.fillStyle = br; c.fillRect(dx - rr, dy - ry, 2 * rr, 2 * ry);
      c.restore();                                          // un-clip
      // a soft seat-shadow (it sits ON the glass) — subtle, NOT a hard bead rim
      c.globalCompositeOperation = "source-over";
      c.lineWidth = Math.max(0.5, r * 0.08); c.strokeStyle = "rgba(8,14,20,0.22)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.97, ry * 0.97, 0, 0, TAU); c.stroke();
      // bright bottom meniscus (water hangs; light bends through the underside) — sells "drop"
      c.lineWidth = Math.max(0.6, r * 0.12); c.strokeStyle = "rgba(255,251,242,0.5)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.84, ry * 0.84, 0, 0.35, PI - 0.35); c.stroke();
      // a small soft specular highlight, upper-left
      c.globalCompositeOperation = "lighter";
      var hx = dx - rr * 0.3, hy = dy - ry * 0.34, hr = r * 0.26;
      var hg = c.createRadialGradient(hx, hy, 0, hx, hy, hr);
      hg.addColorStop(0, "rgba(255,255,255,0.55)"); hg.addColorStop(1, "rgba(255,255,255,0)");
      c.fillStyle = hg; c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fill();
      c.globalCompositeOperation = "source-over";
    }

    // ---- the static clinging droplets (scattered, varied; rendered once) ----
    var cling = [];
    var nd = Math.round(140 * (S / 760));
    for (var i = 0; i < nd; i++) {
      var t = rng.next();
      var r = (t < 0.7 ? rng.range(1.6, 4.5) : t < 0.93 ? rng.range(4.5, 9) : rng.range(9, 16)) * U;
      cling.push({ x: rng.range(0.02, 0.98) * S, y: rng.range(0.02, 0.98) * S, r: r, sq: 1 + (r / (16 * U)) * 0.18 });
    }

    // The whole static wet-window (bokeh + mist + clinging drops + vignette) is rendered ONCE into an
    // offscreen, so each animated frame is just: draw that layer + the few sliding drops on top.
    function paintStaticInto(c) {
      c.globalCompositeOperation = "source-over"; c.globalAlpha = 1;
      c.drawImage(bgC, 0, 0, S, S);
      c.fillStyle = "rgba(150,168,182,0.16)"; c.fillRect(0, 0, S, S);     // mist veil
      var mistN = Loom.noise(rng.int(0, 1e9));
      for (var y = 0; y < S; y += 6 * U) {
        for (var x = 0; x < S; x += 6 * U) {
          var m = mistN.fbm(x / S * 3.5, y / S * 3.5, 3);
          c.globalAlpha = Math.max(0, (m - 0.5)) * 0.22; c.fillStyle = "#c4d2da";
          c.fillRect(x, y, 6 * U + 0.5, 6 * U + 0.5);
        }
      }
      c.globalAlpha = 1;
      for (var i = 0; i < cling.length; i++) drawDroplet(c, cling[i].x, cling[i].y, cling[i].r, cling[i].sq);
      var vg = c.createRadialGradient(S / 2, S * 0.45, S * 0.3, S / 2, S / 2, S * 0.8);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(4,9,14,0.55)");
      c.fillStyle = vg; c.fillRect(0, 0, S, S);
    }
    var staticC = document.createElement("canvas"); staticC.width = S; staticC.height = S;
    paintStaticInto(staticC.getContext("2d"));

    // ---- the sliding drops: pure functions of t, so any frame is reproducible & a t-strip is judgeable ----
    var wobN = Loom.noise(rng.int(0, 1e9));
    var sliders = [];
    for (var si = 0, nsl = rng.int(5, 7); si < nsl; si++) {
      sliders.push({ x: rng.range(0.06, 0.94), wob: rng.range(0, 40), period: rng.range(6, 12),
        phase: rng.next(), y0: rng.range(-0.06, 0.5), r0: rng.range(6, 10) * U, r1: rng.range(14, 26) * U,
        amp: rng.range(0.014, 0.05) * S });
    }
    var botY = 1.08 * S;
    function pathX(s, lt) { return s.x * S + (wobN.fbm(s.wob, lt * 5, 3) - 0.5) * 2 * s.amp; }
    function pathY(s, lt) { var y0 = s.y0 * S; return y0 + lt * lt * (botY - y0); }   // accelerates from its spawn

    // a thin, slightly meandering cleared rivulet from the drop's spawn down to its head — reveals the
    // sharp (un-misted) bokeh, then re-fogs toward the old (upper) end so it fades before the cycle wraps.
    function drawTrail(s, lt, hr) {
      var steps = 14, w = Math.max(1.2, hr * 0.34);
      ctx.save(); ctx.beginPath();
      for (var i = 0; i <= steps; i++) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) - w, pathY(s, lq)); }
      for (var i = steps; i >= 0; i--) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) + w, pathY(s, lq)); }
      ctx.closePath(); ctx.clip();
      ctx.drawImage(bgC, 0, 0, S, S);
      var rf = ctx.createLinearGradient(0, pathY(s, 0), 0, pathY(s, lt));
      rf.addColorStop(0, "rgba(150,168,182,0.55)"); rf.addColorStop(0.7, "rgba(150,168,182,0.12)"); rf.addColorStop(1, "rgba(150,168,182,0.05)");
      ctx.fillStyle = rf; ctx.fillRect(0, 0, S, S);
      ctx.restore();
    }

    function frame(t) {
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      ctx.drawImage(staticC, 0, 0, S, S);
      for (var i = 0; i < sliders.length; i++) {
        var s = sliders[i], lt = ((t / s.period) + s.phase) % 1;
        var x = pathX(s, lt), y = pathY(s, lt), r = s.r0 + (s.r1 - s.r0) * lt;
        drawTrail(s, lt, r);
        drawDroplet(ctx, x, y, r, 1.45);                                 // the head: a fat elongated lens
      }
    }
    return frame;   // ANIMATED — draw() did the seeded setup; frame(t) paints each moment.
  }
});

</script>
