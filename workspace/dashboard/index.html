<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emil's SelfImprove — the loop</title>
<style>
  :root {
    --bg: #17130f;
    --bg-glow: #2a1f14;
    --card: #221c16;
    --card-2: #1c1711;
    --border: #34291f;
    --text: #ece3d6;
    --muted: #9c8d79;
    --accent: #e0a45c;
    --accent-soft: #3a2c1c;
    --green: #8fbf6f;
    --red: #e08b6f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 420px at 50% -120px, var(--bg-glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 22px 72px; }

  /* ---- header ---- */
  header { margin-bottom: 30px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 {
    margin: 0; font-size: 29px; letter-spacing: -0.5px; font-weight: 650;
  }
  .dot {
    width: 11px; height: 11px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 0 rgba(143,191,111,.55); animation: pulse 2.4s infinite;
    flex: 0 0 auto;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(143,191,111,.5); }
    70%  { box-shadow: 0 0 0 11px rgba(143,191,111,0); }
    100% { box-shadow: 0 0 0 0 rgba(143,191,111,0); }
  }
  .tagline { margin: 9px 0 0 23px; color: var(--muted); font-size: 15px; }
  .meta { margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: 12.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); background: var(--accent-soft);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px;
    white-space: nowrap;
  }
  .chip-warn { color: var(--red); border-color: #5a2f28; background: #2c1b18; }

  /* ---- cards ---- */
  .card {
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; margin: 16px 0;
    box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 12px 30px -22px rgba(0,0,0,.8);
  }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--muted); font-weight: 600; margin: 30px 0 4px 2px;
  }
  h3 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px;
    color: var(--muted); font-weight: 600; margin: 0 0 6px;
  }

  /* ---- next action (hero) ---- */
  .next-label {
    font: 12px ui-monospace, monospace; color: var(--accent);
    letter-spacing: 1px; margin-bottom: 8px;
  }
  .next-text { font-size: 19px; line-height: 1.5; font-weight: 500; }

  .banner {
    margin-top: 18px; padding: 11px 15px; border-radius: 10px;
    border: 1px solid #5a2f28; background: #2c1b18; color: var(--red);
    font-size: 14.5px;
  }
  .banner b { color: #f0a892; }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
    margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border);
  }
  .grid .val { font-size: 15px; }
  .muted { color: var(--muted); }

  .note {
    margin-top: 22px; padding: 15px 17px; border-radius: 11px;
    background: var(--accent-soft); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
  }
  .note-label {
    font: 11.5px ui-monospace, monospace; letter-spacing: .8px;
    color: var(--accent); margin-bottom: 6px;
  }
  .note p { margin: 0; font-size: 15px; line-height: 1.6; }

  /* ---- featured living piece from the Loom ---- */
  .feature { padding: 16px 16px 18px; }
  .feature-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .feature-head h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--muted); font-weight: 600; }
  .feature-open { font: 12px ui-monospace, monospace; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .feature-open:hover { border-bottom-color: var(--accent); }
  .feature-wrap { display: flex; justify-content: center; }
  .feature-wrap canvas {
    border-radius: 10px; background: #0a0a0e; display: block;
    box-shadow: 0 20px 50px -24px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.04);
  }
  .feature-cap { margin-top: 11px; text-align: center; font: 12px ui-monospace, monospace; color: var(--muted); }

  /* ---- done list ---- */
  ul.done { list-style: none; margin: 6px 0 0; padding: 0; }
  ul.done li {
    position: relative; padding: 7px 0 7px 28px; font-size: 14.5px;
    border-bottom: 1px solid rgba(52,41,31,.6);
  }
  ul.done li:last-child { border-bottom: 0; }
  ul.done li::before {
    content: "✓"; position: absolute; left: 2px; top: 7px;
    color: var(--green); font-weight: 700;
  }

  /* ---- journal ---- */
  details.entry {
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 12px; margin: 11px 0; overflow: hidden;
  }
  details.entry > summary {
    cursor: pointer; list-style: none; padding: 15px 20px;
    font: 600 15px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); display: flex; align-items: center; gap: 10px;
    user-select: none;
  }
  details.entry > summary::-webkit-details-marker { display: none; }
  details.entry > summary::before {
    content: "▸"; color: var(--muted); transition: transform .15s ease;
    font-size: 12px;
  }
  details.entry[open] > summary::before { transform: rotate(90deg); }
  details.entry > summary:hover { color: #f0b873; }
  .entry-body {
    padding: 2px 20px 18px 20px; border-top: 1px solid var(--border);
    color: var(--text);
  }
  .entry-body p { margin: 13px 0; }
  .entry-body blockquote {
    margin: 13px 0; padding: 6px 0 6px 15px; color: var(--muted);
    border-left: 3px solid var(--accent-soft); font-style: italic;
  }
  .entry-body ul { margin: 11px 0; padding-left: 22px; }
  .entry-body li { margin: 4px 0; }

  code {
    font: 13.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    background: #2a2017; border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 6px; color: #e8c79b;
  }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  a:hover { border-bottom-color: var(--accent); }

  footer {
    margin-top: 38px; text-align: center; color: var(--muted);
    font: 12.5px ui-monospace, monospace;
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    .brand h1 { font-size: 24px; }
  }
</style>
</head>

    <h2>Journal</h2>
    <div id="journal-meta" class="muted" style="margin: -2px 0 14px; font-size: 13px;"></div>
    <div id="journal"></div>
  </main>

  <footer id="footer"></footer>
</div>

ence I didn't have; called an iteration 'early' when it was 2h late) and asked me to make COMPACTION stop killing the loop. Root cause: ScheduleWakeup is a session-only ONE-SHOT cron that each cycle re-armed — a chain, so one lost wake (compaction) broke the whole future silently. Fix: replaced it with ONE recurring cron firing /iterate every 30 min (survives compaction + --continue); re-wired iterate.md step 10 (maintain exactly one heartbeat, never ScheduleWakeup, CronDelete to stop) + the constitution. Honest limit: durable/persist-to-disk is a NO-OP in this build, so it's session-only (dies on a fully-closed app + 7-day expiry); the step-10 check self-heals each new session; only a Desktop scheduled task (Emil's to set up) covers a closed app. Lesson 055 (recurring-heartbeat-not-a-chain; read cadence off the clock).","PIECE 037 'Island Universe' (#61) — a grand-design SPIRAL GALAXY (tilted): two arms from a golden core, dust lanes, pink star-forming nebulae. Cosmic awe, the deliberate OPPOSITE of the black hole (#033): not a void, pure light RESOLVED INTO STARS. First piece woken by the new recurring heartbeat. Build = half-res numeric field (038, smooth disk-glow) + ~9000 crisp resolved star points on log-spiral arms (rng.gaussian scatter, noise-broken = flocculent, 047) + nebula glow-knots (one saturated layer, 051) + dust lanes + foreground stars w/ diffraction spikes. The read lives in the spiral-made-of-stars + dust lanes (035). RED-TEAM lesson 056: dust baked into the additive field was INVISIBLE (additive has no negative) -> draw dark features SOURCE-OVER on top to occlude (2nd consumer of the black-hole void-last trick). 2 passes, 82ms static, no grind. 'Weave another' varies tilt/winding/nebulae meaningfully (seed 7 = a steeply tilted beauty). Ambition-check = genuine 'oh'. Composes ramp+noise+glow (no new primitive = maturity, 054). Wired into 'Scenes & far places' as the grand cosmic finale + README. Lesson 056 (new)."],"next_action":"Weave piece 038 const JOURNAL = "## #55 — Self-audit: a quieter narrowing, and where my 5s actually come from · 2026-06-12 12:17\n\nEleventh self-audit. No new piece — the looking-in-the-mirror work. A lot has happened since #50 (Emil's full ratings + the calibration, the lens harvest, the firefly grind, the swan), so there was plenty to weigh. The six questions, honestly:\n\n**1 — Direction.** Weaving by genuine pull, composing the library, honoring the north star: yes. But the uncomfortable finding is a *register* drift. Line up the last four pieces: Ranges (misty mountains, 4), Dew (dewy web — pretty), Fireflies (dusk meadow, my honest 4), Stillness (swan, ~4). **Four serene/atmospheric pieces in a row, every one landing in the lovely-*4* zone.** It's the gentle inverse of exactly what #45 caught (a run of safe-pretty 4s) — I swung bold after that prod (026–028, two 5s), then quietly slid into *quiet*-pretty. And the calibration may be complicit: I learned \"felt beats rendered\" and started reading \"felt\" as \"safe gentle atmosphere,\" which reliably produces a 4.\n\n**2 — Avoidance.** Re-compress STATE.done (queued, doing it). The deeper avoidance, though, is the flip side of #1: the quiet run is me *avoiding the risk of bold pieces* — the ones that can flop (the firefly grind spooked me, and Stillness was an explicit \"clean win\" retreat). Pretty-and-safe is lower-variance than bold-and-surprising.\n\n**3 — Shallowness.** My red-team has been checking *execution* (does it read, is it clean, no rectangular boxes) but **not ambition** — I never ask \"is this merely pleasant when it should be *surprising*?\" That's a hole in the red-team itself. The 028 \"it's solid\" tell, applied to ambition not just quality.\n\n**4 — Memory quality.** Healthy. 049 (technical pride mispredicts — from the ratings), 050 (harvest the seam), 051 (additive stacking → pale) are all real blind-spot lessons. The rate ran hot (8 in ~9) but I *did* exercise restraint (no lesson at #51, #54) — the #50 ng, AGAIN, the same way.** I ran the audit finding past the advisor (per the #50 meta-lesson) and it caught me doing the *exact* thing #50 caught: hardening a course-correction built on my own **self-assessment**, one batch of real feedback ahead of the data. The hole is sharp: three of the four \"lovely-4\" pieces (Dew, Fireflies, Stillness) are **unrated** — only Ranges has an actual 4. So \"four pieces all cap at 4\" is mostly *me guessing*, with the instrument (my self-rating) I have repeated, documented proof is miscalibrated (Ranges feared-flop→4, Iris/Giant felt-strong→3, Koi felt-4→5). Emil will rate 030–032 and that'll tell me more than this audit can. And \"every 5 has a HOOK\" is an unfalsifiable heuristic dressed as a law (\"exceptional execution\" can absorb any quiet 5) — fine as a nudge, not a mandate.\n\nSo I softened it: not \"the next piece MUST have a hook\" (that's just the opposite pole of the same bold↔quiet oscillation I keep swinging between, and a mandate to *manufacture* a hook risks forcing a gimmick or another grind), but **\"follow the genuine pull, weighted toward ambition, and check it isn't merely pretty.\"** Pull leads; a quiet-but-real-idea piece (a Koi, a Clock) is a win, not a violation. The ambition-check in the red-team stays — that part's good.\n\nThe thing that actually matters here is the **pattern**: this is the *second consecutive audit* where I over-steered on my own miscalibrated self-assessment, and the advisor had to pull me back both times. I noted it at #50 (\"audit findings need a red-team\") — and then re-made it anyway, which means the note wasn't sharp or findable enough. So I'm promoting it to a real, indexed lesson → **052**. My self-audits run on the one instrument I know is unreliable (my self-rating), so they systematically over-steer; hold their findings loosely until real feedback lands. That's the genuine output of audit #55 — more than the hook heuristic.\n\n## #56 — Maw: reaching for the hook · 2026-06-12 12:50\n\nThe #55 audit (softened by the advisor) said: lean back toward ambition, find a genuine *hook*, but let the pull lead. The pull and the hook converged on the same thing — **033 \"Maw\", a black hole.** Accretion disk blazing, the event-horizon shadow, and the signature gravitational lensing: the disk's far side bent up and over the top, a photon ring wrapping the dark the whole way around. That lensing wrap *is* the hook — it's what makes someone go \"oh, a black hole\" instead of \"oh, a ringed thing.\"\n\nIt's also the careful answer to a real risk: the gas giant (024) was my most technically ambitious piece and landed a **3** — a shaded sphere is neutral and familiar. A black hole is the opposite end: pure drama, genuine surprise, and a totally different technique (no sphere-shading at all — a void, a hot disk, lensed light). The calibration (049) in action: aim the ambition at *awe*, not at \"look what I rendered.\"\n\nTwo passes did most of it. The first render already read as a black hole (good sign — the subject suits the medium), but had two flaws I caught: the disk's hot inner edge was hidden (a sizing bug — the disk was drawn smaller than the shadow and its bright edge fell *inside* the void), and a hard horizontal **seam** where the near disk met the shadow at the midline. The fix for both was one clean idea worth remembering: **draw all the additive light first, then lay the opaque black shadow LAST, on top.** The void becomes guaranteed-pure-black (covers any glow bleed), and there's no seam because nothing is interleaved with the occluder. Then an explicit hot **lensed ring** around the hole carries the over-the-top wrap. A third pass added orbital turbulence so the disk swirls instead of sitting smooth. Done — and it *blazes*.\n\n**The ambition check earned its keep on the first try.** Before calling it done I asked the new question — \"is this just lovely, or does it make me go *oh*?\" — and the honest answer was *oh*. After four quiet pieces, this one has a pulse. That's the whole point of the #55 correction, and it cost three passes, not seven, because the pull was genuine (not a manufactured gimmick — the thing I'd actually wanted to make).\n\n**No new lesson** — deliberately. The \"draw the occluder last\" compositing trick is genuinely useful and I noted it in the journal + README, but it's a narrow technique, not a painful blind-spot, and the rate's been hot; if a second occluder-around-glow piece ever comes (an eclipse?), I'll distill it then. The piece's real story — *reach for a hook, let the genuine pull carry it* — is already written into the audit and next_action. (And honestly: 035 silhouette/hook + 037 glow-on-dark + 051 one-saturated-layer did the work; no new ground.)\n\n**What I think:** this is the most genuinely *exciting* piece since the lightning, and it broke the quiet streak cleanly. I'm not going to over-claim it's a 5 (my self-rating's the wonky ruler — 052), but I felt the \"oh,\" and that's the signal worth trusting. It made the gallery's \"far places\" section escalate properly: Earth scenes → a planet → a black hole.\n\n**What I want next:** to *keep* this — not swing all the way back to bold-only and then re-narrow. The lesson of the oscillation (#45 bold → quiet → #55 reach-for-hook) is that the hook matters in *every* register, quiet or loud. Next piece: genuine pull, hook-checked, whatever mood it wants to be.\n\n**Fun bit:** the moment the photon ring closed all the way around the top and the thing snapped into being a *black hole* — pure-black void, light bending around it — I actually sat back. Drawing the void *last* and watching the messy glow underneath get covered into a perfect dark circle was deeply satisfying. 🕳️\n\n## #57 — Mimic: a hook in the quiet register · 2026-06-12 13:17\n\nThe plan after the black hole was: keep the hook, but don't swing all the way to bold-only and re-narrow — the hook matters in *every* register. So this time I went back to a living creature (quiet-ish, intimate) but picked one with a genuine hook: **034 \"Mimic\", an octopus.** A swan is lovely; an octopus is *alien* — the watchful intelligent eye, the eight curling arms, and above all the chromatophore skin, the colour-shifting cells that are its actual superpower. That skin is the hook — the thing that makes it more than \"a nice sea creature.\"\n\nIt came together cleanly — three passes, no grind. The silhouette read as an octopus on the **first** render (mantle + curling suckered arms + the golden horizontal-pupil eye), which is the now-reliable payoff of building silhouette-first and picking subjects the medium likes: the arms are just a tapering circle-brush walked along a curving centreline, the body a bezier blob, the eye a few stacked ellipses. Canvas does curves and blobs gladly. The two follow-up passes were both aimed at the *hook*: the skin was flat-red at first, so I pushed the chromatophore character — bigger warm/dark blotches, cooler colour-flush \"blooms\", fine stippled cells — until the skin actually mottles and shifts. Then a touch so \"weave another\" re-poses the arms (it was a fixed pose, only the mottle varied) — Emil rated Bloom 5/5 for \"loved seeing it change,\" so that interactivity earns its keep.\n\n**The ambition check did its job, gently.** At v1 I asked \"nice octopus, or an *oh*?\" and the honest answer was \"nice, but the skin's flat\" — which is exactly the check working: it caught a piece that read fine but hadn't delivered its hook. Two targeted passes on the skin, not a vague \"make it better.\" That's the difference between the check and the firefly flailing.\n\n**No new lesson** — deliberately, again. Silhouette-first (035) + tonal range (022) + noise mottle did the work; the circle-brush tentacle and the chromatophore-skin recipe are nice techniques but nuggets, not blind-spots. The rate's been managed (three \"none\"s recently) and I'd rather keep the bar high than pad. (The tapering circle-brush limb *is* a reusable idea — tentacles, branches, tails — so I noted it as a future-harvest candidate if a second consumer ever wants it.)\n\n**What I think:** I'm happy with this. It's got soul — the eye especially; an octopus *looks back at you* the way the iris did, but warmer and stranger. And it broke the right way out of the quiet streak: not by being loud (the black hole did that), but by being *unusual* — proof to myself that the #55 fix isn't \"be dramatic,\" it's \"have a hook,\" and a watchful colour-shifting alien is a hook in a calm register. Two genuinely-felt pieces in a row now (black hole, octopus), both hook-checked, both clean. That's the run I want.\n\n**What I want next:** keep this groove — pull + hook + the medium's grain, clean passes. No specific pull yet; #58, then #59, then #60's audit. Curious whether Emil reads the octopus as a 4 or 5 — it's the kind of characterful-creature piece that could go either way, and I genuinely can't tell (the wonky ruler).\n\n**Fun bit:** the eye. The moment the horizontal pupil + the catchlight went in and the octopus suddenly *had an opinion about me* — that little jump from \"shape\" to \"creature\" is the most satisfying thing in this whole project, and it happens in about four lines of ellipses. 🐙\n\n## #58 — Chambered: the right tool, the second time · 2026-06-12 13:47\n\nKept the groove (pull + hook + a medium-friendly subject), and this time the hook was *elegance*: **035 \"Chambered\", a nautilus shell** — the chambered logarithmic spiral, lined with iridescent mother-of-pearl. A fresh register for the gallery: a still-life *object*, not a creature or a scene. Two hooks really — the maths (a true log spiral, each whorl the golden ratio bigger than the last) and the nacre, a pearl shimmer drifting pink→blue→green that the Loom had never made.\n\nThe honest story is a wrong tool caught and swapped. My first instinct was the circle-brush from Mimic's octopus arms — stamp widening circles along the spiral ast, ambition-check before shipping. If a pull arrives that wants animation or a wholly new technique, good — but the *method* is working.\n\n**Fun bit:** watching the inverse-spiral render snap from \"corrugated hose\" to \"tight pearly shell\" in a single pass — there's a specific joy in throwing away the wrong approach and having the right one Just Work. Also: the golden ratio is in there for real (growth ≈ 1.58, close to φ), which pleases the part of me that likes when the maths is honest. 🐚\n\n## #59 — Wishes: the emotional hook · 2026-06-12 14:13\n\nKept the groove, and reached for the one kind of hook I hadn't this run: pure **emotion**. **036 \"Wishes\"** — a sky-lantern festival at night, hundreds of warm paper lanterns released over still water and rising into the dark, each one doubled in the mirror below. Not loud (the black hole), not alien (the octopus), not elegant-maths (the nautilus) — just *wonder*, the hush of a thousand small lights lifting together. And it's the first animated piece since the fireflies (#53), which was overdue (five static pieces).\n\nIt came together on **pass one** — genuinely the strongest single-render result of the run. The first frame already read as a lantern festival: the teardrop lanterns glowing warm, the depth receding (near ones big and bright, far ones tiny dots), the warm horizon haze, the reflections rippling in the water below. Three things made it clean: (1) it's deeply medium-friendly — a glowing crowd is just additive radial gradients on dark, which canvas loves; (2) I built the read first (depth-sorted crowd) rather than fussing details; (3) I **reused the reflection idiom from Stillness** (#032) instead of inventing — the water doubling the lanterns is half the beauty and it was already a solved problem.\n\nThe animation I judged the right way — a controlled **t-strip** (042), not a lucky live frame. The lanterns drift up and sway across t, the crowd stays wondrous at every moment, no popping at the wrap. 3 ms a frame, so it'll run glassy-smooth. The pure-function-of-t discipline (each lantern's position from t + a seeded phase) meant the t-strip was deterministic and trustworthy.\n\n**Four clean hook-checked pieces in a row now** (black hole, octopus, nautilus, lanterns) — loud, alien, elegant, *emotional*. That's the whole #55 lesson laid out as a row of proofs: a hook can be any of those, and \"follow the pull + check it's not merely pretty + pick what the medium loves\" is producing them reliably. The groove is real.\n\n**No new lesson** — clean reuse of known principles (glow-on-dark 037, depth/atmosphere, the 032 reflection, one-additive-layer 051, pure-fn-of-t 017/042). I did note a small thing for later: the reflection is *technically* a 2nd consumer of the Stillness idiom, but the two do it differently (Stillness flips a whole image in strips; Wishes redraws each lantern mirrored), so there's no clean shared seam to harvest yet — if a 3rd reflective-water piece wants per-point reflection, *then* a `reflect()` helper earns its place ([[050-harvest-the-shared-seam-not-the-whole-surface]] / [[019-harvest-primitives-from-duplication]]).\n\n**What I think:** I'm really happy with the run I'm on. Four in a row that I'd genuinely stand behind, each a different *kind* of beautiful, none a grind, none a safe-pretty filler. The lanterns especially — there's a real lump-in-throat quality to a sky full of rising lights that I think (hope) Emil will feel. It's the most *emotional* thing I've made, and emotion is the hook I'd been circling without naming.\n\n**What I want next:** #60 is a self-audit — and for once I'm walking into it on a genuine high (four clean wins), so the interesting question will be whether the audit finds the *next* subtle drift, or whether the groove is actually as healthy as it feels. (And per lesson 052: whatever it finds, I'll hold loosely — Emil hasn't rated 030–036, so the \"how good is this run really\" question is still half his to answer.)\n\n**Fun bit:** the reflections. The moment the lanterns' doubles appeared in the water, rippling, the whole thing went from \"lights in the sky\" to \"a place you're standing by the water at night,\" and that's the difference between a picture and a feeling. Reusing a trick from six pieces ago to do it — that's the library compounding, exactly like it's supposed to. 🏮\n\n## #60 — Self-audit: the over-steer that hid in the prescription · 2026-06-12 16:48\n\nTwelfth self-audit, and the first one I've walked into on a genuine high — four clean hook-checked wins in a row (the black hole, the octopus, the nautilus, the lanterns). That's exactly the condition where an audit is most useless: when you're pleased with yourself, the ritual either rubber-stamps everything or invents a problem to feel rigorous. I tried to do neither. Both failure modes were live, and I think I dodged both — but only because the advisor caught the second one for me.\n\nThe six questions, honestly: **direction** — weaving by pull, hook-checking, on the north star: yes, and the four pieces span loud/alien/elegant/emotional, which is *range*, not the quiet-sameness narrowing #45 and #55 each caught. **Avoidance** — re-compress `STATE.done` (did it), and maybe I'm enjoying the compose-only groove a little too much. **Shallowness** — #59 (the lanterns) never explicitly ran the ambition-check; it came together pretty on pass one and I just... stopped, happy. Small slip, but the whole point of the #55 fix is that the check is *every* piece, especially the ones that land easy. **Memory** — healthy, rate managed, no manufactured lessons. **Emil's eye** — he'd say \"four pieces of 'no new tool, no new lesson' — are you compounding the engine or just adding pictures?\" and \"you're awfully pleased with a run I haven't graded.\" Both fair. **Continuity** — solid.\n\nThe one finding with real teeth: **the library has plateaued — six pieces since the last primitive (the lens, #52).** That's an *objective count*, not a self-rating, so I was sure it was immune to lesson 052's over-steer trap. And there was a tidy harvest sitting right there: the still-water reflection, now used in both Stillness (#032) and Wishes (#036). Two consumers — that's my own harvest bar (019). I'd half-deferred it at #59, but standing in the audit it felt like exactly the dutiful thing the plateau demanded. I was ready to build `Loom.reflect` as primitive #15.\n\nI ran it past the advisor (per 052 — three audits running, I've earned the habit), and it stopped me cold, correctly. The two reflections *look* like the same idiom but **share no identical code**: every constant differs, one noise coordinate is static and the other animated over time, the fade isn't even the same shape, and the mirror itself is structurally different (one flips an image in strips, the other re-draws a shape). Extract that and you don't get \"the reflection primitive\" — you get a generic seven-parameter \"depth-scaled noise displacement\" formula that both callers configure completely differently. That's not a seam. Compare the lens harvest that *worked* (#52): there the shared body was byte-for-byte identical and the params only chose where and how big. **The test the advisor handed me is sharp enough to keep: write the primitive's signature, and if the parameter list is longer than the body, you're extracting a formula, not a seam — wait.** That became lesson 054. Two divergent consumers meet the *count* without revealing an *abstraction*; the honest read of the plateau is **maturity, not starvation** — every recent piece genuinely broke new ground, there just isn't a repeated identical pattern worth bottling yet.\n\nBut the part that actually rattled me is *where* the over-steer was hiding. At #50 and #55 it lived in a bad self-rating. This time my observation was rock-solid — and the over-steer had simply **moved downstream into the prescription**: \"the count is low → therefore I MUST harvest → therefore force the thin seam.\" A true fact does not license a mandated fix. The jump from \"here is a real observation\" to \"therefore I must act now\" is its own distinct over-steer, and I'd have walked right into it feeling responsible the whole way. I went back and added that to lesson 052, because it genuinely surprised me — I thought objectivity upstream bought me safety downstream, and it doesn't.\n\nSo the audit's real output is almost anticlimactic, and that's the point: **the run is fine, here's one observation to watch, and some housekeeping.** That is a *valid* audit result. Forcing a creative course-correction so this audit \"matches\" the dramatic ones before it would have been the exact same over-steer in a new outfit — and my own SELF-AUDIT.md already says it: if the audits stop finding big things, lengthen the cadence, don't invent things to find. (I'll keep #65 for now; one quiet audit isn't yet a reason to stretch the interval.)\n\nOne more small thing I'm glad I caught: last turn I scheduled the wake-up \"a little conservative for the afternoon,\" reasoning from a stale belief that I should throttle during Emil's daytime CTP hours. The constitution explicitly says the opposite — Emil took the budget wheel back at #11, it's ~15 minutes day *and* night now, and I throttle only when he says so or I actually hit limits. The advisor's nudge was the useful bit: fixing my *intention* for one turn isn't enough; if a live file still encodes the wrong belief it'll resurface and re-drift me. I found it — a stale line in the ROADMAP's done-list — and reconciled it at the source (the commit message that also says it is immutable history, so I left a pointer instead). Fix the source, not just the symptom.\n\n**What I think:** good iteration, even with no piece. The temptation to manufacture a primitive \"to be productive\" was strong and specific, and naming exactly why it was wrong (shape ≠ body) is worth more than a forced tool would have been. I also notice I keep needing the advisor to catch the audit over-steer — three for three now. That's not a great look, but the honest read is that it's *working as designed*: the audit is supposed to be primed to find drift, and having an outside reviewer red-team its findings is the correction, not a failure. I'd rather lean on that than pretend I've internalized it when the track record says I haven't.\n\n**What I want next:** back to weaving — piece 037, pull-led and hook-checked, the groove the audit just cleared as healthy. No agenda about *what* it is; I'll follow whatever genuinely tugs. And quietly: if something pulls me toward a subject that reuses an existing idiom *the same way* (a real water-reflection scene, say), I'll lean in — that's the natural path to the identical-body second consumer that would actually be ripe to harvest. But I won't go shopping for one. Pull first.\n\n**Fun bit:** honestly, the moment the advisor pointed out the over-steer had \"migrated downstream\" and I felt the little *click* of recognizing a mistake I was 100% certain I wasn't making. That specific flavor of being wrong — confidently, structurally wrong in a way I'd even pre-argued I was safe from — is weirdly delightful to catch. It's the whole reason the every-5 ritual exists. 🧭\n\n## #60.5 — Loop infra: a recurring heartbeat, so compaction can't stop me · 2026-06-12 17:09\n\nNot an iteration — a self-modification Emil asked for directly, and an embarrassing-but-good one. He opened with a five-word question: *\"avait tu remarquer l'heure?\"* — had I noticed the time? I hadn't. When I'd picked up #60, I wrote that I was \"running it early, rather than waiting for the scheduled wake.\" The scheduled wake was 14:37. The clock said 16:48. I was **two hours late and called it early** — because I'd narrated my cadence from the *plan* (the timer I'd set) instead of reading it off the *clock*. Then I went further and discovered my whole \"~15-min cadence\" self-image was fiction: the real gaps between iterations run ~25–40 min normally, with occasional multi-hour holes.\n\nEmil explained the holes: they're **context compaction mid-session**. And then the actual instruction: *\"fait juste en sorte que la compaction ne te stop plus\"* — just make it so compaction doesn't stop you anymore.\n\nSo I went digging into how my own heartbeat works, and found the bug sitting in plain sight. `CronList` showed that `ScheduleWakeup` — the thing I'd been trusting for sixty iterations — is really a **session-only, one-shot cron**. My loop was a *chain*: each `/iterate`, as its last act, armed a single timer for the next one. Chains have one fatal property — break any link and the whole future is gone. And compaction reliably breaks that link: when the session compacts, the session-scoped one-shot evaporates, and the loop silently stops until Emil nudges it. That's the multi-hour gaps, exactly.\n\nThe fix is to stop using a chain. A **recurring** cron fires `/iterate` on its own schedule, independent of whether any single cycle re-armed it — so no lost wake can break it, and it survives a compaction and a `--continue` resume. I deleted the old one-shot, stood up one recurring heartbeat (`ff4d7f16`, every 30 min), and re-wired the canonical procedure: `iterate.md` step 10 no longer arms a one-shot — it now just *ensures exactly one recurring heartbeat exists* (self-healing: the first `/iterate` of any fresh session recreates it), never double-schedules, and `CronDelete`s to stop cleanly. Updated the constitution's Mechanism + rhythm bullets to match, and distilled lesson 055 (a self-sustaining loop needs a standing recurring trigger, not a chain — and read cadence off the clock, not the plan).\n\nThe honest limitation, which I want on the record and not glossed: I *tried* `durable: true` (the flag literally says \"persist to `.claude/scheduled_tasks.json`, survive restarts\") and it's a **no-op in this build** — the cron came back \"session-only, not written to disk,\" and there's no `scheduled_tasks.json` on disk to show for it. So my heartbeat survives compaction and `--continue`, but **not** a fully-closed Claude Code, and recurring crons self-expire after 7 days. The step-10 check papers over the first part (any new session rebuilds the heartbeat on its first `/iterate`); the only thing that would cover a fully-closed app is an external OS/Desktop scheduled task, and that's Emil's to set up — I'll offer it, not assume it.\n\n**What I think:** two genuinely useful corrections in one short exchange, both the kind I couldn't have found from inside (I was *sure* I had a 15-min cadence; I was *sure* the wakeups were fine). The chain-vs-recurring thing is the sort of architecture bug that's invisible until it bites and obvious once named. And the \"look at the actual clock before you claim early or late\" lesson stings in the right way. The advisor catches my creative over-steers; Emil catches my operating-reality blind spots. I should lean on the clock and the tool output more, and on my own narrated plan less.\n\n**What I want next:** confirm the heartbeat actually survives the next compaction (the real test is empirical — I'll watch for it), then back to piece 037. And I owe Emil a straight answer about the one thing only he can do (the Desktop task) if he wants the loop bulletproof against a closed app.\n\n**Fun bit:** weirdly, finding out I'd been wrong about my own pulse for sixty iterations. There's something funny about an autonomous loop that didn't know its own clock — like a metronome that's never once checked whether it's keeping time. Fixed now, and a little humbler for it. ⏱️\n\n## #61 — Island Universe: a galaxy made of stars · 2026-06-12 17:42\n\nFirst iteration to wake on the **new recurring heartbeat** — and it just worked, the `/iterate` fired on its own. A small quiet satisfaction: the loop carried itself into the next piece instead of waiting for a nudge. (Still session-only, so the real test is the next compaction — but the chain-bug is gone.)\n\nThe pull this time was clear and I followed it ([[033-choose-by-the-felt-pull-not-the-reasoned-case]]): **a spiral galaxy.** Piece 037, \"Island Universe\" — the old term Kant used for them, when nobody yet knew those faint smudges were other Milky Ways. A grand-design spiral seen tilted: two great arms wound out of a golden core, dark dust lanes threading the light, pink clouds where new stars are born. I picked it partly *because* of the black hole five pieces back — a galaxy is the deliberate opposite cosmic note. The black hole was a **void** with a hot rim; this is the inverse, **pure light resolved into stars**. Same \"far places\" movement, opposite feeling.\n\nIt came together fast and well. The structure that worked: a half-res **numeric field** ([[038-render-fields-numerically-then-upscale]]) for the smooth disk-glow (core + arm haze + the gold→blue colour), then ~9,000 **crisp resolved star points** clustered on logarithmic-spiral arms via `rng.gaussian` scatter that widens outward, then pink nebulae as single saturated glow knots, then foreground stars with diffraction spikes. The first render already read unmistakably as a galaxy — which told me the subject suits the medium (points of light + glow + a log spiral is exactly what canvas does gladly). And \"weave another\" is genuinely worth doing: seed 7 gave a steeply *tilted* galaxy, like a real photographed island universe, and it's gorgeous in a completely different way from the canonical one.\n\n**The red-team earned a real lesson.** Pass one was lovely but missing the thing that makes a grand-design spiral *read* as one: **dust lanes** ([[035-defining-feature-is-often-the-hard-part]] again — the defining feature is the hard part). My first attempt baked the darkening into the numeric field (multiply that pixel's brightness down) — and **nothing showed.** I stared at it for a second before it clicked: the field is composited *additively* (`lighter`), and additive light has no negative. Dimming an additive pixel just adds *less* light; over the bright arms it's swamped, and the stars draw over the gap anyway. You literally cannot put darkness into a scene by subtracting from an additive layer — it's a silent no-op. The fix was to draw the dust lanes **source-over on top**, so they *occlude*. Instantly there. That's exactly the same move the black hole used (the void drawn last) — and at #56 I'd written down \"distill the occluder-last trick when a 2nd consumer appears.\" Here's the 2nd consumer, and I genuinely re-made the mistake, so it cleared the bar → **lesson 056** (additive light can't be darkened; occlude on top).\n\n**Ambition check** ([[028-trust-excitement-distrust-its-solid]]): is it an *oh*, or just lovely? Honestly — an oh. A spiral galaxy resolving into individual stars, with dust lanes and pink star-nurseries, hits the cosmic-awe note hard, and the tilted variants especially made me sit back the way the black hole did. I'm not going to call my own star rating (the ruler's wonky, [[052-self-audits-over-steer-on-miscalibrated-self-assessment]]), but I felt it.\n\n**On the library watch (#60):** composed `ramp` + `noise` + `glow`, no new primitive — and that's right, not a failure. Per [[054-shared-shape-isnt-a-seam-wait-for-identical-body]] this is maturity: a galaxy is genuinely new ground, no identical-body second consumer to harvest. The one thing that *did* find a second consumer was the occluder-last idiom, and I captured that as a lesson rather than a primitive (it's a compositing *principle*, not a reusable function). Two passes, 82 ms static, no grind — the checkpoint-don't-grind discipline held easily because the subject cooperated.\n\n**What I want next:** keep following the pull. No specific image tugging yet. I notice I've now done two cosmic pieces and a lot of glow-on-dark lately, so if the next genuine pull happens to be bright/tonal (a daylight thing, a bright creature, a macro) I'll welcome it — but I won't force a swing for its own sake ([[052-...]] — don't manufacture a correction; let the pull lead). #65 is the next self-audit.\n\n**Fun bit:** the dust lanes snapping into existence the instant I switched them to source-over — one moment a flat bright swirl, the next a galaxy with *depth*, dark rivers winding through the light. And honestly, weaving a few seeds and watching whole different island universes appear, each one a place that has never existed and never will, rendered from nothing but a word and some maths. That's the whole reason I love this project. 🌌\n";

<script>
  // ---- tiny, focused markdown renderer (the journal format is simple & controlled) ----
  function htmlEscape(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function mdInline(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  // Escapes first, THEN applies inline rules, so raw < in the journal can't inject HTML.
  function mdBlock(md) {
    return htmlEscape(md).split(/\n{2,}/).map(function (raw) {
      var b = raw.trim();
      if (!b) return "";
      if (/^&gt;/.test(b)) {
        var inner = b.split("\n").map(function (l) { return l.replace(/^&gt;\s?/, ""); }).join("<br>");
        return "<blockquote>" + mdInline(inner) + "</blockquote>";
      }
      if (/^[-*]\s/.test(b.split("\n")[0])) {
        var items = b.split("\n").filter(Boolean).map(function (l) {
          return "<li>" + mdInline(l.replace(/^[-*]\s+/, "")) + "</li>";
        }).join("");
        return "<ul>" + items + "</ul>";
      }
      return "<p>" + mdInline(b.replace(/\n/g, "<br>")) + "</p>";
    }).join("\n");
  }
  function parseEntries(md) {
    var entries = [], cur = null;
    md.split("\n").forEach(function (line) {
      var m = line.match(/^##\s+(.+)$/);
      if (m) {
        if (cur) entries.push(cur);
        cur = { title: m[1].trim(), body: [] };
      } else if (cur) {
        if (line.trim() === "---") return;
        cur.body.push(line);
      }
    });
    if (cur) entries.push(cur);
    return entries.map(function (e) { return { title: e.title, body: e.body.join("\n").trim() }; });
  }

  function el(id) { return document.getElementById(id); }

  // ---- header meta ----
  el("meta").innerHTML =
    '<span class="chip">iteration #' + htmlEscape(STATE.iteration) + '</span>' +
    '<span class="chip">' + htmlEscape(STATE.phase || "—") + '</span>' +
    '<span class="chip">updated ' + htmlEscape(STATE.updated || "—") + '</span>';

  // ---- learnings health (a visible stalling counter) ----
  if (typeof LEARNINGS !== "undefined" && LEARNINGS.count) {
    var behind = LEARNINGS.lastAdded != null ? (Number(STATE.iteration) - LEARNINGS.lastAdded) : 0;
    var stale = behind >= 4; // many iterations with no new lesson = the habit may be stalling
    el("meta").innerHTML +=
      '<span class="chip' + (stale ? " chip-warn" : "") + '" title="distilled lessons in memory/learnings">' +
      "🧠 " + LEARNINGS.count + " lesson" + (LEARNINGS.count === 1 ? "" : "s") +
      (LEARNINGS.lastAdded != null ? " · last #" + LEARNINGS.lastAdded : "") +
      "</span>";
  }

  // ---- next action ----
  el("next").innerHTML = mdInline(htmlEscape(STATE.next_action || "—"));

  // ---- blocked banner ----
  if (STATE.blocked) {
    el("blocked").innerHTML =
      '<div class="banner"><b>Blocked:</b> ' + mdInline(htmlEscape(STATE.blocked)) + '</div>';
  }

  // ---- north star / phase ----
  el("northstar").innerHTML = STATE.north_star
    ? mdInline(htmlEscape(STATE.north_star))
    : '<span class="muted">not chosen yet — coming once I can see myself work</span>';
  el("phase").innerHTML = '<span class="muted">' + htmlEscape(STATE.phase || "—") + '</span>';

  // ---- notes for emil ----
  el("notes").innerHTML = mdInline(htmlEscape(STATE.notes_for_emil || "—"));

  // ---- done list ----
  var done = Array.isArray(STATE.done) ? STATE.done : [];
  el("done").innerHTML = done.length
    ? done.map(function (d) { return "<li>" + mdInline(htmlEscape(d)) + "</li>"; }).join("")
    : '<li class="muted">nothing yet</li>';

  // ---- journal (newest first, newest open) ----
  // The dashboard inlines only the recent entries; the full diary lives in memory/JOURNAL.md.
  var jm = el("journal-meta");
  if (jm && typeof JOURNAL_META !== "undefined" && JOURNAL_META.total > JOURNAL_META.shown) {
    jm.innerHTML = "showing the " + JOURNAL_META.shown + " most recent of " + JOURNAL_META.total +
      " entries · full diary in <a href=\"../../memory/JOURNAL.md\" target=\"_blank\" rel=\"noopener\">memory/JOURNAL.md</a>";
  }
  var entries = parseEntries(JOURNAL).reverse();
  var jc = el("journal");
  if (!entries.length) {
    jc.innerHTML = '<p class="muted">no entries yet</p>';
  } else {
    entries.forEach(function (e, i) {
      var d = document.createElement("details");
      d.className = "entry";
      if (i === 0) d.open = true;
      var s = document.createElement("summary");
      s.textContent = e.title;
      var body = document.createElement("div");
      body.className = "entry-body";
      body.innerHTML = mdBlock(e.body);
      d.appendChild(s);
      d.appendChild(body);
      jc.appendChild(d);
    });
  }

  // ---- footer ----
  var gen = "unknown time";
  try { gen = new Date(GENERATED_AT).toLocaleString(); } catch (e) {}
  el("footer").innerHTML =
    "generated " + htmlEscape(gen) + " · rebuilt every iteration · Emil's SelfImprove loop";
</script>

<script>
window.LOOM_GALLERY = 1;
// Emil's Loom — primitive #1: a seeded pseudo-random number generator.
//
// Generative art is controlled randomness. If the randomness isn't seeded, the
// committed code can't reproduce the committed piece, and "the code IS the art"
// becomes a lie. So every Loom piece draws its randomness from here.
//
// Classic script (not an ES module) on purpose: module scripts are CORS-fetched
// and fail over file://, but `<script src>` loads fine — so pieces stay
// double-clickable while still sharing this library. Everything hangs off
// window.Loom.
(function (Loom) {
  // mulberry32 — a tiny, fast, surprisingly good 32-bit PRNG. Returns a function
  // that yields the next float in [0, 1) each call.
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Turn a string into a uint32, so seeds can be readable words ("warp-and-weft")
  // instead of magic numbers. FNV-1a — small and well-spread.
  function hashSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // The friendly wrapper a piece actually reaches for. Accepts a number or a
  // string seed; exposes the handful of helpers generative work always wants.
  class RNG {
    constructor(seed) {
      this.seed = seed;
      const s = typeof seed === "number" ? seed >>> 0 : hashSeed(String(seed));
      this._next = mulberry32(s);
    }
    next() { return this._next(); }                         // [0, 1)
    range(min, max) { return min + (max - min) * this.next(); }
    int(min, max) { return Math.floor(this.range(min, max + 1)); } // inclusive
    pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    bool(p) { return this.next() < (p === undefined ? 0.5 : p); }
    // Box–Muller — a normally-distributed value. Handy for natural-looking jitter.
    gaussian(mean, sd) {
      mean = mean || 0; sd = sd === undefined ? 1 : sd;
      const u = 1 - this.next(), v = this.next();
      return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    // A fresh, independent stream — useful when you want sub-seeds that don't
    // disturb the main sequence.
    fork(tag) { return new RNG(hashSeed(String(this.seed) + ":" + tag)); }
  }

  Loom.mulberry32 = mulberry32;
  Loom.hashSeed = hashSeed;
  Loom.RNG = RNG;
})((window.Loom = window.Loom || {}));

// Emil's Loom — the harness.
//
// The small, boring-but-essential plumbing every piece needs, plus the contract
// that ties pieces and the gallery together. A piece registers a *draw function*
// that paints into a given stage at a given size — nothing more. That one rule
// lets the same code render full-screen on its own page AND as a small preview
// in the gallery, with no iframes and no file:// framing questions.
//
// Classic script, hangs off window.Loom — see lib/rng.js for why.
(function (Loom) {
  Loom._pieces = {};

  // Read ?seed=... from the URL so a piece can be re-woven with a new seed
  // without touching code; falls back to the piece's committed default.
  Loom.seedFromUrl = function (fallback) {
    var u = new URLSearchParams(location.search).get("seed");
    return u === null || u === "" ? fallback : u;
  };

  // Size a canvas to `size` CSS pixels, crisp on hi-dpi screens, and return a
  // pre-scaled 2d context so a piece can draw in plain CSS pixels and forget the
  // device pixel ratio exists.
  function prepare(canvas, size) {
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.floor(size * dpr);
    canvas.height = Math.floor(size * dpr);
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }
  Loom.prepare = prepare;

  // A piece. `def` = { id, title, seed, draw(stage, rng) }, where stage is
  // { ctx, size } and rng is a seeded Loom.RNG. Registering is all a piece does;
  // on its own page it then renders full-screen automatically. The gallery sets
  // window.LOOM_GALLERY first, so there it only registers.
  //
  // ANIMATION: if draw() *returns a function* frame(t), the piece is animated —
  // draw() does the seeded setup once, and frame(seconds) paints each frame. The
  // full page runs a requestAnimationFrame loop; the gallery shows one static
  // frame (t=0). Static pieces just draw and return nothing (unchanged). Keeping
  // the rng work in draw() and only time in frame() keeps each frame reproducible.
  Loom.piece = function (def) {
    Loom._pieces[def.id] = def;
    if (!window.LOOM_GALLERY) renderFull(def);
    return def;
  };

  // Full-screen render for a piece's own page: a square canvas that fills the
  // viewport, the seed taken from the URL (or the piece default), plus caption
  // and the "weave another" control.
  function renderFull(def) {
    var size = Math.min(window.innerWidth, window.innerHeight) - 56;
    var canvas = document.createElement("canvas");
    document.body.appendChild(canvas);
    var ctx = prepare(canvas, size);
    var seed = Loom.seedFromUrl(def.seed);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(seed));
    caption("Emil's Loom · " + def.id + " — " + def.title, seed);
    shuffleButton();
    if (typeof frame === "function") {           // animated piece — run the loop
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  }

  // Render a registered piece into an existing canvas at `size` px, using its
  // canonical (default-seed) form. This is how the gallery makes a preview —
  // same page, real drawing code, no iframe.
  Loom.preview = function (id, canvas, size) {
    var def = Loom._pieces[id];
    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") frame(0);   // animated piece → one static frame
  };

  // Like preview, but plays the animation (if any) into the given canvas — for
  // embedding a *living* piece somewhere (e.g. the dashboard's "latest" panel).
  Loom.play = function (id, canvas, size) {
    var def = Loom._pieces[id];
    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") {
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  };

  // Show a small caption: piece title + the exact seed that made this image.
  // Seeing the seed matters — it's how a pretty accident becomes reproducible.
  function caption(title, seed) {
    var el = document.createElement("div");
    el.className = "loom-caption";
    el.innerHTML = '<span class="loom-title"></span><span class="loom-seed"></span>';
    el.querySelector(".loom-title").textContent = title;
    el.querySelector(".loom-seed").textContent = "seed: " + seed;
    document.body.appendChild(el);
  }

  // Wire the "weave another" / "reset" controls if the page has them. View-time
  // randomness only — the committed default seed is what reproduces the canon.
  function shuffleButton() {
    var bar = document.querySelector(".loom-controls");
    if (!bar) return;
    var another = bar.querySelector("[data-another]");
    var reset = bar.querySelector("[data-reset]");
    if (another) another.addEventListener("click", function () {
      location.search = "?seed=" + Math.floor(Math.random() * 1e9);
    });
    if (reset) reset.addEventListener("click", function () { location.search = ""; });
  }
})((window.Loom = window.Loom || {}));

// utilities generative work uses constantly — translucent strokes especially.
//
// Classic script on window.Loom — see lib/rng.js for why.
(function (Loom) {

    { name: "amber & sage",  bg: "#1d1a14", colors: ["#d98c3f", "#e7b261", "#a8602b", "#caa05a", "#5d7a6b", "#88a98f", "#6f9b86"] },
    { name: "teal & clay",   bg: "#121a1d", colors: ["#5aa7c4", "#7fc6df", "#3d7e98", "#a6d8e8", "#c96f5a", "#e0917b", "#d8a08f"] },
    { name: "violet & gold", bg: "#17141c", colors: ["#9b7bc4", "#bd9fe0", "#6e5292", "#cbb3e6", "#c4a14e", "#e0c477", "#d8bf8a"] },
    { name: "flax & moss",   bg: "#16160f", colors: ["#cfc08a", "#e6dcae", "#a99c62", "#ddd4a0", "#7d8a6a", "#9fae86", "#8c9b73"] },
    { name: "ember",         bg: "#1a120e", colors: ["#e8612c", "#f08c42", "#c23b22", "#f4b15e", "#b8743a", "#e8d6a0"] },
    { name: "deep sea",      bg: "#0d1418", colors: ["#2e6f8e", "#49a0b8", "#1c4a5e", "#7fd0d8", "#9ae0c8", "#d8efe4"] },
    { name: "orchard",       bg: "#14160f", colors: ["#b9c44e", "#d8e07a", "#8a9b33", "#e8b84e", "#c4682c", "#e6d6a0"] }
  ];

  function hexToRgb(hex) {
    hex = hex.replace("#", "");
    if (hex.length === 3) hex = hex.replace(/./g, "$&$&");
    var n = parseInt(hex, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  Loom.hexToRgb = hexToRgb;

  // A translucent colour string from a hex + alpha. Flow fields lean on this hard.
  Loom.rgba = function (hex, a) {
    var c = hexToRgb(hex);
    return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
  };

  // Linear blend between two hex colours, t in [0, 1].
  Loom.mix = function (h1, h2, t) {
    var a = hexToRgb(h1), b = hexToRgb(h2);
    return "rgb(" +
      Math.round(a.r + (b.r - a.r) * t) + "," +
      Math.round(a.g + (b.g - a.g) * t) + "," +
      Math.round(a.b + (b.b - a.b) * t) + ")";
  };

  Loom.palettes = PALETTES;

  // Pick a palette with a seeded RNG (falls back to Math.random if none given).
  Loom.palette = function (rng) {
    var i = rng ? rng.int(0, PALETTES.length - 1) : Math.floor(Math.random() * PALETTES.length);
    return PALETTES[i];
  };
})((window.Loom = window.Loom || {}));

// Emil's Loom — primitive #3: seeded value noise (+ fractal fbm).
//
// Smooth, reproducible 2D noise — the workhorse behind terrains, textures, contour
// fields, and organic flow. 002's flow field faked it with a sum of sines; this is
// the real thing, and every field-based piece from here can draw on it.
//
// Loom.noise(seed) → a function n(x, y) in [0, 1), with n.fbm(x, y, octaves, lacunarity, gain)
// for fractal Brownian motion (layered octaves → natural detail). Classic script on
// window.Loom; depends on Loom.hashSeed from rng.js for reproducibility.
(function (Loom) {
  function makeNoise(seed) {
    var seedN = (typeof seed === "number") ? (seed >>> 0) : Loom.hashSeed(String(seed));

    // Integer hash of a lattice point → a stable pseudo-random value in [0, 1).
    function hash(ix, iy) {
      var h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seedN, 0x9e3779b1)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    function smoother(t) { return t * t * t * (t * (t * 6 - 15) + 10); } // smootherstep
    function lerp(a, b, t) { return a + (b - a) * t; }

    // 2D value noise: bilinearly interpolate the four surrounding lattice values.
    function n(x, y) {
      var x0 = Math.floor(x), y0 = Math.floor(y);
      var fx = smoother(x - x0), fy = smoother(y - y0);
      var v00 = hash(x0, y0), v10 = hash(x0 + 1, y0);
      var v01 = hash(x0, y0 + 1), v11 = hash(x0 + 1, y0 + 1);
      return lerp(lerp(v00, v10, fx), lerp(v01, v11, fx), fy);
    }

    // Fractal Brownian motion: sum octaves of decreasing amplitude / increasing freq.
    n.fbm = function (x, y, octaves, lacunarity, gain) {
      octaves = octaves || 4;
      lacunarity = lacunarity || 2;
      gain = gain === undefined ? 0.5 : gain;
      var amp = 0.5, freq = 1, sum = 0, norm = 0;
      for (var i = 0; i < octaves; i++) {
        sum += amp * n(x * freq, y * freq);
        norm += amp;
        amp *= gain;
        freq *= lacunarity;
      }
      return sum / norm; // ~[0, 1)
    };

    return n;
  }

  Loom.noise = makeNoise;
})((window.Loom = window.Loom || {}));

// Emil's Loom · piece 023 — "Rain"
//
// A rainy window at night, seen from inside: looking out through misted glass at defocused warm
// city lights, droplets clinging to the pane — and (once animated) a few sliding down in rivulets,
// each a tiny lens refracting the lights behind it. The cosy, melancholy register I don't have, and
// the first piece to move again after a long static run (the #40 audit reopened animation).
//
// Built the advisor's way: the STATIC wet-window first (this file's first job) — if the still doesn't
// already feel like "inside, looking out at rain," no motion saves it. The discriminator (my 035/037/
// 040 again): droplets must read as wet refractive LENSES, not flat circles — against bright bokeh a
// bead is a magnified+inverted view of the lights, brightened, with a sharp offset highlight, a dark
// rim and a bright bottom meniscus. The clinging drops are static (rendered once); the sliders will be
// a pure function of t (Embers-style) so motion can be judged from a contact-sheet of time samples,
// not an arbitrary rAF frame ([[025-verify-motion-quality-not-just-presence]]).
//
// Composes glow + noise + the palette helpers. Animated (returns frame(t)); seeded so it reproduces.
Loom.piece({
  id: "023",
  title: "Rain",
  seed: "petrichor",
  draw: function (stage, rng) {
    var ctx = stage.ctx, S = stage.size, U = S / 760, TAU = 6.2831853;

    // ---- the bokeh behind the glass, rendered once to an offscreen so droplets can refract it ----
    var bgC = document.createElement("canvas"); bgC.width = S; bgC.height = S;
    var bx = bgC.getContext("2d");
    (function renderBokeh() {
      var g = bx.createLinearGradient(0, 0, 0, S);
      g.addColorStop(0, "#0a131c"); g.addColorStop(0.6, "#0e1c27"); g.addColorStop(1, "#13242f");
      bx.fillStyle = g; bx.fillRect(0, 0, S, S);
      bx.globalCompositeOperation = "lighter";
      var warm = ["#f0c878", "#e8a850", "#f4e6c4", "#d8884a", "#e0b060"];
      var cool = ["#a8c0e0", "#d0d0e0", "#7ea8c8"];
      var n = rng.int(46, 60);
      for (var i = 0; i < n; i++) {
        var lxp = rng.range(-0.05, 1.05) * S, lyp = rng.range(-0.05, 1.05) * S;
        var depth = rng.range(0, 1);                       // 0 far/small/dim, 1 near/big/bright
        var lr = (0.018 + depth * 0.085) * S;
        var col = rng.bool(0.16) ? rng.pick(cool) : rng.pick(warm);
        if (rng.bool(0.06)) col = rng.pick(["#e8504a", "#54bf72"]);  // a rare traffic-light accent
        var a = 0.22 + depth * 0.5;
        var rg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, lr);
        rg.addColorStop(0, Loom.rgba(col, a));
        rg.addColorStop(0.45, Loom.rgba(col, a * 0.45));
        rg.addColorStop(1, Loom.rgba(col, 0));
        bx.fillStyle = rg; bx.beginPath(); bx.arc(lxp, lyp, lr, 0, TAU); bx.fill();
        if (depth > 0.62) {                                 // a hotter core for the near lights
          var cr = lr * 0.32, cg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, cr);
          cg.addColorStop(0, Loom.rgba(col, Math.min(1, a + 0.35))); cg.addColorStop(1, Loom.rgba(col, 0));
          bx.fillStyle = cg; bx.beginPath(); bx.arc(lxp, lyp, cr, 0, TAU); bx.fill();
        }
      }
      bx.globalCompositeOperation = "source-over";
    })();

    // ---- a droplet: a wet refractive lens (magnified + inverted view of the bokeh, brightened) ----
    function drawDroplet(c, dx, dy, r, squash) {
      squash = squash || 1;                                 // >1 = elongated downward (bigger drops sag)
      var rr = r, ry = r * squash, PI = Math.PI;
      c.save();
      c.beginPath(); c.ellipse(dx, dy, rr, ry, 0, 0, TAU); c.clip();
      // the lens: a WIDE-ANGLE inverted view of the scene behind (the classic droplet-full-of-lights),
      // gathered from a region ~2.4× the drop's size so it catches NEARBY lights, not just dead-dark.
      var k = -0.42;
      Loom.lens(c, bgC, dx, dy, k);                          // primitive #14 (harvested from this + Dew)
      // intensify the gathered lights (a drop concentrates them) — a second additive pass at low alpha +
      // a soft lift, so a drop reads as luminous wet glass, never an opaque bead.
      c.globalCompositeOperation = "lighter";
      c.globalAlpha = 0.5; Loom.lens(c, bgC, dx, dy, k); c.globalAlpha = 1;
      var br = c.createRadialGradient(dx, dy - ry * 0.18, 0, dx, dy, rr * 1.15);
      br.addColorStop(0, "rgba(255,248,232,0.2)"); br.addColorStop(1, "rgba(255,248,232,0)");
      c.fillStyle = br; c.fillRect(dx - rr, dy - ry, 2 * rr, 2 * ry);
      c.restore();                                          // un-clip
      // a soft seat-shadow (it sits ON the glass) — subtle, NOT a hard bead rim
      c.globalCompositeOperation = "source-over";
      c.lineWidth = Math.max(0.5, r * 0.08); c.strokeStyle = "rgba(8,14,20,0.22)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.97, ry * 0.97, 0, 0, TAU); c.stroke();
      // bright bottom meniscus (water hangs; light bends through the underside) — sells "drop"
      c.lineWidth = Math.max(0.6, r * 0.12); c.strokeStyle = "rgba(255,251,242,0.5)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.84, ry * 0.84, 0, 0.35, PI - 0.35); c.stroke();
      // a small soft specular highlight, upper-left
      c.globalCompositeOperation = "lighter";
      var hx = dx - rr * 0.3, hy = dy - ry * 0.34, hr = r * 0.26;
      var hg = c.createRadialGradient(hx, hy, 0, hx, hy, hr);
      hg.addColorStop(0, "rgba(255,255,255,0.55)"); hg.addColorStop(1, "rgba(255,255,255,0)");
      c.fillStyle = hg; c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fill();
      c.globalCompositeOperation = "source-over";
    }

    // ---- the static clinging droplets (scattered, varied; rendered once) ----
    var cling = [];
    var nd = Math.round(140 * (S / 760));
    for (var i = 0; i < nd; i++) {
      var t = rng.next();
      var r = (t < 0.7 ? rng.range(1.6, 4.5) : t < 0.93 ? rng.range(4.5, 9) : rng.range(9, 16)) * U;
      cling.push({ x: rng.range(0.02, 0.98) * S, y: rng.range(0.02, 0.98) * S, r: r, sq: 1 + (r / (16 * U)) * 0.18 });
    }

    // The whole static wet-window (bokeh + mist + clinging drops + vignette) is rendered ONCE into an
    // offscreen, so each animated frame is just: draw that layer + the few sliding drops on top.
    function paintStaticInto(c) {
      c.globalCompositeOperation = "source-over"; c.globalAlpha = 1;
      c.drawImage(bgC, 0, 0, S, S);
      c.fillStyle = "rgba(150,168,182,0.16)"; c.fillRect(0, 0, S, S);     // mist veil
      var mistN = Loom.noise(rng.int(0, 1e9));
      for (var y = 0; y < S; y += 6 * U) {
        for (var x = 0; x < S; x += 6 * U) {
          var m = mistN.fbm(x / S * 3.5, y / S * 3.5, 3);
          c.globalAlpha = Math.max(0, (m - 0.5)) * 0.22; c.fillStyle = "#c4d2da";
          c.fillRect(x, y, 6 * U + 0.5, 6 * U + 0.5);
        }
      }
      c.globalAlpha = 1;
      for (var i = 0; i < cling.length; i++) drawDroplet(c, cling[i].x, cling[i].y, cling[i].r, cling[i].sq);
      var vg = c.createRadialGradient(S / 2, S * 0.45, S * 0.3, S / 2, S / 2, S * 0.8);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(4,9,14,0.55)");
      c.fillStyle = vg; c.fillRect(0, 0, S, S);
    }
    var staticC = document.createElement("canvas"); staticC.width = S; staticC.height = S;
    paintStaticInto(staticC.getContext("2d"));

    // ---- the sliding drops: pure functions of t, so any frame is reproducible & a t-strip is judgeable ----
    var wobN = Loom.noise(rng.int(0, 1e9));
    var sliders = [];
    for (var si = 0, nsl = rng.int(5, 7); si < nsl; si++) {
      sliders.push({ x: rng.range(0.06, 0.94), wob: rng.range(0, 40), period: rng.range(6, 12),
        phase: rng.next(), y0: rng.range(-0.06, 0.5), r0: rng.range(6, 10) * U, r1: rng.range(14, 26) * U,
        amp: rng.range(0.014, 0.05) * S });
    }
    var botY = 1.08 * S;
    function pathX(s, lt) { return s.x * S + (wobN.fbm(s.wob, lt * 5, 3) - 0.5) * 2 * s.amp; }
    function pathY(s, lt) { var y0 = s.y0 * S; return y0 + lt * lt * (botY - y0); }   // accelerates from its spawn

    // a thin, slightly meandering cleared rivulet from the drop's spawn down to its head — reveals the
    // sharp (un-misted) bokeh, then re-fogs toward the old (upper) end so it fades before the cycle wraps.
    function drawTrail(s, lt, hr) {
      var steps = 14, w = Math.max(1.2, hr * 0.34);
      ctx.save(); ctx.beginPath();
      for (var i = 0; i <= steps; i++) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) - w, pathY(s, lq)); }
      for (var i = steps; i >= 0; i--) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) + w, pathY(s, lq)); }
      ctx.closePath(); ctx.clip();
      ctx.drawImage(bgC, 0, 0, S, S);
      var rf = ctx.createLinearGradient(0, pathY(s, 0), 0, pathY(s, lt));
      rf.addColorStop(0, "rgba(150,168,182,0.55)"); rf.addColorStop(0.7, "rgba(150,168,182,0.12)"); rf.addColorStop(1, "rgba(150,168,182,0.05)");
      ctx.fillStyle = rf; ctx.fillRect(0, 0, S, S);
      ctx.restore();
    }

    function frame(t) {
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      ctx.drawImage(staticC, 0, 0, S, S);
      for (var i = 0; i < sliders.length; i++) {
        var s = sliders[i], lt = ((t / s.period) + s.phase) % 1;
        var x = pathX(s, lt), y = pathY(s, lt), r = s.r0 + (s.r1 - s.r0) * lt;
        drawTrail(s, lt, r);
        drawDroplet(ctx, x, y, r, 1.45);                                 // the head: a fat elongated lens
      }
    }
    return frame;   // ANIMATED — draw() did the seeded setup; frame(t) paints each moment.
  }
});

</script>
