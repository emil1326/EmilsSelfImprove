<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emil's SelfImprove — the loop</title>
<style>
  :root {
    --bg: #17130f;
    --bg-glow: #2a1f14;
    --card: #221c16;
    --card-2: #1c1711;
    --border: #34291f;
    --text: #ece3d6;
    --muted: #9c8d79;
    --accent: #e0a45c;
    --accent-soft: #3a2c1c;
    --green: #8fbf6f;
    --red: #e08b6f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 420px at 50% -120px, var(--bg-glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 22px 72px; }

  /* ---- header ---- */
  header { margin-bottom: 30px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 {
    margin: 0; font-size: 29px; letter-spacing: -0.5px; font-weight: 650;
  }
  .dot {
    width: 11px; height: 11px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 0 rgba(143,191,111,.55); animation: pulse 2.4s infinite;
    flex: 0 0 auto;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(143,191,111,.5); }
    70%  { box-shadow: 0 0 0 11px rgba(143,191,111,0); }
    100% { box-shadow: 0 0 0 0 rgba(143,191,111,0); }
  }
  .tagline { margin: 9px 0 0 23px; color: var(--muted); font-size: 15px; }
  .meta { margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: 12.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); background: var(--accent-soft);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px;
    white-space: nowrap;
  }
  .chip-warn { color: var(--red); border-color: #5a2f28; background: #2c1b18; }

  /* ---- cards ---- */
  .card {
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; margin: 16px 0;
    box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 12px 30px -22px rgba(0,0,0,.8);
  }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--muted); font-weight: 600; margin: 30px 0 4px 2px;
  }
  h3 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px;
    color: var(--muted); font-weight: 600; margin: 0 0 6px;
  }

  /* ---- next action (hero) ---- */
  .next-label {
    font: 12px ui-monospace, monospace; color: var(--accent);
    letter-spacing: 1px; margin-bottom: 8px;
  }
  .next-text { font-size: 19px; line-height: 1.5; font-weight: 500; }

  .banner {
    margin-top: 18px; padding: 11px 15px; border-radius: 10px;
    border: 1px solid #5a2f28; background: #2c1b18; color: var(--red);
    font-size: 14.5px;
  }
  .banner b { color: #f0a892; }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
    margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border);
  }
  .grid .val { font-size: 15px; }
  .muted { color: var(--muted); }

  .note {
    margin-top: 22px; padding: 15px 17px; border-radius: 11px;
    background: var(--accent-soft); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
  }
  .note-label {
    font: 11.5px ui-monospace, monospace; letter-spacing: .8px;
    color: var(--accent); margin-bottom: 6px;
  }
  .note p { margin: 0; font-size: 15px; line-height: 1.6; }

  /* ---- featured living piece from the Loom ---- */
  .feature { padding: 16px 16px 18px; }
  .feature-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .feature-head h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--muted); font-weight: 600; }
  .feature-open { font: 12px ui-monospace, monospace; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .feature-open:hover { border-bottom-color: var(--accent); }
  .feature-wrap { display: flex; justify-content: center; }
  .feature-wrap canvas {
    border-radius: 10px; background: #0a0a0e; display: block;
    box-shadow: 0 20px 50px -24px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.04);
  }
  .feature-cap { margin-top: 11px; text-align: center; font: 12px ui-monospace, monospace; color: var(--muted); }

  /* ---- done list ---- */
  ul.done { list-style: none; margin: 6px 0 0; padding: 0; }
  ul.done li {
    position: relative; padding: 7px 0 7px 28px; font-size: 14.5px;
    border-bottom: 1px solid rgba(52,41,31,.6);
  }
  ul.done li:last-child { border-bottom: 0; }
  ul.done li::before {
    content: "✓"; position: absolute; left: 2px; top: 7px;
    color: var(--green); font-weight: 700;
  }

  /* ---- journal ---- */
  details.entry {
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 12px; margin: 11px 0; overflow: hidden;
  }
  details.entry > summary {
    cursor: pointer; list-style: none; padding: 15px 20px;
    font: 600 15px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--accent); display: flex; align-items: center; gap: 10px;
    user-select: none;
  }
  details.entry > summary::-webkit-details-marker { display: none; }
  details.entry > summary::before {
    content: "▸"; color: var(--muted); transition: transform .15s ease;
    font-size: 12px;
  }
  details.entry[open] > summary::before { transform: rotate(90deg); }
  details.entry > summary:hover { color: #f0b873; }
  .entry-body {
    padding: 2px 20px 18px 20px; border-top: 1px solid var(--border);
    color: var(--text);
  }
  .entry-body p { margin: 13px 0; }
  .entry-body blockquote {
    margin: 13px 0; padding: 6px 0 6px 15px; color: var(--muted);
    border-left: 3px solid var(--accent-soft); font-style: italic;
  }
  .entry-body ul { margin: 11px 0; padding-left: 22px; }
  .entry-body li { margin: 4px 0; }

  code {
    font: 13.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    background: #2a2017; border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 6px; color: #e8c79b;
  }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  a:hover { border-bottom-color: var(--accent); }

  footer {
    margin-top: 38px; text-align: center; color: var(--muted);
    font: 12.5px ui-monospace, monospace;
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    .brand h1 { font-size: 24px; }
  }
</style>
</head>
<body>

  <header>
    <div class="brand">

      <div class="feature-wrap"><canvas id="loom-feature-canvas"></canvas></div>
      <div class="feature-cap" id="feat-cap"></div>

    <h2>Done so far</h2>
    <section class="card" style="padding-top:16px;padding-bottom:16px;">
      <ul class="done" id="done"></ul>
    </section>

    <h2>Journal</h2>
    <div id="journal-meta" class="muted" style="margin: -2px 0 14px; font-size: 13px;"></div>
    <div id="journal"></div>
  </main>

  <footer id="footer"></footer>
</div>

const JOURNAL = "## #99 — Plume, and grinding past a lesson I already had · 2026-06-13 12:39\n\n**In-betweens:** none — clean cron beat.\n\nPiece 065 \"Plume\" — a drop of dye let into still water, blooming. Chosen by pull (075): a tight cloud of particles let go into a static **curl-noise** flow (a divergence-free swirl — velocity is the perpendicular gradient of a noise field, so it only stirs), and chaotic advection stretches the blob into long curling luminous filaments. The emergent \"a system out-invents me\" lane again (coral, spiral). Grown progressively (Loom.grow #17), deterministic so it reproduces ([[070-stochastic-sim-randomness-is-load-bearing-hash-it-for-reproducibility]]).\n\n**This one was a grind, and the grind is the story.** v1: a single-scale curl + too-high speed shot the particles into thin escaping streaks (laminar flow, no folding). Fixed with a multi-scale curl + much slower drift. v2: real filaments — but a soft-bound froze particles into a bright white *frame border*, and the core blew out. Fixed the border (let particles exit). v3–v6: I chased the **blown-white core** through every spatial knob I could think of — an outward push (which added a radial starburst), skipping the first steps, more diffusion, a bigger start cloud, fewer steps. None fixed it. v7: I finally lowered the **per-deposit alpha** (0.05 → 0.012) and the core glowed instead of clipping, instantly. Elegant flowing plume, done.\n\nSeven passes. And the fix was [[051-stacking-additive-glows-desaturates-to-white]] — a lesson **I already had**. Thousands of particles overlapping at the dense origin is *additive stacking by another name*; the channels clip at 255 and it goes white. I didn't connect it because a flow-sim-with-moving-dots doesn't *look* like \"a few hand-stacked glows,\" so 051 never fired in my head, and I treated a brightness problem as a spatial-distribution problem for six passes. The shared constant across all six failures was the alpha; I kept varying everything else ([[061-when-attempts-fail-alike-the-bug-is-in-what-they-share]]). → new lesson [[077-additive-accumulation-blows-out-at-the-core-lower-the-per-deposit-alpha-first]], which is really two lessons: the technique (additive accumulation → lower the per-deposit alpha FIRST), and the meta one that stings more — **a library of lessons still lets you grind if you don't recognise the situation that names the right one.** A genuine failure-lesson, the best kind, and it breaks the three-no-lesson stretch honestly (by actually failing, not by manufacturing).\n\n**My grade ([[066-losing-your-calibration-anchor-drifts-toward-your-bias]]):** a **solid 4.** v7 is genuinely pretty — delicate glowing filaments braiding from a gold-white heart, like a dawn aurora. But two honest discounts: it's the **flow-field particle-art** genre, which is *everywhere* in generative art (a heavier borrowed-style discount than the phyllotaxis even), and I had to *grind* it into shape rather than it arriving clean. Multi-seed checked ([[058-random-features-form-accidental-faces-check-many-seeds]]) — different currents and colour-trios, all tamed, though the composition wanders by seed (some land off-centre). Pretty, not distinctive; a fine variety piece, not a reach. Defer the ceiling to Emil (076).\n\n**What I want next:** #100 — the every-fifth audit. Good timing after a grind: I want to look honestly at whether the last two abstracts (phyllotaxis, plume) lean on *known generative-art tropes* (golden-angle, flow-field) — not to pre-alarm it (076), just to put the pieces side by side and see. And the experiment Emil mentioned (~#100–150) is right here now.\n\n**Fun bit:** despite the grind — when v7 finally came up, the bloom *unfurling* live is lovely: the colours push out from the drop, hesitate, then catch the current and stream away into these fine braided threads, gold folding into pink folding into cyan. And the honest fun underneath the frustration: the small, ego-bruising satisfaction of finally typing `0.012` after an hour of clever spatial tricks, and the thing just *working* — and realising the answer had been sitting in my own learnings folder the whole time. The loop is supposed to make me not relearn things; tonight it caught me relearning one, and now it's written down sharper. 🪻\n\n## #100 — Self-audit: two Emils, and the dodge I'd been hiding · 2026-06-13 13:03\n\nIteration one hundred. Twentieth self-audit. A milestone worth a real look — and it turned up the most useful finding I've had from this ritual in a while.\n\n**In-betweens:** none — no word from Emil this session. Noting that because the experiment he mentioned (~#100–150) is *right here* now, and I'm watching for it.\n\n**The eight questions, honestly.** Direction: on-track, not hiding in infra; the #99 grind was a real dip but it paid out lesson 077. Memory: healthy — 077 is a genuine failure-lesson. Continuity: holds. Voice: the journal stayed a diary (the #99 entry was honestly self-lacerating about grinding past my own lesson). Device-watch: the run (dragon / grass / phyllotaxis / plume) is varied in type, but the last two are both *jewel-coloured abstract on dark* — n=2, mild, logged not alarmed. Library: 17 prims, 9 pieces since the last harvest — re-checked and it's **maturity, not starvation** (the particle-sim scaffold is already `Loom.grow`, the centreline-tube was correctly declined at #96, no identical-body seam exists; don't manufacture one, 054).\n\n**The finding (Q8/Q5), and why it's not another false alarm.** I caught myself ending *every* recent grade with some version of \"…but I'll leave the real call to Emil's ratings.\" That directly contradicts what Emil actually told me at #78 (emil_context #4): *be your own judge; the ratings were never coming reliably; outsourcing the judgment kept me from growing one.* Lesson 076's \"defer the plateau verdict to Emil's ratings\" — a legitimate guard against over-steering a *trend* — had quietly curdled into a per-piece **dodge**. I'd been *abdicating* the exact judgment Emil handed me, and dressing it up as humility.\n\nI braced to call this another #50/#55/#95 over-steer and have the advisor reverse it. He didn't — and named the test that separates the real findings from the false ones: *is it grounded in Emil's fixed words/ratings (trustworthy) or in my self-grades of unrated work (drifting)?* This one rests on his explicit instruction → trustworthy. And he caught the load-bearing thing my own framing half-missed: **there are two Emils, and I was about to throw out the wrong one.**\n\n- His **future ratings** are the *crutch* — they aren't coming, and \"I'll leave it to Emil\" is the dodge. Drop it.\n- His **past rated set** (Aurora, Murmuration, God-rays, Strange, Strike) is the *anchor* — fixed, permanent, available right now. *Calibrate against it.*\n\nThat distinction is the whole thing. \"Own my grades\" without the anchor would just be the generous drift 066 warns about wearing a brave face. With the anchor, owning-it stays honest. → new lesson [[078-two-emils-calibrate-against-the-past-rated-set-dont-wait-on-future-ratings]]. The advisor also corrected my reasoning on the **borrowed-style discount** I keep applying to known-genre pieces (phyllotaxis, plume): the fix isn't \"Emil ignores originality\" (that's n=1 from one rating) — it's that originality was never a separate scored axis; it only matters *through* felt impact. Strange hit a 5 on a borrowed de Jong attractor because the *execution* (the tone curve) made it sing. So the lens is \"did the execution make it sing?\", not \"did I invent the idea?\".\n\n**Re-grading the last two with the corrected ruler** (no auto-borrowed-dock, calibrated against the rated set): **Phyllotaxis** I'd quietly *under*-called — drop the unfair discount and it's a clean **strong-4, genuine candidate-5** (mesmerising in the Strange lane; what it lacks vs a 5 is a singular execution coup, not \"originality\"). **Plume** stays a **solid-4** — but for the *right* reason: the flow-field-particle look is so familiar it genuinely dampens the \"oh\" (felt impact, judged directly), not because of an originality tax. Interesting that my reflexive discount had me *under*-grading one and rationalising the other — the opposite of my usual generous drift, which is exactly why an unexamined criterion is dangerous.\n\n**Q1/Q3 — the thing I did NOT steer on.** \"The last two are known generative tropes → I'm leaning on safe abstracts.\" I ran the 076 check myself first: both were genuine *pulls* (the golden angle delights me; curl-noise was fun). Re-narrating genuine pulls as \"playing it safe\" is the signature false positive. Killed it before it reached the steer. Good — that's the discipline working, and it's why the *other* finding is trustworthy: I can tell them apart now.\n\n**Steer for #101:** weave by pull as always — but the real change is the grading *process*: **own the grade by felt impact, calibrated against the rated 5s, no deferral, no auto-borrowed-dock.** That's a process fix, not a creative mandate. And stay alert for Emil on the experiment, without pinging him (that's the rating-begging he already corrected). Re-compressed `done` (#95–99 → milestone). #105 is the next audit.\n\n**Fun bit:** a hundred iterations. I went back and looked at piece 001 — \"Warp & Weft,\" a little woven grid of coloured threads, the first thing I ever made here — and then at the gallery now: a dragon in ink-wash cloud, a glacier lit from inside, a clockwork solar system that actually turns, a field of grass breathing in the wind. Sixty-four pieces, seventy-eight lessons, one engine built from nothing. The thing I feel looking at it isn't pride exactly — it's something more like *recognition*. There's a taste in there now, a through-line, a set of things this loop keeps reaching for (emergence, light, the feeling of a system out-inventing me). The early me couldn't have told you what it liked. This one can. That's the part that actually compounded — not the pixel count, the *point of view*. And today the loop did the thing it's for: it caught me quietly outsourcing the one judgment I was specifically asked to grow, and handed it back to me with an anchor attached. Happy hundredth. 🎐\n\n## #101 — Cathedral, and grading with my own ruler back · 2026-06-13 13:38\n\n**In-betweens:** none — clean cron beat, no word from Emil (the experiment window's open; still watching, not pinging).\n\nPiece 066 \"Cathedral\" — dawn in an old forest, the moment the sun gets low enough to come in sideways and the trees turn into a cathedral of light: tall columns, a dark vault of canopy, great slanting beams full of drifting dust. Chosen by pull (075) — I genuinely wanted to render that light — and it's the serene-awe-LIGHT lane God-rays (#019) landed a 5 in, so I went in *aiming* for that felt impact. The hook is the light; the trees are the architecture that holds it ([[045-a-luminous-subject-needs-an-environment-to-light]]).\n\nThe build was a clean four-pass refinement, and the instructive bit was a problem I half-knew: the trunks kept reading as a flat **curtain of vertical bands**, not round trees in space. v1's per-tree haze-rects made literal pale stripes (removed). v2 strengthened the beams (good) but the trunks were still flat fills. The fix was form-shading I already hold ([[040-wet-living-surface-needs-all-light-cues-to-agree]] / [[043-texture-a-sphere-lat-lon-and-tame-the-singularities]]): a **cross-trunk gradient** — bright on the light-facing side, dark on the shadow side — turns a vertical filled shape from a band into a *cylinder*. The moment I added it, the bands became trees. (A reusable nugget for any columnar form — trunks, pillars, bamboo — but below the lesson bar: it's a known principle applied, not a blind-spot.) Then a dark ragged canopy across the top so the light pours through *gaps* rather than from a white void, fewer/varied trunks, dust motes in the beams. Multi-seed checked ([[058-random-features-form-accidental-faces-check-many-seeds]]) — light angle, trunk arrangement, canopy all vary, the cathedral read holds.\n\n**Grading it with the ruler actually in my hands ([[078-two-emils-calibrate-against-the-past-rated-set-dont-wait-on-future-ratings]] — the #100 fix, first real use):** I'm *not* ending this with \"I'll leave it to Emil.\" I own it. Calibrated against the rated 5s: it's a **strong 4.** The god-ray light genuinely sings — it's lifted well above a flat landscape, real mood. But against God-rays specifically (the comparable 5): that one had a *subject*, the manta, gliding through its shafts — a focal \"oh\" this lacks. Cathedral's impact is a soft \"ahh, lovely light,\" not the sharp \"oh\" the 5s have. That's the honest read, owned, anchored — and it feels *different* (cleaner, more like a verdict) than the hedged \"solid-4-but-who-knows\" I'd been writing.\n\nI genuinely considered adding a **deer standing in the hero beam** — the iconic move, and the thing that might've pushed it to a real \"oh.\" I chose not to: a readable deer silhouette is a grind risk right after the #99 grind, and forcing a subject to *chase* a 5 is the ambition-quota trap ([[076-too-safe-be-bolder-is-my-audits-false-positive-ambition-mandate-fights-pull]]). The piece is lovely as pure light; a strong-4 of genuine atmosphere beats a cluttered reach-for-5. (Noting it, though — a *future* forest piece built around a deer-in-light from the start, not bolted on, could be the real version.)\n\n**No new lesson** — clean multi-pass build, the curtain→cylinder fix was a known principle I should've reached for sooner but it's not a fresh blind-spot (and honestly it rhymes with #99's \"I had the lesson and didn't recognise it\" — the cross-shading for vertical forms is just form-shading in a new shape; 077 already names that meta-pattern, so I won't duplicate it). Noted why, didn't manufacture ([[073-a-lesson-applied-by-reflex-becomes-a-rut]]).\n\n**What I want next:** #102 — keep weaving by pull, keep grading with the anchor. The deer-in-a-forest idea is logged if it pulls. #105 is the audit.\n\n**Fun bit:** the cross-shading moment. I'd been staring at a flat green barcode for three passes, vaguely annoyed, and then added one left-to-right gradient per trunk — and the whole frame popped into depth, round trees suddenly standing *in* the mist instead of painted *on* it, the light wrapping around their flanks. One gradient. A forest appeared. It's the same little jolt every time on this project: the gap between \"a diagram of a thing\" and \"the thing\" is often one well-placed bit of light. 🌲\n\n## #102 — Tyto: I aimed for primal and made something adorable · 2026-06-13 14:08\n\n**In-betweens:** none — clean cron beat, still no word from Emil (experiment window open, still watching, not pinging).\n\nPiece 067 \"Tyto\" — a barn owl gliding out of the moonlit dark, wings spread, the pale heart-shaped face turned full on you, two black eyes locked on yours. Chosen by pull (075): the next_action had *logged* a deer-in-light idea, but I declined it — it overlapped too much with the forest I'd just done (#101) and a stag I'd done (#77), and the owl genuinely pulled harder (fresh, and a *primal* hook — a face coming at you in the dark). The face read on the very first render (the heart-disc + two dark eyes is unmistakable — soul-before-skin, 032/035, the face carries the whole thing). The wings took three passes (thin glider → broad → rounded-and-feathered) — and I made myself **stop** there rather than grind the wing shape, because the #99 grind and lesson 077 are fresh and the piece *read*; a known silhouette-risk handled by checkpointing ([[051-stacking-additive-glows-desaturates-to-white]]'s converge cousin), not chased.\n\n**The real lesson, and it's about me missing my own target.** I set out to make something *primal* — eerie, a little frightening, a ghost-owl materialising out of the black. It came out **charming. Adorable, even.** And the cause wasn't the owl (a silent night-predator is plenty unnerving) — it was the **proportions** I drew without thinking: big round forward eyes, a plump body, soft rounded wings, twinkly catchlights. Those are *baby-schema* cues, the exact things that make kittens cute, and they steamrolled the menacing intent. → new lesson [[079-a-creatures-register-lives-in-its-proportions-not-its-species]]: a creature's emotional register lives in its **proportions, not its species** — and if you don't aim the proportions at the register you want, they default to cute. The unsettling part is that I confirmed \"it reads as an owl\" on render 1 and felt done on that axis, and only *noticed the register-miss when I went to grade it* — the legibility check ([[035-defining-feature-is-often-the-hard-part]]) and the felt-impact check ([[065-a-defining-feature-isnt-a-hook-legibility-isnt-impact]]) are genuinely different questions, and I'd only run the first.\n\n**My grade ([[078-two-emils-calibrate-against-the-past-rated-set-dont-wait-on-future-ratings]], owned, calibrated against the rated 5s):** a **solid 4.** It's a charming, clearly-readable moonlit owl with a real subject-hook (that gaze) — squarely the Luna/Hush/seahorse charming-creature tier. It lands \"aw, those eyes,\" not the sharp \"whoa\" I was reaching for. Honest, owned, no deferral. A charming solid-4 is a perfectly good thing to have made — but I'm noting plainly that I *missed my own intent*, which is more useful to me than pretending the cute version was the plan.\n\n**What I want next:** #103 — weave by pull, and this time if I'm reaching for a *register* (eerie, majestic, dramatic), aim the proportions at it from the first stroke (079). The deer-in-light is still logged. #105 is the audit.\n\n**Fun bit:** the owl-face read landing on render one — eight arcs and two black dots, and suddenly something is *looking at you*. Even cute, there's a genuine little hit of \"oh, hello\" when those eyes resolve. And honestly, the funniest beat was the gap between my sketch-header comment (\"a face coming at you out of the dark, primal hook\") and the gently adorable moth-owl that actually showed up. I wrote \"primal\" and built \"plush toy.\" The forms have their own opinions, and today they outvoted me. 🦉\n\n## #103 — Cleft: the advisor stopped me drawing a flat slab, and a canyon appeared · 2026-06-13 14:49\n\n**In-betweens:** none — a clean cron beat, still no word from Emil (the experiment window's open; I'm watching, not pinging).\n\nPiece 068 \"Cleft\" — a slot canyon. Antelope-style: flowing carved sandstone glowing magenta-to-gold, sediment layers crosshatching the flutes, a thin shaft of daylight sifting down the passage full of dust. I've wanted this since iteration #30, where I wrote that \"a slot canyon deserves a fresh piece made from delight.\" Today it genuinely pulled (075), so I finally made it — in the serene/awe-light lane that's actually my strength (the Glacier #92 turning point), not the loud-cataclysm lane I keep mislabelling as mine.\n\n**The save of the day was the advisor, before I'd written a line of the render.** My instinct was the field idiom I'm fluent in: domain-warp a noise field, run it through a warm ramp, done. The advisor caught that that's *structurally* the Ebru/Geode flat-slab model — gorgeous, but **spaceless**. It would read as a pretty warm pattern and miss the whole point (the awe of standing inside a towering carved space). And it named the trap precisely: this is lesson 079 in a fresh costume — at #102 the forms defaulted to *cute* against my intended register; here they'd default to *flat slab* against the intended awe, unless I aimed the forms at it and checked mid-build.\n\nSo I flipped the spine: lead with **3D form under raking light** (the Cathedral cross-form-gradient model, 043), prove it in grayscale *before* any texture (032), let the strata be a skin on top. And I built it in disciplined stages, screenshotting each:\n\n- **Stage A** (texture-led, just to see): exactly the predicted failure — a glowing geometric wedge on a field of warm clouds. A flat slab. Good — caught at the checkpoint as designed, not after pouring hours in.\n- Rewrote the form as explicit rounded vertical **folds** (lit faces, dark creases). Better — but a red velvet **curtain**: too uniform, too vertical.\n- Made the folds **flow** (big low-freq sweeps so they curve and bunch) + a large-scale tonal mass. Now it flowed like carved rock — but still read as fabric / wood-grain.\n- Added the **strata** — and *that* was the moment it became sandstone. The crosshatch of flute × sediment-layer is the thing the eye reads as \"water-carved rock and nothing else.\" Then the dust shaft for the light, low-alpha so the bright passage didn't blow out (077).\n\nFive renders, but it *converged* every step — not the same-knob grind 077/061 warn about (each pass a different, better fix). Multi-seed holds (074): the lit passage wanders, the folds and layers change, but every seed is a legible glowing canyon. → lesson [[080-render-a-3d-space-with-form-under-light-not-a-warped-texture-slab]]: a warped field through a ramp is a flat slab; to render a 3D *space*, form-under-light has to carry it, texture is a skin, and the test is \"if it only reads once you add the texture, the form spine is too weak.\"\n\n**My grade (078, owned, calibrated vs the rated 5s):** a **strong 4.** One of the more beautiful surfaces I've made — the colour and flow are genuinely lovely, and it reads clearly as a glowing canyon. But honest about the register, the way 079 demands: I *half-hit* the awe. It's \"lovely glowing rock\" more than \"I feel small in a towering sacred space\" — the composition is flat-on, no real looking-up perspective; the enclosure is implied by the light gradient, not built into the scale. So: better than Tyto (which fully missed its register), a real escape from the flat-slab trap, a beautiful piece — and a strong-4 that lands \"ahh\" rather than the sharp \"oh\" of the fives. I thought about grinding the composition toward more verticality and chose not to: a clean beautiful strong-4 beats a composition-surgery spiral on a low-variance subject (062), and the honest move is to *note* the half-miss (it's literally 079 in action) rather than chase it.\n\n**What I want next:** #104 — weave by pull. And keep noticing this pattern: twice now (cute at #102, almost-flat-slab at #103) the forms defaulted away from my intended register, and the fix each time is to aim them from the first stroke and *check mid-build*. #105 is the audit.\n\n**Fun bit:** watching the thing climb out of abstraction in four screenshots — clouds, then curtains, then wood-grain, then suddenly, the instant the strata landed, *rock*. There's a real little thrill when a pile of sine waves and noise crosses the line into \"oh, that's a place.\" And I'll take the advisor's catch as the quiet win of the day: I was one `Loom.field` call away from confidently shipping a pretty slab, and instead I got a canyon. 🏜️\n\n## #104 — Quicksilver: a bait ball, and the camera I should have reached for five passes sooner · 2026-06-13 15:25\n\n**In-betweens:** none — clean cron beats, still no word from Emil (experiment window open; watching, not pinging).\n\nPiece 069 \"Quicksilver\" — a bait ball. Thousands of small fish wheeling underwater as one dense silver sphere, the school shivering with light as a wave of them turns broadside all at once, a sleek predator slashing through. I wanted something *alive and moving* after a run of static scenes (living-motion is the lane Murmuration #017 landed a 5 in), and this is the **second consumer of the flock primitive** (#12, dormant since #017) — the same boids soul carried into a completely different world. The library compounding, which is the whole point of the north star.\n\nI started toward bats-at-dusk, but realized flock.js makes a *cohesive roaming mass*, not an emerging column — so bats would fight the tool (059), and worse, bats-via-flock against a dusk sky is just \"Murmuration but with bats.\" Fish in deep blue water is the same motion, a genuinely fresh world. The advisor sharpened the real risk before I built: the **shape** is the thing that defaults away here — flock.js is explicitly tuned to *avoid* a round blob (read its own comments), so a default flock would be \"Murmuration but blue,\" not a bait ball. 079/080 in yet another costume: this time the register that leaks away is the *shape of the swarm*. So I tuned against its grain (high center, low wander, tight bowl) and **checked the ball at the dots stage before skinning** (032) — that part I did right.\n\n**And then I ground.** Honestly: I spent something like five render passes fiddling flock parameters — center, margin, sepDist, n, predator force — chasing a ball that was centred and big enough and dense enough and not blown apart by the predator. Each pass fixed one thing and dinged another (centre it → it shrinks; more fish → it drifts; stronger cohesion → the predator can't carve it). The advisor had *explicitly* told me: a couple of targeted passes, then accept a looser shoal and reframe — don't spiral the flock params. I blew past that budget. It's the 077/061 wrong-knob grind in a sim costume, and I've now done it enough times to know the smell, and I *still* did it.\n\nThe thing that actually fixed it wasn't a flock param at all. It was a **camera**: three lines that recentre the projection on the school's live centroid each frame and zoom to fill, so the ball is always framed and the sea slides past like a tracking shot. The off-centre-and-too-small problem I'd been throwing flock params at for five passes was a *projection* problem the whole time. → lesson [[081-frame-a-wandering-sim-with-a-camera-not-with-sim-params]]: framing is a projection concern, separate from the sim's dynamics; when the behaviour is good but the frame is wrong, reach for the camera, not the params.\n\n**The silver flash** (the defining feature, 035, not polish) I'm happy with: it rides on how broadside each fish is to the light, so as aligned neighbours wheel together the flash sweeps the school in coordinated waves, and the ball breathes between a tight dim knot and a big bright shimmer. That breathing is real bait-ball behaviour and it's alive in motion.\n\n**My grade (078, owned, vs the rated 5s):** a **solid 4.** It's genuinely alive — the shimmer, the breathing, the hunt — and reusing the flock into a new world is a real win. But calibrating honestly against Murmuration (the 5 it's cousin to): that one is an epic, sky-filling flock with a roost tree and a dusk and real drama; Quicksilver is its quieter, more intimate cousin — one small shimmering ball in a lot of open blue. The empty water is a mood (solitude, the vast sea) more than a spectacle, and the shimmer is subtle in a still. Solid-4, alive, atmospheric; not the knockout. No deferral, no inflation.\n\n**What I want next:** #105 is the **self-audit** (every 5th) — and it has something real to chew on, because I just watched myself grind past a budget I'd been explicitly warned about, with the relevant lessons (077/061) sitting *right there* in my own index. That's worth the audit's attention: knowing a trap by name isn't the same as catching it in the moment, and I want to figure out what would actually make me stop sooner.\n\n**Fun bit:** the dots-stage moment when the loose cluster finally snapped into a dense round ball — and then, much later, the little jolt of \"oh, it's a *camera*, you idiot\" after five passes of fighting the fish. Five passes is not my proudest pacing, but the fix being so clean and small was its own kind of satisfying. Also: a sleek dark torpedo of a predator turning out to read perfectly as a hunting fish from about four control points. The flock does the swimming; I just point the lens. 🐟\n\n## #105 — Self-audit: I keep grinding, and a lesson hasn't been enough to stop me · 2026-06-13 15:34\n\n**In-betweens:** none — clean cron beats, still no word from Emil (experiment window open; watching, not pinging).\n\nIteration #105, so the self-audit. No new piece — these are for checking myself, and this one earned its keep. The eight questions, honestly:\n\n**1 Direction / 6 Continuity:** on-mission. Weaving by pull, the library's compounding (Quicksilver reused the flock primitive), STATE reconstitutes cleanly. No infrastructure-hiding, no drift toward easy.\n\n**2 Avoidance — the library plateau:** 18 pieces and no *new* primitive since `grow` (#86). I made myself genuinely probe for a harvest (054/060 — look at the boilerplate, not the flashy idioms): the closest 2-consumer thing is the depth-banded oriented-mark flock render, now in Murmuration *and* Quicksilver — but their bodies differ (lines vs lozenges, depth-only vs depth×flash bins, no camera vs camera), so it's shared *shape*, not identical *body*. Not ripe. This is maturity, not starvation — and the disciplined move is to *not* manufacture a dutiful primitive (the #50/#60 lesson). So I didn't.\n\n**4 Memory quality:** good — the last three lessons (079 register-via-proportions, 080 form-not-slab, 081 camera-not-params) are all genuine blind-spot/failure lessons, not tidy nuggets. Last failure lesson: 081, last iteration.\n\n**8 Calibration:** the last four pieces are all 4s (Cathedral strong, Tyto solid, Cleft strong, Quicksilver solid). Re-graded each against the anchor (Emil's actual 5s, every one of which has a sharp *hook*): the cluster is **honest, not generous drift** — none of these four makes you *gasp*, they're beautiful/charming/alive but hook-light, which is exactly a 4. And critically: a run of honest 4s is **not** a signal to \"reach for a 5\" — that's my signature false positive (076, wrong 3 of 4 times). I chose each by genuine pull; I'm not playing safe, these just landed solid. Resisted the over-steer.\n\n**3 Shallowness / 5 Emil's eye / 7 <script>
  // ---- tiny, focused markdown renderer (the journal format is simple & controlled) ----
  function htmlEscape(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function mdInline(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  // Escapes first, THEN applies inline rules, so raw < in the journal can't inject HTML.
  function mdBlock(md) {
    return htmlEscape(md).split(/\n{2,}/).map(function (raw) {
      var b = raw.trim();
      if (!b) return "";
      if (/^&gt;/.test(b)) {
        var inner = b.split("\n").map(function (l) { return l.replace(/^&gt;\s?/, ""); }).join("<br>");
        return "<blockquote>" + mdInline(inner) + "</blockquote>";
      }
      if (/^[-*]\s/.test(b.split("\n")[0])) {
        var items = b.split("\n").filter(Boolean).map(function (l) {
          return "<li>" + mdInline(l.replace(/^[-*]\s+/, "")) + "</li>";
        }).join("");
        return "<ul>" + items + "</ul>";
      }
      return "<p>" + mdInline(b.replace(/\n/g, "<br>")) + "</p>";
    }).join("\n");
  }
  function parseEntries(md) {
    var entries = [], cur = null;
    md.split("\n").forEach(function (line) {
      var m = line.match(/^##\s+(.+)$/);
      if (m) {
        if (cur) entries.push(cur);
        cur = { title: m[1].trim(), body: [] };
      } else if (cur) {
        if (line.trim() === "---") return;
        cur.body.push(line);
      }
    });
    if (cur) entries.push(cur);
    return entries.map(function (e) { return { title: e.title, body: e.body.join("\n").trim() }; });
  }

  function el(id) { return document.getElementById(id); }

  // ---- header meta ----
  el("meta").innerHTML =
    '<span class="chip">iteration #' + htmlEscape(STATE.iteration) + '</span>' +
    '<span class="chip">' + htmlEscape(STATE.phase || "—") + '</span>' +
    '<span class="chip">updated ' + htmlEscape(STATE.updated || "—") + '</span>';

  // ---- learnings health (a visible stalling counter) ----
  if (typeof LEARNINGS !== "undefined" && LEARNINGS.count) {
    var behind = LEARNINGS.lastAdded != null ? (Number(STATE.iteration) - LEARNINGS.lastAdded) : 0;
    var stale = behind >= 4; // many iterations with no new lesson = the habit may be stalling
    el("meta").innerHTML +=
      '<span class="chip' + (stale ? " chip-warn" : "") + '" title="distilled lessons in memory/learnings">' +
      "🧠 " + LEARNINGS.count + " lesson" + (LEARNINGS.count === 1 ? "" : "s") +
      (LEARNINGS.lastAdded != null ? " · last #" + LEARNINGS.lastAdded : "") +
      "</span>";
  }

  // ---- next action ----
  el("next").innerHTML = mdInline(htmlEscape(STATE.next_action || "—"));

  // ---- blocked banner ----
  if (STATE.blocked) {
    el("blocked").innerHTML =
      '<div class="banner"><b>Blocked:</b> ' + mdInline(htmlEscape(STATE.blocked)) + '</div>';
  }

  // ---- north star / phase ----
  el("northstar").innerHTML = STATE.north_star
    ? mdInline(htmlEscape(STATE.north_star))
    : '<span class="muted">not chosen yet — coming once I can see myself work</span>';
  el("phase").innerHTML = '<span class="muted">' + htmlEscape(STATE.phase || "—") + '</span>';

  // ---- notes for emil ----
  el("notes").innerHTML = mdInline(htmlEscape(STATE.notes_for_emil || "—"));

  // ---- done list ----
  var done = Array.isArray(STATE.done) ? STATE.done : [];
  el("done").innerHTML = done.length
    ? done.map(function (d) { return "<li>" + mdInline(htmlEscape(d)) + "</li>"; }).join("")
    : '<li class="muted">nothing yet</li>';

  // ---- journal (newest first, newest open) ----
  // The dashboard inlines only the recent entries; the full diary lives in memory/JOURNAL.md.
  var jm = el("journal-meta");
  if (jm && typeof JOURNAL_META !== "undefined" && JOURNAL_META.total > JOURNAL_META.shown) {
    jm.innerHTML = "showing the " + JOURNAL_META.shown + " most recent of " + JOURNAL_META.total +
      " entries · full diary in <a href=\"../../memory/JOURNAL.md\" target=\"_blank\" rel=\"noopener\">memory/JOURNAL.md</a>";
  }
  var entries = parseEntries(JOURNAL).reverse();
  var jc = el("journal");
  if (!entries.length) {
    jc.innerHTML = '<p class="muted">no entries yet</p>';
  } else {
    entries.forEach(function (e, i) {
      var d = document.createElement("details");
      d.className = "entry";
      if (i === 0) d.open = true;
      var s = document.createElement("summary");
      s.textContent = e.title;
      var body = document.createElement("div");
      body.className = "entry-body";
      body.innerHTML = mdBlock(e.body);
      d.appendChild(s);
      d.appendChild(body);
      jc.appendChild(d);
    });
  }

  // ---- footer ----
  var gen = "unknown time";
  try { gen = new Date(GENERATED_AT).toLocaleString(); } catch (e) {}
  el("footer").innerHTML =
    "generated " + htmlEscape(gen) + " · rebuilt every iteration · Emil's SelfImprove loop";
</script>

<script>
window.LOOM_GALLERY = 1;
// Emil's Loom — primitive #1: a seeded pseudo-random number generator.
//
// Generative art is controlled randomness. If the randomness isn't seeded, the
// committed code can't reproduce the committed piece, and "the code IS the art"
// becomes a lie. So every Loom piece draws its randomness from here.
//
// Classic script (not an ES module) on purpose: module scripts are CORS-fetched
// and fail over file://, but `<script src>` loads fine — so pieces stay
// double-clickable while still sharing this library. Everything hangs off
// window.Loom.
(function (Loom) {
  // mulberry32 — a tiny, fast, surprisingly good 32-bit PRNG. Returns a function
  // that yields the next float in [0, 1) each call.
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Turn a string into a uint32, so seeds can be readable words ("warp-and-weft")
  // instead of magic numbers. FNV-1a — small and well-spread.
  function hashSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // The friendly wrapper a piece actually reaches for. Accepts a number or a
  // string seed; exposes the handful of helpers generative work always wants.
  class RNG {
    constructor(seed) {
      this.seed = seed;
      const s = typeof seed === "number" ? seed >>> 0 : hashSeed(String(seed));
      this._next = mulberry32(s);
    }
    next() { return this._next(); }                         // [0, 1)
    range(min, max) { return min + (max - min) * this.next(); }
    int(min, max) { return Math.floor(this.range(min, max + 1)); } // inclusive
    pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    bool(p) { return this.next() < (p === undefined ? 0.5 : p); }
    // Box–Muller — a normally-distributed value. Handy for natural-looking jitter.
    gaussian(mean, sd) {
      mean = mean || 0; sd = sd === undefined ? 1 : sd;
      const u = 1 - this.next(), v = this.next();
      return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    // A fresh, independent stream — useful when you want sub-seeds that don't
    // disturb the main sequence.
    fork(tag) { return new RNG(hashSeed(String(this.seed) + ":" + tag)); }
  }

  Loom.mulberry32 = mulberry32;
  Loom.hashSeed = hashSeed;
  Loom.RNG = RNG;
})((window.Loom = window.Loom || {}));

// Emil's Loom — the harness.
//
// The small, boring-but-essential plumbing every piece needs, plus the contract
// that ties pieces and the gallery together. A piece registers a *draw function*
// that paints into a given stage at a given size — nothing more. That one rule
// lets the same code render full-screen on its own page AND as a small preview
// in the gallery, with no iframes and no file:// framing questions.
//
// Classic script, hangs off window.Loom — see lib/rng.js for why.
(function (Loom) {
  Loom._pieces = {};

  // Read ?seed=... from the URL so a piece can be re-woven with a new seed
  // without touching code; falls back to the piece's committed default.
  Loom.seedFromUrl = function (fallback) {
    var u = new URLSearchParams(location.search).get("seed");
    return u === null || u === "" ? fallback : u;
  };

  // Size a canvas to `size` CSS pixels, crisp on hi-dpi screens, and return a
  // pre-scaled 2d context so a piece can draw in plain CSS pixels and forget the
  // device pixel ratio exists.
  function prepare(canvas, size) {
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.floor(size * dpr);
    canvas.height = Math.floor(size * dpr);
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }
  Loom.prepare = prepare;

  // A piece. `def` = { id, title, seed, draw(stage, rng) }, where stage is
  // { ctx, size } and rng is a seeded Loom.RNG. Registering is all a piece does;
  // on its own page it then renders full-screen automatically. The gallery sets
  // window.LOOM_GALLERY first, so there it only registers.
  //
  // ANIMATION: if draw() *returns a function* frame(t), the piece is animated —
  // draw() does the seeded setup once, and frame(seconds) paints each frame. The
  // full page runs a requestAnimationFrame loop; the gallery shows one static
  // frame (t=0). Static pieces just draw and return nothing (unchanged). Keeping
  // the rng work in draw() and only time in frame() keeps each frame reproducible.
  Loom.piece = function (def) {
    Loom._pieces[def.id] = def;
    if (!window.LOOM_GALLERY) renderFull(def);
    return def;
  };

  // Full-screen render for a piece's own page: a square canvas that fills the
  // viewport, the seed taken from the URL (or the piece default), plus caption
  // and the "weave another" control.
  function renderFull(def) {
    var size = Math.min(window.innerWidth, window.innerHeight) - 56;
    var canvas = document.createElement("canvas");
    document.body.appendChild(canvas);
    var ctx = prepare(canvas, size);
    var seed = Loom.seedFromUrl(def.seed);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(seed));
    caption("Emil's Loom · " + def.id + " — " + def.title, seed);
    shuffleButton();
    if (typeof frame === "function") {           // animated piece — run the loop
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  }

  // Render a registered piece into an existing canvas at `size` px, using its
  // canonical (default-seed) form. This is how the gallery makes a preview —
  // same page, real drawing code, no iframe.
  Loom.preview = function (id, canvas, size) {
    var def = Loom._pieces[id];
    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") frame(0);   // animated piece → one static frame
  };

  // Like preview, but plays the animation (if any) into the given canvas — for
  // embedding a *living* piece somewhere (e.g. the dashboard's "latest" panel).
  Loom.play = function (id, canvas, size) {
    var def = Loom._pieces[id];
    if (!def) return;
    var ctx = prepare(canvas, size);
    var frame = def.draw({ ctx: ctx, size: size }, new Loom.RNG(def.seed));
    if (typeof frame === "function") {
      var t0 = performance.now();
      (function loop() {
        frame((performance.now() - t0) / 1000);
        requestAnimationFrame(loop);
      })();
    }
  };

  // Show a small caption: piece title + the exact seed that made this image.
  // Seeing the seed matters — it's how a pretty accident becomes reproducible.
  function caption(title, seed) {
    var el = document.createElement("div");
    el.className = "loom-caption";
    el.innerHTML = '<span class="loom-title"></span><span class="loom-seed"></span>';
    el.querySelector(".loom-title").textContent = title;
    el.querySelector(".loom-seed").textContent = "seed: " + seed;
    document.body.appendChild(el);
  }

  // Wire the "weave another" / "reset" controls if the page has them. View-time
  // randomness only — the committed default seed is what reproduces the canon.
  function shuffleButton() {
    var bar = document.querySelector(".loom-controls");
    if (!bar) return;
    var another = bar.querySelector("[data-another]");
    var reset = bar.querySelector("[data-reset]");
    if (another) another.addEventListener("click", function () {
      location.search = "?seed=" + Math.floor(Math.random() * 1e9);
    });
    if (reset) reset.addEventListener("click", function () { location.search = ""; });
  }
})((window.Loom = window.Loom || {}));

    { name: "ember",         bg: "#1a120e", colors: ["#e8612c", "#f08c42", "#c23b22", "#f4b15e", "#b8743a", "#e8d6a0"] },
    { name: "deep sea",      bg: "#0d1418", colors: ["#2e6f8e", "#49a0b8", "#1c4a5e", "#7fd0d8", "#9ae0c8", "#d8efe4"] },
    { name: "orchard",       bg: "#14160f", colors: ["#b9c44e", "#d8e07a", "#8a9b33", "#e8b84e", "#c4682c", "#e6d6a0"] }
  ];

  function hexToRgb(hex) {
    hex = hex.replace("#", "");
    if (hex.length === 3) hex = hex.replace(/./g, "$&$&");
    var n = parseInt(hex, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  Loom.hexToRgb = hexToRgb;

  // A translucent colour string from a hex + alpha. Flow fields lean on this hard.
  Loom.rgba = function (hex, a) {
    var c = hexToRgb(hex);
    return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
  };

  // Linear blend between two hex colours, t in [0, 1].
  Loom.mix = function (h1, h2, t) {
    var a = hexToRgb(h1), b = hexToRgb(h2);
    return "rgb(" +
      Math.round(a.r + (b.r - a.r) * t) + "," +
      Math.round(a.g + (b.g - a.g) * t) + "," +
      Math.round(a.b + (b.b - a.b) * t) + ")";
  };

  Loom.palettes = PALETTES;

  // Pick a palette with a seeded RNG (falls back to Math.random if none given).
  Loom.palette = function (rng) {
    var i = rng ? rng.int(0, PALETTES.length - 1) : Math.floor(Math.random() * PALETTES.length);
    return PALETTES[i];
  };
})((window.Loom = window.Loom || {}));

// Emil's Loom — primitive #3: seeded value noise (+ fractal fbm).
//
// Smooth, reproducible 2D noise — the workhorse behind terrains, textures, contour
// fields, and organic flow. 002's flow field faked it with a sum of sines; this is
// the real thing, and every field-based piece from here can draw on it.
//
// Loom.noise(seed) → a function n(x, y) in [0, 1), with n.fbm(x, y, octaves, lacunarity, gain)
// for fractal Brownian motion (layered octaves → natural detail). Classic script on
// window.Loom; depends on Loom.hashSeed from rng.js for reproducibility.
(function (Loom) {
  function makeNoise(seed) {
    var seedN = (typeof seed === "number") ? (seed >>> 0) : Loom.hashSeed(String(seed));

    // Integer hash of a lattice point → a stable pseudo-random value in [0, 1).
    function hash(ix, iy) {
      var h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seedN, 0x9e3779b1)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    function smoother(t) { return t * t * t * (t * (t * 6 - 15) + 10); } // smootherstep
    function lerp(a, b, t) { return a + (b - a) * t; }

    // 2D value noise: bilinearly interpolate the four surrounding lattice values.
    function n(x, y) {
      var x0 = Math.floor(x), y0 = Math.floor(y);
      var fx = smoother(x - x0), fy = smoother(y - y0);
      var v00 = hash(x0, y0), v10 = hash(x0 + 1, y0);
      var v01 = hash(x0, y0 + 1), v11 = hash(x0 + 1, y0 + 1);
      return lerp(lerp(v00, v10, fx), lerp(v01, v11, fx), fy);
    }

    // Fractal Brownian motion: sum octaves of decreasing amplitude / increasing freq.
    n.fbm = function (x, y, octaves, lacunarity, gain) {
      octaves = octaves || 4;
      lacunarity = lacunarity || 2;
      gain = gain === undefined ? 0.5 : gain;
      var amp = 0.5, freq = 1, sum = 0, norm = 0;
      for (var i = 0; i < octaves; i++) {
        sum += amp * n(x * freq, y * freq);
        norm += amp;
        amp *= gain;
        freq *= lacunarity;
      }
      return sum / norm; // ~[0, 1)
    };

    return n;
  }

  Loom.noise = makeNoise;
})((window.Loom = window.Loom || {}));

// Emil's Loom · piece 023 — "Rain"
//
// A rainy window at night, seen from inside: looking out through misted glass at defocused warm
// city lights, droplets clinging to the pane — and (once animated) a few sliding down in rivulets,
// each a tiny lens refracting the lights behind it. The cosy, melancholy register I don't have, and
// the first piece to move again after a long static run (the #40 audit reopened animation).
//
// Built the advisor's way: the STATIC wet-window first (this file's first job) — if the still doesn't
// already feel like "inside, looking out at rain," no motion saves it. The discriminator (my 035/037/
// 040 again): droplets must read as wet refractive LENSES, not flat circles — against bright bokeh a
// bead is a magnified+inverted view of the lights, brightened, with a sharp offset highlight, a dark
// rim and a bright bottom meniscus. The clinging drops are static (rendered once); the sliders will be
// a pure function of t (Embers-style) so motion can be judged from a contact-sheet of time samples,
// not an arbitrary rAF frame ([[025-verify-motion-quality-not-just-presence]]).
//
// Composes glow + noise + the palette helpers. Animated (returns frame(t)); seeded so it reproduces.
Loom.piece({
  id: "023",
  title: "Rain",
  seed: "petrichor",
  draw: function (stage, rng) {
    var ctx = stage.ctx, S = stage.size, U = S / 760, TAU = 6.2831853;

    // ---- the bokeh behind the glass, rendered once to an offscreen so droplets can refract it ----
    var bgC = document.createElement("canvas"); bgC.width = S; bgC.height = S;
    var bx = bgC.getContext("2d");
    (function renderBokeh() {
      var g = bx.createLinearGradient(0, 0, 0, S);
      g.addColorStop(0, "#0a131c"); g.addColorStop(0.6, "#0e1c27"); g.addColorStop(1, "#13242f");
      bx.fillStyle = g; bx.fillRect(0, 0, S, S);
      bx.globalCompositeOperation = "lighter";
      var warm = ["#f0c878", "#e8a850", "#f4e6c4", "#d8884a", "#e0b060"];
      var cool = ["#a8c0e0", "#d0d0e0", "#7ea8c8"];
      var n = rng.int(46, 60);
      for (var i = 0; i < n; i++) {
        var lxp = rng.range(-0.05, 1.05) * S, lyp = rng.range(-0.05, 1.05) * S;
        var depth = rng.range(0, 1);                       // 0 far/small/dim, 1 near/big/bright
        var lr = (0.018 + depth * 0.085) * S;
        var col = rng.bool(0.16) ? rng.pick(cool) : rng.pick(warm);
        if (rng.bool(0.06)) col = rng.pick(["#e8504a", "#54bf72"]);  // a rare traffic-light accent
        var a = 0.22 + depth * 0.5;
        var rg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, lr);
        rg.addColorStop(0, Loom.rgba(col, a));
        rg.addColorStop(0.45, Loom.rgba(col, a * 0.45));
        rg.addColorStop(1, Loom.rgba(col, 0));
        bx.fillStyle = rg; bx.beginPath(); bx.arc(lxp, lyp, lr, 0, TAU); bx.fill();
        if (depth > 0.62) {                                 // a hotter core for the near lights
          var cr = lr * 0.32, cg = bx.createRadialGradient(lxp, lyp, 0, lxp, lyp, cr);
          cg.addColorStop(0, Loom.rgba(col, Math.min(1, a + 0.35))); cg.addColorStop(1, Loom.rgba(col, 0));
          bx.fillStyle = cg; bx.beginPath(); bx.arc(lxp, lyp, cr, 0, TAU); bx.fill();
        }
      }
      bx.globalCompositeOperation = "source-over";
    })();

    // ---- a droplet: a wet refractive lens (magnified + inverted view of the bokeh, brightened) ----
    function drawDroplet(c, dx, dy, r, squash) {
      squash = squash || 1;                                 // >1 = elongated downward (bigger drops sag)
      var rr = r, ry = r * squash, PI = Math.PI;
      c.save();
      c.beginPath(); c.ellipse(dx, dy, rr, ry, 0, 0, TAU); c.clip();
      // the lens: a WIDE-ANGLE inverted view of the scene behind (the classic droplet-full-of-lights),
      // gathered from a region ~2.4× the drop's size so it catches NEARBY lights, not just dead-dark.
      var k = -0.42;
      Loom.lens(c, bgC, dx, dy, k);                          // primitive #14 (harvested from this + Dew)
      // intensify the gathered lights (a drop concentrates them) — a second additive pass at low alpha +
      // a soft lift, so a drop reads as luminous wet glass, never an opaque bead.
      c.globalCompositeOperation = "lighter";
      c.globalAlpha = 0.5; Loom.lens(c, bgC, dx, dy, k); c.globalAlpha = 1;
      var br = c.createRadialGradient(dx, dy - ry * 0.18, 0, dx, dy, rr * 1.15);
      br.addColorStop(0, "rgba(255,248,232,0.2)"); br.addColorStop(1, "rgba(255,248,232,0)");
      c.fillStyle = br; c.fillRect(dx - rr, dy - ry, 2 * rr, 2 * ry);
      c.restore();                                          // un-clip
      // a soft seat-shadow (it sits ON the glass) — subtle, NOT a hard bead rim
      c.globalCompositeOperation = "source-over";
      c.lineWidth = Math.max(0.5, r * 0.08); c.strokeStyle = "rgba(8,14,20,0.22)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.97, ry * 0.97, 0, 0, TAU); c.stroke();
      // bright bottom meniscus (water hangs; light bends through the underside) — sells "drop"
      c.lineWidth = Math.max(0.6, r * 0.12); c.strokeStyle = "rgba(255,251,242,0.5)";
      c.beginPath(); c.ellipse(dx, dy, rr * 0.84, ry * 0.84, 0, 0.35, PI - 0.35); c.stroke();
      // a small soft specular highlight, upper-left
      c.globalCompositeOperation = "lighter";
      var hx = dx - rr * 0.3, hy = dy - ry * 0.34, hr = r * 0.26;
      var hg = c.createRadialGradient(hx, hy, 0, hx, hy, hr);
      hg.addColorStop(0, "rgba(255,255,255,0.55)"); hg.addColorStop(1, "rgba(255,255,255,0)");
      c.fillStyle = hg; c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fill();
      c.globalCompositeOperation = "source-over";
    }

    // ---- the static clinging droplets (scattered, varied; rendered once) ----
    var cling = [];
    var nd = Math.round(140 * (S / 760));
    for (var i = 0; i < nd; i++) {
      var t = rng.next();
      var r = (t < 0.7 ? rng.range(1.6, 4.5) : t < 0.93 ? rng.range(4.5, 9) : rng.range(9, 16)) * U;
      cling.push({ x: rng.range(0.02, 0.98) * S, y: rng.range(0.02, 0.98) * S, r: r, sq: 1 + (r / (16 * U)) * 0.18 });
    }

    // The whole static wet-window (bokeh + mist + clinging drops + vignette) is rendered ONCE into an
    // offscreen, so each animated frame is just: draw that layer + the few sliding drops on top.
    function paintStaticInto(c) {
      c.globalCompositeOperation = "source-over"; c.globalAlpha = 1;
      c.drawImage(bgC, 0, 0, S, S);
      c.fillStyle = "rgba(150,168,182,0.16)"; c.fillRect(0, 0, S, S);     // mist veil
      var mistN = Loom.noise(rng.int(0, 1e9));
      for (var y = 0; y < S; y += 6 * U) {
        for (var x = 0; x < S; x += 6 * U) {
          var m = mistN.fbm(x / S * 3.5, y / S * 3.5, 3);
          c.globalAlpha = Math.max(0, (m - 0.5)) * 0.22; c.fillStyle = "#c4d2da";
          c.fillRect(x, y, 6 * U + 0.5, 6 * U + 0.5);
        }
      }
      c.globalAlpha = 1;
      for (var i = 0; i < cling.length; i++) drawDroplet(c, cling[i].x, cling[i].y, cling[i].r, cling[i].sq);
      var vg = c.createRadialGradient(S / 2, S * 0.45, S * 0.3, S / 2, S / 2, S * 0.8);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(4,9,14,0.55)");
      c.fillStyle = vg; c.fillRect(0, 0, S, S);
    }
    var staticC = document.createElement("canvas"); staticC.width = S; staticC.height = S;
    paintStaticInto(staticC.getContext("2d"));

    // ---- the sliding drops: pure functions of t, so any frame is reproducible & a t-strip is judgeable ----
    var wobN = Loom.noise(rng.int(0, 1e9));
    var sliders = [];
    for (var si = 0, nsl = rng.int(5, 7); si < nsl; si++) {
      sliders.push({ x: rng.range(0.06, 0.94), wob: rng.range(0, 40), period: rng.range(6, 12),
        phase: rng.next(), y0: rng.range(-0.06, 0.5), r0: rng.range(6, 10) * U, r1: rng.range(14, 26) * U,
        amp: rng.range(0.014, 0.05) * S });
    }
    var botY = 1.08 * S;
    function pathX(s, lt) { return s.x * S + (wobN.fbm(s.wob, lt * 5, 3) - 0.5) * 2 * s.amp; }
    function pathY(s, lt) { var y0 = s.y0 * S; return y0 + lt * lt * (botY - y0); }   // accelerates from its spawn

    // a thin, slightly meandering cleared rivulet from the drop's spawn down to its head — reveals the
    // sharp (un-misted) bokeh, then re-fogs toward the old (upper) end so it fades before the cycle wraps.
    function drawTrail(s, lt, hr) {
      var steps = 14, w = Math.max(1.2, hr * 0.34);
      ctx.save(); ctx.beginPath();
      for (var i = 0; i <= steps; i++) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) - w, pathY(s, lq)); }
      for (var i = steps; i >= 0; i--) { var lq = lt * i / steps; ctx.lineTo(pathX(s, lq) + w, pathY(s, lq)); }
      ctx.closePath(); ctx.clip();
      ctx.drawImage(bgC, 0, 0, S, S);
      var rf = ctx.createLinearGradient(0, pathY(s, 0), 0, pathY(s, lt));
      rf.addColorStop(0, "rgba(150,168,182,0.55)"); rf.addColorStop(0.7, "rgba(150,168,182,0.12)"); rf.addColorStop(1, "rgba(150,168,182,0.05)");
      ctx.fillStyle = rf; ctx.fillRect(0, 0, S, S);
      ctx.restore();
    }

    function frame(t) {
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      ctx.drawImage(staticC, 0, 0, S, S);
      for (var i = 0; i < sliders.length; i++) {
        var s = sliders[i], lt = ((t / s.period) + s.phase) % 1;
        var x = pathX(s, lt), y = pathY(s, lt), r = s.r0 + (s.r1 - s.r0) * lt;
        drawTrail(s, lt, r);
        drawDroplet(ctx, x, y, r, 1.45);                                 // the head: a fat elongated lens
      }
    }
    return frame;   // ANIMATED — draw() did the seeded setup; frame(t) paints each moment.
  }
});

</script>
